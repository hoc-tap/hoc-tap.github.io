<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt tên máy cho bài kiểm tra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-2 sm:p-4 flex items-center justify-center">

    <div class="max-w-4xl w-full bg-white rounded-xl shadow-lg p-4 sm:p-6 border border-slate-100">
        
        <!-- Header Section -->
        <div class="text-center mb-4">
            <h1 class="text-xl sm:text-2xl font-bold text-indigo-600 mb-1">Cài đặt tên máy cho bài kiểm tra</h1>
            <p class="text-slate-500 text-xs sm:text-sm">Bấm chọn tên máy để lưu vào localStorage của trình duyệt.</p>
        </div>

        <!-- Status & Control Panel -->
        <div class="bg-indigo-50 rounded-lg p-3 mb-4 flex flex-col sm:flex-row items-center justify-between gap-3 border border-indigo-100">
            <div class="text-center sm:text-left">
                <span class="text-[11px] uppercase tracking-wider font-semibold text-indigo-400 block">Tên máy đang lưu:</span>
                <span id="statusDisplay" class="text-base font-bold text-indigo-900 font-mono">Chưa có dữ liệu</span>
            </div>
            <div>
                <button onclick="checkLocalStorageData()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-4 py-2 rounded-lg shadow-sm transition-all active:scale-95 flex items-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                    </svg>
                    Kiểm tra
                </button>
            </div>
        </div>

        <!-- 50 Buttons Grid Section -->
        <div>
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Danh sách máy (01 - 50)</h2>
            </div>
            <!-- Điều chỉnh grid và padding để nút to hơn nhưng vẫn gọn gàng -->
            <div id="buttonGrid" class="grid grid-cols-5 sm:grid-cols-10 gap-2 max-h-[55vh] overflow-y-auto pr-1">
                <!-- Buttons will be injected here via JavaScript -->
            </div>
        </div>

    </div>

    <!-- Custom Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-xl transition-all duration-300 transform translate-y-20 opacity-0 flex items-center gap-2.5 z-50 text-xs sm:text-sm">
        <span id="toastIcon" class="text-emerald-400 font-bold">✓</span>
        <span id="toastMessage" class="font-medium">Đã lưu!</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        window.onload = function() {
            buildGridButtons();
            loadCurrentSavedName();
        };

        function buildGridButtons() {
            const grid = document.getElementById('buttonGrid');
            for (let i = 1; i <= 50; i++) {
                const formattedNum = i < 10 ? '0' + i : i;
                const computerName = `Máy ${formattedNum}`;

                const btn = document.createElement('button');
                // Tăng kích thước nút lên (py-2.5 thay vì py-1.5) để to hơn dễ bấm
                btn.className = "bg-white hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 text-slate-700 font-medium py-2.5 px-1 rounded-md shadow-2xs transition-all active:scale-95 text-center flex flex-col items-center justify-center gap-0.5 group text-xs";
                
                btn.innerHTML = `
                    <span class="text-[9px] text-slate-400 group-hover:text-indigo-400">MÁY</span>
                    <span class="font-bold text-slate-800 group-hover:text-indigo-600">${formattedNum}</span>
                `;

                // Khi click nút nào, lưu trực tiếp vào localStorage của máy hiện tại
                btn.onclick = function() {
                    saveToLocalStorage(computerName);
                };

                grid.appendChild(btn);
            }
        }

        function saveToLocalStorage(computerName) {
            try {
                localStorage.setItem("computerName", computerName);
                updateDisplay(computerName);
                showToast(`Đã lưu "${computerName}" vào localStorage!`);
            } catch (e) {
                console.error("Lỗi khi lưu localStorage:", e);
                showToast("Không thể lưu vào localStorage!", true);
            }
        }

        function loadCurrentSavedName() {
            const savedName = localStorage.getItem("computerName");
            if (savedName) {
                updateDisplay(savedName);
            } else {
                updateDisplay("Chưa có dữ liệu");
            }
        }

        window.checkLocalStorageData = function() {
            const savedName = localStorage.getItem("computerName");
            if (savedName) {
                updateDisplay(savedName);
                showToast(`Đang lưu: ${savedName}`);
            } else {
                updateDisplay("Chưa có dữ liệu");
                showToast("localStorage trống!", true);
            }
        };

        function updateDisplay(name) {
            const display = document.getElementById('statusDisplay');
            display.textContent = name;
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;
            toastIcon.textContent = isError ? "⚠" : "✓";
            toastIcon.className = isError ? "text-amber-400 font-bold" : "text-emerald-400 font-bold";

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
