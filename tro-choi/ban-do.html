<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bản đồ Vệ tinh Trường TH&THCS Nguyễn Du - Đầy Đủ Tính Năng</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS for high quality map control -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Custom Glassmorphism UI */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-button {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            transition: all 0.2s ease;
        }
        .glass-button:hover {
            background: rgba(51, 65, 85, 1);
            transform: translateY(-1px);
        }
        .glass-button.active {
            background: #2563eb;
            border-color: #60a5fa;
            color: #ffffff;
        }
        /* Hide Leaflet Default Control Container to use custom UI */
        .leaflet-control-container .leaflet-top,
        .leaflet-control-container .leaflet-bottom {
            z-index: 999;
        }
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.95) !important;
            color: #f8fafc !important;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px !important;
            backdrop-filter: blur(8px);
        }
        .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.95) !important;
        }
    </style>
</head>
<body class="relative w-full h-full text-slate-100 select-none">

    <div id="map"></div>

    <div class="absolute top-3 left-3 right-3 md:left-4 md:right-auto z-[1000] flex flex-col md:flex-row gap-2 max-w-lg pointer-events-auto">
        <!-- Search Bar -->
        <div class="glass-panel rounded-xl flex items-center px-3 py-2 w-full gap-2 shadow-lg">
            <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm vị trí, tọa độ..." 
                class="bg-transparent text-sm text-white focus:outline-none w-full placeholder-slate-400"
                onkeypress="if(event.key==='Enter') searchLocation()">
            <button onclick="searchLocation()" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg font-medium transition">
                Tìm
            </button>
        </div>
    </div>

    <div class="absolute top-3 right-3 z-[1000] pointer-events-auto">
        <div class="glass-panel p-1.5 rounded-xl flex items-center gap-1">
            <button id="btn-sat" onclick="switchLayer('sat')" class="glass-button active text-xs px-3 py-1.5 rounded-lg font-medium flex items-center gap-1.5">
                <i class="fa-solid fa-globe"></i> Vệ tinh
            </button>
            <button id="btn-hybrid" onclick="switchLayer('hybrid')" class="glass-button text-xs px-3 py-1.5 rounded-lg font-medium flex items-center gap-1.5">
                <i class="fa-solid fa-map"></i> Phối hợp
            </button>
            <button id="btn-streets" onclick="switchLayer('streets')" class="glass-button text-xs px-3 py-1.5 rounded-lg font-medium flex items-center gap-1.5">
                <i class="fa-solid fa-road"></i> Đường phố
            </button>
            <button id="btn-terrain" onclick="switchLayer('terrain')" class="glass-button text-xs px-3 py-1.5 rounded-lg font-medium flex items-center gap-1.5">
                <i class="fa-solid fa-mountain"></i> Địa hình
            </button>
        </div>
    </div>

    <div class="absolute right-3 top-20 z-[1000] flex flex-col gap-2 pointer-events-auto">
        <!-- Zoom In / Out -->
        <div class="glass-panel rounded-xl p-1 flex flex-col gap-1">
            <button onclick="zoomIn()" title="Phóng to" class="glass-button w-9 h-9 rounded-lg flex items-center justify-center text-sm">
                <i class="fa-solid fa-plus"></i>
            </button>
            <button onclick="zoomOut()" title="Thu nhỏ" class="glass-button w-9 h-9 rounded-lg flex items-center justify-center text-sm">
                <i class="fa-solid fa-minus"></i>
            </button>
        </div>

        <!-- Reset Default Location (Ta Dung Center) -->
        <div class="glass-panel rounded-xl p-1 flex flex-col gap-1">
            <button onclick="resetToCenter()" title="Về vị trí mặc định (Tà Đùng)" class="glass-button w-9 h-9 rounded-lg flex items-center justify-center text-sm text-emerald-400">
                <i class="fa-solid fa-location-crosshairs"></i>
            </button>
            <button onclick="getUserLocation()" title="Vị trí của tôi" class="glass-button w-9 h-9 rounded-lg flex items-center justify-center text-sm text-sky-400">
                <i class="fa-solid fa-street-view"></i>
            </button>
        </div>

        <!-- Tools (Marker, Share, Fullscreen) -->
        <div class="glass-panel rounded-xl p-1 flex flex-col gap-1">
            <button id="btn-pin-mode" onclick="togglePinMode()" title="Ghim điểm mới" class="glass-button w-9 h-9 rounded-lg flex items-center justify-center text-sm">
                <i class="fa-solid fa-map-pin"></i>
            </button>
            <button onclick="shareLocation()" title="Chia sẻ vị trí hiện tại" class="glass-button w-9 h-9 rounded-lg flex items-center justify-center text-sm">
                <i class="fa-solid fa-share-nodes"></i>
            </button>
            <button onclick="toggleFullScreen()" title="Toàn màn hình" class="glass-button w-9 h-9 rounded-lg flex items-center justify-center text-sm">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>
    </div>

    <div class="absolute bottom-3 left-3 right-3 md:right-auto z-[1000] pointer-events-auto">
        <div class="glass-panel px-3.5 py-2.5 rounded-xl text-xs flex flex-col sm:flex-row items-center justify-between gap-3 shadow-xl">
            <div class="flex items-center gap-3 text-slate-300 font-mono">
                <span>Tọa độ: <strong id="coords-display" class="text-white">12.2426, 107.5323</strong></span>
                <span class="hidden sm:inline">| Zoom: <strong id="zoom-display" class="text-white">17</strong></span>
            </div>
            <a id="external-google-link" href="https://www.google.com/maps/@12.2426471,107.5323126,17z/data=!3m1!1e3" target="_blank" 
                class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 transition shadow-lg transform hover:-translate-y-0.5">
                <i class="fa-solid fa-earth-americas text-sky-300"></i>
                <span>Chuyển sang Google Maps</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-80"></i>
            </a>
        </div>
    </div>

    <div id="toast" class="absolute top-16 left-1/2 -translate-x-1/2 z-[2000] glass-panel bg-slate-900/90 text-white text-xs px-4 py-2 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2 border border-slate-700">
        <i id="toast-icon" class="fa-solid fa-circle-info text-blue-400"></i>
        <span id="toast-msg">Thông báo</span>
    </div>

    <script>
        // Initial Coordinates (Ta Dung Lake)
        const DEFAULT_LAT = 12.242647137656833;
        const DEFAULT_LNG = 107.5323125510706;
        const DEFAULT_ZOOM = 17;

        let map, currentMarker, customMarkers = [];
        let isPinMode = false;

        // Tile Layers for Google Maps engine
        const layers = {
            sat: L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '&copy; Google Maps'
            }),
            hybrid: L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '&copy; Google Maps'
            }),
            streets: L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '&copy; Google Maps'
            }),
            terrain: L.tileLayer('https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '&copy; Google Maps'
            })
        };

        let currentActiveLayer = layers.sat;

        function initMap() {
            // Initialize Leaflet map
            map = L.map('map', {
                center: [DEFAULT_LAT, DEFAULT_LNG],
                zoom: DEFAULT_ZOOM,
                zoomControl: false, // Disable default zoom control for custom UI
                layers: [layers.sat]
            });

            // Set main marker on Trường TH&THCS Nguyễn Du
            currentMarker = L.marker([DEFAULT_LAT, DEFAULT_LNG]).addTo(map);
            currentMarker.bindPopup(`
                <div class="p-1">
                    <h3 class="font-bold text-sm text-blue-400 mb-1">Trường TH&THCS Nguyễn Du</h3>
                    <p class="text-xs text-slate-300">Trường Tiểu học & Trung học Cơ sở</p>
                    <p class="text-[11px] font-mono text-slate-400 mt-1">${DEFAULT_LAT.toFixed(6)}, ${DEFAULT_LNG.toFixed(6)}</p>
                </div>
            `).openPopup();

            // Map Movement Event Listeners
            map.on('move', updateBottomInfo);
            map.on('zoomend', updateBottomInfo);

            // Map Click Event Listener for adding custom pins
            map.on('click', function(e) {
                if (isPinMode) {
                    addCustomPin(e.latlng.lat, e.latlng.lng);
                    togglePinMode(); // Turn off pin mode after placing
                }
            });

            updateBottomInfo();
        }

        function switchLayer(layerKey) {
            if (!layers[layerKey]) return;

            map.removeLayer(currentActiveLayer);
            currentActiveLayer = layers[layerKey];
            map.addLayer(currentActiveLayer);

            // Update UI buttons state
            ['sat', 'hybrid', 'streets', 'terrain'].forEach(k => {
                const btn = document.getElementById(`btn-${k}`);
                if (btn) {
                    if (k === layerKey) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            });

            showToast(`Đã chuyển sang chế độ xem: ${layerKey.toUpperCase()}`);
        }

        function zoomIn() { map.zoomIn(); }
        function zoomOut() { map.zoomOut(); }

        function resetToCenter() {
            map.setView([DEFAULT_LAT, DEFAULT_LNG], DEFAULT_ZOOM);
            currentMarker.openPopup();
            showToast('Đã di chuyển về Trường TH&THCS Nguyễn Du');
        }

        function getUserLocation() {
            if (!navigator.geolocation) {
                showToast('Trình duyệt không hỗ trợ định vị GPS');
                return;
            }

            showToast('Đang lấy vị trí hiện tại của bạn...');
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    map.setView([lat, lng], 16);
                    
                    const userMarker = L.marker([lat, lng]).addTo(map);
                    userMarker.bindPopup('<strong class="text-xs text-emerald-400">Vị trí của bạn</strong>').openPopup();
                    showToast('Đã định vị thành công vị trí của bạn');
                },
                () => {
                    showToast('Không thể truy cập vị trí của bạn');
                }
            );
        }

        function togglePinMode() {
            isPinMode = !isPinMode;
            const btn = document.getElementById('btn-pin-mode');
            if (isPinMode) {
                btn.classList.add('active');
                showToast('Nhấp vào bất kỳ đâu trên bản đồ để cắm ghim');
            } else {
                btn.classList.remove('active');
            }
        }

        function addCustomPin(lat, lng) {
            const marker = L.marker([lat, lng], { draggable: true }).addTo(map);
            marker.bindPopup(`
                <div class="p-1">
                    <strong class="text-xs text-amber-400">Điểm ghim mới</strong>
                    <p class="text-[11px] font-mono text-slate-400 mt-1">${lat.toFixed(6)}, ${lng.toFixed(6)}</p>
                </div>
            `).openPopup();
            customMarkers.push(marker);
            showToast('Đã thêm điểm ghim mới');
        }

        function searchLocation() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            // Check if input is direct coordinates (lat, lng)
            const coordRegex = /^[-+]?([1-8]?\d(\.\d+)?|90(\.0+)?),\s*[-+]?(180(\.0+)?|((1[0-7]\d)|(\d{1,2}))(\.\d+)?)$/;
            if (coordRegex.test(query)) {
                const parts = query.split(',').map(p => parseFloat(p.trim()));
                map.setView([parts[0], parts[1]], 16);
                addCustomPin(parts[0], parts[1]);
                return;
            }

            // Geocoding search via Open-Meteo Geocoding API (Reliable, CORS-friendly, No API key required)
            showToast(`Đang tìm kiếm: ${query}...`);
            fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=vi&format=json`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.results && data.results.length > 0) {
                        const result = data.results[0];
                        const lat = parseFloat(result.latitude);
                        const lon = parseFloat(result.longitude);
                        map.setView([lat, lon], 15);
                        
                        const displayName = [result.name, result.admin1, result.country].filter(Boolean).join(', ');
                        const searchMarker = L.marker([lat, lon]).addTo(map);
                        searchMarker.bindPopup(`<strong class="text-xs text-sky-400">${displayName}</strong>`).openPopup();
                        customMarkers.push(searchMarker);
                        showToast('Đã tìm thấy vị trí!');
                    } else {
                        showToast('Không tìm thấy kết quả phù hợp');
                    }
                })
                .catch(() => showToast('Lỗi khi tìm kiếm vị trí'));
        }

        function updateBottomInfo() {
            const center = map.getCenter();
            const zoom = map.getZoom();

            document.getElementById('coords-display').innerText = `${center.lat.toFixed(5)}, ${center.lng.toFixed(5)}`;
            document.getElementById('zoom-display').innerText = zoom;

            // Dynamic link to official Google Maps Web
            const extLink = `https://www.google.com/maps/@${center.lat},${center.lng},${zoom}z/data=!3m1!1e3`;
            document.getElementById('external-google-link').href = extLink;
        }

        function shareLocation() {
            const center = map.getCenter();
            const zoom = map.getZoom();
            const url = `${window.location.origin}${window.location.pathname}?lat=${center.lat.toFixed(6)}&lng=${center.lng.toFixed(6)}&z=${zoom}`;

            // Fallback copy strategy
            const textarea = document.createElement('textarea');
            textarea.value = url;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast('Đã sao chép đường dẫn bản đồ vào bộ nhớ tạm!');
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Toast Helper Notification
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = msg;
            
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }

        window.onload = function() {
            initMap();
        };
    </script>
</body>
</html>
