<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2f8">
  <title>Kho Học Liệu – Thầy Minh</title>
  <style>
    /* ── Tokens ──────────────────────────────────────────────── */
    :root {
      --bg:        #edf2f8;
      --bg2:       #f8fafc;
      --surface:   #ffffff;
      --border:    #dce4ed;
      --text:      #17251f;
      --text2:     #4a5e54;
      --green:     #087938;
      --green-lt:  #e5f5eb;
      --shadow:    rgba(30, 50, 74, .07);
      --nav-bg:    rgba(248,250,253,.95);
      --card-bg:   rgba(255,255,255,.95);
      --lesson-bg: linear-gradient(180deg,#fff,#f9fbfa);
      --lesson-hover: #f2fbf4;
      --badge-bg:  #075a39;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg:        #111a14;
      --bg2:       #151f18;
      --surface:   #1c2820;
      --border:    #2c3d32;
      --text:      #d8ede0;
      --text2:     #7aaa8a;
      --green:     #45c47a;
      --green-lt:  #183023;
      --shadow:    rgba(0,0,0,.3);
      --nav-bg:    rgba(17,26,20,.96);
      --card-bg:   rgba(28,40,32,.97);
      --lesson-bg: linear-gradient(180deg,#1e2e22,#192619);
      --lesson-hover: #1e3324;
      --badge-bg:  #1f6640;
      color-scheme: dark;
    }

    /* ── Reset ───────────────────────────────────────────────── */
    *,::before,::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: Inter,"Segoe UI",Arial,sans-serif; font-size: 16px;
           -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body { min-height: 100vh; background: var(--bg); color: var(--text);
           display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; }

    /* ── Navbar ──────────────────────────────────────────────── */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 10px clamp(14px, 3.5vw, 52px);
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px var(--shadow);
      backdrop-filter: blur(12px);
    }

    /* Brand */
    .brand {
      display: flex; align-items: center; gap: 11px;
      white-space: nowrap; flex-shrink: 0;
    }
    .brand-leaf { width: 36px; height: 40px; flex: 0 0 auto; }
    .brand-copy { display: flex; flex-direction: column; line-height: 1.2; }
    .brand-name {
      font-size: 1.18rem; font-weight: 800; letter-spacing: .02em;
      text-transform: uppercase; color: var(--green);
    }
    .brand-sub { font-size: .75rem; color: var(--text2); font-weight: 500; }

    /* Search */
    .search-area {
      max-width: 480px; width: 100%;
      position: relative; justify-self: center;
    }
    .search-area .g-logo {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; pointer-events: none;
    }
    .search-box {
      width: 100%; height: 40px;
      padding: 0 14px 0 40px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text);
      font-size: .88rem;
      cursor: pointer;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .search-box:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(8,121,56,.15); }
    .search-box::placeholder { color: var(--text2); }

    /* Actions */
    .nav-actions {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; height: 36px; padding: 0 14px;
      border: 1px solid var(--border); border-radius: 8px;
      background: transparent; cursor: pointer; font-size: .82rem; font-weight: 650;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--green-lt); border-color: var(--green); }
    .btn.icon-btn { width: 36px; padding: 0; }
    .btn.game-btn { color: var(--green); border-color: var(--green); }
    .btn.game-btn:hover { background: var(--green); color: #fff; }

    /* Dark/Light toggle */
    .theme-btn svg { pointer-events: none; }

    /* Language toggle */
    .lang-pill {
      display: inline-flex; align-items: center; gap: 4px;
      height: 36px; padding: 0 10px;
      border: 1px solid var(--border); border-radius: 8px;
      background: transparent; cursor: pointer; font-size: .78rem; font-weight: 700;
      transition: background .15s;
    }
    .lang-pill:hover { background: var(--green-lt); border-color: var(--green); }
    .lang-pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green); flex-shrink: 0;
    }

    /* ── Main content ────────────────────────────────────────── */
    .main { flex: 1; width: 100%; max-width: 1780px;
            align-self: center; padding: 20px clamp(12px,3vw,44px) 28px; }

    /* Status row */
    .statusbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; font-size: .78rem; color: var(--text2);
    }

    /* ── Grade grid (4 cols) ─────────────────────────────────── */
    .grade-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    /* For 7 grades arranged in 4 cols: rows are calculated automatically */
    .grade-card {
      display: flex; flex-direction: column;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--card-bg); overflow: hidden;
      box-shadow: 0 3px 10px var(--shadow);
      max-height: calc(100vh - 170px);
    }
    .grade-header {
      position: sticky; top: 0; z-index: 1;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-weight: 750; font-size: clamp(.95rem,1.3vw,1.15rem);
      color: var(--green);
    }
    .grade-num {
      display: inline-grid; place-items: center;
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--green); color: #fff; font-size: .82rem; font-weight: 800;
    }
    .lesson-list {
      flex: 1; overflow-y: auto; padding: 6px 6px 8px;
      display: flex; flex-direction: column; gap: 3px;
      scrollbar-color: #c9d6cb transparent; scrollbar-width: thin;
    }
    .lesson {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 6px;
      border: 1px solid var(--border); border-radius: 7px;
      background: var(--lesson-bg);
      font-size: clamp(.72rem,.85vw,.84rem); line-height: 1.3;
      transition: background .14s, border-color .14s, transform .14s;
    }
    .lesson:hover {
      border-color: var(--green); background: var(--lesson-hover);
      transform: translateY(-1px);
    }
    .lesson-badge {
      display: inline-grid; place-items: center; flex-shrink: 0;
      width: 14px; height: 14px; border-radius: 3px;
      background: var(--badge-bg); color: #fff; font-size: 8px;
    }
    .lesson[hidden] { display: none; }
    .grade-card[hidden] { display: none; }

    /* ── Footer ──────────────────────────────────────────────── */
    .footer {
      text-align: center; padding: 14px 16px;
      font-size: .74rem; color: var(--text2);
      border-top: 1px solid var(--border);
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 900px) {
      .navbar { grid-template-columns: auto auto; }
      .search-area { grid-column: 1 / -1; grid-row: 2; max-width: 100%; justify-self: stretch; }
      .grade-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 600px) {
      .brand-name { font-size: 1rem; }
      .grade-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
      .grade-card { max-height: calc(100vh - 200px); }
      .btn { font-size: .76rem; height: 32px; padding: 0 10px; }
    }
    @media (max-width: 420px) {
      .grade-grid { grid-template-columns: 1fr; }
      .grade-card { max-height: none; }
    }
  </style>
</head>
<body>

  <!-- ════════════════ NAVBAR ════════════════ -->
  <header class="navbar">

    <!-- Brand -->
    <a class="brand" href="./" aria-label="KHO HỌC LIỆU – Thầy Minh, về trang chủ">
      <svg class="brand-leaf" viewBox="0 0 48 52" role="img" aria-label="Logo chiếc lá">
        <path fill="#167c3c" d="M12 7C4 13 3 27 11 35c2-8 5-15 11-22-3-3-6-5-10-6Z"/>
        <path fill="#63b54b" d="M41 4C24 5 12 15 10 31c-1 9 3 15 8 18 0-13 6-24 23-34-4 11-12 19-22 27 17-1 29-15 27-38l-5 0Z"/>
        <path fill="#a4d778" d="M18 45c3-11 10-20 21-28-8 10-13 19-15 29l-6-1Z"/>

      <span class="brand-copy">
        <span class="brand-name" data-vi="KHO HỌC LIỆU" data-en="LEARNING HUB">KHO HỌC LIỆU</span>
        <span class="brand-sub" data-vi="thầy Minh" data-en="by Thầy Minh">thầy Minh</span>
      </span>

    <!-- Search (Google) -->
    <div class="search-area" role="search">
      <svg class="g-logo" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M21.35 12.2c0-.7-.06-1.37-.18-2.02H12v3.82h5.24a4.48 4.48 0 0 1-1.94 2.94v2.4h3.14c1.84-1.7 2.91-4.2 2.91-7.14Z"/>
        <path fill="#34A853" d="M12 21.7c2.63 0 4.83-.87 6.44-2.36l-3.14-2.4c-.87.58-1.98.92-3.3.92-2.54 0-4.7-1.72-5.47-4.04H3.28v2.47A9.72 9.72 0 0 0 12 21.7Z"/>
        <path fill="#FBBC05" d="M6.53 13.82a5.84 5.84 0 0 1 0-3.64V7.71H3.28a9.72 9.72 0 0 0 0 8.58l3.25-2.47Z"/>
        <path fill="#EA4335" d="M12 6.14c1.43 0 2.71.49 3.72 1.47l2.79-2.79C16.82 3.2 14.63 2.3 12 2.3a9.72 9.72 0 0 0-8.72 5.41l3.25 2.47c.77-2.32 2.93-4.04 5.47-4.04Z"/>
      </svg>
      <input id="search-box" class="search-box" type="text" readonly
             placeholder="Bấm để tìm kiếm trên Google..."
             aria-label="Bấm để mở Google tìm kiếm"
             data-vi="Bấm để tìm kiếm trên Google..."
             data-en="Click to search on Google...">
    </div>

    <!-- Actions -->
    <nav class="nav-actions" aria-label="Tiện ích">
      <!-- Game button → /tro-choi/ -->
      <a id="game-btn" class="btn game-btn" href="./tro-choi/"
         data-vi="🧠 Trò chơi trí tuệ" data-en="🧠 Brain Games">🧠 Trò chơi trí tuệ</a>

      <!-- Dark / Light mode -->
      <button id="theme-btn" class="btn icon-btn theme-btn" type="button"
              aria-label="Chuyển chế độ tối/sáng" title="Sáng / Tối">
        <svg id="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>

      <!-- Language VI / EN -->
      <button id="lang-btn" class="lang-pill" type="button" aria-label="Chuyển ngôn ngữ" aria-pressed="false">
        <span class="dot" aria-hidden="true"></span>

      <!-- Fullscreen -->
      <button id="fs-btn" class="btn icon-btn" type="button"
              aria-label="Bật toàn màn hình" title="Toàn màn hình">

        <svg id="icon-fs-collapse" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
          <path d="M8 8H3M8 3v5M16 8h5M16 3v5M16 16h5M16 21v-5M8 16H3M8 21v-5"/>

      </button>
    </nav>
  </header>

  <!-- ════════════════ CONTENT ════════════════ -->
  <main class="main" aria-label="Thư viện học liệu Tin học">
    <div class="statusbar">
      <span id="status-label" data-vi="Tin học lớp 3 – 9" data-en="Computer Science Grade 3–9">Tin học lớp 3 – 9</span>
      <span id="count-label" aria-live="polite">Đang tải...</span>
    </div>

    <div id="grade-grid" class="grade-grid" aria-label="Bài học theo lớp">
      <!-- Cards được tạo bằng JS -->
    </div>
  </main>

  <!-- ════════════════ FOOTER ════════════════ -->
  <footer class="footer">
    <span data-vi="© Kho học liệu Thầy Minh · Tin học lớp 3 – 9 · Dùng cho mục đích học tập"
          data-en="© Learning Hub by Thầy Minh · Computer Science Grade 3–9 · For educational use">
      © Kho học liệu Thầy Minh · Tin học lớp 3 – 9 · Dùng cho mục đích học tập
    </span>
  </footer>

  <!-- ════════════════ SCRIPT ════════════════ -->
  <script>
    /* ── State ───────────────────────────────────────────────── */
    let isEnglish = false;
    let isDark    = false;

    /* ── Elements ────────────────────────────────────────────── */
    const html       = document.documentElement;
    const gradeGrid  = document.getElementById('grade-grid');
    const searchBox  = document.getElementById('search-box');
    const countLabel = document.getElementById('count-label');
    const langBtn    = document.getElementById('lang-btn');
    const langLabel  = document.getElementById('lang-label');
    const themeBtn   = document.getElementById('theme-btn');
    const iconSun    = document.getElementById('icon-sun');
    const iconMoon   = document.getElementById('icon-moon');
    const fsBtn      = document.getElementById('fs-btn');
    const iconExpand = document.getElementById('icon-fs-expand');
    const iconCollapse = document.getElementById('icon-fs-collapse');

    /* ── Lesson data per grade (from GitHub API – cached in JS) ── */
    /*
     * Mỗi mảng chứa tên bài học cho lớp tương ứng.
     * API endpoint: https://api.github.com/repos/hoc-tap/hoc-tap.github.io/contents/tin-hoc-{grade}
     * Trang sẽ tự động lấy danh sách thư mục bai-xx từ API.
     */
    const GRADE_LABELS = {
      vi: g => `Lớp ${g}`,
      en: g => `Grade ${g}`
    };

    /* ── Load lessons for all grades ─────────────────────────── */
    async function loadAllGrades() {
      gradeGrid.innerHTML = '';

      // Create placeholder cards
      for (let g = 3; g <= 9; g++) {
        const card = createGradeCard(g, []);
        card.id = `card-grade-${g}`;
        gradeGrid.append(card);
      }

      const fetches = [];
      for (let g = 3; g <= 9; g++) {
        fetches.push(fetchGrade(g));
      }
      await Promise.allSettled(fetches);
      updateCount();
    }

    async function fetchGrade(grade) {
      const url = `https://api.github.com/repos/hoc-tap/hoc-tap.github.io/contents/tin-hoc-${grade}?ref=main`;
      try {
        const res = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const items = await res.json();
        // Only directories matching bai-xx
        const lessons = items
          .filter(i => i.type === 'dir' && /^bai-\d+$/i.test(i.name))
          .sort((a, b) => a.name.localeCompare(b.name, 'vi'));
        populateCard(grade, lessons);
      } catch (e) {
        // Keep empty placeholder, show error text
        const card = document.getElementById(`card-grade-${grade}`);
        if (card) {
          const list = card.querySelector('.lesson-list');
          if (list) {
            const err = document.createElement('p');
            err.style.cssText = 'padding:10px 6px;font-size:.78rem;color:var(--text2)';
            err.textContent = isEnglish ? 'Could not load lessons.' : 'Chưa tải được bài học.';
            list.append(err);
          }
        }
      }
    }

    function lessonLabel(folderName, grade) {
      // "bai-01" → "Bài 1", "bai-12" → "Bài 12"
      const num = parseInt(folderName.replace('bai-', ''), 10);
      return isEnglish ? `Lesson ${num}` : `Bài ${num}`;
    }

    function createGradeCard(grade, lessons) {
      const card = document.createElement('section');
      card.className = 'grade-card';
      card.dataset.grade = grade;
      card.setAttribute('aria-label', (isEnglish ? 'Grade ' : 'Lớp ') + grade);

      const header = document.createElement('div');
      header.className = 'grade-header';
      const num = document.createElement('span');
      num.className = 'grade-num';
      num.textContent = grade;
      const label = document.createElement('span');
      label.dataset.vi = `Lớp ${grade}`;
      label.dataset.en = `Grade ${grade}`;
      label.textContent = isEnglish ? `Grade ${grade}` : `Lớp ${grade}`;
      header.append(num, label);

      const list = document.createElement('div');
      list.className = 'lesson-list';

      lessons.forEach(item => {
        list.append(makeLessonLink(item.name, grade));
      });

      card.append(header, list);
      return card;
    }

    function makeLessonLink(folderName, grade) {
      const num = parseInt(folderName.replace('bai-', ''), 10);
      const a = document.createElement('a');
      a.className = 'lesson';
      a.href = `./tin-hoc-${grade}/${folderName}/`;
      const title = isEnglish ? `Lesson ${num}` : `Bài ${num}`;
      a.dataset.search = `bai ${num} lop ${grade} lesson ${num} grade ${grade}`;
      a.setAttribute('aria-label', title + (isEnglish ? `, Grade ${grade}` : `, Lớp ${grade}`));

      const badge = document.createElement('span');
      badge.className = 'lesson-badge';
      badge.setAttribute('aria-hidden', 'true');
      badge.textContent = num;

      a.append(badge, document.createTextNode(title));
      return a;
    }

    function populateCard(grade, lessons) {
      const card = document.getElementById(`card-grade-${grade}`);
      if (!card) return;
      const list = card.querySelector('.lesson-list');
      list.innerHTML = '';
      lessons.forEach(item => {
        list.append(makeLessonLink(item.name, grade));
      });
    }

    /* ── Translate all data-vi/data-en elements ──────────────── */
    function applyLanguage() {
      document.querySelectorAll('[data-vi]').forEach(el => {
        const key = isEnglish ? 'en' : 'vi';
        if (el.tagName === 'INPUT') {
          el.placeholder = el.dataset[key] || el.placeholder;
        } else {
          el.textContent = el.dataset[key] || el.textContent;
        }
      });
      // Grade headers
      document.querySelectorAll('.grade-card').forEach(card => {
        const g = card.dataset.grade;
        const lbl = card.querySelector('.grade-header span:last-child');
        if (lbl) lbl.textContent = isEnglish ? `Grade ${g}` : `Lớp ${g}`;
        // Lesson labels
        card.querySelectorAll('.lesson').forEach(a => {
          const badge = a.querySelector('.lesson-badge');
          const num = badge ? badge.textContent : '?';
          const text = isEnglish ? `Lesson ${num}` : `Bài ${num}`;
          // Update text node
          a.childNodes.forEach(node => {
            if (node.nodeType === Node.TEXT_NODE) node.textContent = text;
          });
          a.setAttribute('aria-label', text + (isEnglish ? `, Grade ${g}` : `, Lớp ${g}`));
        });
      });
      langLabel.textContent = isEnglish ? 'EN' : 'VI';
      langBtn.setAttribute('aria-pressed', String(isEnglish));
      updateCount();
    }

    /* ── Count visible lessons ───────────────────────────────── */
    function updateCount() {
      const cards  = document.querySelectorAll('.grade-card:not([hidden])');
      const lessons = document.querySelectorAll('.lesson:not([hidden])');
      const lbl = isEnglish
        ? `${lessons.length} lessons · ${cards.length} grades`
        : `${lessons.length} bài học · ${cards.length} lớp`;
      countLabel.textContent = lbl;
    }

    /* ── Google search ───────────────────────────────────────── */
    searchBox.addEventListener('click', () => {
      window.location.href = 'https://www.google.com.vn/';
    });
    searchBox.addEventListener('keydown', e => {
      if (e.key === 'Enter') window.location.href = 'https://www.google.com.vn/';
    });

    /* ── Dark / Light mode ───────────────────────────────────── */
    function applyTheme() {
      html.dataset.theme = isDark ? 'dark' : 'light';
      iconSun.style.display  = isDark ? 'none' : '';
      iconMoon.style.display = isDark ? ''     : 'none';
      themeBtn.title = isDark
        ? (isEnglish ? 'Switch to Light mode' : 'Chuyển sang chế độ Sáng')
        : (isEnglish ? 'Switch to Dark mode'  : 'Chuyển sang chế độ Tối');
    }
    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      applyTheme();
      try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch(_) {}
    });

    /* ── Language ────────────────────────────────────────────── */
    langBtn.addEventListener('click', () => {
      isEnglish = !isEnglish;
      applyLanguage();
    });

    /* ── Fullscreen ──────────────────────────────────────────── */
    fsBtn.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch (_) {}
    });
    document.addEventListener('fullscreenchange', () => {
      const full = Boolean(document.fullscreenElement);
      iconExpand.style.display   = full ? 'none' : '';
      iconCollapse.style.display = full ? ''     : 'none';
      fsBtn.setAttribute('aria-label', full
        ? (isEnglish ? 'Exit fullscreen' : 'Thoát toàn màn hình')
        : (isEnglish ? 'Fullscreen'      : 'Bật toàn màn hình'));
      fsBtn.title = full ? (isEnglish ? 'Exit fullscreen' : 'Thoát') : (isEnglish ? 'Fullscreen' : 'Toàn màn hình');
    });

    /* ── Init ────────────────────────────────────────────────── */
    (function init() {
      // Restore theme preference
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') { isDark = true; applyTheme(); }
        else if (saved === 'light') { isDark = false; applyTheme(); }
        else {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          applyTheme();
        }
      } catch(_) {}

      loadAllGrades();
    })();
  </script>

</body>
</html>
