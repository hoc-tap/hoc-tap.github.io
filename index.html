<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2f8">
  <title>Kho Học Liệu – Thầy Minh</title>
  <style>
    /* ── Tokens ──────────────────────────────────────────────── */
    :root {
      --bg:        #edf2f8;
      --bg2:       #f8fafc;
      --surface:   #ffffff;
      --border:    #dce4ed;
      --text:      #17251f;
      --text2:     #4a5e54;
      --green:     #087938;
      --green-lt:  #e5f5eb;
      --shadow:    rgba(30, 50, 74, .07);
      --nav-bg:    rgba(248,250,253,.95);
      --card-bg:   rgba(255,255,255,.95);
      --lesson-bg: linear-gradient(180deg,#fff,#f9fbfa);
      --lesson-hover: #f2fbf4;
      --badge-bg:  #075a39;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg:        #111a14;
      --bg2:       #151f18;
      --surface:   #1c2820;
      --border:    #2c3d32;
      --text:      #d8ede0;
      --text2:     #7aaa8a;
      --green:     #45c47a;
      --green-lt:  #183023;
      --shadow:    rgba(0,0,0,.3);
      --nav-bg:    rgba(17,26,20,.96);
      --card-bg:   rgba(28,40,32,.97);
      --lesson-bg: linear-gradient(180deg,#1e2e22,#192619);
      --lesson-hover: #1e3324;
      --badge-bg:  #1f6640;
      color-scheme: dark;
    }

    /* ── Reset ───────────────────────────────────────────────── */
    *,::before,::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: Inter,"Segoe UI",Arial,sans-serif; font-size: 16px;
           -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body { min-height: 100vh; background: var(--bg); color: var(--text);
           display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; }

    /* ── Navbar ──────────────────────────────────────────────── */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 10px clamp(14px, 3.5vw, 52px);
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px var(--shadow);
      backdrop-filter: blur(12px);
    }

    /* Brand */
    .brand {
      display: flex; align-items: center; gap: 11px;
      white-space: nowrap; flex-shrink: 0;
    }
    .brand-leaf { width: 36px; height: 40px; flex: 0 0 auto; }
    .brand-copy { display: flex; flex-direction: column; line-height: 1.2; }
    .brand-name {
      font-size: 1.18rem; font-weight: 800; letter-spacing: .02em;
      text-transform: uppercase; color: var(--green);
    }
    .brand-sub { font-size: .75rem; color: var(--text2); font-weight: 500; }

    /* Search */
    .search-area {
      max-width: 480px; width: 100%;
      position: relative; justify-self: center;
    }
    .search-area .g-logo {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; pointer-events: none;
    }
    .search-box {
      width: 100%; height: 40px;
      padding: 0 14px 0 40px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text);
      font-size: .88rem;
      cursor: pointer;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .search-box:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(8,121,56,.15); }
    .search-box::placeholder { color: var(--text2); }

    /* Actions */
    .nav-actions {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; height: 36px; padding: 0 14px;
      border: 1px solid var(--border); border-radius: 8px;
      background: transparent; cursor: pointer; font-size: .82rem; font-weight: 650;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--green-lt); border-color: var(--green); }
    .btn.icon-btn { width: 36px; padding: 0; }
    .btn.game-btn { color: var(--green); border-color: var(--green); }
    .btn.game-btn:hover { background: var(--green); color: #fff; }

    /* Dark/Light toggle */
    .theme-btn svg { pointer-events: none; }

    /* Language toggle */
    .lang-pill {
      display: inline-flex; align-items: center; gap: 4px;
      height: 36px; padding: 0 10px;
      border: 1px solid var(--border); border-radius: 8px;
      background: transparent; cursor: pointer; font-size: .78rem; font-weight: 700;
      transition: background .15s;
    }
    .lang-pill:hover { background: var(--green-lt); border-color: var(--green); }
    .lang-pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green); flex-shrink: 0;
    }

    /* ── Main content ────────────────────────────────────────── */
    .main { flex: 1; width: 100%; max-width: 1780px;
            align-self: center; padding: 20px clamp(12px,3vw,44px) 28px; }

    /* Status row */
    .statusbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; font-size: .78rem; color: var(--text2);
    }

    /* ── Grade grid (4 cols) ─────────────────────────────────── */
    .grade-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    /* For 7 grades arranged in 4 cols: rows are calculated automatically */
    .grade-card {
      display: flex; flex-direction: column;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--card-bg); overflow: hidden;
      box-shadow: 0 3px 10px var(--shadow);
      height: calc(100vh - 180px);
      min-height: 520px;
    }
    .grade-header {
      position: sticky; top: 0; z-index: 2;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-weight: 750; font-size: clamp(.95rem,1.3vw,1.15rem);
      color: var(--green);
    }
    .grade-num {
      display: inline-grid; place-items: center;
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--green); color: #fff; font-size: .82rem; font-weight: 800;
    }
    .lesson-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 8px 12px;
      display: flex; flex-direction: column; gap: 6px;
      scrollbar-color: #c9d6cb transparent; scrollbar-width: thin;
    }
    /* ── Bai accordion ───────────────────────────────────────── */
    .bai-group {
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: border-color .15s;
    }
    .bai-group:hover {
      border-color: #a8cfb1;
    }

    .bai-toggle {
      width: 100%;
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: var(--lesson-bg);
      border: none;
      cursor: pointer;
      text-align: left;
      font-size: .84rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
      transition: background .14s;
    }
    .bai-toggle:hover { background: var(--lesson-hover); }
    .bai-toggle[aria-expanded="true"] {
      background: var(--green-lt);
      border-bottom: 1px solid var(--border);
    }

    .bai-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: var(--badge-bg);
      color: #fff;
      font-size: 11px;
      font-weight: 750;
      line-height: 1;
    }
    .bai-title {
      font-size: .84rem;
      color: var(--text);
    }
    .bai-arrow {
      margin-left: auto;
      flex-shrink: 0;
      font-size: .65rem;
      transition: transform .18s;
      color: var(--text2);
    }
    .bai-toggle[aria-expanded="true"] .bai-arrow { transform: rotate(90deg); }
    .bai-file-count {
      color: var(--green);
      font-size: .75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .bai-files {
      display: none;
      flex-direction: column;
      gap: 3px;
      background: var(--bg2);
      padding: 6px 8px 8px 14px;
    }
    .bai-files.open { display: flex; }

    .file-link {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-size: .78rem;
      line-height: 1.35;
      color: var(--text);
      text-decoration: none;
      background: var(--surface);
      transition: background .12s, color .12s, border-color .12s;
    }
    .file-link:hover {
      background: var(--lesson-hover);
      border-color: #a8cfb1;
      color: var(--green);
    }
    .file-icon { flex-shrink: 0; font-size: .85rem; }
    .file-empty {
      padding: 6px 8px;
      font-size: .75rem;
      color: var(--text2);
      font-style: italic;
    }
    .bai-loading { color: var(--text2); font-size: .75rem; padding: 6px 8px; font-style: italic; }

    .bai-group[hidden] { display: none; }
    .grade-card[hidden] { display: none; }

    /* ── Footer ──────────────────────────────────────────────── */
    .footer {
      text-align: center; padding: 14px 16px;
      font-size: .74rem; color: var(--text2);
      border-top: 1px solid var(--border);
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 900px) {
      .navbar { grid-template-columns: auto auto; }
      .search-area { grid-column: 1 / -1; grid-row: 2; max-width: 100%; justify-self: stretch; }
      .grade-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 600px) {
      .brand-name { font-size: 1rem; }
      .grade-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
      .grade-card { height: calc(100vh - 200px); min-height: 420px; }
      .btn { font-size: .76rem; height: 32px; padding: 0 10px; }
    }
    @media (max-width: 420px) {
      .grade-grid { grid-template-columns: 1fr; }
      .grade-card { height: auto; max-height: none; min-height: unset; }
    }
  </style>
</head>
<body>

  <!-- ════════════════ NAVBAR ════════════════ -->
  <header class="navbar">

    <a class="brand" href="./" aria-label="KHO HỌC LIỆU – Thầy Minh, về trang chủ">

  <!-- ════════════════ CONTENT ════════════════ -->
  <main class="main" aria-label="Thư viện học liệu Tin học">

      <span id="status-label" data-vi="Tin học lớp 3 – 9" data-en="Computer Science Grade 3–9">Tin học lớp 3 – 9</span>
      <span id="count-label" aria-live="polite">Đang tải...</span>

    <div id="grade-grid" class="grade-grid" aria-label="Bài học theo lớp">

  <!-- ════════════════ SCRIPT ════════════════ -->
  <script>
    /* ── State ───────────────────────────────────────────────── */
    let isEnglish = false;
    let isDark    = false;

    /* ── Elements ────────────────────────────────────────────── */
    const html         = document.documentElement;
    const gradeGrid    = document.getElementById('grade-grid');
    const searchBox    = document.getElementById('search-box');
    const countLabel   = document.getElementById('count-label');
    const langBtn      = document.getElementById('lang-btn');
    const langLabel    = document.getElementById('lang-label');
    const themeBtn     = document.getElementById('theme-btn');
    const iconSun      = document.getElementById('icon-sun');
    const iconMoon     = document.getElementById('icon-moon');
    const fsBtn        = document.getElementById('fs-btn');
    const iconExpand   = document.getElementById('icon-fs-expand');
    const iconCollapse = document.getElementById('icon-fs-collapse');

    /* ── Static lesson data (generated from local filesystem) ──
       Cập nhật dữ liệu này mỗi khi thêm file mới vào thư mục.
    ────────────────────────────────────────────────────────── */
    const GRADE_DATA = {
      3: {
        "bai-01": ["google_maps_satellite_embed (1).html", "kiem_tra_tin_8_GHKI (3).html", "test-nop-bai.html"],
        "bai-02": [], "bai-03": [], "bai-04": [], "bai-05": [], "bai-06": [], "bai-07": [], "bai-08": [],
        "bai-09": [], "bai-10": [], "bai-11": [], "bai-12": [], "bai-13": [], "bai-14": [], "bai-15": [], "bai-16": []
      },
      4: {
        "bai-01": [], "bai-02": [], "bai-03": [], "bai-04": [], "bai-05": [], "bai-06": [], "bai-07": [], "bai-08": [],
        "bai-09": [], "bai-10": [], "bai-11": [], "bai-12": [], "bai-13": [], "bai-14": [], "bai-15": [], "bai-16": []
      },
      5: {
        "bai-01": [], "bai-02": [], "bai-03": [], "bai-04": [], "bai-05": [], "bai-06": [], "bai-07": [], "bai-08": [],
        "bai-09": [], "bai-10": [], "bai-11": [], "bai-12": [], "bai-13": [], "bai-14": [], "bai-15": [], "bai-16": []
      },
      6: {
        "bai-01": [], "bai-02": [], "bai-03": [], "bai-04": [], "bai-05": [], "bai-06": [], "bai-07": [], "bai-08": [],
        "bai-09": [], "bai-10": [], "bai-11": [], "bai-12": [], "bai-13": [], "bai-14": [], "bai-15": [], "bai-16": []
      },
      7: {
        "bai-01": [], "bai-02": [], "bai-03": [], "bai-04": [], "bai-05": [], "bai-06": [], "bai-07": [], "bai-08": [],
        "bai-09": [], "bai-10": [], "bai-11": [], "bai-12": [], "bai-13": [], "bai-14": [], "bai-15": [], "bai-16": []
      },
      8: {
        "bai-01": [], "bai-02": [], "bai-03": [], "bai-04": [], "bai-05": [], "bai-06": [], "bai-07": [], "bai-08": [],
        "bai-09": [], "bai-10": [], "bai-11": [], "bai-12": [], "bai-13": [], "bai-14": [], "bai-15": [], "bai-16": []
      },
      9: {
        "bai-01": [], "bai-02": [], "bai-03": [], "bai-04": [], "bai-05": [], "bai-06": [], "bai-07": [], "bai-08": [],
        "bai-09": [], "bai-10": [], "bai-11": [], "bai-12": [], "bai-13": [], "bai-14": [], "bai-15": [], "bai-16": []
      }
    };

    /* ── Pretty file name ────────────────────────────────────── */
    function prettyName(filename) {
      return filename
        .replace(/\.html?$/i, '')
        .replace(/[-_()\[\]]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    /* ── Build a file sub-link ───────────────────────────────── */
    function makeFileLink(grade, baiName, fileName) {
      const a = document.createElement('a');
      a.className = 'file-link';
      a.href = `./tin-hoc-${grade}/${baiName}/${encodeURIComponent(fileName)}`;
      a.target = '_blank';
      a.rel = 'noopener';
      a.setAttribute('aria-label', prettyName(fileName));

      const icon = document.createElement('span');
      icon.className = 'file-icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.textContent = '\uD83D\uDCC4';

      a.append(icon, document.createTextNode(prettyName(fileName)));
      return a;
    }

    /* ── Accordion toggle (instant, no API) ─────────────────── */
    function toggleBai(toggleEl, filesEl, grade, baiName) {
      const expanded = toggleEl.getAttribute('aria-expanded') === 'true';

      toggleEl.setAttribute('aria-expanded', String(!expanded));
      filesEl.classList.toggle('open', !expanded);

      if (expanded || filesEl.dataset.rendered) return;
      filesEl.dataset.rendered = '1';

      const files = (GRADE_DATA[grade] || {})[baiName] || [];
      filesEl.innerHTML = '';

      if (files.length === 0) {
        const empty = document.createElement('span');
        empty.className = 'file-empty';
        empty.textContent = isEnglish ? 'No files yet.' : 'Chưa có bài học nào.';
        filesEl.append(empty);
      } else {
        files.forEach(fn => filesEl.append(makeFileLink(grade, baiName, fn)));
      }
    }

    /* ── Build one bai-group ─────────────────────────────────── */
    function makeBaiGroup(baiName, grade) {
      const num   = parseInt(baiName.replace('bai-', ''), 10);
      const files = (GRADE_DATA[grade] || {})[baiName] || [];
      const label = isEnglish ? `Lesson ${num}` : `Bài ${num}`;

      const group = document.createElement('div');
      group.className = 'bai-group';
      group.dataset.bai    = baiName;
      group.dataset.search = `bai ${num} lop ${grade} lesson ${num} grade ${grade}`;

      const toggle = document.createElement('button');
      toggle.className = 'bai-toggle';
      toggle.type = 'button';
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', `${label}, ${isEnglish ? 'Grade' : 'Lớp'} ${grade}`);

      const badge = document.createElement('span');
      badge.className = 'bai-badge';
      badge.setAttribute('aria-hidden', 'true');
      badge.textContent = num;

      const titleSpan = document.createElement('span');
      titleSpan.className = 'bai-title';
      titleSpan.textContent = label;

      const fileCount = document.createElement('span');
      fileCount.className = 'bai-file-count';
      fileCount.setAttribute('aria-hidden', 'true');
      fileCount.textContent = files.length > 0 ? `(${files.length})` : '';

      const arrow = document.createElement('span');
      arrow.className = 'bai-arrow';
      arrow.setAttribute('aria-hidden', 'true');
      arrow.textContent = '\u25B6';

      toggle.append(badge, titleSpan, fileCount, arrow);

      const filesEl = document.createElement('div');
      filesEl.className = 'bai-files';

      toggle.addEventListener('click', () => toggleBai(toggle, filesEl, grade, baiName));

      group.append(toggle, filesEl);
      return group;
    }

    /* ── Build a grade card ──────────────────────────────────── */
    function createGradeCard(grade) {
      const card = document.createElement('section');
      card.className = 'grade-card';
      card.id = `card-grade-${grade}`;
      card.dataset.grade = grade;
      card.setAttribute('aria-label', (isEnglish ? 'Grade ' : 'Lớp ') + grade);

      const header = document.createElement('div');
      header.className = 'grade-header';

      const numBadge = document.createElement('span');
      numBadge.className = 'grade-num';
      numBadge.textContent = grade;

      const lbl = document.createElement('span');
      lbl.dataset.vi = `Lớp ${grade}`;
      lbl.dataset.en = `Grade ${grade}`;
      lbl.textContent = isEnglish ? `Grade ${grade}` : `Lớp ${grade}`;

      header.append(numBadge, lbl);

      const list = document.createElement('div');
      list.className = 'lesson-list';

      const baiNames = Object.keys(GRADE_DATA[grade] || {}).sort((a,b) => a.localeCompare(b, 'vi'));
      if (baiNames.length === 0) {
        const p = document.createElement('p');
        p.style.cssText = 'padding:10px 6px;font-size:.78rem;color:var(--text2)';
        p.textContent = isEnglish ? 'No lessons yet.' : 'Chưa có bài học.';
        list.append(p);
      } else {
        baiNames.forEach(bn => list.append(makeBaiGroup(bn, grade)));
      }

      card.append(header, list);
      return card;
    }

    /* ── Render all grade cards ──────────────────────────────── */
    function renderAllGrades() {
      gradeGrid.innerHTML = '';
      for (let g = 3; g <= 9; g++) {
        gradeGrid.append(createGradeCard(g));
      }
      updateCount();
    }

    /* ── Count ───────────────────────────────────────────────── */
    function updateCount() {
      const cards  = gradeGrid.querySelectorAll('.grade-card:not([hidden])');
      const groups = gradeGrid.querySelectorAll('.bai-group:not([hidden])');
      countLabel.textContent = isEnglish
        ? `${groups.length} lessons · ${cards.length} grades`
        : `${groups.length} bài học · ${cards.length} lớp`;
    }

    /* ── Language ────────────────────────────────────────────── */
    function applyLanguage() {
      document.querySelectorAll('[data-vi]').forEach(el => {
        const val = el.dataset[isEnglish ? 'en' : 'vi'];
        if (!val) return;
        if (el.tagName === 'INPUT') el.placeholder = val;
        else el.textContent = val;
      });
      gradeGrid.querySelectorAll('.grade-card').forEach(card => {
        const g = card.dataset.grade;
        const lbl = card.querySelector('.grade-header span:last-child');
        if (lbl) lbl.textContent = isEnglish ? `Grade ${g}` : `Lớp ${g}`;
        card.querySelectorAll('.bai-group').forEach(group => {
          const baiName = group.dataset.bai || '';
          const num  = parseInt(baiName.replace('bai-', ''), 10) || '?';
          const text = isEnglish ? `Lesson ${num}` : `Bài ${num}`;
          const titleEl = group.querySelector('.bai-title');
          if (titleEl) titleEl.textContent = text;
          const tog  = group.querySelector('.bai-toggle');
          if (tog) tog.setAttribute('aria-label', `${text}, ${isEnglish ? 'Grade' : 'Lớp'} ${g}`);
        });
      });
      langLabel.textContent = isEnglish ? 'EN' : 'VI';
      langBtn.setAttribute('aria-pressed', String(isEnglish));
      updateCount();
    }

    /* ── Theme ───────────────────────────────────────────────── */
    function applyTheme() {
      html.dataset.theme    = isDark ? 'dark' : 'light';
      iconSun.style.display  = isDark ? 'none' : '';
      iconMoon.style.display = isDark ? '' : 'none';
      themeBtn.title = isDark
        ? (isEnglish ? 'Switch to Light' : 'Chế độ Sáng')
        : (isEnglish ? 'Switch to Dark'  : 'Chế độ Tối');
    }

    /* ── Events ──────────────────────────────────────────────── */
    searchBox.addEventListener('click',   () => { window.location.href = 'https://www.google.com.vn/'; });
    searchBox.addEventListener('keydown', e  => { if (e.key === 'Enter') window.location.href = 'https://www.google.com.vn/'; });

    themeBtn.addEventListener('click', () => {
      isDark = !isDark; applyTheme();
      try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch(_) {}
    });

    langBtn.addEventListener('click', () => { isEnglish = !isEnglish; applyLanguage(); });

    fsBtn.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch (_) {}
    });
    document.addEventListener('fullscreenchange', () => {
      const full = Boolean(document.fullscreenElement);
      iconExpand.style.display   = full ? 'none' : '';
      iconCollapse.style.display = full ? '' : 'none';
      fsBtn.setAttribute('aria-label', full
        ? (isEnglish ? 'Exit fullscreen' : 'Thoát toàn màn hình')
        : (isEnglish ? 'Fullscreen'      : 'Bật toàn màn hình'));
    });

    /* ── Init ────────────────────────────────────────────────── */
    (function init() {
      try {
        const saved = localStorage.getItem('theme');
        isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
      } catch(_) {}
      applyTheme();
      renderAllGrades();
    })();
  </script>

</body>
</html>
