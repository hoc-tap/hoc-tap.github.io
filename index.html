<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Góc trò chơi học tập</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20243a;
      background: #f6f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 8% 0%, rgba(112, 91, 255, .10), transparent 34rem),
        radial-gradient(ellipse at 100% 35%, rgba(35, 190, 164, .08), transparent 30rem),
        #f6f7fb;
    }

    .page {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
      padding: 64px 0 48px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      color: #6254d8;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6254d8;
      content: "";
    }

    h1 {
      max-width: 700px;
      margin: 0;
      font-size: clamp(2.25rem, 6vw, 4.4rem);
      letter-spacing: -.055em;
      line-height: 1.05;
    }

    .intro {
      max-width: 590px;
      margin: 20px 0 32px;
      color: #697087;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .count {
      margin: 0;
      color: #737a8f;
      font-size: .92rem;
    }

    .search {
      width: min(100%, 300px);
      padding: 12px 15px;
      border: 1px solid #e4e6ef;
      border-radius: 12px;
      outline: none;
      background: rgba(255, 255, 255, .85);
      color: #20243a;
      font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }

    .search:focus {
      border-color: #8175ef;
      box-shadow: 0 0 0 4px rgba(112, 91, 255, .12);
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 245px), 1fr));
      gap: 18px;
    }

    .game-card {
      display: flex;
      min-height: 220px;
      flex-direction: column;
      padding: 22px;
      border: 1px solid rgba(225, 228, 239, .9);
      border-radius: 20px;
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 12px 32px rgba(40, 45, 80, .045);
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: #d5d0ff;
      box-shadow: 0 18px 38px rgba(53, 48, 112, .10);
    }

    .game-icon {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      margin-bottom: 20px;
      border-radius: 16px;
      background: #f0eeff;
      font-size: 1.65rem;
    }

    .game-card h2 {
      margin: 0 0 8px;
      font-size: 1.12rem;
      letter-spacing: -.02em;
    }

    .game-card p {
      margin: 0;
      color: #737a8f;
      font-size: .92rem;
      line-height: 1.55;
    }

    .play-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 22px;
      color: #6254d8;
      font-size: .92rem;
      font-weight: 750;
      text-decoration: none;
    }

    .play-link span:last-child {
      transition: transform .2s;
    }

    .play-link:hover span:last-child { transform: translateX(4px); }

    .message {
      grid-column: 1 / -1;
      padding: 28px;
      border: 1px dashed #d8dbea;
      border-radius: 16px;
      color: #697087;
      text-align: center;
      line-height: 1.6;
    }

    .message[hidden] { display: none; }

    .retry {
      margin-top: 12px;
      padding: 9px 14px;
      border: 0;
      border-radius: 10px;
      background: #6254d8;
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .retry:hover { background: #5143c0; }

    footer {
      margin-top: 36px;
      color: #858ba0;
      font-size: .82rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      .page { width: min(100% - 28px, 1080px); padding-top: 42px; }
      .toolbar { align-items: stretch; flex-direction: column-reverse; }
      .search { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Học mà chơi</p>
    <h1>Chọn trò chơi<br>và bắt đầu nhé!</h1>
    <p class="intro">Tập hợp các trò chơi học tập. Chọn một trò chơi để mở và trải nghiệm ngay trên website.</p>

    <section aria-label="Danh sách trò chơi">
      <div class="toolbar">
        <p class="count" id="count" aria-live="polite">Đang tải danh sách trò chơi...</p>
        <input class="search" id="search" type="search" placeholder="Tìm trò chơi..." aria-label="Tìm trò chơi" disabled>
      </div>
      <div class="games" id="games" aria-live="polite">
        <div class="message">Đang kết nối để lấy danh sách trò chơi...</div>
      </div>
    </section>

    <footer>Danh sách được tự động lấy từ thư mục tro-choi trên GitHub.</footer>
  </main>

  <script>
    const API_URL = "https://api.github.com/repos/hoc-tap/hoc-tap.github.io/contents/tro-choi?ref=main";
    const gamesElement = document.querySelector("#games");
    const countElement = document.querySelector("#count");
    const searchElement = document.querySelector("#search");
    const gameDetails = {
      "sudoku.html": { title: "Sudoku", description: "Rèn tư duy logic với những ô số đầy thử thách.", icon: "🔢" },
      "luyen-go-ban-phim.html": { title: "Luyện gõ bàn phím", description: "Luyện kỹ năng gõ phím nhanh và chính xác.", icon: "⌨️" },
      "co-vua.html": { title: "Cờ vua", description: "Thử sức chiến thuật qua từng nước cờ.", icon: "♟️" },
      "co-tuong.html": { title: "Cờ tướng", description: "Đấu trí và sắp xếp thế trận thật khéo léo.", icon: "🏮" },
      "bao-tap-ban-phim.html": { title: "Bão táp gõ phím", description: "Tăng tốc độ gõ phím trong thử thách sôi động.", icon: "⚡" }
    };
    let games = [];

    function getGameDetails(fileName) {
      if (gameDetails[fileName]) return gameDetails[fileName];
      const title = fileName
        .replace(/\.html$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, (letter) => letter.toLocaleUpperCase("vi"));
      return { title, description: "Mở trò chơi và bắt đầu trải nghiệm.", icon: "🎮" };
    }

    function renderGames() {
      const query = searchElement.value.trim().toLocaleLowerCase("vi");
      const filteredGames = games.filter((game) => {
        const details = getGameDetails(game.name);
        return `${details.title} ${details.description} ${game.name}`.toLocaleLowerCase("vi").includes(query);
      });
      gamesElement.replaceChildren();

      if (filteredGames.length === 0) {
        const emptyMessage = document.createElement("div");
        emptyMessage.className = "message";
        emptyMessage.textContent = games.length ? "Không tìm thấy trò chơi phù hợp." : "Thư mục chưa có trò chơi HTML nào.";
        gamesElement.append(emptyMessage);
      } else {
        filteredGames.forEach((game) => {
          const details = getGameDetails(game.name);
          const card = document.createElement("article");
          card.className = "game-card";

          const icon = document.createElement("div");
          icon.className = "game-icon";
          icon.setAttribute("aria-hidden", "true");
          icon.textContent = details.icon;

          const title = document.createElement("h2");
          title.textContent = details.title;

          const description = document.createElement("p");
          description.textContent = details.description;

          const link = document.createElement("a");
          link.className = "play-link";
          link.href = `./tro-choi/${encodeURIComponent(game.name)}`;
          link.setAttribute("aria-label", `Chơi ${details.title}`);
          link.innerHTML = "<span>Chơi ngay</span><span aria-hidden=\"true\">→</span>";

          card.append(icon, title, description, link);
          gamesElement.append(card);
        });
      }

      countElement.textContent = `${filteredGames.length} / ${games.length} trò chơi`;
    }

    async function loadGames() {
      searchElement.disabled = true;
      countElement.textContent = "Đang tải danh sách trò chơi...";
      gamesElement.replaceChildren();
      const loadingMessage = document.createElement("div");
      loadingMessage.className = "message";
      loadingMessage.textContent = "Đang kết nối để lấy danh sách trò chơi...";
      gamesElement.append(loadingMessage);

      try {
        const response = await fetch(API_URL, {
          headers: { Accept: "application/vnd.github+json" }
        });
        if (!response.ok) throw new Error(`GitHub API trả về mã ${response.status}.`);

        const files = await response.json();
        if (!Array.isArray(files)) throw new Error("Dữ liệu thư mục trả về không hợp lệ.");

        games = files
          .filter((file) => file.type === "file" && /\.html?$/i.test(file.name))
          .sort((first, second) => first.name.localeCompare(second.name, "vi"));
        searchElement.disabled = false;
        renderGames();
      } catch (error) {
        console.error("Không thể tải danh sách trò chơi:", error);
        games = [];
        countElement.textContent = "Chưa thể tải danh sách trò chơi";
        gamesElement.replaceChildren();
        const errorMessage = document.createElement("div");
        errorMessage.className = "message";
        errorMessage.textContent = "Không tải được danh sách từ GitHub. Vui lòng kiểm tra kết nối mạng rồi thử lại.";
        const retryButton = document.createElement("button");
        retryButton.className = "retry";
        retryButton.type = "button";
        retryButton.textContent = "Thử lại";
        retryButton.addEventListener("click", loadGames);
        errorMessage.append(document.createElement("br"), retryButton);
        gamesElement.append(errorMessage);
      }
    }

    searchElement.addEventListener("input", renderGames);
    loadGames();
  </script>
</body>
</html>
