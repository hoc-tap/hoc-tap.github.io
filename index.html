<!DOCTYPE html>
<html lang="vi" translate="no" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <meta name="theme-color" content="#293c55">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <title>Kho Học Liệu – Thầy Minh</title>
  <style>
    /* ── Tokens ──────────────────────────────────────────────── */
    :root {
      --bg: #293c55;
      --bg2: #f8fafc;
      --surface: #ffffff;
      --border: #dce4ed;
      --text: #17251f;
      --text2: #4a5e54;
      --green: #087938;
      --green-lt: #e5f5eb;
      --shadow: rgba(30, 50, 74, .07);
      --nav-bg: rgba(248, 250, 253, .95);
      --card-bg: rgba(255, 255, 255, .95);
      --lesson-bg: linear-gradient(180deg, #fff, #f9fbfa);
      --lesson-hover: #f2fbf4;
      --badge-bg: #075a39;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #111a14;
      --bg2: #151f18;
      --surface: #1c2820;
      --border: #2c3d32;
      --text: #d8ede0;
      --text2: #7aaa8a;
      --green: #45c47a;
      --green-lt: #183023;
      --shadow: rgba(0, 0, 0, .3);
      --nav-bg: rgba(17, 26, 20, .96);
      --card-bg: rgba(28, 40, 32, .97);
      --lesson-bg: linear-gradient(180deg, #1e2e22, #192619);
      --lesson-hover: #1e3324;
      --badge-bg: #1f6640;
      color-scheme: dark;
    }

    /* ── Reset ───────────────────────────────────────────────── */
    *,
    ::before,
    ::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
      color: inherit;
    }

    /* ── Navbar ──────────────────────────────────────────────── */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 10px clamp(14px, 3.5vw, 52px);
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px var(--shadow);
      backdrop-filter: blur(12px);
    }

    /* Brand */
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .brand-leaf {
      width: 36px;
      height: 40px;
      flex: 0 0 auto;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-name {
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: var(--green);
    }

    .brand-sub {
      font-size: .75rem;
      color: var(--text2);
      font-weight: 500;
    }

    /* Search */
    .search-area {
      max-width: 480px;
      width: 100%;
      position: relative;
      justify-self: center;
    }

    .search-area .g-logo {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    .search-box {
      width: 100%;
      height: 40px;
      padding: 0 14px 0 40px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text);
      font-size: .88rem;
      cursor: pointer;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }

    .search-box:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(8, 121, 56, .15);
    }

    .search-box::placeholder {
      color: var(--text2);
    }

    /* Actions */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: .82rem;
      font-weight: 650;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--green-lt);
      border-color: var(--green);
    }

    .btn.icon-btn {
      width: 36px;
      padding: 0;
    }

    .btn.game-btn {
      color: var(--green);
      border-color: var(--green);
    }

    .btn.game-btn:hover {
      background: var(--green);
      color: #fff;
    }

    /* Dark/Light toggle */
    .theme-btn svg {
      pointer-events: none;
    }

    /* ── Main content ────────────────────────────────────────── */
    .main {
      flex: 1;
      width: 100%;
      max-width: 1780px;
      align-self: center;
      padding: 20px clamp(12px, 3vw, 44px) 28px;
    }

    /* Status row */
    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: .78rem;
      color: #e2e8f0;
    }

    /* ── Grade grid (7 cols) ─────────────────────────────────── */
    .grade-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }

    .grade-card {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      overflow: hidden;
      box-shadow: 0 3px 10px var(--shadow);
      height: auto;
    }

    .grade-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 9px 5px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: .7rem;
      color: var(--green);
    }

    .grade-num {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      font-size: .62rem;
      font-weight: 400;
    }

    .lesson-list {
      flex: 0 0 auto;
      overflow: visible;
      padding: 6px 5px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ── Bai accordion ───────────────────────────────────────── */
    .bai-group {
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: border-color .15s;
    }

    .bai-group:hover {
      border-color: #a8cfb1;
    }

    .bai-group.is-open {
      border-color: #a8cfb1;
    }

    .bai-toggle {
      width: 100%;
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 6px;
      background: var(--lesson-bg);
      border: none;
      cursor: pointer;
      text-align: left;
      font-size: .62rem;
      font-weight: 400;
      line-height: 1.3;
      color: var(--text);
      transition: background .14s;
    }

    .bai-toggle:hover {
      background: var(--lesson-hover);
    }

    .bai-toggle[aria-expanded="true"] {
      background: var(--green-lt);
      border-bottom: 1px solid var(--border);
    }

    .bai-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .62rem;
      color: var(--text);
    }

    .bai-file-count {
      color: var(--green);
      font-size: .58rem;
      font-weight: 400;
      flex-shrink: 0;
    }

    .bai-files {
      display: none;
      flex-direction: column;
      gap: 3px;
      background: var(--bg2);
      padding: 6px 8px 8px 14px;
    }

    .bai-files.open {
      display: flex;
    }

    .file-link {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-size: .62rem;
      line-height: 1.35;
      color: var(--text);
      text-decoration: none;
      background: var(--surface);
      transition: background .12s, color .12s, border-color .12s;
    }

    .file-link:hover {
      background: var(--lesson-hover);
      border-color: #a8cfb1;
      color: var(--green);
    }

    .file-empty {
      padding: 6px 8px;
      font-size: .75rem;
      color: var(--text2);
      font-style: italic;
    }

    .bai-loading {
      color: var(--text2);
      font-size: .75rem;
      padding: 6px 8px;
      font-style: italic;
    }

    .bai-group[hidden] {
      display: none;
    }

    .grade-card[hidden] {
      display: none;
    }

    /* ── Footer ──────────────────────────────────────────────── */
    .footer {
      text-align: center;
      padding: 14px 16px;
      font-size: .74rem;
      color: #e2e8f0;
      border-top: 1px solid var(--border);
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (min-width: 901px) {
      .main {
        padding: 12px 12px 20px;
      }

      .grade-grid {
        gap: 6px;
      }

      .grade-header {
        padding: 6px 3px;
      }

      .lesson-list {
        padding: 4px 3px 6px;
        gap: 4px;
      }

      .bai-toggle {
        gap: 3px;
        padding: 3px 4px;
      }

      .bai-files {
        padding: 6px 4px 6px 6px;
      }

      .file-link {
        gap: 4px;
        padding: 6px 4px;
      }

      .file-empty,
      .bai-loading {
        padding: 6px 4px;
      }
    }

    @media (max-width: 900px) {
      .navbar {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .search-area {
        grid-column: 1 / -1;
        grid-row: 2;
        max-width: 100%;
        justify-self: stretch;
      }

      .grade-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .navbar {
        gap: 8px;
        padding: 10px 12px;
      }

      .brand-name {
        font-size: 1rem;
      }

      .nav-actions {
        gap: 4px;
      }

      .btn.icon-btn,
      .btn.game-btn {
        width: 32px;
        padding: 0;
      }

      .game-btn-label {
        display: none;
      }

      .grade-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .btn {
        font-size: .76rem;
        height: 32px;
        padding: 0 10px;
      }
    }

    @media (max-width: 420px) {
      .grade-grid {
        grid-template-columns: 1fr;
      }

      .grade-card {
        height: auto;
        max-height: none;
        min-height: unset;
      }
    }

    html[data-cap="1"] .grade-grid,
    html[data-cap="2"] .grade-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    html[data-cap="1"] .grade-header,
    html[data-cap="2"] .grade-header {
      gap: 8px;
      padding: 10px 8px;
      font-size: .95rem;
    }

    html[data-cap="1"] .grade-num,
    html[data-cap="2"] .grade-num {
      width: 28px;
      height: 28px;
      font-size: .8rem;
    }

    html[data-cap="1"] .lesson-list,
    html[data-cap="2"] .lesson-list {
      padding: 10px 8px 12px;
      gap: 8px;
    }

    html[data-cap="1"] .bai-toggle,
    html[data-cap="2"] .bai-toggle {
      gap: 6px;
      padding: 8px;
      font-size: .85rem;
    }

    html[data-cap="1"] .bai-title,
    html[data-cap="2"] .bai-title {
      font-size: .85rem;
    }

    html[data-cap="1"] .bai-file-count,
    html[data-cap="2"] .bai-file-count {
      font-size: .75rem;
    }

    html[data-cap="1"] .bai-files,
    html[data-cap="2"] .bai-files {
      gap: 6px;
      padding: 8px;
    }

    html[data-cap="1"] .file-link,
    html[data-cap="2"] .file-link {
      padding: 9px 8px;
      font-size: .85rem;
    }
  </style>
</head>

    /* ── Pretty file name (fallback) ────────────────────────── */
    function prettyName(filename) {
      if (typeof filename !== 'string') return '';
      return filename
        .replace(/\.html?$/i, '')
        .replace(/[-_()\[\]]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    /* ── Chuẩn hóa thông tin bài học [tên hiển thị, tên file] ─── */
    function getLessonInfo(item) {
      if (!item) return null;
      if (Array.isArray(item)) {
        if (item.length === 0) return null;
        const label = item[0] !== undefined && item[0] !== null ? String(item[0]).trim() : '';
        const file = item[1] !== undefined && item[1] !== null ? String(item[1]).trim() : label;
        if (!file && !label) return null;
        return {
          displayName: label || prettyName(file) || file,
          fileName: file || label
        };
      }
      if (typeof item === 'string') {
        const file = item.trim();
        if (!file) return null;
        return {
          displayName: prettyName(file) || file,
          fileName: file
        };
      }
      return null;
    }

    /* ── Build a file sub-link ───────────────────────────────── */
    function makeFileLink(grade, baiName, item) {
      const info = getLessonInfo(item);
      if (!info) return null;

      const a = document.createElement('a');
      a.className = 'file-link';
      a.href = `./tin-hoc-${grade}/${baiName}/${encodeURIComponent(info.fileName)}`;
      a.target = '_blank';
      a.rel = 'noopener';
      a.setAttribute('aria-label', info.displayName);

      a.textContent = info.displayName;
      return a;
    }

    /* ── Render list of files inside an open bai ─────────────── */
    function renderBaiFiles(filesEl, grade, baiName) {
      const rawFiles = (GRADE_DATA[grade] || {})[baiName] || [];
      const validFiles = rawFiles.map(getLessonInfo).filter(Boolean);
      filesEl.innerHTML = '';

      if (validFiles.length === 0) {
        const empty = document.createElement('span');
        empty.className = 'file-empty';
        empty.textContent = 'Chưa có bài học nào.';
        filesEl.append(empty);
      } else {
        validFiles.forEach(info => {
          const link = makeFileLink(grade, baiName, [info.displayName, info.fileName]);
          if (link) filesEl.append(link);
        });
      }
      filesEl.dataset.rendered = '1';
    }

    /* ── Accordion toggle ───────────────────────────────────── */
    function toggleBai(toggleEl, filesEl, grade, baiName) {
      const expanded = toggleEl.getAttribute('aria-expanded') === 'true';

      toggleEl.setAttribute('aria-expanded', String(!expanded));
      filesEl.classList.toggle('open', !expanded);
      filesEl.parentElement.classList.toggle('is-open', !expanded);

      if (!expanded) {
        renderBaiFiles(filesEl, grade, baiName);
      }
    }

    /* ── Build one bai-group ─────────────────────────────────── */
    function makeBaiGroup(baiName, grade) {
      const num = parseInt(baiName.replace('bai-', ''), 10);
      const rawFiles = (GRADE_DATA[grade] || {})[baiName] || [];
      const validCount = rawFiles.filter(item => getLessonInfo(item) !== null).length;
      const label = `${num}. ${GRADE_TITLES[grade][num - 1]}`;

      const group = document.createElement('div');
      group.className = 'bai-group';
      group.dataset.bai = baiName;
      group.dataset.grade = String(grade);
      group.dataset.search = `bai ${num} lop ${grade} lesson ${num} grade ${grade}`;

      const toggle = document.createElement('button');
      toggle.className = 'bai-toggle';
      toggle.type = 'button';
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', `${label}, Lớp ${grade}`);

      const titleSpan = document.createElement('span');
      titleSpan.className = 'bai-title';
      titleSpan.textContent = label;
      titleSpan.title = label;

      const fileCount = document.createElement('span');
      fileCount.className = 'bai-file-count';
      fileCount.setAttribute('aria-hidden', 'true');
      fileCount.textContent = validCount > 0 ? `(${validCount})` : '';

      toggle.append(titleSpan, fileCount);

      const filesEl = document.createElement('div');
      filesEl.className = 'bai-files';

      toggle.addEventListener('click', () => toggleBai(toggle, filesEl, grade, baiName));

      group.append(toggle, filesEl);
      return group;
    }

    /* ── Build a grade card ──────────────────────────────────── */
    function createGradeCard(grade) {
      const card = document.createElement('section');
      card.className = 'grade-card';
      card.id = `card-grade-${grade}`;
      card.dataset.grade = grade;
      card.setAttribute('aria-label', `Lớp ${grade}`);

      const header = document.createElement('div');
      header.className = 'grade-header';

      const numBadge = document.createElement('span');
      numBadge.className = 'grade-num';
      numBadge.textContent = grade;

      const lbl = document.createElement('span');
      lbl.textContent = `LỚP ${grade}`;

      header.append(numBadge, lbl);

      const list = document.createElement('div');
      list.className = 'lesson-list';

      const baiNames = Object.keys(GRADE_DATA[grade] || {}).sort((a, b) => a.localeCompare(b, 'vi'));
      if (baiNames.length === 0) {
        const p = document.createElement('p');
        p.style.cssText = 'padding:10px 6px;font-size:.78rem;color:var(--text2)';
        p.textContent = 'Chưa có bài học.';
        list.append(p);
      } else {
        baiNames.forEach(bn => list.append(makeBaiGroup(bn, grade)));
      }

      card.append(header, list);
      return card;
    }

    /* ── Render all grade cards ──────────────────────────────── */
    function renderAllGrades() {
      gradeGrid.innerHTML = '';
      for (let g = 3; g <= 9; g++) {
        const card = createGradeCard(g);
        card.hidden = (cap === '1' && g > 5) || (cap === '2' && g < 6);
        gradeGrid.append(card);
      }
      updateCount();
    }

    /* ── Count ───────────────────────────────────────────────── */
    function updateCount() {
      const cards = gradeGrid.querySelectorAll('.grade-card:not([hidden])');
      const groups = gradeGrid.querySelectorAll('.bai-group:not([hidden])');
      countLabel.textContent = `${groups.length} bài học · ${cards.length} lớp`;
    }

    /* ── Theme ───────────────────────────────────────────────── */
    function applyTheme() {
      html.dataset.theme = isDark ? 'dark' : 'light';
      iconSun.style.display = isDark ? 'none' : '';
      iconMoon.style.display = isDark ? '' : 'none';
      themeBtn.title = isDark
        ? 'Chế độ Sáng'
        : 'Chế độ Tối';
    }

    /* ── Events ──────────────────────────────────────────────── */
    searchBox.addEventListener('click', () => { window.location.href = 'https://www.google.com.vn/'; });
    searchBox.addEventListener('keydown', e => { if (e.key === 'Enter') window.location.href = 'https://www.google.com.vn/'; });

    themeBtn.addEventListener('click', () => {
      isDark = !isDark; applyTheme();
      try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (_) { }
    });

    fsBtn.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch (_) { }
    });
    document.addEventListener('fullscreenchange', () => {
      const full = Boolean(document.fullscreenElement);
      iconExpand.style.display = full ? 'none' : '';
      iconCollapse.style.display = full ? '' : 'none';
      fsBtn.setAttribute('aria-label', full
        ? 'Thoát toàn màn hình'
        : 'Bật toàn màn hình');
    });

    /* ── Init ────────────────────────────────────────────────── */
    (function init() {
      try {
        const saved = localStorage.getItem('theme');
        isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
      } catch (_) { }
      applyTheme();
      renderAllGrades();
    })();
  </script>
