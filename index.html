<!DOCTYPE html>
<html lang="vi" translate="no" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <meta name="theme-color" content="#f3f6fb">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <title>Kho Học Liệu – Thầy Minh</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>

  <!-- ════════════════ NAVBAR ════════════════ -->
  <header class="navbar">

    <!-- Brand -->
    <a class="brand" href="./" aria-label="KHO HỌC LIỆU – Thầy Minh, về trang chủ">
      <svg class="brand-leaf" viewBox="0 0 48 52" role="img" aria-label="Logo chiếc lá">
        <path fill="#166534" d="M12 7C4 13 3 27 11 35c2-8 5-15 11-22-3-3-6-5-10-6Z" />
        <path fill="#22a447"
          d="M41 4C24 5 12 15 10 31c-1 9 3 15 8 18 0-13 6-24 23-34-4 11-12 19-22 27 17-1 29-15 27-38l-5 0Z" />
        <path fill="#86d65b" d="M18 45c3-11 10-20 21-28-8 10-13 19-15 29l-6-1Z" />
      </svg>
      <span class="brand-copy">
        <span class="brand-name">KHO HỌC LIỆU</span>
        <span class="brand-sub">Thầy Minh</span>
      </span>
    </a>

    <!-- Search (Google) -->
    <div class="search-area" role="search">
      <svg class="g-logo" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4"
          d="M21.35 12.2c0-.7-.06-1.37-.18-2.02H12v3.82h5.24a4.48 4.48 0 0 1-1.94 2.94v2.4h3.14c1.84-1.7 2.91-4.2 2.91-7.14Z" />
        <path fill="#34A853"
          d="M12 21.7c2.63 0 4.83-.87 6.44-2.36l-3.14-2.4c-.87.58-1.98.92-3.3.92-2.54 0-4.7-1.72-5.47-4.04H3.28v2.47A9.72 9.72 0 0 0 12 21.7Z" />
        <path fill="#FBBC05" d="M6.53 13.82a5.84 5.84 0 0 1 0-3.64V7.71H3.28a9.72 9.72 0 0 0 0 8.58l3.25-2.47Z" />
        <path fill="#EA4335"
          d="M12 6.14c1.43 0 2.71.49 3.72 1.47l2.79-2.79C16.82 3.2 14.63 2.3 12 2.3a9.72 9.72 0 0 0-8.72 5.41l3.25 2.47c.77-2.32 2.93-4.04 5.47-4.04Z" />
      </svg>
      <input id="search-box" class="search-box" type="text" readonly placeholder="Bấm để tìm kiếm trên Google..."
        aria-label="Bấm để mở Google tìm kiếm">
    </div>

    <!-- Actions -->
    <nav class="nav-actions" aria-label="Tiện ích">
      <!-- Game button → /tro-choi/ -->
      <a id="game-btn" class="btn game-btn" href="./tro-choi/" aria-label="Trò chơi trí tuệ">
        🧠<span class="game-btn-label"> Trò chơi trí tuệ</span>
      </a>

      <!-- Dark / Light mode -->
      <button id="theme-btn" class="btn icon-btn theme-btn" type="button" aria-label="Chuyển chế độ tối/sáng"
        title="Sáng / Tối">
        <svg id="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <svg id="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>

      <!-- Fullscreen -->
      <button id="fs-btn" class="btn icon-btn" type="button" aria-label="Bật toàn màn hình" title="Toàn màn hình">
        <svg id="icon-fs-expand" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5" />
        </svg>
        <svg id="icon-fs-collapse" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
          <path d="M8 8H3M8 3v5M16 8h5M16 3v5M16 16h5M16 21v-5M8 16H3M8 21v-5" />
        </svg>
      </button>
    </nav>
  </header>

  <!-- ════════════════ CONTENT ════════════════ -->
  <main class="main" aria-label="Thư viện học liệu Tin học">
    <div class="statusbar">
      <span id="status-label">Tin học lớp 3 – 9</span>
      <span id="count-label" aria-live="polite">Đang tải...</span>
    </div>

    <div id="grade-grid" class="grade-grid" aria-label="Bài học theo lớp">
      <!-- Cards được tạo bằng JS -->
    </div>
  </main>

  <!-- ════════════════ FOOTER ════════════════ -->
  <footer class="footer">
    <span>
      © Kho học liệu Thầy Minh · Tin học lớp 3 – 9 · Dùng cho mục đích học tập
    </span>
  </footer>

  <!-- ════════════════ SCRIPT ════════════════ -->
  <script src="./script.js"></script>

</body>

</html>
