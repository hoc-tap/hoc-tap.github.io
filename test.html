<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <title>Giải phương trình bậc nhất</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        width: 350px;
      }
      h2 {
        text-align: center;
        color: #333;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #007BFF;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
      #result {
        margin-top: 15px;
        padding: 10px;
        background-color: #e9ecef;
        border-radius: 4px;
        text-align: center;
        font-weight: bold;
        color: #333;
      }
      #status {
        margin-top: 8px;
        text-align: center;
        font-size: 12px;
        color: #28a745;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Giải Phương Trình Bậc Nhất</h2>
      <p style="text-align: center; color: #666; font-size: 14px;">Dạng: ax + b = 0</p>
      
      <div class="form-group">
        <label for="a">Nhập hệ số a:</label>
        <input type="number" id="a" placeholder="Ví dụ: 2">
      </div>
      
      <div class="form-group">
        <label for="b">Nhập hệ số b:</label>
        <input type="number" id="b" placeholder="Ví dụ: -4">
      </div>
      
      <button onclick="giaiPhuongTrinh()">Giải và lưu kết quả</button>
      
      <div id="result">Kết quả sẽ hiển thị ở đây</div>
      <div id="status"></div>
    </div>

    <script>
      function giaiPhuongTrinh() {
        let a = parseFloat(document.getElementById('a').value);
        let b = parseFloat(document.getElementById('b').value);
        let resultDiv = document.getElementById('result');
        let statusDiv = document.getElementById('status');
        
        if (isNaN(a) || isNaN(b)) {
          resultDiv.innerHTML = "Vui lòng nhập đầy đủ số a và b!";
          resultDiv.style.color = "#d9534f";
          statusDiv.innerHTML = "";
          return;
        }
        
        let ketQuaStr = "";
        if (a === 0) {
          if (b === 0) {
            ketQuaStr = "Phương trình có vô số nghiệm!";
          } else {
            ketQuaStr = "Phương trình vô nghiệm!";
          }
        } else {
          let x = -b / a;
          ketQuaStr = "x = " + x.toFixed(4);
        }
        
        resultDiv.innerHTML = "Nghiệm: " + ketQuaStr;
        resultDiv.style.color = "#333";
        statusDiv.innerHTML = "Đang lưu vào Google Sheet...";
        
        // Gọi hàm Apps Script ở phía server để lưu dữ liệu
        google.script.run
          .withSuccessHandler(function(responseMessage) {
            statusDiv.innerHTML = responseMessage;
          })
          .withFailureHandler(function(error) {
            statusDiv.innerHTML = "Lỗi: " + error.message;
            statusDiv.style.color = "#d9534f";
          })
          .saveToSheet(a, b, ketQuaStr);
      }
    </script>
  </body>
</html>
