<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>JSON API Data</title>
</head>
<body>
    <script>
        // 1. Tạo dữ liệu bằng JavaScript thuần
        const danhSach = [
            { id: 1, hoTen: "Nguyễn Văn An", monHoc: "Tin học", diem: 9.5 },
            { id: 2, hoTen: "Trần Thị Bình", monHoc: "Tin học", diem: 8.8 },
            { id: 3, hoTen: "Lê Văn Cường", monHoc: "Tin học", diem: 9.0 }
        ];

        // 2. Chuyển đối tượng/mảng thành chuỗi JSON (có thụt lề 2 khoảng trắng để dễ nhìn)
        const chuoiJson = JSON.stringify(danhSach, null, 2);

        // 3. In toàn bộ chuỗi JSON ra nội dung của trang (văn bản thuần túy)
        document.body.innerText = chuoiJson;
    </script>
</body>
</html>
