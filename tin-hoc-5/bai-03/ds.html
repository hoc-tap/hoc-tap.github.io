const RW={star:{e:'⭐',t:'Ngôi sao! +5 điểm'},gem:{e:'💎',t:'Kim cương! +15 điểm'},shield:{e:'🛡️',t:'Nhận khiên bảo vệ chuỗi đúng!'},chest:{e:'🎁',t:''}};
let G={};
function buildScene(){let s=`<defs><linearGradient id="gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb4d9"/><stop offset="1" stop-color="#5f8f6a"/></linearGradient></defs>
<circle cx="880" cy="70" r="40" fill="#ffd54a"/><g fill="#fff" opacity=".9"><ellipse cx="170" cy="80" rx="70" ry="22"/><ellipse cx="220" cy="68" rx="45" ry="20"/><ellipse cx="700" cy="130" rx="60" ry="18"/></g>
<polygon points="-200,600 180,230 560,600" fill="#a9c7e4"/><polygon points="500,600 840,260 1200,600" fill="#9dbddb"/>
<polygon points="-90,610 500,40 1090,610" fill="url(#gm)"/><polygon points="500,40 425,115 470,100 500,128 535,100 580,115" fill="#fff"/>
<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#c98a4b" stroke-width="5" stroke-dasharray="3 12" stroke-linecap="round"/>`;
pts.forEach((p,i)=>{if(i)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${i%5?'#ffe3b8':'#ff8a1f'}" stroke="#fff" stroke-width="2"/>`});
Object.keys(G.rw).forEach(k=>{const p=pts[k];s+=`<text id="rw${k}" x="${p[0]}" y="${p[1]-14}" font-size="34" text-anchor="middle">${RW[G.rw[k]].e}</text>`});
s+=`<text x="${pts[N][0]}" y="${pts[N][1]-12}" font-size="46" text-anchor="middle">🚩</text><g id="climber"><text font-size="46" text-anchor="middle" y="-6">🧗</text></g>`;
$('#scene').innerHTML=s;const c=$('#climber');c.style.transition='none';c.style.transform=`translate(${pts[0][0]}px,${pts[0][1]}px)`;void c.getBoundingClientRect();c.style.transition=''}
function newGame(){const name=$('#nm').value.trim();G={name,list:shuffle(Q).slice(0,N),i:0,score:0,streak:0,shield:0,right:0,lock:false,rw:{}};
const types=['star','gem','shield','chest','star','gem','chest','shield','star'];shuffle(Array.from({length:28},(_,i)=>i+2)).slice(0,9).forEach((k,j)=>G.rw[k]=types[j]);
buildScene();sfx.go();showQ()}
function hud(){$('#hN').textContent=G.name;$('#hS').textContent=G.score;$('#hK').textContent=G.streak+(G.streak>1?' 🔥':'');$('#hD').textContent=G.shield?'🛡️×'+G.shield:'0';$('#pg').style.width=(G.i/N*100)+'%'}
const RULES=[
[/Nha Trang/,()=>E('🏖️☀️🩴','Nha Trang')],
[/Đà Lạt/,()=>E('🌲🧥☁️','Đà Lạt')],
[/Nam bán cầu|ở Úc|sang Úc|Úc là|Minh/,()=>E('🦘☃️🧣','Nước Úc')],
[/nhà thờ đá/i,()=>E('⛪','Nhà thờ đá Sa Pa')],
[/ruộng bậc thang|Cổng trời/,()=>E('🌾🌄','')],
[/Phan Xi Păng|Ô Quy Hồ|Mường Hoa|trèo đèo|lội suối/,()=>E('🏔️🥾','')],
[/Sa Pa|Cát Cát|Lào Cai|hồ Sa Pa/,()=>E('🏞️⛰️','Sa Pa')],
[/Hình 17|từ khoá/,(m,t)=>search(t.includes('Sa Pa')?'Các điểm tham quan ở Sa Pa':'Từ khoá tìm kiếm')],
[/Google|máy tìm kiếm|nháy chuột vào kết quả|kết quả/,()=>E('🔍🌐','')],
[/Thủ đô|Hà Nội|website|sodulich/,()=>E('🌐🏛️','')],
[/trình chiếu|trang chiếu/,()=>E('📊👫','')],
[/nhóm|hợp tác|phân công/,()=>E('👧🧒👦🤝','')],
[/truyện|mua sách/,()=>E('📚🛒','')],
[/ti vi|sách, báo|báo/,()=>E('📺📰📖','')],
[/người già|trẻ em|đoàn/,()=>E('👴👶🚶','')]
];
const E=(e,c)=>`<div class="ar"><div class="ae">${e}</div>${c?`<div class="ac">${c}</div>`:''}</div>`;
const CUR={hand:'<text x="150" y="92" font-size="40">👆</text>',arrow:'<polygon points="150,52 150,97 162,87 170,106 178,102 170,83 186,83" fill="#fff" stroke="#222" stroke-width="3"/>',ibeam:'<path d="M160 50v50M150 50h20M150 100h20" stroke="#222" stroke-width="4" fill="none"/>'};
const mock=k=>`<svg viewBox="0 0 300 120" class="mk"><rect x="2" y="2" width="296" height="116" rx="14" fill="#e8f3ff" stroke="#9cc4ee" stroke-width="3"/><text x="150" y="60" font-size="30" text-anchor="middle" fill="#1f4e9c"${k=='hand'?' text-decoration="underline"':''}>Trăng ơi!</text>${CUR[k]}</svg>`;
const fig7=n=>{const h=i=>i==n?'stroke="#ff8a1f" stroke-width="6"':'stroke="#9cc4ee" stroke-width="2"';const b=(i,x,y,c)=>`<circle cx="${x}" cy="${y}" r="14" fill="${c}"/><text x="${x}" y="${y+5}" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">0${i}</text>`;
return `<svg viewBox="0 0 360 160" class="mk"><rect x="2" y="2" width="356" height="156" rx="12" fill="#f3f8ff" stroke="#9cc4ee" stroke-width="3"/><rect x="18" y="26" width="150" height="104" rx="8" fill="#34495e" ${h(1)}/><polygon points="76,60 76,98 108,79" fill="#fff"/>${b(1,22,24,'#16a870')}<g ${h(2)}><rect x="190" y="26" width="150" height="58" rx="6" fill="#fff"/></g><rect x="194" y="30" width="68" height="24" fill="#ffb347"/><rect x="266" y="30" width="70" height="24" fill="#4aa3df"/><rect x="194" y="56" width="68" height="24" fill="#e76f51"/><rect x="266" y="56" width="70" height="24" fill="#6bbf59"/>${b(2,336,24,'#ff8a1f')}<rect x="190" y="94" width="150" height="40" rx="6" fill="#fff" ${h(3)}/><rect x="198" y="102" width="134" height="5" fill="#b8c7d9"/><rect x="198" y="114" width="134" height="5" fill="#b8c7d9"/><rect x="198" y="126" width="90" height="5" fill="#b8c7d9"/>${b(3,336,136,'#17a2b8')}</svg>`};
const search=t=>`<svg viewBox="0 0 360 80" class="mk" style="height:clamp(60px,14vh,100px)"><rect x="2" y="12" width="356" height="56" rx="28" fill="#fff" stroke="#9cc4ee" stroke-width="3"/><text x="26" y="48" font-size="22">🔍</text><text x="62" y="47" font-size="19" fill="#34495e">${t}</text></svg>`;
function art(t){for(const [re,f] of RULES){const m=t.match(re);if(m)return typeof f=='function'?f(m,t):f}return''}
function showQ(){show('#sQuiz');const q=G.list[G.i];$('#qNo').textContent=`CÂU ${G.i+1} / ${N} · chặng ${G.i+1}`;$('#qTx').textContent=q[0];$('#qArt').innerHTML=art(q[0]);$('#fb').textContent='';$('#fb').style.color='';
[$('#bT'),$('#bF')].forEach(b=>{b.disabled=false;b.className=b.id=='bT'?'bt':'bf'});G.lock=false;hud()}
function answer(v){if(G.lock)return;G.lock=true;const q=G.list[G.i],ok=v===q[1];$('#bT').disabled=$('#bF').disabled=true;(v?$('#bT'):$('#bF')).classList.add('pick');(q[1]?$('#bT'):$('#bF')).classList.add('right');
const fb=$('#fb');let msg;
if(ok){G.right++;G.streak++;const bonus=Math.min(G.streak-1,5)*2;G.score+=10+bonus;msg=`🎉 Chính xác! +${10+bonus} điểm`+(bonus?` (chuỗi ${G.streak} 🔥)`:'');fb.style.color='var(--ok)';sfx.ok();flash('#6df0a8')}
else{if(G.shield>0){G.shield--;msg=`🛡️ Chưa đúng — khiên đã giữ chuỗi cho em! Đáp án: ${q[1]?'ĐÚNG':'SAI'}`}else{G.streak=0;msg=`😅 Chưa đúng. Đáp án là ${q[1]?'ĐÚNG':'SAI'}`}fb.style.color='var(--no)';sfx.no();flash('#ff8a8f');$('#qBox').classList.remove('shake');void $('#qBox').offsetWidth;$('#qBox').classList.add('shake')}
fb.textContent=msg;hud();setTimeout(()=>climb(ok),1300)}
function toast(t,ms=1500){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),ms)}
function chud(){$('#cStep').textContent=`⛰️ Chặng ${G.i}/${N}`;$('#cScore').textContent=`⭐ ${G.score} điểm`;$('#cShield').textContent=G.shield?`🛡️ ×${G.shield}`:'🧗 '+G.name}
function climb(ok){show('#sClimb');chud();const c=$('#climber');
setTimeout(()=>{G.i++;const p=pts[G.i];c.style.transform=`translate(${p[0]}px,${p[1]}px)`;sfx.step();setTimeout(sfx.step,300);setTimeout(sfx.step,600)},500);
setTimeout(()=>{chud();const r=c.getBoundingClientRect(),x=r.left+r.width/2,y=r.top;const k=G.rw[G.i];let ms=700;
if(G.i>=N){sfx.win();flash('#ffd54a');burst(x,y,['🎉','⭐','✨','🎊'],36);toast('🚩 Đã lên đến đỉnh núi!',1800);setTimeout(end,2200);return}
if(k){const rk=k;let t=RW[rk].t;if(rk=='star')G.score+=5;else if(rk=='gem')G.score+=15;else if(rk=='shield')G.shield++;else{const b=10+Math.floor(Math.random()*21);G.score+=b;t=`Rương báu! +${b} điểm`}
const m=$('#rw'+G.i);if(m)m.style.display='none';sfx.gift();flash('#ffe28a');burst(x,y,['⭐','✨',RW[rk].e]);toast(RW[rk].e+' '+t,1500);ms=1800;chud()}
else if(!ok)toast('Trượt chân nhẹ nhưng vẫn tiến lên! 💪',1000);
setTimeout(showQ,ms+300)},1750)}
function end(){show('#sEnd');$('#eN').textContent=`Chúc mừng ${G.name}!`;$('#eS').textContent=G.score+' điểm';$('#eD').textContent=`Đúng ${G.right}/${N} câu`;const p=G.right/N;$('#eR').textContent=p>=.9?'🥇 Nhà leo núi xuất sắc!':p>=.7?'🥈 Nhà leo núi giỏi!':p>=.5?'🥉 Nhà leo núi khá!':'🌱 Cố gắng hơn ở lần sau nhé!';
let b=0;try{b=+localStorage.getItem('lntt_best')||0;if(G.score>b){b=G.score;localStorage.setItem('lntt_best',b)}}catch(e){}
$('#eD').textContent+=b?` · Điểm cao nhất: ${b}`:'';sfx.win();burst(innerWidth/2,innerHeight/3,['🎉','🎊','⭐'],30)}
function start(){const v=$('#nm').value.trim();if(!v){$('#nm').focus();$('#nm').style.borderColor='var(--no)';return}newGame()}
$('#bStart').onclick=start;$('#nm').onkeydown=e=>{if(e.key=='Enter')start()};
$('#bT').onclick=()=>answer(1);$('#bF').onclick=()=>answer(0);
$('#bAgain').onclick=()=>{newGame()};
document.addEventListener('keydown',e=>{if(!$('#sQuiz').classList.contains('on'))return;if(e.key=='ArrowLeft'||e.key.toLowerCase()=='d')answer(1);if(e.key=='ArrowRight'||e.key.toLowerCase()=='s')answer(0)});
$('#snd').onclick=()=>{mute=!mute;$('#snd').textContent=mute?'🔇':'🔊'};
$('#fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
try{const b=+localStorage.getItem('lntt_best');if(b)$('#best').textContent='🏅 Điểm cao nhất: '+b}catch(e){}
</script></body></html>
