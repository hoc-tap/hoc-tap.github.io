<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trắc nghiệm Tin học 7</title><style>
:root{--bg:#f4f8ff;--card:#fff;--ink:#1e293b;--mut:#64748b;--pri:#2563eb;--pri2:#7c3aed;--ok:#16a34a;--okb:#dcfce7;--bad:#dc2626;--badb:#fee2e2;--warn:#b45309;--warnb:#fef3c7;--line:#e2e8f0}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#eef4ff,#f8fbff 40%,#fdf6ff);color:var(--ink);line-height:1.6;font-size:16px}
.nav{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;box-shadow:0 2px 12px #2563eb40;flex-wrap:wrap}
.nav b{font-size:1.05rem}.nav .sp{flex:1}.nav a{color:#fff;text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:600;font-size:.92rem;transition:.2s}
.nav a:hover{background:#ffffff33}.nav a.on{background:#fff;color:var(--pri)}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border-radius:16px;box-shadow:0 4px 18px #1e3a8a14;padding:18px 20px;margin:16px 0;animation:up .45s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2.bai{margin:0 0 8px;color:var(--pri);font-size:1.3rem}
.btn{border:0;border-radius:12px;padding:10px 20px;font-size:1rem;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--pri),var(--pri2));cursor:pointer;transition:.15s;box-shadow:0 4px 12px #2563eb40}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}.btn.gray{background:#64748b;box-shadow:none}
@media(max-width:600px){.nav{padding:8px 10px;gap:6px}.nav b{font-size:.95rem;width:100%}.card{padding:14px}}
.layout{display:flex;gap:20px;max-width:1100px;margin:0 auto;padding:18px 14px 60px}.main{flex:1;min-width:0}
.side{width:230px;position:sticky;top:76px;align-self:flex-start;background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px #1e3a8a14;max-height:calc(100vh - 96px);overflow:auto}
.side h4{margin:0 0 8px;color:var(--pri)}.side a{display:block;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.9rem}.side a:hover{background:#eaf1ff}
.side .sc{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:.9rem}
.bar{height:8px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#2563eb);transition:.4s}
.q{border:2px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:#fff}.q .qt{font-weight:600}.q .qt span.n{background:var(--pri);color:#fff;border-radius:8px;padding:1px 9px;margin-right:6px;font-size:.9rem}
.lv{font-size:.7rem;background:#eef2ff;color:#4338ca;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 12px;border:2px solid var(--line);background:#fff;border-radius:12px;font-size:1rem;cursor:pointer;transition:.15s;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--pri);background:#f0f6ff;transform:translateX(3px)}.opt b{color:var(--pri);margin-right:6px}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--badb);border-color:var(--bad);animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ex{display:none;margin-top:8px;padding:9px 12px;border-radius:10px;background:#eff6ff;border-left:5px solid var(--pri);font-size:.95rem}.ex.show{display:block;animation:up .3s}
.ex.g{background:var(--okb);border-color:var(--ok)}.ex.r{background:var(--badb);border-color:var(--bad)}
.ds{border-top:1px dashed var(--line);padding:8px 0}.ds .row{display:flex;gap:6px;margin-top:6px}.ds .row button{flex:0 0 auto;width:90px;padding:6px;margin:0}.ds img{max-width:100%}
.part{font-weight:700;color:#7c3aed;margin:10px 0 0}img.fig{max-width:100%;border-radius:10px;border:1px solid var(--line);margin:8px 0}
@media(max-width:860px){.side{display:none}.layout{padding:12px 10px 60px}}</style></head><body><nav class="nav"><b>📝 Trắc nghiệm Tin học 7</b><span class="sp"></span><a href="lythuyet.html">Lý thuyết</a><a href="tracnghiem.html" class=on>Trắc nghiệm</a><a href="kiemtra.html">Thi thử</a></nav><div class="layout"><div class="main"><div class="card"><h2 class="bai">Ôn tập trắc nghiệm giữa học kỳ 1</h2>Bấm chọn đáp án, hệ thống hiện đúng/sai và hướng dẫn ngay. Tổng cộng <b id="tot"></b> ý/câu để làm.</div><div id="main"></div></div><aside class="side"><h4>📑 Mục lục</h4><div id="toc"></div><div class="sc">Kết quả: <b id="sc">0/0 đúng</b><div class="bar"><i id="pg"></i></div></div></aside></div><script>
const D=[{"n": 1, "bai": 1, "t": "mc", "q": "Việc cấp nguồn điện cho máy tính nên được thực hiện khi nào?", "o": ["Trước khi kết nối màn hình", "Trước khi cắm bàn phím", "Bất kỳ lúc nào tùy thích", "Sau khi đã kết nối xong các thiết bị"], "a": 3, "l": "NB", "e": "Phải kết nối xong các thiết bị rồi mới cấp nguồn điện cho máy tính."}, {"n": 2, "bai": 1, "t": "mc", "q": "Tài liệu hướng dẫn sử dụng thiết bị do ai cung cấp?", "o": ["Thợ sửa chữa điện", "Nhà sản xuất", "Học sinh trong lớp", "Người mua hàng"], "a": 1, "l": "NB", "e": "Tài liệu hướng dẫn sử dụng do nhà sản xuất thiết bị cung cấp."}, {"n": 3, "bai": 1, "t": "mc", "q": "Chuột máy tính có thể có dạng nào sau đây?", "o": ["Chuột có dây", "Chuột không dây", "Chuột tích hợp trên bàn phím", "Tất cả các dạng trên"], "a": 3, "l": "NB", "e": "Chuột có thể có dây, không dây hoặc tích hợp (như touchpad), nên chọn \"tất cả các dạng trên\"."}, {"n": 4, "bai": 1, "t": "mc", "q": "Chức năng chính của thiết bị ra là gì?", "o": ["Xuất thông tin từ máy tính ra bên ngoài", "Lưu trữ phần mềm hệ thống", "Nhập dữ liệu âm thanh", "Biến đổi dữ liệu thành điện áp"], "a": 0, "l": "NB", "e": "Thiết bị ra đưa thông tin từ máy tính ra bên ngoài để con người nhận biết."}, {"n": 5, "bai": 1, "t": "mc", "q": "Thiết bị nào dưới đây được sử dụng để đưa lệnh điều khiển vào máy tính khi chơi trò chơi?", "o": ["Loa thông minh", "Máy chiếu", "Bộ điều khiển game", "Máy quay phim"], "a": 2, "l": "NB", "e": "Bộ điều khiển game dùng để đưa lệnh điều khiển trò chơi vào máy tính."}, {"n": 6, "bai": 1, "t": "mc", "q": "Thiết bị nào vừa có chức năng nhập thông tin vừa có chức năng xuất thông tin?", "o": ["Chuột không dây", "Bàn phím cơ", "Máy in laser", "Màn hình cảm ứng"], "a": 3, "l": "NB", "e": "Màn hình cảm ứng vừa hiển thị (ra) vừa nhận thao tác chạm (vào)."}, {"n": 7, "bai": 1, "t": "mc", "q": "Bàn phím máy tính dùng để nhập dữ liệu dạng nào?", "o": ["Hình ảnh và video", "Kí tự và văn bản", "Âm thanh và giai điệu", "Sóng vô tuyến"], "a": 1, "l": "NB", "e": "Bàn phím dùng để nhập kí tự và văn bản."}, {"n": 8, "bai": 1, "t": "mc", "q": "Việc làm nào sau đây được khuyến khích khi sử dụng máy tính?", "o": ["Giữ bàn tay khô sạch", "Đặt ly nước cạnh bàn phím", "Dùng tay ướt gõ phím", "Giật mạnh dây cắm nguồn"], "a": 0, "l": "NB", "e": "Giữ tay khô sạch là đúng; để nước gần máy, tay ướt gõ phím, giật dây nguồn đều gây hỏng thiết bị."}, {"n": 9, "bai": 1, "t": "mc", "q": "Thao tác nào sau đây có thể gây hỏng thiết bị hoặc mất dữ liệu?", "o": ["Đóng mọi ứng dụng trước khi tắt máy", "Rút thẻ nhớ khi máy tính đang ghi dữ liệu", "Sử dụng lệnh Shut down để tắt máy", "Đọc kĩ hướng dẫn trước khi lắp đặt"], "a": 1, "l": "NB", "e": "Rút thẻ nhớ khi máy đang ghi dữ liệu có thể mất dữ liệu hoặc hỏng thẻ; phải dùng lệnh Safe To Remove Hardware."}, {"n": 10, "bai": 1, "t": "mc", "q": "Thiết bị nào sau đây là thiết bị vào?", "o": ["Máy in", "Màn hình", "Micro", "Loa"], "a": 2, "l": "NB", "e": "Micro nhập âm thanh nên là thiết bị vào; máy in, màn hình, loa là thiết bị ra."}, {"n": 11, "bai": 1, "t": "mc", "q": "Để ngắt kết nối an toàn với thẻ nhớ hoặc USB, em chọn lệnh nào trong Windows?", "o": ["Format Disk", "Lock Drive", "Safe To Remove Hardware", "Delete Hardware"], "a": 2, "l": "NB", "e": "Lệnh ngắt kết nối an toàn thẻ nhớ/USB trong Windows là Safe To Remove Hardware."}, {"n": 12, "bai": 1, "t": "mc", "q": "Loa thông minh nhận lệnh trực tiếp từ người dùng bằng dạng dữ liệu nào?", "o": ["Hình vẽ", "Chữ viết", "Kí tự đặc biệt", "Giọng nói"], "a": 3, "l": "NB", "e": "Loa thông minh nhận lệnh bằng giọng nói của người dùng."}, {"n": 13, "bai": 1, "t": "mc", "q": "Máy ảnh kĩ thuật số thu nhận dữ liệu thuộc dạng nào vào máy tính?", "o": ["Con số", "Văn bản", "Hình ảnh", "Âm thanh"], "a": 2, "l": "NB", "e": "Máy ảnh kĩ thuật số thu nhận dữ liệu dạng hình ảnh."}, {"n": 14, "bai": 1, "t": "mc", "q": "Tấm cảm ứng (touchpad) trên máy tính xách tay có chức năng tương tự như thiết bị nào?", "o": ["Micro", "Bàn phím", "Chuột", "Loa"], "a": 2, "l": "NB", "e": "Touchpad nhận vị trí, sự di chuyển của ngón tay nên có chức năng giống chuột."}, {"n": 15, "bai": 1, "t": "mc", "q": "Điểm khác nhau giữa máy in và máy quét là gì?", "o": ["Máy in chuyển dữ liệu thành âm thanh, máy quét chuyển thành hình ảnh.", "Máy in có khả năng tự sửa lỗi chính tả còn máy quét thì không.", "Máy in là thiết bị ra, máy quét là thiết bị vào.", "Máy quét chỉ hoạt động khi kết nối với loa thông minh."], "a": 2, "l": "TH", "e": "Máy in đưa thông tin ra (thiết bị ra), máy quét đưa tài liệu vào máy tính (thiết bị vào)."}, {"n": 16, "bai": 1, "t": "mc", "q": "Thao tác nào thể hiện việc giữ gìn khu vực làm việc với máy tính ngăn nắp?", "o": ["Việc để tất cả các loại nước uống, bánh kẹo ngay sát bàn phím sẽ giúp tiết kiệm thời gian.", "Dán thật nhiều băng dính lên màn hình để bảo vệ.", "Tháo rời các thiết bị ra để trên mặt bàn.", "Sắp xếp dây cáp gọn gàng, bàn làm việc khô ráo và không để đồ ăn."], "a": 3, "l": "TH", "e": "Sắp xếp dây cáp gọn gàng, bàn khô ráo, không để đồ ăn là giữ khu vực làm việc ngăn nắp."}, {"n": 17, "bai": 1, "t": "mc", "q": "Tại sao không nên cắm nhầm đầu cáp mạng LAN vào cổng USB?", "o": ["Cắm sai cổng có thể làm cong chấu kim loại và gây chập điện hỏng cổng.", "Cáp mạng sẽ bị cháy nổ ngay lập tức do dòng điện xoay chiều.", "Khi cắm sai cổng, hệ điều hành máy tính sẽ lập tức xóa toàn bộ các tệp văn bản đang soạn thảo.", "Máy tính sẽ bị mất bản quyền hệ điều hành."], "a": 0, "l": "TH", "e": "Đầu cáp mạng khác đầu USB, cắm sai cổng có thể làm cong chấu, chập điện, hỏng cổng."}, {"n": 18, "bai": 1, "t": "mc", "q": "Bạn An cắm tai nghe vào cổng micro màu hồng trên máy tính nhưng không nghe thấy nhạc. Nguyên nhân chính là gì?", "o": ["Do tai nghe bị hỏng loa bên trong.", "Bạn chưa bật công tắc nguồn máy in.", "Máy tính bị nhiễm virus âm thanh.", "An cắm sai cổng chức năng tín hiệu."], "a": 3, "l": "TH", "e": "Cổng màu hồng là cổng micro; tai nghe phải cắm vào cổng màu xanh lá (cổng tai nghe/loa). An đã cắm sai cổng."}, {"n": 19, "bai": 2, "t": "mc", "q": "Tên tệp 'TapLamVan.doc' cho hệ điều hành biết điều gì về nó?", "o": ["Đó là tệp dữ liệu văn bản", "Đó là tệp hình ảnh động", "Đó là tệp thực thi của hệ thống", "Đó là tệp âm thanh thu âm"], "a": 0, "l": "NB", "e": "Phần mở rộng .doc cho biết đây là tệp văn bản Word."}, {"n": 20, "bai": 2, "t": "mc", "q": "Nếu không có hệ điều hành, máy tính sẽ ở trong tình trạng như thế nào?", "o": ["Chạy nhanh hơn bình thường", "Hoạt động bình thường bằng chuột", "Chỉ là khối kim loại không hoạt động", "Chỉ chạy được ứng dụng soạn thảo"], "a": 2, "l": "NB", "e": "Không có hệ điều hành thì phần cứng không được điều khiển, máy tính không hoạt động được."}, {"n": 21, "bai": 2, "t": "mc", "q": "Phần mềm nào dưới đây là phần mềm ứng dụng?", "o": ["Linux", "Zalo", "iOS", "Windows 10"], "a": 1, "l": "NB", "e": "Zalo là phần mềm ứng dụng; Linux, iOS, Windows 10 là hệ điều hành."}, {"n": 22, "bai": 2, "t": "mc", "q": "Các tệp được tạo ra từ phần mềm Scratch thường có phần mở rộng nào?", "o": [".jpg, .bmp", ".doc, .docx", ".htm, .html", ".sb, .sb2, .sb3"], "a": 3, "l": "NB", "e": "Tệp của Scratch có phần mở rộng .sb, .sb2, .sb3."}, {"n": 23, "bai": 2, "t": "mc", "q": "Phần mở rộng .mp3 và .mp4 thường được sử dụng cho loại tệp nào?", "o": ["Tệp văn bản", "Tệp trang web", "Chương trình hệ thống", "Tệp âm thanh và video"], "a": 3, "l": "NB", "e": ".mp3 là tệp âm thanh, .mp4 là tệp video."}, {"n": 24, "bai": 2, "t": "ds", "q": "Minh vừa được bố mẹ mua cho một chiếc máy tính mới và đang tìm hiểu về phần mềm máy tính. Em hãy cho biết các nhận định sau đúng hay sai:", "it": [{"t": "Windows, Android và iOS là tên các hệ điều hành thông dụng.", "a": true, "l": "NB", "e": "Windows, Android, iOS đều là hệ điều hành thông dụng."}, {"t": "Hệ điều hành và phần mềm ứng dụng giống nhau vì cả hai đều có chức năng điều khiển và quản lí toàn bộ hoạt động của máy tính.", "a": false, "l": "TH", "e": "Hệ điều hành quản lí phần cứng, còn phần mềm ứng dụng giúp làm công việc cụ thể, hai loại này khác nhau."}, {"t": "Phần mềm soạn thảo văn bản chỉ chạy được trên môi trường do hệ điều hành cung cấp.", "a": true, "l": "TH", "e": "Phần mềm ứng dụng chạy trên nền hệ điều hành."}, {"t": "Minh tải tệp cài đặt phần mềm từ một trang web không rõ nguồn gốc, tắt phần mềm diệt virus rồi chạy tệp đó để cài đặt. Đây là cách cài đặt an toàn.", "a": false, "l": "VD", "e": "Tệp cài đặt không rõ nguồn gốc và tắt diệt virus là rất nguy hiểm, không an toàn."}]}, {"n": 25, "bai": 2, "t": "ds", "q": "Hoa đang tìm hiểu về hệ điều hành và phần mềm ứng dụng trên máy tính bảng và máy tính của mình. Em hãy cho biết các nhận định sau đúng hay sai:", "it": [{"t": "Android và iOS là hệ điều hành dành cho điện thoại thông minh và máy tính bảng.", "a": true, "l": "NB", "e": "Android và iOS là hệ điều hành của điện thoại thông minh, máy tính bảng."}, {"t": "Các phần mềm Word, Excel, Chrome có nhiệm vụ quản lí và điều khiển các thiết bị phần cứng như bàn phím, chuột, màn hình.", "a": false, "l": "TH", "e": "Word, Excel, Chrome là phần mềm ứng dụng; quản lí phần cứng là nhiệm vụ của hệ điều hành."}, {"t": "Nếu không có hệ điều hành, các phần mềm ứng dụng không có môi trường để hoạt động.", "a": true, "l": "TH", "e": "Phần mềm ứng dụng chạy trên nền hệ điều hành, không có hệ điều hành thì không chạy được."}, {"t": "Hoa tải bộ cài đặt phần mềm Zalo dành cho Windows và dùng nó để cài trực tiếp lên máy tính bảng chạy Android. Cách làm này sẽ cài đặt thành công.", "a": false, "l": "VD", "e": "Bộ cài cho Windows không cài được lên Android; phải tải đúng phiên bản phù hợp hệ điều hành."}]}, {"n": 26, "bai": 2, "t": "ds", "q": "An vừa cài lại máy tính ở nhà và đang tìm hiểu về phần mềm. Em hãy cho biết các nhận định sau đúng hay sai:", "it": [{"t": "Phần mềm ứng dụng là phần mềm giúp người dùng thực hiện một công việc cụ thể như soạn thảo văn bản, nghe nhạc, xem phim.", "a": true, "l": "NB", "e": "Đây là định nghĩa đúng của phần mềm ứng dụng."}, {"t": "Windows và phần mềm soạn thảo văn bản Word đều là hệ điều hành.", "a": false, "l": "TH", "e": "Windows là hệ điều hành, còn Word là phần mềm ứng dụng."}, {"t": "Hệ điều hành giúp người dùng giao tiếp với máy tính và điều khiển các thiết bị phần cứng.", "a": true, "l": "TH", "e": "Hệ điều hành là môi trường giao tiếp giữa người dùng và máy tính, điều khiển phần cứng."}, {"t": "An muốn soạn bài thuyết trình nhưng máy chưa có phần mềm trình chiếu. Cài thêm một hệ điều hành thứ hai sẽ giúp An soạn được bài thuyết trình.", "a": false, "l": "VD", "e": "Muốn soạn bài trình chiếu phải cài phần mềm ứng dụng (như PowerPoint), cài thêm hệ điều hành không giúp được."}]}, {"n": 27, "bai": 3, "t": "mc", "q": "Ứng dụng quản lí tệp trên hệ điều hành Windows 10 có tên là gì?", "o": ["File Explorer", "Internet Explorer", "Windows Explorer", "Windows Defender"], "a": 0, "l": "NB", "e": "File Explorer là ứng dụng quản lí tệp và thư mục của Windows 10."}, {"n": 28, "bai": 3, "t": "mc", "q": "Phần mềm nào sau đây KHÔNG phải là phần mềm diệt virus?", "o": ["Avira", "Windows Explorer", "Bkav", "Kaspersky"], "a": 1, "l": "NB", "e": "Windows Explorer là ứng dụng quản lí tệp, không phải phần mềm diệt virus."}, {"n": 29, "bai": 3, "t": "mc", "q": "Chức năng chính của phần mềm diệt virus là gì?", "o": ["Phát hiện và diệt virus, chặn tấn công", "Sắp xếp lại ổ cứng bị phân mảnh", "Tự động đổi tên các thư mục rác", "Tăng tốc độ truy cập Internet"], "a": 0, "l": "NB", "e": "Phần mềm diệt virus phát hiện, diệt virus và ngăn chặn tấn công."}, {"n": 30, "bai": 3, "t": "mc", "q": "Lệnh Cut kết hợp với lệnh Paste dùng để thực hiện thao tác nào?", "o": ["Đổi tên thư mục", "Sao chép thư mục", "Di chuyển thư mục", "Xóa thư mục"], "a": 2, "l": "NB", "e": "Cut + Paste là di chuyển; Copy + Paste mới là sao chép."}, {"n": 31, "bai": 3, "t": "mc", "q": "Trong hệ điều hành Windows, phần mở rộng .exe thường dùng cho loại tệp nào?", "o": ["Tệp văn bản", "Tệp hình ảnh", "Tệp âm thanh", "Tệp chương trình"], "a": 3, "l": "NB", "e": ".exe là phần mở rộng của tệp chương trình."}, {"n": 32, "bai": 3, "t": "mc", "q": "Tên mặc định của một thư mục mới vừa được tạo ra là gì?", "o": ["Document", "New Folder", "Untitled Folder", "New File"], "a": 1, "l": "NB", "e": "Thư mục mới tạo có tên mặc định là New Folder."}, {"n": 33, "bai": 3, "t": "mc", "q": "Mật khẩu mạnh thường có độ dài tối thiểu bao nhiêu kí tự?", "o": ["Ít nhất 8 kí tự", "Ít nhất 6 kí tự", "Ít nhất 10 kí tự", "Ít nhất 12 kí tự"], "a": 0, "l": "NB", "e": "Mật khẩu mạnh nên có ít nhất 8 kí tự."}, {"n": 34, "bai": 3, "t": "mc", "q": "Tại sao sao lưu từ xa bằng công nghệ đám mây lại an toàn hơn sao lưu cục bộ khi máy tính gặp sự cố cháy nổ?", "o": ["Bản sao lưu được tự động mã hóa ở mức độ phức tạp cao nhất nhằm chống lại sự thay đổi nhiệt độ ở thiết bị gốc.", "Thiết bị lưu trữ vật lí của người dùng sẽ tự động ngắt kết nối và đóng băng dữ liệu ngay khi phát hiện khói, lửa.", "Công nghệ đám mây sử dụng hệ thống chống cháy nổ tích hợp trực tiếp vào bo mạch chủ của thiết bị người dùng.", "Bản sao lưu được đặt ở một hệ thống máy chủ khác qua Internet, không bị ảnh hưởng bởi hỏa hoạn tại nơi đặt máy gốc."], "a": 3, "l": "TH", "e": "Sao lưu đám mây đặt bản sao ở máy chủ khác qua Internet nên không bị ảnh hưởng khi cháy nổ tại nơi đặt máy gốc."}, {"n": 35, "bai": 3, "t": "mc", "q": "Mật khẩu “Ngay12Thang10” bị đánh giá là mật khẩu yếu vì lí do gì?", "o": ["Vì nó đã vi phạm quy tắc phải có từ mười kí tự trở lên.", "Vì nó có thể là ngày sinh, rất dễ để người khác đoán ra.", "Vì nó sử dụng bảng mã ngôn ngữ tiếng Việt không hợp lệ.", "Vì nó có chứa các chữ số kết hợp chữ cái và quá dài."], "a": 1, "l": "TH", "e": "\"Ngay12Thang10\" có thể là ngày sinh, rất dễ đoán nên là mật khẩu yếu."}, {"n": 36, "bai": 3, "t": "mc", "q": "Phát biểu nào đúng khi so sánh USB và lưu trữ đám mây?", "o": ["USB khó lấy lại dữ liệu nếu đánh mất, Đám mây không phụ thuộc vào thiết bị vật lí của người dùng.", "USB bắt buộc có Internet mới xem được dữ liệu, Đám mây kết nối bằng cổng vật lí trên thân máy tính.", "USB không thể lây lan virus máy tính, Đám mây có khả năng tự động sửa chữa phần cứng hỏng hóc.", "Cả hai thiết bị đều bắt buộc cần hệ thống cung cấp đầu ghi đọc tương tự như băng đĩa từ tính."], "a": 0, "l": "TH", "e": "USB dễ thất lạc, mất là khó lấy lại dữ liệu; đám mây không phụ thuộc thiết bị vật lí của người dùng."}, {"n": 37, "bai": 3, "t": "mc", "q": "So sánh giữa “sao lưu cục bộ” và “sao lưu từ xa”, sự khác biệt cơ bản nhất về vị trí lưu trữ là gì?", "o": ["Sao lưu cục bộ lưu trên ổ cứng, sao lưu từ xa lưu ở RAM.", "Sao lưu cục bộ chỉ dùng mạng LAN, sao lưu từ xa dùng Wifi.", "Sao lưu cục bộ lưu gần bản gốc, sao lưu từ xa lưu ở nơi khác.", "Sao lưu cục bộ lưu ở đám mây, sao lưu từ xa lưu trên USB."], "a": 2, "l": "TH", "e": "Sao lưu cục bộ để gần bản gốc (cùng máy, ổ cứng ngoài, USB); sao lưu từ xa để ở nơi khác (đám mây)."}, {"n": 38, "bai": 3, "t": "mc", "q": "Trong các mật khẩu sau, mật khẩu nào là mạnh nhất?", "o": ["matkhau", "2n#M1nhKh0a", "12345678", "AnMinhKhoa"], "a": 1, "l": "TH", "e": "2n#M1nhKh0a dài, có chữ hoa, chữ thường, số, kí tự đặc biệt nên mạnh nhất."}, {"n": 39, "bai": 3, "t": "mc", "q": "Lựa chọn mật khẩu \"Ha Noi\" để bảo vệ máy tính có nhược điểm gì?", "o": ["Khiến cho bộ nhớ đệm của máy tính phải hoạt động vượt quá công suất để phân tích chuỗi kí tự khoảng trắng.", "Kích hoạt tính năng khóa tài khoản do sử dụng cụm từ vi phạm chính sách kiểm duyệt văn bản quốc tế.", "Là mật khẩu yếu vì sử dụng từ đặc biệt rất dễ dự đoán dựa trên thông tin phổ biến.", "Mật khẩu này chứa quá nhiều kí tự đặc biệt làm vô hiệu hóa hệ thống mã hóa bảo mật hiện hành."], "a": 2, "l": "TH", "e": "\"Ha Noi\" là từ quen thuộc, ngắn, rất dễ đoán nên là mật khẩu yếu."}, {"n": 40, "bai": 3, "t": "mc", "q": "Nếu công ty của bạn có nguy cơ cao bị mất trộm thiết bị phần cứng tại văn phòng, bạn nên ưu tiên giải pháp nào để bảo vệ dữ liệu công việc quan trọng?", "o": ["Xóa bớt các tệp .exe không cần thiết để tăng cường bảo mật.", "Tạo nhiều thư mục ẩn trên ổ C để giấu dữ liệu.", "Thiết lập sao lưu dữ liệu từ xa lên công nghệ đám mây định kì.", "Mua các USB dung lượng lớn, sao chép dữ liệu rồi cất vào ngăn kéo làm việc."], "a": 2, "l": "VD", "e": "Nguy cơ mất trộm thiết bị thì cần sao lưu từ xa lên đám mây để dữ liệu ở nơi khác."}, {"n": 41, "bai": 3, "t": "mc", "q": "Trong một doanh nghiệp cần thường xuyên xử lí lượng lớn dữ liệu phim ảnh dung lượng hàng trăm Gigabyte và phải đem đi lại giữa các văn phòng chi nhánh. Bạn sẽ tư vấn cho doanh nghiệp thiết bị lưu trữ nào hiệu quả nhất?", "o": ["Thẻ nhớ điện thoại", "In trực tiếp ra giấy", "Đĩa quang CD", "Ổ cứng ngoài"], "a": 3, "l": "VD", "e": "Dữ liệu hàng trăm GB, cần mang đi lại nên chọn ổ cứng ngoài (dung lượng lớn)."}, {"n": 42, "bai": 3, "t": "mc", "q": "Máy tính chỉ còn lại 2GB dung lượng trống. Bạn cần sao lưu một tệp Video 5GB từ máy để dọn dẹp hệ thống nhưng không có thiết bị USB nào trong tay, lại có tài khoản lưu trữ online. Lựa chọn hợp lí nhất là?", "o": ["Lưu vào đĩa quang bằng bất kì ổ đọc CD thông thường nào", "Dùng lệnh Create shortcut để chuyển tệp đi", "Đổi tên tệp thành .exe để giảm dung lượng", "Tải tệp đó lên công cụ lưu trữ công nghệ đám mây"], "a": 3, "l": "VD", "e": "Máy gần hết dung lượng, không có USB nhưng có tài khoản online nên tải tệp lên đám mây."}, {"n": 43, "bai": 3, "t": "mc", "q": "Cây thư mục máy tính của Lan có: D:\\NamHoc\\HocKi1\\MonTin\\BaiTap.docx. Lan thực hiện thao tác Cut tệp BaiTap.docx và Paste vào thư mục NamHoc. Vị trí mới của tệp BaiTap.docx ở đâu?", "o": ["D:\\NamHoc\\BaiTap.docx", "D:\\NamHoc\\HocKi1\\BaiTap.docx", "D:\\BaiTap.docx", "Vẫn nằm ở vị trí cũ, chỉ đổi tên."], "a": 0, "l": "VD", "e": "Cut tệp rồi Paste vào NamHoc nên tệp chuyển ra thư mục NamHoc: D:\\NamHoc\\BaiTap.docx.", "img": "data:image/webp;base64,UklGRtoaAABXRUJQVlA4IM4aAACwewCdASqNAdcAPm0ylUikIqGiJDBq6IANiWUvM3VydN8nxbFvZ+GfhPyw6dYhvMu7v5X/3fq+/33+Z9s237/pvoV/Xj9h/ed/3PqY9AD9WutK9AD9yvTV9l392MpX6tdun97/tX7bf1L1P/G/mH7D+UX9Z3sfUy+UfbD8n/g ình. Em hãy cho biết các nhận định sau đúng hay sai:", "it": [{"t": "Tệp chương trình cũng là dữ liệu và được lưu trữ trong máy tính dưới dạng tệp.", "a": true, "l": "NB", "e": "Tệp chương trình cũng là dữ liệu, lưu dưới dạng tệp."}, {"t": "Phần mở rộng trong tên tệp chỉ để trang trí, không cho biết tệp thuộc loại nào.", "a": false, "l": "TH", "e": "Phần mở rộng cho biết loại tệp, không phải để trang trí."}, {"t": "Lan đặt mật khẩu tài khoản là 1234567a vì mật khẩu có 8 kí tự nên là mật khẩu mạnh.", "a": false, "l": "VD", "e": "1234567a chỉ có số và 1 chữ thường, thiếu chữ hoa, kí tự đặc biệt, dễ đoán nên chưa phải mật khẩu mạnh."}, {"t": "Lan đổi tên tệp BaiTap.docx thành BaiTap.jpg. Việc đổi phần mở rộng không biến tệp văn bản thành tệp ảnh, tệp có thể không mở được bình thường.", "a": true, "l": "VD", "e": "Đổi đuôi không đổi nội dung thật của tệp, tệp có thể không mở được bình thường."}]}, {"n": 47, "bai": 3, "t": "ds", "q": "Tuấn thường xuyên lưu bài tập và tài liệu học tập trên máy tính. Em hãy cho biết các nhận định sau đúng hay sai:", "it": [{"t": "Phần mềm diệt virus giúp phát hiện và ngăn chặn virus, bảo vệ dữ liệu trong máy tính.", "a": true, "l": "NB", "e": "Phần mềm diệt virus phát hiện, ngăn chặn virus, bảo vệ dữ liệu."}, {"t": "Tệp có tên BaiHat.mp3 có phần mở rộng .mp3 cho biết đây là tệp âm thanh.", "a": true, "l": "TH", "e": ".mp3 là phần mở rộng của tệp âm thanh."}, {"t": "Tuấn chỉ lưu toàn bộ bài tập quan trọng trên ổ đĩa của máy tính, không sao lưu ở nơi nào khác. Đây là cách bảo vệ dữ liệu an toàn nhất.", "a": false, "l": "VD", "e": "Chỉ lưu một nơi là không an toàn, cần sao lưu thêm nơi khác."}, {"t": "Để chuyển tệp BaiTap.docx sang thư mục khác và không để lại bản gốc ở vị trí cũ, Tuấn dùng lệnh Cut rồi lệnh Paste.", "a": true, "l": "VD", "e": "Cut + Paste là di chuyển, tệp không còn ở vị trí cũ."}]}, {"n": 48, "bai": 3, "t": "ds", "q": "Hà đang sắp xếp dữ liệu và bảo vệ tài khoản cá nhân trên máy tính. Em hãy cho biết các nhận định sau đúng hay sai:", "it": [{"t": "Sao lưu dữ liệu là tạo thêm bản sao của dữ liệu để dùng khi bản gốc bị mất hoặc bị hỏng.", "a": true, "l": "NB", "e": "Đây là định nghĩa đúng của sao lưu dữ liệu."}, {"t": "Mật khẩu 12345678 gồm toàn chữ số liên tiếp nên là mật khẩu yếu vì rất dễ bị đoán ra.", "a": true, "l": "TH", "e": "12345678 là dãy số đơn giản, dễ bị đoán."}, {"t": "Để đặt mật khẩu mạnh, Hà nên chọn mật khẩu dài, kết hợp chữ hoa, chữ thường, chữ số và kí hiệu đặc biệt, không dùng ngày sinh của mình.", "a": true, "l": "VD", "e": "Đây là cách đặt mật khẩu mạnh đúng."}, {"t": "Hà dùng lệnh Cut rồi Paste để sao chép tệp vào USB nên tệp ở thư mục cũ trên máy tính vẫn còn nguyên.", "a": false, "l": "VD", "e": "Cut + Paste là di chuyển nên tệp ở thư mục cũ không còn; muốn giữ bản gốc phải dùng Copy + Paste."}]}, {"n": 49, "bai": 3, "t": "ds", "q": "Bình đang sắp xếp và bảo vệ dữ liệu học tập trên máy tính. Em hãy cho biết các nhận định sau đúng hay sai:", "it": [{"t": "File Explorer là ứng dụng dùng để quản lí tệp và thư mục trong hệ điều hành Windows.", "a": true, "l": "NB", "e": "File Explorer là ứng dụng quản lí tệp, thư mục của Windows."}, {"t": "Tệp có phần mở rộng .jpg và tệp có phần mở rộng .exe đều là tệp hình ảnh.", "a": false, "l": "TH", "e": ".jpg là tệp ảnh, còn .exe là tệp chương trình."}, {"t": "Bình lưu một bản bài tập trên USB và một bản trên dịch vụ lưu trữ đám mây. Đây là cách sao lưu giúp bảo vệ dữ liệu tốt hơn so với chỉ lưu ở một nơi.", "a": true, "l": "VD", "e": "Lưu ở hai nơi (USB và đám mây) an toàn hơn chỉ lưu một nơi."}, {"t": "Bình đặt tên thư mục là Tin/hoc 7 để phân loại tài liệu. Hệ điều hành Windows cho phép đặt tên thư mục có chứa kí tự “/”.", "a": false, "l": "VD", "e": "Windows không cho phép kí tự \"/\" trong tên thư mục."}]}, {"n": 50, "bai": 4, "t": "mc", "q": "Yếu tố nào giúp người dùng phân biệt trang cá nhân của mình với người khác trên Facebook?", "o": ["Tên tài khoản và Ảnh đại diện", "Tốc độ chuột máy tính", "Màu sắc bàn phím", "Kích thước màn hình hiển thị"], "a": 0, "l": "NB", "e": "Tên tài khoản và ảnh đại diện giúp phân biệt trang cá nhân."}, {"n": 51, "bai": 4, "t": "mc", "q": "Kênh nào sau đây cho phép thảo luận không trực tiếp và phản hồi có thể nhận được ngay hoặc sau vài ngày?", "o": ["Gọi video trực tiếp", "Phát thanh", "Diễn đàn", "Điện thoại"], "a": 2, "l": "NB", "e": "Diễn đàn (forum) là kênh thảo luận không trực tiếp, phản hồi sau một thời gian."}, {"n": 52, "bai": 4, "t": "mc", "q": "Trang web nào sau đây có mục đích chính là chia sẻ video?", "o": ["Instagram", "Zalo", "YouTube", "Scratch"], "a": 2, "l": "NB", "e": "YouTube là nơi chia sẻ video."}, {"n": 53, "bai": 4, "t": "mc", "q": "Việc bình luận xấu, miệt thị ngoại hình người khác trên mạng xã hội gọi là hành vi gì?", "o": ["Học tập trực tuyến", "Trao đổi tri thức", "Giải trí lành mạnh", "Bắt nạt trên mạng"], "a": 3, "l": "NB", "e": "Bình luận xấu, miệt thị người khác trên mạng là bắt nạt trên mạng."}, {"n": 54, "bai": 4, "t": "mc", "q": "Muốn kết nối với một người bạn trên Facebook, người dùng nháy vào nút nào trên trang cá nhân của bạn đó?", "o": ["Nhắn tin", "Theo dõi", "Chia sẻ", "Thêm bạn bè"], "a": 3, "l": "NB", "e": "Muốn kết bạn trên Facebook thì nháy nút Thêm bạn bè."}, {"n": 55, "bai": 4, "t": "mc", "q": "Hành vi đăng tải thông tin sai trái lên mạng xã hội có thể chịu hậu quả gì?", "o": ["Được mạng xã hội thưởng tiền mặt ngay lập tức", "Bị phạt theo quy định của pháp luật hoặc bị xử lí kỷ luật", "Không chịu bất kỳ hình thức xử lí nào", "Tự động tăng tốc độ đường truyền Internet"], "a": 1, "l": "NB", "e": "Đăng thông tin sai trái có thể bị kỉ luật hoặc bị phạt theo quy định của pháp luật."}, {"n": 56, "bai": 4, "t": "mc", "q": "Hành vi nào sau đây bị nghiêm cấm trên mạng xã hội?", "o": ["Chia sẻ kinh nghiệm học tập môn Tin học", "Đưa thông tin sai sự thật, xúc phạm người khác", "Thảo luận bài tập nhóm với bạn học", "Đăng tải hình ảnh sinh hoạt gia đình phù hợp"], "a": 1, "l": "NB", "e": "Đưa thông tin sai sự thật, xúc phạm người khác bị nghiêm cấm."}, {"n": 57, "bai": 4, "t": "mc", "q": "Mạng xã hội là gì?", "o": ["Một hệ thống máy tính dùng để lưu trữ cơ sở dữ liệu quốc gia", "Một cộng đồng trực tuyến để mọi người có thể tương tác với nhau", "Một chương trình diệt virus chạy trên máy tính cá nhân", "Một thiết bị truyền thông dùng để phát sóng truyền hình"], "a": 1, "l": "NB", "e": "Mạng xã hội là cộng đồng trực tuyến cho mọi người tương tác, chia sẻ."}, {"n": 58, "bai": 4, "t": "mc", "q": "Để thêm hình ảnh vào bài viết trên Facebook, người dùng nháy chuột vào biểu tượng/chữ nào?", "o": ["Ảnh/Video", "Cảm xúc/Hoạt động", "Phòng họp mặt", "Tệp đính kèm"], "a": 0, "l": "NB", "e": "Muốn thêm hình ảnh vào bài viết Facebook thì nháy vào Ảnh/Video."}, {"n": 59, "bai": 4, "t": "mc", "q": "Tên gọi tiếng Anh của khái niệm \"Diễn đàn\" trên Internet là gì?", "o": ["Chat", "Forum", "Email", "Website"], "a": 1, "l": "NB", "e": "Diễn đàn trong tiếng Anh là Forum."}, {"n": 60, "bai": 4, "t": "mc", "q": "Lợi ích nào sau đây thuộc về việc sử dụng mạng xã hội đúng cách?", "o": ["Nghiện trò chơi trực tuyến", "Bị lừa đảo tài sản", "Lãng phí toàn bộ thời gian rảnh", "Học hỏi kiến thức và kết nối bạn bè"], "a": 3, "l": "NB", "e": "Lợi ích của mạng xã hội dùng đúng cách là học hỏi kiến thức và kết nối bạn bè."}, {"n": 61, "bai": 4, "t": "mc", "q": "Sự khác biệt cơ bản giữa Thư điện tử (Email) và Diễn đàn (Forum) là gì?", "o": ["Thư điện tử chỉ gửi cho một hoặc một nhóm người xác định; Diễn đàn là nơi công khai cho cộng đồng cùng thảo luận.", "Thư điện tử chỉ sử dụng trên máy tính bàn; Diễn đàn chỉ có thể truy cập được bằng điện thoại thông minh.", "Thư điện tử bắt buộc phải trả phí dịch vụ hàng tháng; Diễn đàn hoàn toàn miễn phí cho tất cả mọi người.", "Thư điện tử không thể gửi được hình ảnh; Diễn đàn chỉ gửi được tập tin âm thanh MP3."], "a": 0, "l": "TH", "e": "Email gửi cho người (nhóm người) xác định; diễn đàn công khai, cộng đồng cùng thảo luận."}, {"n": 62, "bai": 4, "t": "mc", "q": "Vì sao chúng ta KHÔNG nên đăng tải thông tin cá nhân nhạy cảm (như số căn cước, địa chỉ nhà, mật khẩu) lên mạng xã hội?", "o": ["Kẻ xấu có thể lợi dụng thông tin đó để lừa đảo hoặc gây hại cho bản thân và gia đình.", "Vì đăng như vậy sẽ làm máy tính bị chậm tốc độ xử lí do dung lượng văn bản quá nặng.", "Mạng xã hội sẽ tự động khóa tài khoản ngay lập tức nếu phát hiện các con số.", "Việc này làm mất thẩm mỹ giao diện trang cá nhân và gây khó chịu cho người xem."], "a": 0, "l": "TH", "e": "Thông tin nhạy cảm bị kẻ xấu lợi dụng để lừa đảo, gây hại cho bản thân và gia đình."}, {"n": 63, "bai": 4, "t": "mc", "q": "Tại sao mạng xã hội quy định độ tuổi tối thiểu (thường từ 13 tuổi) mới được phép đăng ký?", "o": ["Máy tính không thể hiển thị giao diện mạng xã hội cho người dùng ở độ tuổi thiếu nhi vì hệ thống bị lỗi.", "Trẻ em dưới 13 tuổi chưa được phép sử dụng bàn phím và chuột máy tính theo quy định của pháp luật.", "Trẻ em dưới 13 tuổi chưa đủ kĩ năng nhận thức và chưa có khả năng tự bảo vệ mình trước các nguy cơ trên mạng.", "Mạng xã hội chỉ muốn phục vụ người lớn để thu tiền phí dịch vụ duy trì hệ thống hàng năm."], "a": 2, "l": "TH", "e": "Trẻ dưới 13 tuổi chưa đủ nhận thức, chưa tự bảo vệ mình trước nguy cơ trên mạng."}, {"n": 64, "bai": 4, "t": "mc", "q": "Một học sinh chụp ảnh bài làm của bạn rồi đăng lên mạng xã hội để chế giễu bài làm đó điểm thấp. Hành vi này là:", "o": ["Hành vi vi phạm đạo đức, bắt nạt bạn bè trên không gian mạng.", "Chức năng chia sẻ kiến thức hợp lệ của mạng xã hội Facebook.", "Phương pháp học tập nhóm mang lại hiệu quả cao theo khuyến nghị.", "Việc làm tốt giúp bạn nhận ra sai sót để cố gắng hơn trong học tập."], "a": 0, "l": "TH", "e": "Chế giễu bài làm của bạn trên mạng là bắt nạt, vi phạm đạo đức."}, {"n": 65, "bai": 4, "t": "mc", "q": "Khi một người dùng bấm \"Hủy kết bạn\" với một tài khoản khác trên Facebook, điều gì sẽ xảy ra?", "o": ["Hai người không thể tìm thấy tên nhau trên thanh tìm kiếm được nữa.", "Tài khoản kia sẽ bị hệ thống tự động khóa vĩnh viễn không thể truy cập.", "Mọi tin nhắn cũ giữa hai người sẽ bị xóa sạch hoàn toàn khỏi máy tính.", "Hai tài khoản không còn là bạn bè và ngừng tự động theo dõi bài viết của nhau."], "a": 3, "l": "TH", "e": "Hủy kết bạn thì hai tài khoản không còn là bạn bè, không còn theo dõi bài viết của nhau."}, {"n": 66, "bai": 4, "t": "mc", "q": "Sự khác biệt lớn nhất giữa việc đọc tin tức trên Trang báo điện tử chính thống và Mạng xã hội là gì?", "o": ["Báo điện tử bắt buộc người đọc phải mua tài khoản; mạng xã hội không cho phép đăng ký tài khoản.", "Tin tức trên báo điện tử được kiểm duyệt nội dung; thông tin trên mạng xã hội do người dùng tự đăng nên chưa được kiểm chứng.", "Trang báo điện tử chỉ hiển thị hình ảnh đen trắng; mạng xã hội hiển thị hình ảnh có màu sắc sinh động.", "Tin tức trên báo điện tử chỉ đọc được vào ban ngày; mạng xã hội hoạt động 24/24 giờ."], "a": 1, "l": "TH", "e": "Báo điện tử chính thống có kiểm duyệt; thông tin trên mạng xã hội do người dùng tự đăng, chưa được kiểm chứng."}, {"n": 67, "bai": 4, "t": "mc", "q": "Mạng xã hội YouTube cho phép người dùng thực hiện các thao tác nào với video?", "o": ["Thay đổi nội dung video của người khác đã đăng", "Xóa video của các tài khoản khác", "Chỉnh sửa mã nguồn của video hệ thống", "Xem, chia sẻ, bình luận và tải video lên"], "a": 3, "l": "TH", "e": "YouTube cho phép xem, chia sẻ, bình luận và tải video của mình lên, không được sửa hay xóa video người khác."}, {"n": 68, "bai": 4, "t": "mc", "q": "Học sinh A thấy một bài viết đăng tin đồn thất thiệt về một sự việc xảy ra tại trường mình. Học sinh A nên xử lí như thế nào là ĐÚNG?", "o": ["Nhắn tin chửi bới người đăng bài viết đó bằng những từ ngữ thô tục để bảo vệ uy tín của nhà trường.", "Báo cáo bài viết xấu độc hoặc thông báo với giáo viên, không chia sẻ lại tin đồn đó.", "Sao chép bài viết đó đăng sang các nhóm mạng xã hội khác để kiểm chứng thông tin đúng sai.", "Chia sẻ ngay lập tức về trang cá nhân của mình để tất cả bạn bè trong lớp cùng đọc và thảo luận xôn xao."], "a": 1, "l": "TH", "e": "Gặp tin đồn thất thiệt thì báo cáo bài viết hoặc báo giáo viên, không chia sẻ lại."}, {"n": 69, "bai": 4, "t": "mc", "q": "Nam nhận được lời mời kết bạn trên Facebook từ một tài khoản có ảnh đại diện là hình người nổi tiếng nhưng không có bạn chung nào và hồ sơ hoàn toàn trống. Nam nên xử lí thế nào?", "o": ["Gửi ngay mật khẩu tài khoản của mình cho người đó để làm quen.", "Từ chối lời mời kết bạn để đảm bảo an toàn tài khoản.", "Chấp nhận ngay vì người nổi tiếng kết bạn là điều may mắn.", "Nhắn tin hỏi địa chỉ nhà của người đó rồi mới bấm đồng ý."], "a": 1, "l": "VD", "e": "Tài khoản lạ, hồ sơ trống, không bạn chung có thể là giả mạo, nên từ chối kết bạn."}, {"n": 70, "bai": 4, "t": "mc", "q": "Nguyên tắc quan trọng nhất giúp em trở thành một người sử dụng mạng xã hội thông minh và an toàn là gì?", "o": ["Luôn suy nghĩ kĩ trước khi đăng tải/chia sẻ thông tin và tôn trọng quy định pháp luật.", "Kết bạn với tất cả những ai gửi lời mời trên không gian mạng.", "Chia sẻ tất cả những thông tin mình đọc được mà không cần kiểm chứng.", "Đăng càng nhiều bài viết mỗi ngày càng tốt để tăng lượng tương tác."], "a": 0, "l": "VD", "e": "Luôn suy nghĩ kĩ trước khi đăng, chia sẻ và tôn trọng pháp luật là nguyên tắc quan trọng nhất."}, {"n": 71, "bai": 4, "t": "mc", "q": "Minh nhận được thông báo tài khoản Facebook của mình vừa đăng nhập từ một thiết bị lạ ở thành phố khác. Minh cần thực hiện thao tác khẩn cấp nào?", "o": ["Đăng bài viết hỏi xem ai vừa đăng nhập tài khoản của mình.", "Nhắn tin cho tất cả bạn bè trong danh sách để hỏi nguyên nhân.", "Đổi mật khẩu tài khoản lập tức và đăng xuất khỏi các thiết bị khác.", "Xóa ứng dụng Facebook trên điện thoại rồi tải lại."], "a": 2, "l": "VD", "e": "Đăng nhập lạ thì phải đổi mật khẩu ngay và đăng xuất các thiết bị khác."}, {"n": 72, "bai": 4, "t": "mc", "q": "Một tài khoản lạ gửi cho em một đường link đính kèm lời nhắn: \"Nhấp vào đây để nhận quà tặng iPhone miễn phí\". Em nên làm gì?", "o": ["Gửi đường link đó cho tất cả bạn bè trong lớp cùng nhấp vào nhận quà.", "Tuyệt đối không nhấp vào đường link vì đó có thể là liên kết lừa đảo, đánh cắp thông tin.", "Nhập số điện thoại và mật khẩu tài khoản của mình vào đường link đó.", "Nhấp vào ngay để nhận quà vì đây là cơ hội hiếm có trên mạng xã hội."], "a": 1, "l": "VD", "e": "Link \"quà tặng miễn phí\" thường là lừa đảo, đánh cắp thông tin, tuyệt đối không bấm."}, {"n": 73, "bai": 4, "t": "ds", "q": "Bình (đủ 13 tuổi) đăng kí tài khoản mạng xã hội để giao lưu với bạn bè và đang tìm hiểu cách sử dụng. Em hãy cho biết các nhận định sau đúng hay sai:", "it": [{"t": "Thư gửi qua đường bưu điện là một kênh trao đổi thông tin trên Internet.", "a": false, "l": "NB", "e": "Thư bưu điện không đi qua Internet nên không phải kênh trao đổi trên Internet."}, {"t": "Mạng xã hội giúp kết nối bạn bè nhanh chóng nhưng cũng có thể bị lợi dụng để lan truyền tin giả hoặc bắt nạt người khác.", "a": true, "l": "TH", "e": "Mạng xã hội có cả lợi ích lẫn tác hại (tin giả, bắt nạt)."}, {"t": "Một người trông rất quen gửi lời mời kết bạn và hỏi địa chỉ nhà, số điện thoại. Bình nên chấp nhận kết bạn và cung cấp thông tin để làm quen.", "a": false, "l": "VD", "e": "Không cung cấp địa chỉ nhà, số điện thoại cho người lạ."}, {"t": "Để hạn chế người lạ xem bài đăng, Bình nên đặt chế độ chia sẻ bài viết là Bạn bè thay vì Công khai.", "a": true, "l": "VD", "e": "Đặt chế độ Bạn bè giúp hạn chế người lạ xem bài đăng."}]}, {"n": 74, "bai": 4, "t": "ds", "q": "Hùng sử dụng mạng xã hội để kết nối với bạn bè và chia sẻ thông tin. Em hãy cho biết các nhận định sau đúng hay sai:", "it": [{"t": "Facebook và Instagram là các ví dụ về mạng xã hội.", "a": true, "l": "NB", "e": "Facebook, Instagram đều là mạng xã hội."}, {"t": "Mọi thông tin trên mạng xã hội đều chính xác nên Hùng có thể chia sẻ lại ngay mà không cần kiểm chứng.", "a": false, "l": "TH", "e": "Thông tin trên mạng xã hội chưa chắc chính xác, phải kiểm chứng trước khi chia sẻ."}, {"t": "Hùng nhận được tin nhắn từ tài khoản giống bạn thân nhờ chuyển tiền gấp. Hùng nên gọi điện trực tiếp cho bạn để xác nhận trước khi làm theo.", "a": true, "l": "VD", "e": "Tài khoản giống bạn nhờ chuyển tiền có thể bị giả mạo, cần gọi điện xác nhận."}, {"t": "Một người lạ nhắn tin xin mật khẩu để “hỗ trợ khoá tài khoản”. Hùng nên cung cấp mật khẩu để được hỗ trợ nhanh chóng.", "a": false, "l": "VD", "e": "Không bao giờ cung cấp mật khẩu cho người lạ."}]}, {"n": 75, "bai": 4, "t": "ds", "q": "Linh sử dụng thư điện tử, diễn đàn và mạng xã hội để học tập và giao lưu. Em hãy cho biết các nhận định sau đúng hay sai:", "it": [{"t": "Thư điện tử và diễn đàn là các kênh trao đổi thông tin trên Internet.", "a": true, "l": "NB", "e": "Thư điện tử và diễn đàn đều là kênh trao đổi thông tin trên Internet."}, {"t": "Một thông tin được nhiều người chia sẻ trên mạng xã hội thì chắc chắn là thông tin đúng.", "a": false, "l": "TH", "e": "Nhiều người chia sẻ chưa chắc là đúng, tin giả vẫn lan nhanh."}, {"t": "Linh thấy một bài đăng kêu gọi quyên góp từ thiện không rõ nguồn gốc. Linh nên kiểm chứng thông tin qua nguồn tin cậy trước khi chia sẻ.", "a": true, "l": "VD", "e": "Phải kiểm chứng qua nguồn tin cậy trước khi chia sẻ tin kêu gọi quyên góp."}, {"t": "Linh thấy một bạn bị nhiều người bình luận miệt thị trên mạng xã hội. Linh nên bình luận thêm cho vui để hòa nhập với mọi người.", "a": false, "l": "VD", "e": "Bình luận miệt thị thêm là tham gia bắt nạt, vi phạm quy tắc ứng xử."}]}, {"n": 76, "bai": 5, "t": "mc", "q": "Một trong những biểu hiện của bệnh nghiện Internet là gì?", "o": ["Chơi thể thao mỗi ngày", "Thường xuyên dùng thiết bị thông minh để đi khám phá thế giới", "Hay sử dụng máy tính để tham gia hoạt động ngoài trời", "Sử dụng Internet quá nhiều, chán ăn, sụt cân"], "a": 3, "l": "NB", "e": "Dùng Internet quá nhiều, chán ăn, sụt cân là biểu hiện nghiện Internet."}, {"n": 77, "bai": 5, "t": "mc", "q": "Người nghiện trò chơi trực tuyến thường có tâm trạng thế nào khi KHÔNG được chơi?", "o": ["Thoải mái, thư giãn", "Vui vẻ, hòa đồng", "Tập trung học tập hơn", "Cáu gắt, lầm lì, bồn chồn"], "a": 3, "l": "NB", "e": "Người nghiện game thường cáu gắt, lầm lì, bồn chồn khi không được chơi."}, {"n": 78, "bai": 5, "t": "mc", "q": "Hành động nào sau đây vi phạm quyền riêng tư trên mạng?", "o": ["Tham gia diễn đàn học tập trên mạng khi chưa xin phép", "Chia sẻ hình ảnh của bạn bè lên mạng khi chưa xin phép", "Gửi email cho giáo viên", "Thay đổi mật khẩu cá nhân thường xuyên"], "a": 1, "l": "NB", "e": "Chia sẻ hình ảnh của bạn khi chưa xin phép là vi phạm quyền riêng tư."}, {"n": 79, "bai": 5, "t": "mc", "q": "Đâu là một ví dụ về giao tiếp qua mạng có văn hóa?", "o": ["Bình luận mang tính chất động viên, khen ngợi hợp lý", "Chửi bới người khác trên diễn đàn", "Phát tán tin đồn thất thiệt", "Dùng tiếng lóng, từ ngữ thô tục"], "a": 0, "l": "NB", "e": "Bình luận động viên, khen ngợi hợp lí là giao tiếp có văn hóa."}, {"n": 80, "bai": 5, "t": "mc", "q": "Một nguyên tắc quan trọng khi tạo mật khẩu cho tài khoản mạng là gì?", "o": ["Sử dụng số điện thoại", "Sử dụng tên của mình", "Sử dụng ngày sinh của mình", "Sử dụng mật khẩu mạnh gồm chữ cái, số và kí tự đặc biệt"], "a": 3, "l": "NB", "e": "Mật khẩu mạnh gồm chữ cái, số và kí tự đặc biệt."}, {"n": 81, "bai": 5, "t": "mc", "q": "Trang web nào phù hợp với lứa tuổi học sinh THCS?", "o": ["Trang web cung cấp kiến thức khoa học, lịch sử", "Trang web chia sẻ video bạo lực", "Trang web mua bán vũ khí", "Trang web cá cược bóng đá"], "a": 0, "l": "NB", "e": "Trang web cung cấp kiến thức khoa học, lịch sử phù hợp với học sinh THCS."}, {"n": 82, "bai": 5, "t": "mc", "q": "Việc làm nào sau đây là NÊN làm khi giao tiếp qua mạng?", "o": ["Sử dụng ngôn ngữ lịch sự", "Đọc trộm email của bạn", "Nói xấu người khác", "Giấu bố mẹ khi bị bắt nạt"], "a": 0, "l": "NB", "e": "Nên dùng ngôn ngữ lịch sự khi giao tiếp qua mạng."}, {"n": 83, "bai": 5, "t": "mc", "q": "Tại sao người nghiện mạng thường gặp tình trạng suy giảm kết quả học tập?", "o": ["Vì thời gian, tâm trí và sự tập trung của họ đã bị cuốn hết vào thế giới ảo, không còn hứng thú học.", "Vì sách vở bị cũ đi nhanh hơn khi để gần các thiết bị phát wifi.", "Vì chơi mạng xã hội làm mất toàn bộ kiến thức đã học trong trí nhớ.", "Vì thầy cô giáo thường ghét những học sinh hay sử dụng máy tính."], "a": 0, "l": "TH", "e": "Tâm trí, thời gian bị cuốn vào thế giới ảo nên không còn hứng thú học tập."}, {"n": 84, "bai": 5, "t": "mc", "q": "Vì sao không nên dùng tiếng lóng, từ ngữ thô tục khi giao tiếp qua mạng?", "o": ["Vì nó thể hiện sự có văn hóa, tôn trọng người khác và làm xấu đi hình ảnh của chính mình.", "Vì những từ ngữ đó không thể hiển thị trên màn hình máy tính.", "Vì nhà mạng phát hiện sẽ lập tức cắt kết nối Internet của gia đình bạn.", "Vì nó thể hiện sự thiếu văn hóa, không tôn trọng người khác."], "a": 3, "l": "TH", "e": "Dùng tiếng lóng, từ thô tục là thiếu văn hóa, không tôn trọng người khác."}, {"n": 85, "bai": 5, "t": "mc", "q": "Vì sao việc để máy tính ở không gian sinh hoạt chung giúp phòng ngừa nghiện Internet?", "o": ["Bởi vì sóng wifi ở không gian chung luôn mạnh hơn trong phòng ngủ rất nhiều.", "Vì nó giúp bố mẹ dễ dàng quan sát, nhắc nhở và quản lí thời gian sử dụng máy tính của con.", "Vì không gian chung có nhiệt độ mát mẻ hơn, giúp máy tính hoạt động bền bỉ hơn.", "Vì trong phòng riêng không thể kết nối được Internet."], "a": 1, "l": "TH", "e": "Máy ở nơi sinh hoạt chung giúp bố mẹ dễ quan sát, nhắc nhở, quản lí thời gian dùng máy."}, {"n": 86, "bai": 5, "t": "mc", "q": "Vì sao trò chơi trực tuyến dễ gây nghiện hơn việc đọc tin tức trên mạng?", "o": ["Bởi vì các trang web tin tức luôn tự động phát ra những tần số âm thanh gây buồn ngủ cực mạnh thông qua loa máy tính.", "Vì trò chơi trực tuyến không cần kết nối Internet vẫn có thể chơi được với người khác.", "Vì trò chơi được thiết kế với các phần thưởng, mục tiêu liên tục kích thích não bộ người chơi.", "Vì đọc tin tức mất tiền còn trò chơi luôn luôn miễn phí hoàn toàn."], "a": 2, "l": "TH", "e": "Trò chơi có phần thưởng, mục tiêu liên tục kích thích người chơi nên dễ gây nghiện."}, {"n": 87, "bai": 5, "t": "mc", "q": "Mục đích của việc thiết lập giới hạn thời gian sử dụng Internet là gì?", "o": ["Bởi vì việc thiết lập thời gian sẽ khiến cho các máy chủ trên toàn cầu nhận diện được.", "Giúp cân bằng giữa việc sử dụng mạng với các hoạt động học tập, thể thao và nghỉ ngơi.", "Để tiết kiệm tối đa tiền điện cho gia đình hàng tháng.", "Để nhà mạng không cắt kết nối Internet một cách đột ngột."], "a": 1, "l": "TH", "e": "Giới hạn thời gian giúp cân bằng giữa dùng mạng với học tập, thể thao, nghỉ ngơi."}, {"n": 88, "bai": 5, "t": "mc", "q": "Tại sao ý thức của người sử dụng lại là 'công cụ' bảo vệ tốt nhất trên mạng?", "o": ["Vì ý thức giúp tăng cường sóng wifi cho các thiết bị điện tử.", "Bởi vì ý thức con người có khả năng tự động mã hóa mọi dữ liệu tải về máy tính thành những thông tin an toàn tuyệt đối.", "Vì ý thức giúp ta chủ động nhận diện rủi ro và quyết định dừng lại trước những thông tin độc hại.", "Vì ý thức làm cho các trang web xấu tự động biến mất."], "a": 2, "l": "TH", "e": "Ý thức giúp ta chủ động nhận ra rủi ro và dừng lại trước thông tin độc hại."}, {"n": 89, "bai": 5, "t": "mc", "q": "Đang tra cứu tài liệu học tập, máy tính của em hiện lên trang web có hình ảnh phản cảm. Em sẽ làm gì?", "o": ["Bình luận trực tiếp vào trang web đó để mắng những người đã tạo ra nó.", "Đóng trang web lại để gửi cho nhóm bạn thân cùng xem và bàn luận.", "Đóng ngay trang web đó lại và tiếp tục tìm kiếm tài liệu ở những trang uy tín khác.", "Tiếp tục nhấp vào các đường dẫn trong trang web đó để khám phá thêm."], "a": 2, "l": "VD", "e": "Gặp trang web phản cảm phải đóng ngay rồi tiếp tục tìm ở trang uy tín."}, {"n": 90, "bai": 5, "t": "mc", "q": "Một người lạ tự xưng là công an nhắn tin yêu cầu em cung cấp mật khẩu email cá nhân để phục vụ điều tra. Em sẽ xử lí ra sao?", "o": ["Tuyệt đối không cung cấp, chặn liên lạc và báo ngay cho bố mẹ biết sự việc.", "Hỏi lại xem họ là công an ở đồn nào rồi mới cung cấp mật khẩu.", "Thử cung cấp mật khẩu sai xem họ có biết không.", "Lập tức cung cấp ngay toàn bộ tên đăng nhập, mật khẩu, và thậm chí cả số chứng minh nhân dân của bố mẹ."], "a": 0, "l": "VD", "e": "Không cung cấp mật khẩu cho người lạ, chặn liên lạc và báo bố mẹ."}, {"n": 91, "bai": 5, "t": "mc", "q": "Nếu em vô tình biết mật khẩu Facebook của một bạn trong lớp do bạn ấy đăng nhập vào máy tính nhà trường mà quên thoát. Em sẽ làm gì?", "o": ["Ghi lại mật khẩu đó vào sổ tay để khi nào cần mượn tài khoản chơi game thì dùng.", "Lập tức sử dụng tài khoản đó để đăng những dòng trạng thái bôi nhọ danh dự của chính bạn ấy lên các hội nhóm trường học.", "Bảo bạn ấy thoát tài khoản ngay, đồng thời khuyên bạn nên đổi mật khẩu để đảm bảo an toàn.", "Tự ý vào phần tin nhắn của bạn ấy để đọc trộm xem bạn ấy có nói xấu mình không."], "a": 2, "l": "VD", "e": "Nhắc bạn thoát tài khoản và đổi mật khẩu; dùng tài khoản người khác là vi phạm."}, {"n": 92, "bai": 5, "t": "mc", "q": "Em nhận được tin nhắn từ một bạn cùng lớp với lời lẽ chửi bới, xúc phạm. Em sẽ làm gì?", "o": ["Tìm địa chỉ IP của bạn đó rồi công khai thông tin cá nhân của bạn ấy.", "Chụp màn hình tin nhắn đó lại làm bằng chứng và nhờ thầy cô, bố mẹ can thiệp giải quyết.", "Giữ im lặng, xóa tin nhắn và âm thầm chịu đựng vì sợ bạn đó sẽ đánh mình.", "Nhắn tin chửi lại với lời lẽ nặng nề hơn để bạn đó sợ và không dám bắt nạt nữa."], "a": 1, "l": "VD", "e": "Chụp màn hình làm bằng chứng và nhờ thầy cô, bố mẹ giúp đỡ."}, {"n": 93, "bai": 5, "t": "mc", "q": "Thấy một nhóm bạn đang lập nhóm chat để tẩy chay và nói xấu một bạn nữ trong lớp, các bạn có mời em tham gia. Em sẽ phản ứng thế nào?", "o": ["Từ chối tham gia, khuyên các bạn dừng lại và nếu tình hình nghiêm trọng sẽ báo cáo giáo viên chủ nhiệm.", "Đi kể lại toàn bộ câu chuyện với bạn nữ kia để bạn ấy tức giận lên.", "Vui vẻ chấp nhận lời mời và lập tức đóng vai trò là một nhà phân tích tâm lý học nghiệp dư, tích cực thu thập mọi thông tin tiêu cực.", "Tham gia vào nhóm nhưng chỉ đọc chứ không nói gì để thỏa mãn sự tò mò."], "a": 0, "l": "VD", "e": "Từ chối tham gia, khuyên các bạn dừng lại, nghiêm trọng thì báo giáo viên."}, {"n": 94, "bai": 5, "t": "mc", "q": "Khi nhận được một tệp đính kèm (file đính kèm) trong email từ một người em không quen biết, hành động đúng mực nhất là gì?", "o": ["Tuyệt đối không tải xuống hay mở tệp đính kèm đó, xóa email ngay lập tức.", "Lập tức tải tệp tin đó xuống và mở nó ra bằng quyền quản trị viên cao nhất của hệ thống máy tính, bởi vì theo nguyên lý tò mò của con người.", "Chuyển tiếp email đó sang hộp thư của thầy giáo tin học để thầy mở thử.", "Lưu tệp đó vào ổ cứng USB và mang sang quán nét mở để nếu có virus thì chỉ hỏng máy quán nét."], "a": 0, "l": "VD", "e": "Không mở tệp đính kèm từ người lạ vì có thể chứa virus."}, {"n": 95, "bai": 5, "t": "ds", "q": "Nam là học sinh lớp 7, thường xuyên sử dụng Internet để học tập và giao lưu. Em hãy cho biết các nhận định sau đúng hay sai:", "it": [{"t": "Việc dùng mật khẩu của bạn để đăng nhập vào tài khoản mạng xã hội của bạn khi chưa được phép là truy cập không hợp lệ.", "a": true, "l": "NB", "e": "Dùng mật khẩu của bạn khi chưa được phép là truy cập không hợp lệ, vi phạm pháp luật."}, {"t": "Không nên dùng chung mật khẩu tài khoản mạng xã hội với người khác vì thông tin cá nhân có thể bị lộ hoặc bị lợi dụng.", "a": true, "l": "TH", "e": "Không dùng chung mật khẩu để tránh lộ, bị lợi dụng thông tin."}, {"t": "Nam nhận được email của người lạ báo “Bạn trúng thưởng điện thoại phải bấm ngay trong vòng 10 phút là hết hạn” kèm đường link. Nam nên nhấp vào link để xem thử ngay không mất cơ hội, sau đó mới hỏi ý kiến bố mẹ.", "a": false, "l": "VD", "e": "Không bấm link lạ \"trúng thưởng\", phải hỏi người lớn trước."}, {"t": "Nam thấy một nhóm bạn trong lớp lập nhóm chat để nói xấu và tẩy chay một bạn. Để không bị lạc lõng, Nam nên tham gia nhóm đó.", "a": false, "l": "VD", "e": "Tham gia nhóm nói xấu, tẩy chay bạn là tiếp tay cho bắt nạt."}]}, {"n": 96, "bai": 5, "t": "ds", "q": "Mai thường xuyên sử dụng Internet để học tập, giải trí và trò chuyện với bạn bè. Em hãy cho biết các nhận định sau đúng hay sai:", "it": [{"t": "Dành quá nhiều thời gian trên mạng, bỏ bê ăn ngủ và học tập là biểu hiện của bệnh nghiện Internet.", "a": true, "l": "NB", "e": "Bỏ bê ăn ngủ, học tập vì dùng mạng quá nhiều là biểu hiện nghiện Internet."}, {"t": "Giao tiếp qua mạng bằng ngôn ngữ lịch sự, có văn hoá giúp xây dựng môi trường mạng lành mạnh.", "a": true, "l": "TH", "e": "Ngôn ngữ lịch sự, văn hoá giúp môi trường mạng lành mạnh."}, {"t": "Mai vô tình mở trang web có hình ảnh bạo lực. Mai nên chia sẻ trang web đó cho cả lớp cùng xem rồi bình luận.", "a": false, "l": "VD", "e": "Gặp trang web bạo lực phải đóng lại, không chia sẻ."}, {"t": "Mai bị một bạn nhắn tin đe doạ trên mạng. Mai nên giữ bí mật, không nói với ai để tránh rắc rối.", "a": false, "l": "VD", "e": "Bị đe doạ phải báo cho bố mẹ, thầy cô, không giữ bí mật."}]}, {"n": 97, "bai": 5, "t": "ds", "q": "Tuấn là học sinh lớp 7, đang tìm cách sử dụng Internet hợp lí và ứng xử có văn hoá trên mạng. Em hãy cho biết các nhận định sau đúng hay sai:", "it": [{"t": "Chia sẻ thông tin hoặc hình ảnh của người khác khi chưa được phép là hành vi không nên làm khi giao tiếp qua mạng.", "a": true, "l": "NB", "e": "Chia sẻ thông tin, hình ảnh người khác khi chưa được phép là không nên."}, {"t": "Sử dụng Internet quá nhiều có thể làm giảm sức khoẻ và kết quả học tập.", "a": true, "l": "TH", "e": "Dùng Internet quá nhiều giảm sức khoẻ và kết quả học tập."}, {"t": "Nhận được tin nhắn thô tục từ một người lạ, Tuấn nên nhắn lại bằng lời lẽ nặng nề hơn để họ sợ.", "a": false, "l": "VD", "e": "Không đáp trả bằng lời lẽ nặng nề vì sẽ biến mình thành người vi phạm."}, {"t": "Để tránh nghiện Internet, Tuấn nên đặt giờ sử dụng máy hợp lí và dành thời gian chơi thể thao, gặp gỡ bạn bè.", "a": true, "l": "VD", "e": "Đặt giờ hợp lí, chơi thể thao, gặp gỡ bạn bè giúp tránh nghiện Internet."}]}, {"n": 98, "bai": 5, "t": "ds", "q": "Khoa thường xuyên sử dụng Internet để học tập và giải trí. Em hãy cho biết các nhận định sau đúng hay sai:", "it": [{"t": "Dùng mật khẩu mạnh và không tiết lộ cho người khác là cách bảo vệ tài khoản trên mạng.", "a": true, "l": "NB", "e": "Mật khẩu mạnh, không tiết lộ là cách bảo vệ tài khoản."}, {"t": "Người nghiện Internet thường lơ là việc học và ít giao tiếp trực tiếp với người thân, bạn bè.", "a": true, "l": "TH", "e": "Người nghiện Internet thường lơ là học tập, ít giao tiếp với người thân, bạn bè."}, {"t": "Khoa thấy một bạn trong lớp chơi game quá nhiều. Khoa nên động viên bạn tham gia hoạt động thể thao và nhờ thầy cô, cha mẹ hỗ trợ.", "a": true, "l": "VD", "e": "Nên động viên bạn chơi thể thao và nhờ thầy cô, cha mẹ hỗ trợ."}, {"t": "Khoa dùng tài khoản của người khác để bình luận xúc phạm một bạn trong lớp vì nghĩ không ai biết. Việc này không vi phạm quy tắc ứng xử trên mạng.", "a": false, "l": "VD", "e": "Dùng tài khoản người khác để xúc phạm bạn là vi phạm quy tắc ứng xử và pháp luật."}]}],BAI={"1": "Bài 1. Thiết bị vào – ra", "2": "Bài 2. Phần mềm máy tính", "3": "Bài 3. Quản lí dữ liệu trong máy tính", "4": "Bài 4. Mạng xã hội và một số kênh trao đổi thông tin trên Internet", "5": "Bài 5. Ứng xử trên mạng"};let total=0,done=0,right=0;const main=document.getElementById('main'),side=document.getElementById('toc');
function el(h){const d=document.createElement('div');d.innerHTML=h;return d.firstChild}
function upd(ok){done++;if(ok)right++;document.getElementById('pg').style.width=done/total*100+'%';document.getElementById('sc').textContent=right+'/'+done+' đúng'}
let cur=0,sec=null;
D.forEach(q=>{
 if(q.bai!=cur){cur=q.bai;sec=el('<section class="card" id="b'+cur+'"><h2 class="bai">'+BAI[cur]+'</h2></section>');main.appendChild(sec);side.insertAdjacentHTML('beforeend','<a href="#b'+cur+'">'+BAI[cur].split('. ')[0]+' – '+BAI[cur].split('. ')[1].slice(0,26)+'…</a>')}
 const box=el('<div class="q" id="c'+q.n+'"></div>');
 if(q.t=='mc'){
  total++;
  box.innerHTML='<div class="qt"><span class="n">Câu '+q.n+'</span>'+q.q+'<span class="lv">'+q.l+'</span></div>'+(q.img?'<img class="fig" src="'+q.img+'">':'')+'<div class="os"></div><div class="ex"></div>';
  const os=box.querySelector('.os'),ex=box.querySelector('.ex');
  q.o.forEach((t,i)=>{const b=el('<button class="opt"><b>'+'ABCD'[i]+'.</b></button>');b.append(t);b.onclick=()=>{
    os.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j==q.a)x.classList.add('ok')});
    const ok=i==q.a;if(!ok)b.classList.add('no');
    ex.className='ex show '+(ok?'g':'r');ex.innerHTML=(ok?'✅ <b>Chính xác!</b> ':'❌ <b>Chưa đúng.</b> Đáp án đúng là <b>'+'ABCD'[q.a]+'</b>. ')+'<br>💡 '+q.e;upd(ok)};os.appendChild(b)})
 }else{
  box.innerHTML='<div class="qt"><span class="n">Câu '+q.n+'</span>'+q.q+'</div>';
  q.it.forEach((it,k)=>{total++;
   const r=el('<div class="ds"><div>'+'abcd'[k]+') '+it.t+'<span class="lv">'+it.l+'</span></div><div class="row"><button class="opt">Đúng</button><button class="opt">Sai</button></div><div class="ex"></div></div>');
   const bs=r.querySelectorAll('button'),ex=r.querySelector('.ex');
   bs.forEach((b,v)=>b.onclick=()=>{const ans=v==0;bs.forEach((x,j)=>{x.disabled=true;if((j==0)==it.a)x.classList.add('ok')});const ok=ans==it.a;if(!ok)b.classList.add('no');
     ex.className='ex show '+(ok?'g':'r');ex.innerHTML=(ok?'✅ <b>Chính xác!</b> ':'❌ <b>Chưa đúng.</b> ')+'Ý này <b>'+(it.a?'ĐÚNG':'SAI')+'</b>.<br>💡 '+it.e;upd(ok)});
   box.appendChild(r)})
 }
 sec.appendChild(box)});
document.getElementById('tot').textContent=total;
