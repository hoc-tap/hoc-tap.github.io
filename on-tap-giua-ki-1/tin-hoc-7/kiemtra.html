<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kiểm tra thử Tin học 7</title><style>
:root{--bg:#f4f8ff;--card:#fff;--ink:#1e293b;--mut:#64748b;--pri:#2563eb;--pri2:#7c3aed;--ok:#16a34a;--okb:#dcfce7;--bad:#dc2626;--badb:#fee2e2;--warn:#b45309;--warnb:#fef3c7;--line:#e2e8f0}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#eef4ff,#f8fbff 40%,#fdf6ff);color:var(--ink);line-height:1.6;font-size:16px}
.nav{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;box-shadow:0 2px 12px #2563eb40;flex-wrap:wrap}
.nav b{font-size:1.05rem}.nav .sp{flex:1}.nav a{color:#fff;text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:600;font-size:.92rem;transition:.2s}
.nav a:hover{background:#ffffff33}.nav a.on{background:#fff;color:var(--pri)}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border-radius:16px;box-shadow:0 4px 18px #1e3a8a14;padding:18px 20px;margin:16px 0;animation:up .45s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2.bai{margin:0 0 8px;color:var(--pri);font-size:1.3rem}
.btn{border:0;border-radius:12px;padding:10px 20px;font-size:1rem;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--pri),var(--pri2));cursor:pointer;transition:.15s;box-shadow:0 4px 12px #2563eb40}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}.btn.gray{background:#64748b;box-shadow:none}
@media(max-width:600px){.nav{padding:8px 10px;gap:6px}.nav b{font-size:.95rem;width:100%}.card{padding:14px}}

body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input{-webkit-user-select:text;user-select:text}
@media print{body{display:none!important}}
.top{position:sticky;top:0;z-index:60;background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;display:none;align-items:center;gap:10px;padding:8px 14px;font-size:.88rem;white-space:nowrap;box-shadow:0 2px 12px #2563eb50}
.top b.l{font-size:1rem;letter-spacing:.5px}.top .t{flex:1;overflow:hidden;text-overflow:ellipsis;text-align:center}.top .u{overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.clock{background:#fff;color:#1e3a8a;border-radius:999px;padding:3px 12px;font-weight:800;font-variant-numeric:tabular-nums}.clock.low{background:#dc2626;color:#fff;animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.08)}}
.start{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:#fff;border-radius:22px;box-shadow:0 10px 40px #2563eb30;padding:28px;max-width:420px;width:100%;text-align:center;animation:up .6s both}
.box h1{margin:4px 0;color:#1e3a8a;font-size:1.5rem}.box .sub{color:var(--mut);margin-bottom:14px}.box .logo{font-size:3rem;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px) rotate(6deg)}}
.box input{width:100%;padding:12px 14px;margin:8px 0;border:2px solid #c7d7fe;border-radius:12px;font-size:1rem;outline:0;transition:.2s}.box input:focus{border-color:var(--pri);box-shadow:0 0 0 4px #2563eb22}
.box .btn{width:100%;margin-top:8px;font-size:1.1rem}.info{font-size:.85rem;color:var(--mut);margin-top:12px}
.lay{display:none;max-width:1100px;margin:0 auto;padding:14px;gap:18px;align-items:flex-start}
.qs{flex:1;min-width:0}.panel{z-index:40;width:270px;position:sticky;background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px #1e3a8a1a}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.grid a{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:#eef2ff;color:#3730a3;font-weight:700;font-size:.85rem;text-decoration:none;cursor:pointer;transition:.15s;flex:0 0 auto}
.grid a.d{background:#22c55e;color:#fff}.grid a.s{background:#ef4444;color:#fff;animation:pl .6s 2}
.part{font-weight:800;color:#7c3aed;margin:16px 0 4px;font-size:1.05rem}
.q{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;transition:.3s;animation:up .4s both}.q.s{background:#fee2e2;border-color:#f87171}
.q .n{background:var(--pri);color:#fff;border-radius:8px;padding:1px 9px;margin-right:6px;font-size:.9rem;font-weight:700}.q .qt{font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 12px;border:2px solid var(--line);background:#fff;border-radius:12px;font-size:1rem;cursor:pointer;transition:.15s;font-family:inherit}.opt:hover{border-color:var(--pri);background:#f0f6ff}
.opt.sel{background:#dbeafe;border-color:var(--pri);transform:scale(1.01)}.opt b{color:var(--pri);margin-right:6px}
.ds{border-top:1px dashed var(--line);padding:8px 0}.ds .row{display:flex;gap:8px;margin-top:6px}.ds .row .opt{width:100px;margin:0;text-align:center}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--badb);border-color:var(--bad)}.opt.sel.no{background:var(--badb)}
.ex{margin-top:8px;padding:8px 12px;border-radius:10px;background:#eff6ff;border-left:5px solid var(--pri);font-size:.93rem}.ex.g{background:var(--okb);border-color:var(--ok)}.ex.r{background:var(--badb);border-color:var(--bad)}
img.fig{max-width:100%;border-radius:10px;border:1px solid var(--line);margin:8px 0}
.mask{position:fixed;inset:0;background:#0f172acc;z-index:100;display:none;place-items:center;padding:16px}.mask.on{display:grid}
.dlg{background:#fff;border-radius:18px;padding:22px;max-width:440px;width:100%;text-align:center;animation:up .3s}.dlg h3{margin:0 0 8px;font-size:1.25rem}.dlg .bs{display:flex;gap:10px;margin-top:14px}.dlg .bs .btn{flex:1}
.dlg.w{border:4px solid #dc2626}.dlg.w h3{color:#dc2626}
.res{display:none;max-width:900px;margin:0 auto;padding:14px}.score{text-align:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 30px #2563eb40}
.score .big{font-size:4rem;font-weight:900;line-height:1}.score small{display:block;opacity:.9}.chip{display:inline-block;margin-top:10px;background:#ffffff30;border-radius:999px;padding:4px 14px;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#dc2626;color:#fff;padding:10px 18px;border-radius:12px;z-index:120;display:none;font-weight:600;max-width:90vw;text-align:center}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:110}
.det{font-family:monospace;font-size:.8rem;background:#f1f5f9;border-radius:10px;padding:10px;word-break:break-all;margin:10px 0;user-select:text}
#sb{margin-top:8px;width:100%}
@media(max-width:860px){.panel{box-shadow:0 6px 12px #1e3a8a22}#sb{width:auto;margin:0;white-space:nowrap}.grid{min-width:0}.lay{display:none;flex-direction:column;padding:8px}.panel{width:100%;order:-1;padding:8px 10px;border-radius:0 0 14px 14px;margin:0 -8px;width:calc(100% + 16px);display:flex;align-items:center;gap:8px}
.panel h4,.panel .pc{display:none}.grid{flex-wrap:nowrap;overflow-x:auto;margin:0;flex:1;padding:2px}.grid a{width:30px;height:30px}.panel .btn{padding:8px 12px;font-size:.9rem;flex:0 0 auto}.top{font-size:.75rem;gap:6px;padding:7px 8px}.top .u{max-width:26vw}}
</style></head><body>
<div class="start" id="st"><div class="box"><div class="logo">🎓</div><h1>NGUYỄN DU EDU</h1><div class="sub">Kiểm tra thử • Tin học 7 • 45 phút</div>
<input id="ten" placeholder="Họ và tên" autocomplete="off"><input id="lop" placeholder="Lớp (ví dụ: 7A)" autocomplete="off">
<button class="btn" id="go">🚀 Bắt đầu làm bài</button><div class="info">24 câu trắc nghiệm + 4 câu đúng/sai • Tối đa 10 điểm</div></div></div>
<div class="top" id="tp"><b class="l">NGUYỄN DU EDU</b><span class="t">Kiểm tra thử</span><span class="u" id="nu"></span><span class="clock" id="ck">45:00</span></div>
<div class="lay" id="ly"><div class="qs" id="qs"></div><aside class="panel" id="pn"><h4 style="margin:0;color:#2563eb">📋 Bảng câu hỏi</h4><div class="grid" id="gr"></div><div class="pc" style="font-size:.85rem;color:#64748b">Xanh: đã làm • Đỏ: bỏ sót</div><button class="btn" id="sb">📤 Nộp bài</button></aside></div>
<div class="res" id="rs"></div>
<div class="mask" id="mk"><div class="dlg" id="dl"></div></div><div class="toast" id="ts"></div><canvas id="cf"></canvas>

document.addEventListener('contextmenu',e=>e.preventDefault());['copy','cut','paste','dragstart','selectstart'].forEach(k=>document.addEventListener(k,e=>{if(!/INPUT/.test(e.target.tagName))e.preventDefault()}));
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.key=='F12'||(e.ctrlKey&&['u','s','p','c','a'].includes(k)&&!/INPUT/.test(e.target.tagName))||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))){e.preventDefault();return false}});
setInterval(()=>{if(over||!tStart||innerWidth<900)return;const o=(outerWidth-innerWidth>200)||(outerHeight-innerHeight>260);document.body.style.filter=o?'blur(14px)':'';if(o&&!window._w){window._w=1;leaves++;toast('Không được mở công cụ nhà phát triển!');setTimeout(()=>window._w=0,5000)}},1000);
let away=false;function leave(){if(!tStart||over||away)return;away=true;leaves++}function back(){if(away){away=false;toast('⚠️ Bạn đã rời màn hình bài thi '+leaves+' lần. Việc này được ghi lại!')}}
document.addEventListener('visibilitychange',()=>document.hidden?leave():back());addEventListener('blur',leave);addEventListener('focus',back);
addEventListener('beforeunload',e=>{if(tStart&&!over){e.preventDefault();e.returnValue=''}});
// ---- bắt đầu ----
$('go').onclick=async()=>{ten=$('ten').value.trim();lop=$('lop').value.trim();if(!ten||!lop){toast('Vui lòng nhập đủ Họ tên và Lớp');return}
 $('go').disabled=true;await sync();const P=dec();const mc=shuf(P.filter(q=>q.t=='mc')).slice(0,24),ds=shuf(P.filter(q=>q.t=='ds')).slice(0,4);
 U=[];mc.forEach((q,i)=>U.push({k:'mc',no:i+1,q}));ds.forEach((q,i)=>U.push({k:'ds',no:25+i,q}));
 maDe='7'+pad(Math.floor(Math.random()*1000)).padStart(3,'0');tStart=Date.now()+off;t0=performance.now();
 $('st').style.display='none';$('tp').style.display='flex';$('ly').style.display='flex';$('nu').textContent=ten+' • '+lop;$('pn').style.top=($('tp').offsetHeight+8)+'px';build();tick=setInterval(clock,500);clock();scrollTo(0,0)};
function clock(){const r=Math.max(0,DUR-(performance.now()-t0)/1000);$('ck').textContent=pad(Math.floor(r/60))+':'+pad(Math.floor(r%60));$('ck').classList.toggle('low',r<300);if(r<=0&&!over){finish(true)}}
function build(){let h='<div class="part">PHẦN I. Trắc nghiệm nhiều lựa chọn (mỗi câu 0,25 điểm)</div>';
 U.forEach((u,i)=>{if(u.k=='ds'&&u.no==25)h+='<div class="part">PHẦN II. Đúng/Sai (mỗi ý 0,25 điểm)</div>';
  h+='<div class="q" id="q'+i+'"><div class="qt"><span class="n">Câu '+u.no+'</span>'+u.q.q+'</div>';
  if(u.k=='mc'){if(u.q.img)h+='<img class="fig" src="'+u.q.img+'">';u.q.o.forEach((t,j)=>h+='<button class="opt" data-i="'+i+'" data-j="'+j+'"><b>'+'ABCD'[j]+'.</b>'+t+'</button>')}
  else u.q.it.forEach((it,k)=>h+='<div class="ds"><div>'+'abcd'[k]+') '+it.t+'</div><div class="row"><button class="opt" data-i="'+i+'" data-j="'+k+'" data-v="1">Đúng</button><button class="opt" data-i="'+i+'" data-j="'+k+'" data-v="0">Sai</button></div></div>');
  h+='</div>'});$('qs').innerHTML=h;
 $('gr').innerHTML=U.map((u,i)=>'<a id="g'+i+'" data-i="'+i+'">'+u.no+'</a>').join('');
 $('qs').onclick=e=>{const b=e.target.closest('.opt');if(!b||over)return;const i=+b.dataset.i,j=+b.dataset.j;
  if(U[i].k=='mc'){A[i]=j;document.querySelectorAll('#q'+i+' .opt').forEach(x=>x.classList.toggle('sel',+x.dataset.j==j))}
  else{A[i]=A[i]||{};A[i][j]=b.dataset.v=='1';b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))}refresh(i)};
 $('gr').onclick=e=>{const a=e.target.closest('a');if(a)$('q'+a.dataset.i).scrollIntoView({behavior:'smooth',block:'center'})};$('sb').onclick=submit}
const full=i=>U[i].k=='mc'?A[i]!==undefined:(A[i]&&Object.keys(A[i]).length==4);
function refresh(last){let mx=-1;U.forEach((u,i)=>{if(A[i]!==undefined)mx=Math.max(mx,i)});
 U.forEach((u,i)=>{const f=full(i),s=!f&&i<mx;$('q'+i).classList.toggle('s',s);$('g'+i).className=f?'d':(s?'s':'')})}
// ---- nộp bài ----
function unans(){const r=[];U.forEach((u,i)=>{if(!full(i))r.push(i)});return r}
function submit(){if(over)return;const el=(performance.now()-t0)/1000;
 if(el<MIN){modal('<h3>⛔ CẢNH BÁO NGHIÊM TRỌNG</h3><p>Em mới làm bài được <b>'+Math.floor(el/60)+' phút '+Math.floor(el%60)+' giây</b>. Thời gian tối thiểu là <b>3 phút</b>.</p><p>Làm bài quá nhanh như vậy là <b>không nghiêm túc</b> và có dấu hiệu gian lận. Em <b>KHÔNG ĐƯỢC NỘP BÀI</b>, hãy quay lại đọc kỹ từng câu và làm bài cẩn thận!</p><div class="bs"><button class="btn" id="bk">Quay lại làm bài</button></div>',1);$('bk').onclick=close;return}
 const u=unans();let h;
 if(u.length){h='<h3>⚠️ Em còn '+u.length+' câu chưa làm</h3><p>Câu: <b>'+u.map(i=>U[i].no).join(', ')+'</b></p><p>Em có muốn quay lại làm tiếp không?</p><div class="bs"><button class="btn" id="bk">Làm tiếp</button><button class="btn gray" id="ok">Vẫn nộp</button></div>'}
 else h='<h3>📤 Nộp bài?</h3><p>Em đã làm đủ tất cả các câu. Xác nhận nộp bài?</p><div class="bs"><button class="btn gray" id="bk">Xem lại</button><button class="btn" id="ok">Nộp bài</button></div>';
 modal(h);$('bk').onclick=()=>{close();if(u.length)$('q'+u[0]).scrollIntoView({behavior:'smooth',block:'center'})};$('ok').onclick=()=>{close();finish(false)}}
function finish(auto){if(over)return;over=true;clearInterval(tick);document.body.style.filter='';close();
 const sec=Math.round((performance.now()-t0)/1000);let nm=0,nd=0,det=[],dd=[],rv='';
 U.forEach((u,i)=>{const q=u.q;rv+='<div class="q" style="animation:none"><div class="qt"><span class="n">Câu '+u.no+'</span>'+q.q+'</div>';
  if(u.k=='mc'){const ok=A[i]===q.a;if(ok)nm++;det.push(u.no+(ok?'v':'x'));if(q.img)rv+='<img class="fig" src="'+q.img+'">';
   q.o.forEach((t,j)=>rv+='<div class="opt'+(j==q.a?' ok':(j===A[i]?' no':''))+(j===A[i]?' sel':'')+'"><b>'+'ABCD'[j]+'.</b>'+t+(j===A[i]?' ← em chọn':'')+'</div>');
   rv+='<div class="ex '+(ok?'g':'r')+'">'+(ok?'✅ Đúng. ':(A[i]===undefined?'❌ Em chưa làm. ':'❌ Sai. ')+'Đáp án: <b>'+'ABCD'[q.a]+'</b>. ')+'<br>💡 '+q.e+'</div>'}
  else q.it.forEach((it,k)=>{const v=A[i]&&A[i][k],ok=v===it.a;if(ok)nd++;dd.push(u.no+'abcd'[k]+(ok?'v':'x'));
   rv+='<div class="ds"><div>'+'abcd'[k]+') '+it.t+'</div><div class="ex '+(ok?'g':'r')+'">'+(ok?'✅ Đúng. ':(v===undefined?'❌ Chưa làm. ':'❌ Sai. '))+'Ý này <b>'+(it.a?'ĐÚNG':'SAI')+'</b>. Em chọn: '+(v===undefined?'—':(v?'Đúng':'Sai'))+'<br>💡 '+it.e+'</div></div>'});
  rv+='</div>'});
 const dm=nm*0.25,dds=nd*0.25,tot=dm+dds,chi='NLC:'+det.join(',')+' Đ/S:'+dd.join(',');
 const f=n=>String(n).replace('.',',');
 $('tp').querySelector('.t').textContent='Đã nộp bài';$('ck').textContent='Xong';$('ck').classList.remove('low');$('ly').style.display='none';
 $('rs').style.display='block';
 $('rs').innerHTML='<div class="score"><div style="font-size:1.1rem">'+ten+' • '+lop+' • Mã đề '+maDe+'</div><div class="big">'+f(tot)+'</div><small>/ 10 điểm</small><div class="chip">NLC: '+nm+'/24 câu đúng ('+f(dm)+'đ)</div> <div class="chip">Đ/S: '+nd+'/16 ý đúng ('+f(dds)+'đ)</div> <div class="chip">Thời gian: '+pad(Math.floor(sec/60))+':'+pad(sec%60)+'</div>'+(auto?'<div class="chip">⏰ Hết giờ, hệ thống tự nộp</div>':'')+'</div><div id="sv" class="card" style="text-align:center;margin-top:14px">⏳ Đang gửi bài lên hệ thống...</div><div class="card"><b>Chi tiết bài làm</b><div class="det">'+chi+'</div></div><h3>📖 Xem lại bài làm và hướng dẫn từng câu</h3>'+rv+'<p style="text-align:center"><a class="btn" style="text-decoration:none;display:inline-block" href="tracnghiem.html">Ôn thêm trắc nghiệm</a></p>';
 scrollTo(0,0);if(tot>=8)confetti();
 lastP={soBaoDanh:'',hoTen:ten,lop:lop,maDe:maDe,kyKiemTra:'Kiểm tra thử',soCauNLC:nm,diemNLC:dm,soYDS:nd,diemDS:dds,tongDiem:tot,thoiGianBatDau:vn(tStart),thoiGianLamBai:pad(Math.floor(sec/60))+':'+pad(sec%60),soLanThoat:leaves,computerName:(navigator.platform||'')+' | '+innerWidth+'x'+innerHeight+' | '+navigator.userAgent.slice(0,80),ip:ip,chiTietBaiLam:chi};send()}
async function send(){const s=$('sv');s.textContent='⏳ Đang gửi bài lên hệ thống...';
 for(let i=0;i<3;i++){try{await fetch(URL_,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(lastP)});s.innerHTML='✅ <b>Bài làm đã được gửi lên hệ thống.</b>';return}catch(e){await new Promise(r=>setTimeout(r,1200))}}
 s.innerHTML='⚠️ <b>Chưa gửi được bài (mất mạng?).</b> Em đừng đóng trang, hãy bật mạng rồi bấm: <br><br><button class="btn" id="rt">Gửi lại</button>';$('rt').onclick=send}
function confetti(){const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*5,vy:2+Math.random()*4,vx:-1+Math.random()*2,c:'hsl('+Math.random()*360+',90%,55%)'}));let n=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++n<220)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
})();
</script></body></html>
