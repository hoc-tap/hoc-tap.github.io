<style>
:root{--bg:#f4f7fc;--surface:#fff;--ink:#17233b;--muted:#5a6b88;--line:#dde5f2;--blue:#2457c5;--blue-soft:#e8effc;--ok:#0b8f55;--ok-soft:#e2f6ea;--bad:#d03a3a;--bad-soft:#fdeaea;--amber:#e59a00;--amber-soft:#fff7e0;--nav:64px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav) + 16px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.top{position:fixed;inset:0 0 auto 0;height:var(--nav);z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 max(16px,calc((100% - 1120px)/2))}
.brand{font-weight:700;font-size:1.05rem;color:var(--ink);text-decoration:none}.brand i{font-style:normal;color:var(--blue)}
.links{display:flex;gap:6px}
.links a{padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.92rem;color:var(--blue);background:var(--blue-soft)}
.links a:hover{background:var(--blue);color:#fff}
.bar{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--blue)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.q{margin:0 0 10px;font-weight:600}.q span{color:var(--blue)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft)}
.opt b{flex:0 0 1.5em;color:var(--blue)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok b{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad b{color:var(--bad)}
.fb{display:none;margin-top:10px;padding:10px 14px;border-radius:10px;border-left:6px solid var(--amber);background:var(--amber-soft);font-size:.96rem}
.fb.show{display:block}.fb strong{display:block;margin-bottom:2px}
.fb.good{border-left-color:var(--ok)}.fb.wrong{border-left-color:var(--bad)}
.tf{border:1px solid var(--line);border-radius:10px;margin-top:8px;padding:10px 12px}
.tf p{margin:0 0 8px}
.yn{display:flex;gap:8px}
.yn button{padding:6px 18px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-weight:600;cursor:pointer}
.yn button:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft)}
.yn button:disabled{cursor:default}.yn .ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}.yn .bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.ex{margin:0 0 10px}.sheet{border-collapse:collapse;font-size:.9rem;min-width:520px}.sheet th{background:#eef2f9;color:#5a6b88;font-weight:600}.sheet td,.sheet th{border:1px solid #c9d4e6;padding:5px 10px;text-align:center}.sheet td.b{background:#e8effc;font-weight:600}.sheet td.t{background:#fff7e0;font-weight:700}
a:focus-visible,button:focus-visible{outline:3px solid #7aa2f7;outline-offset:2px}
@media(max-width:900px){
 .wrap{grid-template-columns:1fr;gap:12px}
 .toc,main{grid-column:auto;grid-row:auto}
 .toc{position:sticky;top:var(--nav);z-index:40;flex-direction:row;align-items:center;overflow-x:auto;border-radius:0 0 12px 12px;margin:0 -16px;padding:8px 12px;gap:6px}
 .toc h4,.score button{display:none}.toc a{flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;padding:4px 10px}.toc a small{display:none}.toc a.on{border-bottom-color:var(--blue)}
 .score{margin:0 0 0 auto;padding:4px 10px;white-space:nowrap;flex:0 0 auto}
 html{scroll-padding-top:calc(var(--nav) + 64px)}}
@media(max-width:520px){.brand{font-size:.9rem;line-height:1.2}.links a{padding:7px 10px;font-size:.82rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

<header class="hero"><h1>Tin học 8 – Trắc nghiệm ôn tập giữa học kì 1</h1><p>Chọn đáp án để xem kết quả và hướng dẫn trả lời ngay. Có thể làm lại bất cứ lúc nào.</p></header>

<script>
var DATA=[{"b": 1, "t": "Lược sử công cụ tính toán", "q": [{"n": 1, "q": "Công cụ tính toán sớm nhất mà con người sử dụng là gì?", "o": ["Máy tính cơ khí", "Thẻ đục lỗ", "Bàn tính", "Máy vi tính"], "a": 2, "e": "Bàn tính (hơn 2000 năm TCN) là công cụ tính toán sớm nhất của loài người."}, {"n": 2, "q": "Chiếc máy tính cơ khí đầu tiên ra đời vào năm nào?", "o": ["1833", "1945", "1642", "1944"], "a": 2, "e": "Pascaline ra đời năm 1642, là máy tính cơ khí đầu tiên. Nhớ: 1642 – Pascal, 1833 – Babbage."}, {"n": 3, "q": "Ai là người chế tạo ra chiếc máy tính cơ khí Pascaline?", "o": ["Charles Babbage", "John Von Neumann", "Howard Aiken", "Blaise Pascal"], "a": 3, "e": "Blaise Pascal chế tạo Pascaline (1642). Charles Babbage là tác giả máy đa năng (1833)."}, {"n": 4, "q": "Pascaline được chế tạo để giúp đỡ công việc gì?", "o": ["Tính thuế", "Dự báo thời tiết", "Dịch thuật", "Phân tích dữ liệu"], "a": 0, "e": "Pascal chế tạo Pascaline để giúp cha mình tính thuế."}, {"n": 5, "q": "Charles Babbage bắt đầu dự án máy tính của mình vào năm nào?", "o": ["1833", "1642", "1944", "1945"], "a": 0, "e": "Babbage bắt đầu dự án máy tính đa năng, tự động năm 1833."}, {"n": 6, "q": "Theo cấu trúc Von Neumann, máy tính gồm bộ xử lí (CPU), thiết bị vào – ra, đường truyền và thành phần nào sau đây?", "o": ["Bộ nhớ", "Bàn phím", "Chuột", "Màn hình"], "a": 0, "e": "Cấu trúc Von Neumann gồm: bộ xử lí (CPU), bộ nhớ, thiết bị vào – ra và đường truyền."}, {"n": 7, "q": "Máy tính điện tử thế hệ thứ nhất ra đời trong khoảng thời gian nào?", "o": ["1945 - 1955", "1955 - 1965", "1965 - 1974", "1974 - 1990"], "a": 0, "e": "Thế hệ 1: 1945–1955; thế hệ 2: 1955–1965; thế hệ 3: 1965–1974; thế hệ 4: 1974–1990; thế hệ 5: từ 1990."}, {"n": 8, "q": "Linh kiện điện tử chính của máy tính thế hệ thứ nhất là gì?", "o": ["Bóng bán dẫn", "Đèn điện tử chân không", "Mạch tích hợp", "Vi xử lí"], "a": 1, "e": "Thế hệ 1 dùng đèn điện tử chân không; bóng bán dẫn là thế hệ 2, IC là thế hệ 3."}, {"n": 9, "q": "Thiết bị vào - ra của máy tính thế hệ thứ nhất là gì?", "o": ["Bàn phím và chuột", "Máy đọc và in băng đục lỗ", "Màn hình cảm ứng", "Máy quét"], "a": 1, "e": "Thế hệ 1 nhập/xuất dữ liệu bằng máy đọc và máy in thẻ, băng đục lỗ."}, {"n": 10, "q": "Máy tính thế hệ thứ tư sử dụng thành phần điện tử chính là gì?", "o": ["Bóng bán dẫn", "Mạch tích hợp IC", "Đèn điện tử", "Mạch tích hợp cỡ rất lớn (VLSI)"], "a": 3, "e": "Thế hệ 4 dùng mạch tích hợp cỡ rất lớn (VLSI) → vi xử lí. Dễ nhầm với ULSI của thế hệ 5."}, {"n": 11, "q": "Thành phần điện tử chính của máy tính thế hệ thứ năm là gì?", "o": ["Bóng bán dẫn", "Mạch tích hợp cỡ lớn", "Mạch tích hợp cỡ siêu lớn (ULSI)", "Đèn chân không"], "a": 2, "e": "Thế hệ 5 dùng mạch tích hợp cỡ siêu lớn (ULSI)."}, {"n": 12, "q": "Máy tính thế hệ thứ năm có đặc điểm nổi bật nào sau đây?", "o": ["Chỉ thực hiện được các phép tính cộng, trừ.", "Chỉ nhận lệnh từ thẻ đục lỗ.", "Tích hợp khả năng cảm nhận, suy luận (trí tuệ nhân tạo).", "Không có khả năng lưu trữ dữ liệu."], "a": 2, "e": "Thế hệ 5 tích hợp khả năng cảm nhận, suy luận giống con người (trí tuệ nhân tạo – AI)."}, {"n": 13, "q": "Trong lĩnh vực y tế, máy tính mang lại lợi ích gì?", "o": ["Hỗ trợ phóng phi thuyền", "Theo dõi sức khỏe thường xuyên", "Giao dịch tài chính", "Điều khiển đèn giao thông"], "a": 1, "e": "Trong y tế, thiết bị thông minh giúp theo dõi sức khoẻ thường xuyên; AI hỗ trợ chẩn đoán sớm."}, {"n": 14, "q": "Lí do chính khiến máy tính thế hệ thứ nhất có kích thước khổng lồ là gì?", "o": ["Do sử dụng đèn điện tử chân không có kích thước lớn và phải ghép nối hàng nghìn bóng với nhau.", "Do việc sản xuất vi mạch lúc đó đòi hỏi vỏ bọc bảo vệ siêu lớn để tránh phóng xạ.", "Do hệ thống tản nhiệt bằng chất lỏng chiếm phần lớn không gian căn phòng.", "Do bộ nhớ RAM thời đó được làm từ các ống thủy tinh dài hàng chục mét chứa khí hiếm."], "a": 0, "e": "Đèn điện tử chân không kích thước lớn, phải ghép nối hàng nghìn bóng nên máy to cỡ cả căn phòng, tốn điện."}, {"n": 15, "q": "Yếu tố nào giúp máy tính thế hệ thứ hai nhỏ gọn và tiêu thụ ít điện năng hơn máy tính thế hệ thứ nhất?", "o": ["Sự ra đời của bóng bán dẫn thay thế đèn điện tử chân không.", "Việc tích hợp hàng triệu linh kiện lên một vi mạch xử lí.", "Việc loại bỏ hoàn toàn bộ nhớ lưu trữ.", "Sự xuất hiện của màn hình cảm ứng thay cho thẻ đục lỗ."], "a": 0, "e": "Bóng bán dẫn (transistor) nhỏ, ít toả nhiệt nên thay được đèn chân không → máy nhỏ gọn, tiết kiệm điện."}, {"n": 16, "q": "Sự thay đổi nào từ thế hệ 2 sang thế hệ 3 đã làm giảm đáng kể giá thành máy tính?", "o": ["Việc sản xuất hàng loạt các thẻ đục lỗ bằng vật liệu tái chế.", "Việc tích hợp nhiều linh kiện bán dẫn thành một khối nguyên duy nhất gọi là IC.", "Việc phát minh ra ngôn ngữ lập trình trí tuệ nhân tạo đa ngôn ngữ có thể tự viết mã nguồn.", "Việc thay thế điện lưới bằng hệ thống năng lượng mặt trời công suất cao nhỏ gọn."], "a": 1, "e": "IC tích hợp nhiều linh kiện bán dẫn trong một khối, không phải hàn từng bóng rời → giảm kích thước và giá thành."}, {"n": 17, "q": "Chức năng của “bộ nhớ” trong kiến trúc Von Neumann là gì?", "o": ["Chỉ dùng để hiển thị dữ liệu ra màn hình.", "Lưu trữ cả dữ liệu tính toán và các lệnh của chương trình.", "Làm chức năng tản nhiệt cho hệ thống máy tính làm việc quá tải trong thời gian dài.", "Là nơi duy nhất tiếp nhận tín hiệu trực tiếp từ người dùng thông qua bàn phím cơ."], "a": 1, "e": "Theo Von Neumann, chương trình và dữ liệu đều được lưu trong bộ nhớ; CPU tự lấy lệnh ra thực hiện."}, {"n": 18, "q": "Việc camera an ninh tự động phát hiện hành vi vi phạm pháp luật thể hiện điều gì?", "o": ["Sức mạnh cơ khí của máy móc.", "Sự chính xác tuyệt đối của công nghệ ghi hình bằng băng từ.", "Việc máy tính tự đưa ra hình phạt ngay tại hiện trường.", "Khả năng nhận dạng hình ảnh và phân tích của trí tuệ nhân tạo ở máy tính thế hệ thứ năm."], "a": 3, "e": "Camera tự động nhận dạng, phân tích hình ảnh là khả năng của trí tuệ nhân tạo (thế hệ 5)."}, {"n": 19, "q": "Hệ thống ghi số thập phân sử dụng bao nhiêu chữ số cơ bản?", "o": ["2 chữ số", "8 chữ số", "10 chữ số", "16 chữ số"], "a": 2, "e": "Hệ ghi số thập phân dùng 10 chữ số cơ bản (từ 0 đến 9)."}, {"n": 20, "q": "Nguyên lí thiết kế của Babbage giống với loại máy nào ngày nay?", "o": ["Máy cơ khí", "Máy đánh chữ", "Điện thoại bàn", "Máy tính đa năng"], "a": 3, "e": "Máy của Babbage có nguyên lí thiết kế giống máy tính đa năng ngày nay."}, {"n": 21, "q": "Máy tính thế hệ thứ năm được phát triển từ năm nào?", "o": ["1974", "1980", "1990", "2000"], "a": 2, "e": "Máy tính thế hệ 5 phát triển từ năm 1990 đến nay."}, {"n": 22, "q": "Trong lĩnh vực kinh tế, máy tính giúp ích như thế nào?", "o": ["Theo dõi tội phạm", "Chữa bệnh tự động", "Lái xe tăng tự động", "Giao dịch tăng tốc độ và đa dạng hóa dịch vụ"], "a": 3, "e": "Trong kinh tế, máy tính giúp giao dịch nhanh chóng, đa dạng hoá dịch vụ (ví dụ thanh toán bằng mã QR)."}, {"n": 23, "q": "Mạng LAN xuất hiện từ thế hệ máy tính nào và có vai trò gì?", "o": ["Thế hệ thứ tư, kết nối nhiều máy tính với nhau thành một nhóm để chia sẻ tài nguyên.", "Thế hệ thứ nhất, để nối các bóng đèn điện tử.", "Thế hệ thứ hai, để điều khiển các máy dệt tự động.", "Thế hệ thứ năm, để phát sóng siêu âm ra toàn vũ trụ."], "a": 0, "e": "Từ thế hệ 4 có máy tính cá nhân (PC) và mạng LAN, nối nhiều máy để chia sẻ tài nguyên."}, {"n": 24, "q": "Công nghệ chế tạo máy tính đã phát triển theo xu hướng nào qua các thế hệ?", "o": ["Kích thước ngày càng lớn, tốc độ chậm lại.", "Kích thước thu nhỏ dần, tốc độ và dung lượng lưu trữ tăng lên theo cấp số nhân.", "Giá thành ngày càng đắt đỏ và chỉ dành cho giới thượng lưu hoặc chính phủ sở hữu.", "Chỉ chú trọng vào thay đổi màu sắc mà linh kiện bên trong vẫn giữ nguyên từ năm 1945."], "a": 1, "e": "Xu hướng chung: thu nhỏ kích thước, tăng tốc độ xử lí, tăng dung lượng lưu trữ, giảm giá thành."}], "f": []}, {"b": 2, "t": "Thông tin trong môi trường số", "q": [{"n": 25, "q": "Đặc điểm nào sau đây là của thông tin số?", "o": ["Khó bị sao chép và nhân bản.", "Dễ dàng được nhân bản và chia sẻ.", "Chỉ truyền tải được trên một thiết bị duy nhất.", "Luôn bị xoá hoàn toàn sau khi chia sẻ."], "a": 1, "e": "Thông tin số dễ nhân bản, chia sẻ, lan truyền nên khó bị xoá bỏ hoàn toàn."}, {"n": 26, "q": "Khái niệm “Thông tin số” được hiểu là gì?", "o": ["Là thông tin được lưu trữ trên sách, báo in.", "Là thông tin được ghi chép bằng bút và giấy.", "Là thông tin đã được mã hóa thành các dãy bit (0 và 1) để máy tính xử lí.", "Là thông tin truyền miệng giữa con người với nhau."], "a": 2, "e": "Thông tin số là thông tin đã được mã hoá thành dãy bit (0 và 1) để máy tính xử lí."}, {"n": 27, "q": "Một đặc điểm quan trọng về độ bền vững của thông tin số là gì?", "o": ["Nó sẽ tự động biến mất sau một thời gian.", "Nó rất dễ bị xóa bỏ hoàn toàn khỏi Internet.", "Nó khó bị xóa bỏ hoàn toàn.", "Nó chỉ tồn tại khi máy tính được bật."], "a": 2, "e": "Thông tin số dễ lan truyền, đã chia sẻ thì khó xoá hoàn toàn khỏi Internet."}, {"n": 28, "q": "Thông tin số có độ tin cậy như thế nào?", "o": ["Mọi thông tin số đều đáng tin cậy tuyệt đối.", "Mọi thông tin số đều không đáng tin cậy.", "Thông tin số có độ tin cậy rất khác nhau.", "Chỉ thông tin trên mạng xã hội mới đáng tin cậy."], "a": 2, "e": "Độ tin cậy của thông tin số rất khác nhau, phụ thuộc nguồn gốc và mục đích của thông tin."}, {"n": 29, "q": "Tại sao tính thời sự của thông tin lại quan trọng?", "o": ["Vì thông tin cũ luôn luôn sai.", "Vì nó quyết định thông tin đó còn ý nghĩa không hay đã trở nên lỗi thời.", "Vì thông tin mới luôn luôn đúng.", "Tính thời sự không ảnh hưởng đến độ tin cậy của thông tin."], "a": 1, "e": "Tính thời sự cho biết thông tin còn ý nghĩa hay đã lỗi thời; thông tin cũ dễ giảm độ tin cậy (không phải luôn sai)."}, {"n": 30, "q": "Câu nào sau đây là ví dụ về một “ý kiến” chứ không phải “sự kiện”?", "o": ["Trái đất quay quanh mặt trời.", "Hà Nội là thủ đô của Việt Nam.", "Bộ phim này là bộ phim hay nhất mọi thời đại.", "Nước sôi ở 100 độ C ở áp suất tiêu chuẩn."], "a": 2, "e": "Ý kiến là quan điểm, đánh giá cá nhân (“hay nhất”). Sự kiện là việc có thật, kiểm chứng được."}, {"n": 31, "q": "Trong một cuộc tranh luận trực tuyến, một người dùng đưa ra kết luận: “Tất cả học sinh trường X đều lười học vì tôi thấy hai học sinh trường đó trốn học đi chơi”. Lỗi chính trong thông tin này theo nguyên tắc đánh giá độ tin cậy là gì?", "o": ["Là một sự kiện thực tế nhưng đã mất đi tính thời sự do thời điểm xảy ra không được đề cập rõ.", "Là một kết luận không có chứng cứ đầy đủ, mang tính chất ý kiến cá nhân và cảm xúc.", "Là một thông tin đã bị vi phạm bản quyền do lấy từ hệ thống camera giám sát của nhà trường.", "Là thông tin không thể nhân bản và lưu trữ trong môi trường số do dung lượng quá lớn."], "a": 1, "e": "Từ vài trường hợp suy ra “tất cả” là kết luận thiếu chứng cứ, chỉ như ý kiến cá nhân → độ tin cậy thấp."}, {"n": 32, "q": "Internet được xem là kho thông tin như thế nào?", "o": ["Là kho thông tin khổng lồ và mọi thông tin đều chính xác 100%.", "Là nơi chỉ chứa những thông tin sai lệch.", "Là kho thông tin nhỏ lẻ, chỉ phục vụ mục đích giải trí.", "Là kho thông tin khổng lồ nhưng không phải mọi thông tin đều đáng tin cậy."], "a": 3, "e": "Internet là kho thông tin khổng lồ nhưng chất lượng không đồng đều, cần kiểm tra nguồn."}, {"n": 33, "q": "“Thông tin số dễ dàng được chỉnh sửa” mang lại rủi ro gì?", "o": ["Giúp nội dung ngày càng hoàn thiện hơn.", "Tiết kiệm thời gian sáng tạo nội dung mới.", "Có thể làm sai lệch sự thật ban đầu và lan truyền thông tin sai lệch.", "Tăng cường khả năng hợp tác giữa nhiều người."], "a": 2, "e": "Thông tin số dễ chỉnh sửa nên dễ bị bóp méo, tạo tin giả, làm sai lệch sự thật ban đầu."}], "f": [{"n": 34, "q": "Khoa chụp một bức ảnh bằng điện thoại thông minh rồi đăng lên mạng xã hội. Khi tìm hiểu về thông tin số, Khoa đưa ra các nhận định sau:", "s": ["Bức ảnh Khoa chụp bằng điện thoại thông minh là thông tin số vì đã được mã hoá thành dãy bit.", "Quyền tác giả đối với thông tin số không được pháp luật bảo vệ.", "Khi tìm hiểu về một đội bóng yêu thích, Khoa nên ưu tiên trang web chính thức của đội bóng hoặc các trang báo thể thao uy tín vì những nguồn này có độ tin cậy cao hơn tin đồn trên mạng xã hội.", "Một thông tin được chia sẻ rất nhiều lần trên mạng xã hội thì chắc chắn là thông tin đáng tin cậy."], "a": [1, 0, 1, 0], "e": ["Ảnh chụp bằng điện thoại được mã hoá thành dãy bit nên là thông tin số.", "Quyền tác giả đối với thông tin số được pháp luật bảo vệ.", "Trang chính thức, báo thể thao uy tín đáng tin cậy hơn tin đồn trên mạng xã hội.", "Chia sẻ nhiều không chứng minh thông tin đúng; vẫn phải kiểm tra nguồn."]}, {"n": 35, "q": "Trong giờ học Tin học, cô giáo yêu cầu học sinh nhận xét về đặc điểm của thông tin số. Các bạn đưa ra các ý kiến sau:", "s": ["Thông tin số chỉ được lưu trữ bởi cá nhân, không có tổ chức nào lưu trữ.", "Thông tin số có thể được truy cập từ xa nếu người quản lí thông tin đó cho phép.", "Một bức ảnh đã xoá khỏi điện thoại nhưng trước đó đã được gửi cho nhiều người thì vẫn có thể còn tồn tại trên thiết bị khác.", "Bài báo đăng cách đây nhiều năm về giá xăng vẫn dùng được làm số liệu hiện tại vì thông tin cũ luôn đúng."], "a": [0, 1, 1, 0], "e": ["Thông tin số được nhiều tổ chức và cá nhân lưu trữ với dung lượng khổng lồ.", "Thông tin số có thể truy cập từ xa nếu người quản lí cho phép.", "Ảnh đã gửi cho nhiều người thì vẫn còn bản sao trên thiết bị khác dù đã xoá ở máy mình.", "Thông tin cũ dễ lỗi thời, số liệu hiện tại cần thông tin có tính thời sự."]}, {"n": 36, "q": "Bạn Nam tìm hiểu về thông tin số và tin tức trên mạng xã hội. Nam ghi lại các nhận định sau:", "s": ["Thông tin số được mã hoá thành dãy bit nên máy tính có thể xử lí, lưu trữ và truyền tải được.", "Thông tin số rất ít bị nhân bản vì mỗi lần chia sẻ, bản gốc sẽ bị xoá đi.", "Phát biểu “Bộ phim này hay nhất mọi thời đại” là một sự kiện có thể kiểm chứng được.", "Một kết luận không đưa ra chứng cứ thì có độ tin cậy thấp, cũng giống như ý kiến cá nhân."], "a": [1, 0, 0, 1], "e": ["Thông tin số là dãy bit nên máy tính xử lí, lưu trữ, truyền tải được.", "Thông tin số rất dễ nhân bản; chia sẻ không làm mất bản gốc.", "“Hay nhất mọi thời đại” là ý kiến chủ quan, không phải sự kiện kiểm chứng được.", "Kết luận không có chứng cứ có độ tin cậy thấp, giống ý kiến cá nhân."]}]}, {"b": 3, "t": "Thực hành: khai thác thông tin số", "q": [{"n": 37, "q": "Công cụ nào sau đây được dùng để tìm kiếm thông tin trên mạng?", "o": ["Máy tìm kiếm", "Trình soạn thảo văn bản", "Phần mềm diệt virus", "Phần mềm bảng tính"], "a": 0, "e": "Máy tìm kiếm là công cụ để tìm thông tin trên mạng bằng từ khoá."}, {"n": 38, "q": "Thành phần nào thường xuất hiện ngay sau trang tiêu đề?", "o": ["Trang kết luận", "Trang dàn ý", "Trang tài liệu tham khảo", "Trang chứa danh sách nhóm"], "a": 1, "e": "Thứ tự các trang: tiêu đề → dàn ý → giới thiệu vấn đề → nội dung → kết luận → tài liệu tham khảo."}, {"n": 39, "q": "Cần làm gì sau khi tìm kiếm được kết quả?", "o": ["Xoá lịch sử duyệt web", "Tắt ngay máy tính", "Gọi điện thoại báo cáo giáo viên", "Ghi chép kết quả tìm kiếm"], "a": 3, "e": "Sau khi tìm được kết quả cần ghi chép lại (kèm nguồn) để đánh giá, tham khảo và kiểm chứng khi cần."}, {"n": 40, "q": "Trang web có địa chỉ tên miền kết thúc bằng “.gov.vn” là trang thông tin của tổ chức nào?", "o": ["Một tập đoàn công nghệ", "Một tổ chức phi chính phủ", "Một câu lạc bộ thể thao", "Cơ quan chính phủ"], "a": 3, "e": ".gov.vn là tên miền của cơ quan chính phủ → nguồn chính thống, độ tin cậy cao."}, {"n": 41, "q": "Phương tiện kĩ thuật số nào sau đây được gợi ý để sử dụng khi chia sẻ bài trình chiếu?", "o": ["Báo giấy truyền thống", "Dịch vụ điện tín bưu điện", "Thư điện tử, mạng xã hội, không gian lưu trữ dùng chung", "Đài phát thanh địa phương"], "a": 2, "e": "Chia sẻ bài trình chiếu bằng thư điện tử, mạng xã hội hoặc không gian lưu trữ dùng chung."}, {"n": 42, "q": "Mục đích chính của việc đánh giá thông tin tìm được trên mạng là gì?", "o": ["So sánh tốc độ tải của các trang web.", "Xác định độ tin cậy và sự phù hợp của thông tin.", "Tải được nhiều hình ảnh đẹp và video chất lượng cao về máy tính.", "Tăng lượt truy cập cho các trang web."], "a": 1, "e": "Đánh giá thông tin để biết nó có đáng tin cậy và phù hợp với nội dung cần trình bày hay không."}, {"n": 43, "q": "Mục “Tài liệu tham khảo” trong một bài trình chiếu dùng để làm gì?", "o": ["Liệt kê các thiết bị phần cứng đã được sử dụng để thiết kế bài trình chiếu.", "Ghi nhận và trích dẫn nguồn gốc của các thông tin, hình ảnh đã sử dụng.", "Chứa các câu hỏi trắc nghiệm để khán giả trả lời cuối giờ.", "Liệt kê danh sách các thành viên trong nhóm thiết kế."], "a": 1, "e": "Trang tài liệu tham khảo liệt kê nguồn đã dùng: tôn trọng bản quyền và giúp người xem tìm lại thông tin gốc."}, {"n": 44, "q": "Tiêu chí “sự phù hợp” khi đánh giá thông tin tìm được có ý nghĩa gì?", "o": ["Thông tin phải được trình bày dưới dạng video có độ nét cao.", "Thông tin phải hoàn toàn miễn phí và không cần đăng nhập.", "Nội dung thông tin đáp ứng đúng yêu cầu của chủ đề cần tìm.", "Trang web chứa thông tin phải có giao diện đẹp, bắt mắt."], "a": 2, "e": "“Sự phù hợp” nghĩa là nội dung thông tin đáp ứng đúng yêu cầu của chủ đề cần tìm."}, {"n": 45, "q": "Yêu cầu về mức độ trình bày đối với một trang nội dung trong bài trình chiếu là gì?", "o": ["Phải chứa toàn bộ các đoạn văn bản nguyên gốc.", "Không được sử dụng bất kỳ hình ảnh minh họa nào.", "Tối thiểu 10 dòng chữ để đảm bảo truyền tải đủ thông tin.", "Không quá 6 mục, mỗi mục không quá 2 dòng."], "a": 3, "e": "Trang nội dung: không quá 6 mục, mỗi mục không quá 2 dòng; không dán đoạn văn dài."}, {"n": 46, "q": "Lan tìm được hai bài viết về “Năng lượng mặt trời”: Bài 1 đăng trên trang web .gov.vn năm 2021; Bài 2 đăng trên diễn đàn cá nhân năm 2026. Nếu cần số liệu chính xác để báo cáo, Lan nên ưu tiên bài nào?", "o": ["Bài 2, vì được đăng gần đây nhất.", "Lấy số liệu trung bình cộng của cả hai bài.", "Không dùng bài nào.", "Bài 1, vì thuộc cơ quan chính phủ nên có độ tin cậy cao hơn."], "a": 3, "e": "Ưu tiên nguồn có thẩm quyền, rõ nguồn gốc (.gov.vn) hơn diễn đàn cá nhân, dù bài mới hơn."}, {"n": 47, "q": "Đối với các thông tin về quy hoạch cơ cấu nguồn điện, nguồn tin nào dưới đây được đánh giá là đáng tin cậy nhất?", "o": ["Thông tin trên các diễn đàn", "Lời kể của người đi đường", "Thông tin từ trang web của một doanh nghiệp nhỏ", "Thông tin từ cơ quan chính phủ"], "a": 3, "e": "Thông tin về quy hoạch điện đáng tin nhất khi lấy từ cơ quan chính phủ."}, {"n": 48, "q": "Câu hỏi quan trọng thứ hai cần đặt ra khi đánh giá thông tin tìm được là gì?", "o": ["Bài viết có sử dụng phông chữ to không?", "Màu sắc của trang web có rực rỡ không?", "Nguồn tin có đáng tin cậy không?", "Link bài viết có dễ nhớ không?"], "a": 2, "e": "Hai câu hỏi đánh giá: (1) Có phù hợp nội dung không? (2) Nguồn tin có đáng tin cậy không?"}, {"n": 49, "q": "Bước đầu tiên trong quy trình tạo một bài trình chiếu theo hướng dẫn là gì?", "o": ["Mở phần mềm thiết kế và chọn các hiệu ứng chuyển trang thật đẹp mắt.", "Xây dựng ý tưởng và cấu trúc bài trình chiếu.", "Sao chép toàn bộ thông tin trên mạng vào các trang nội dung.", "Tải các hình ảnh động và video âm nhạc về máy tính."], "a": 1, "e": "Cần có ý tưởng và dàn ý tổng thể trước, rồi mới làm nội dung chi tiết."}, {"n": 50, "q": "Tại sao cần ghi chép lại địa chỉ trang web và thời gian của kết quả tìm kiếm?", "o": ["Để nộp lại cho nhà mạng nhằm nhận được điểm thưởng.", "Để trang trí cho bài trình chiếu thêm phần chuyên nghiệp.", "Để thuận tiện cho việc đánh giá và làm tài liệu tham khảo.", "Để so sánh xem máy tính nào xử lí dữ liệu nhanh hơn."], "a": 2, "e": "Ghi địa chỉ trang web và thời gian giúp đánh giá, kiểm chứng và làm trang tài liệu tham khảo."}, {"n": 51, "q": "Khi cần tìm hiểu về “Quy hoạch điện VIII”, nguồn tin nào sau đây cung cấp thông tin chính xác nhất?", "o": ["Một bài luận văn tốt nghiệp của một sinh viên chuyên nghiên cứu.", "Bình luận của người dùng trên trang mạng xã hội.", "Diễn đàn cộng đồng những người yêu công nghệ.", "Trang web của Bộ Công Thương."], "a": 3, "e": "Trang web của Bộ Công Thương là cơ quan nhà nước phụ trách, nên chính xác và tin cậy nhất."}, {"n": 52, "q": "Đội bóng trường em vừa giành giải nhất. Em muốn đăng tin này lên diễn đàn của trường kèm theo ảnh chụp đội. Để thông tin đáng tin cậy nhất đối với người xem, em nên đính kèm yếu tố nào?", "o": ["Em nên đính kèm thêm một bài phân tích dài hàng chục trang viết về lịch sử hình thành và phát triển của bộ môn bóng đá trên toàn thế giới.", "Chỉ cần đăng ảnh và không cần ghi gì thêm.", "Đăng một bức ảnh đã qua chỉnh sửa hiệu ứng biến dạng để trông nghệ thuật hơn.", "Tên tác giả bài viết, thời gian chụp ảnh và chú thích rõ nguồn gốc ảnh từ ban tổ chức giải đấu."], "a": 3, "e": "Ghi rõ tác giả, thời gian và nguồn gốc ảnh làm tăng độ tin cậy của thông tin đăng lên."}], "f": [{"n": 53, "q": "Nhóm của Lan thực hiện bài trình chiếu với chủ đề “Tác hại của rác thải nhựa”. Trong quá trình tìm kiếm, xử lí và chia sẻ thông tin, nhóm gặp các tình huống sau:", "s": ["Việc dán nguyên đoạn văn dài 500 chữ vào một trang nội dung là chưa phù hợp với yêu cầu trình bày của bài trình chiếu.", "Nhóm tìm thấy một tài liệu rất chi tiết trên website .com của một hãng bán túi nilon. Nhóm cần cẩn trọng với tài liệu này vì website thuộc doanh nghiệp có lợi ích liên quan nên thông tin có thể thiên vị.", "Bài trình chiếu có 15 trang, gồm 1 trang tiêu đề, 1 trang dàn ý, 1 trang kết luận và 1 trang tài liệu tham khảo. Như vậy bài có 12 trang nội dung.", "Một video dung lượng 2 GB về tài liệu tìm thấy không gửi được qua thư điện tử vì vượt giới hạn. Cách xử lí hợp lí là chia video thành nhiều tệp chỉ vài kilobyte rồi gửi liên tiếp."], "a": [1, 1, 0, 0], "e": ["Dán đoạn văn dài vào trang nội dung là chưa phù hợp (mỗi trang không quá 6 mục, mỗi mục không quá 2 dòng).", "Trang của doanh nghiệp bán hàng có thể thiên vị vì mục tiêu thương mại, cần cẩn trọng.", "15 − 4 trang cố định (tiêu đề, dàn ý, kết luận, tài liệu tham khảo) = 11 trang nội dung, không phải 12.", "Chia tệp thành vài KB là vô lí; nên tải lên lưu trữ đám mây rồi gửi liên kết."]}, {"n": 54, "q": "Hoa chuẩn bị bài trình chiếu về chủ đề “Năng lượng sạch”. Trong quá trình tìm kiếm, xử lí thông tin, Hoa gặp các tình huống sau:", "s": ["Hoa thấy một trang web quảng cáo máy lọc nước có tính năng “tạo ra điện năng lượng mặt trời”. Hoa có thể tin ngay thông tin này vì trang web có giao diện đẹp.", "Khi có quá nhiều kết quả không liên quan, Hoa có thể đặt cụm từ khoá trong cặp dấu ngoặc kép để máy tìm kiếm trả về các kết quả chứa chính xác cụm từ đó.", "Bức ảnh nhà máy điện gió quá lớn so với khoảng trống trên trang trình chiếu. Hoa nên dùng công cụ xử lí ảnh để thu nhỏ kích thước ảnh cho vừa vặn.", "Hoa ghép bảng số liệu của Hùng và hình ảnh của Tuấn vào bài trình chiếu. Hoa chỉ cần ghi tên mình là tác giả duy nhất mà không cần ghi nguồn."], "a": [0, 1, 1, 0], "e": ["Giao diện đẹp không chứng minh thông tin đúng; thông tin quảng cáo cần đối chiếu nguồn uy tín.", "Đặt cụm từ trong dấu ngoặc kép để tìm đúng cụm từ đó.", "Dùng phần mềm xử lí ảnh để đổi kích thước ảnh cho phù hợp trang trình chiếu.", "Dùng sản phẩm của người khác phải ghi rõ nguồn và tác giả."]}, {"n": 55, "q": "Nhóm của Minh thực hiện bài trình chiếu với chủ đề “Ưu điểm và hạn chế của thuỷ điện”. Trong quá trình làm bài, nhóm gặp các tình huống sau:", "s": ["Bài trình chiếu có 20 trang, gồm 1 trang tiêu đề, 1 trang dàn ý, 1 trang kết luận và 1 trang tài liệu tham khảo. Như vậy bài có 16 trang nội dung.", "Hai bài viết cùng nêu số liệu về quy hoạch thuỷ điện: bài 1 đăng trên trang .gov.vn năm 2022, bài 2 đăng trên diễn đàn cá nhân năm 2026. Nhóm nên ưu tiên số liệu của bài 2 vì được đăng gần đây hơn.", "Tệp video 1,5 GB không đính kèm được vào thư điện tử. Nhóm có thể tải video lên không gian lưu trữ dùng chung rồi gửi liên kết chia sẻ.", "Một diễn đàn viết “thuỷ điện không gây ảnh hưởng gì đến môi trường”. Nhóm cần tìm thêm thông tin đối chứng từ nguồn chính thống trước khi đưa vào bài."], "a": [1, 0, 1, 1], "e": ["20 − 4 trang cố định = 16 trang nội dung.", "Nên ưu tiên nguồn .gov.vn có thẩm quyền, không chỉ vì bài đăng gần đây.", "Tệp lớn nên tải lên không gian lưu trữ dùng chung rồi gửi liên kết.", "Thông tin từ diễn đàn cần đối chiếu thêm với nguồn chính thống trước khi dùng."]}, {"n": 56, "q": "Tuấn chuẩn bị bài trình chiếu về chủ đề “Năng lượng gió”. Trong quá trình tìm kiếm, xử lí và chia sẻ thông tin, Tuấn gặp các tình huống sau:", "s": ["Bài trình chiếu có 12 trang nội dung, 1 trang tiêu đề, 1 trang dàn ý, 1 trang kết luận và 1 trang tài liệu tham khảo. Như vậy bài có tổng cộng 16 trang.", "Tuấn lấy số liệu từ một bài đăng ẩn danh trên mạng xã hội. Vì bài được chia sẻ rất nhiều lần nên Tuấn không cần kiểm chứng lại.", "Tuấn cần ghi lại địa chỉ trang web và thời gian tìm kiếm để thuận tiện cho việc đánh giá và làm tài liệu tham khảo.", "Để chia sẻ bài trình chiếu cho cả lớp, Tuấn chỉ cần chọn phương tiện có biểu tượng đẹp nhất, không cần quan tâm đến tính an toàn dữ liệu."], "a": [1, 0, 1, 0], "e": ["12 + 4 trang cố định = 16 trang.", "Bài đăng ẩn danh, dù chia sẻ nhiều, vẫn cần kiểm chứng nguồn.", "Ghi địa chỉ trang web và thời gian giúp đánh giá và làm tài liệu tham khảo.", "Khi chia sẻ phải xét cả tính dễ sử dụng và an toàn dữ liệu."]}]}, {"b": 4, "t": "Đạo đức và văn hoá trong sử dụng công nghệ kĩ thuật số", "q": [{"n": 57, "q": "Hành vi nào sau đây bị pháp luật nghiêm cấm trên không gian mạng?", "o": ["Tham gia, quảng cáo cho các trang web đánh bạc trực tuyến.", "Đăng bài viết chia sẻ về ẩm thực quê hương.", "Lập trang web bán sản phẩm thủ công mỹ nghệ.", "Tạo nhóm trên mạng xã hội để trao đổi về thú cưng."], "a": 0, "e": "Quảng cáo, tham gia cờ bạc, cá cược trên mạng là hành vi vi phạm pháp luật."}, {"n": 58, "q": "Việc làm nào dưới đây là vi phạm quyền riêng tư của người khác?", "o": ["Tham gia các diễn đàn học tập trực tuyến để trao đổi bài tập.", "Ghi âm trái phép các cuộc nói chuyện của những người xung quanh.", "Sử dụng phần mềm diệt virus có bản quyền trên máy tính cá nhân.", "Cài đặt mật khẩu mạnh cho tài khoản mạng xã hội của chính mình."], "a": 1, "e": "Ghi âm trái phép người khác xâm phạm quyền riêng tư, bí mật đời tư."}, {"n": 59, "q": "Hành vi nào dưới đây cổ xúy cho những hành động tiêu cực trong trường học?", "o": ["Thành lập nhóm trực tuyến để giúp đỡ nhau học tập tốt hơn.", "Chia sẻ các bài viết biểu dương tấm gương người tốt việc tốt.", "Phát trực tiếp các vụ bạo lực học đường lên mạng xã hội.", "Kêu gọi các bạn quyên góp sách vở cho học sinh vùng khó khăn."], "a": 2, "e": "Phát trực tiếp, phát tán video bạo lực học đường là cổ xuý hành vi tiêu cực, gây tổn hại nạn nhân."}, {"n": 60, "q": "Vì sao việc sử dụng phần mềm bẻ khoá (crack) bị coi là vi phạm pháp luật và đạo đức?", "o": ["Vì làm chậm tốc độ hoạt động của hệ điều hành.", "Vì xâm phạm quyền sở hữu trí tuệ của nhà phát triển phần mềm.", "Vì luôn chứa mã độc làm hỏng phần cứng của thiết bị.", "Vì làm tăng dung lượng ổ đĩa cứng."], "a": 1, "e": "Dùng phần mềm bẻ khoá (crack) là xâm phạm quyền sở hữu trí tuệ của nhà phát triển, còn có nguy cơ mất an ninh mạng."}, {"n": 61, "q": "Hành động nào sau đây thể hiện ứng xử có văn hoá trên môi trường số?", "o": ["Chia sẻ lại các bài viết chưa kiểm chứng để cảnh báo cộng đồng mạng.", "Sử dụng tài khoản ẩn danh để tranh luận gay gắt và chỉ trích ý kiến trái chiều của người dùng khác.", "Bình luận dùng từ ngữ lịch sự, tôn trọng ý kiến cá nhân của người khác.", "Đăng ảnh dìm hàng bạn bè lên nhóm lớp để tạo không khí vui vẻ."], "a": 2, "e": "Ứng xử có văn hoá: dùng ngôn từ lịch sự, tôn trọng ý kiến người khác."}, {"n": 62, "q": "Hành vi nào sau đây vi phạm quyền riêng tư về thông tin cá nhân trên mạng xã hội?", "o": ["Tự đăng ảnh kỷ niệm chuyến du lịch của gia đình mình.", "Đăng số điện thoại và địa chỉ nhà của bạn học lên mạng khi chưa được bạn đồng ý.", "Nhắn tin riêng tư hỏi thăm sức khỏe của bạn bè trong lớp.", "Chia sẻ bài viết của các trang báo chính thống về tình hình thời tiết địa phương."], "a": 1, "e": "Đưa số điện thoại, địa chỉ nhà của bạn lên mạng khi chưa được đồng ý là xâm phạm thông tin cá nhân."}, {"n": 63, "q": "Hậu quả pháp lí của hành vi cố tình đăng tải, lan truyền thông tin bịa đặt, sai sự thật lên mạng xã hội là gì?", "o": ["Được gia tăng uy tín và danh tiếng trên mạng xã hội.", "Được các nền tảng mạng xã hội hỗ trợ tăng tương tác.", "Giúp người đọc rèn luyện kĩ năng phân tích dữ liệu một cách độc lập và hiệu quả hơn.", "Vi phạm pháp luật về an ninh mạng và bị xử lí theo quy định."], "a": 3, "e": "Đăng, lan truyền thông tin sai sự thật vi phạm Luật An ninh mạng, có thể bị xử phạt."}, {"n": 64, "q": "Hành vi nào dưới đây thể hiện việc tôn trọng chuẩn mực đạo đức và pháp luật trên mạng?", "o": ["Đưa lên mạng địa chỉ nhà và số điện thoại của bạn cùng lớp.", "Tiết lộ lịch trình cá nhân của người nổi tiếng lên các nhóm kín.", "Không tiết lộ thông tin cá nhân của người khác trên mạng xã hội.", "Chia sẻ công khai bảng điểm của học sinh trong lớp lên diễn đàn."], "a": 2, "e": "Không tiết lộ thông tin cá nhân của người khác là tôn trọng đạo đức và pháp luật."}, {"n": 65, "q": "Đâu là hành vi vi phạm pháp luật khi tham gia các hoạt động trực tuyến?", "o": ["Tham gia các khóa học kĩ năng mềm được tổ chức trực tuyến.", "Chơi các trò chơi điện tử mang tính giải trí đã được cấp phép.", "Lập nhóm chat để cùng nhau bình luận về một trận bóng đá hợp pháp.", "Tham gia cá cược bóng đá thông qua các trang mạng Internet."], "a": 3, "e": "Cá cược bóng đá trên mạng là hành vi vi phạm pháp luật."}], "f": [{"n": 66, "q": "Trong buổi sinh hoạt lớp với chủ đề “Ứng xử có văn hoá trên môi trường số”, các bạn học sinh đưa ra các ý kiến sau:", "s": ["Chụp ảnh tại khu vực có biển báo không cho phép chụp ảnh là việc làm bình thường, không vi phạm quy định.", "Quay phim bộ phim đang chiếu trong rạp rồi chia sẻ lên mạng là hành vi vi phạm pháp luật.", "Hà tải sơ đồ của người khác từ Internet về, chỉnh sửa màu sắc rồi ghi tên mình là tác giả. Hành vi này là thiếu trung thực khi tạo ra sản phẩm số.", "Tải tệp bài hát có bản quyền từ trang web chia sẻ lậu về máy tính để nghe cá nhân thì không vi phạm bản quyền."], "a": [0, 1, 1, 0], "e": ["Chụp ảnh ở nơi có biển cấm là xâm phạm quy định, không phải việc bình thường.", "Quay phim trong rạp rồi chia sẻ lên mạng là vi phạm bản quyền và pháp luật.", "Sao chép, chỉnh sửa sản phẩm người khác rồi nhận là của mình là thiếu trung thực.", "Tải bài hát có bản quyền từ trang chia sẻ lậu khi chưa được phép là vi phạm bản quyền."]}, {"n": 67, "q": "Trong tiết sinh hoạt lớp với chủ đề “Sử dụng công nghệ số có trách nhiệm”, các bạn học sinh đưa ra các ý kiến sau:", "s": ["Hầu hết các thông tin và sản phẩm đăng tải trên Internet đều không có bản quyền nên có thể tự do sử dụng.", "Chia sẻ thông tin về việc mua bán động vật hoang dã quý hiếm trên mạng xã hội là hành vi vi phạm pháp luật.", "Dùng lời lẽ giễu cợt để chỉ ra lỗi sai trong bài làm của bạn trên nhóm học tập trực tuyến là cách ứng xử có văn hoá.", "Muốn dùng bức ảnh do người khác chụp để minh hoạ cho bài thuyết trình, em nên xin phép tác giả và ghi rõ nguồn trong bài."], "a": [0, 1, 0, 1], "e": ["Hầu hết thông tin, sản phẩm trên Internet đều có bản quyền, không được tự do sử dụng.", "Mua bán động vật hoang dã quý hiếm là vi phạm pháp luật; chia sẻ thông tin này cũng là sai.", "Dùng lời lẽ giễu cợt, xúc phạm là thiếu văn hoá.", "Dùng ảnh của người khác cần xin phép tác giả và ghi rõ nguồn."]}, {"n": 68, "q": "Trong giờ Tin học, các nhóm thảo luận về việc tạo và chia sẻ sản phẩm số. Các ý kiến được đưa ra như sau:", "s": ["Việc đăng thông tin cá nhân của người khác lên mạng khi chưa được phép là hành vi xâm phạm thông tin cá nhân.", "Phát trực tiếp video bạo lực học đường lên mạng xã hội là việc nên làm để cảnh báo mọi người.", "Tải tài liệu có ghi chú bản quyền, xoá dòng ghi chú rồi gửi cho cả lớp dùng chung là không vi phạm bản quyền.", "Chia sẻ đường liên kết đến bài gốc để các bạn tự truy cập là cách thể hiện sự tôn trọng bản quyền của tác giả."], "a": [1, 0, 0, 1], "e": ["Đưa thông tin cá nhân của người khác lên mạng khi chưa được phép là xâm phạm quyền riêng tư.", "Phát video bạo lực học đường gây tổn hại nạn nhân và cổ vũ bạo lực, không nên làm.", "Xoá ghi chú bản quyền rồi chia sẻ vẫn là vi phạm bản quyền.", "Chia sẻ liên kết tới bài gốc là cách tôn trọng bản quyền tác giả."]}]}, {"b": 5, "t": "Sử dụng bảng tính giải quyết bài toán thực tế", "q": [{"n": 69, "q": "Ưu điểm nổi bật nhất của chương trình bảng tính khi sử dụng công thức là gì?", "o": ["Tự động thay đổi màu sắc ô tính.", "Tự động tính toán lại khi dữ liệu thay đổi.", "Tự động tạo biểu đồ cho mọi loại dữ liệu.", "Tự động lưu tệp tin sau mỗi giây."], "a": 1, "e": "Ưu điểm nổi bật của công thức: kết quả tự tính lại khi dữ liệu nguồn thay đổi."}, {"n": 70, "q": "Khi nhập công thức vào ô tính, kí tự đầu tiên phải gõ là gì?", "o": ["Dấu cộng (+)", "Dấu ngoặc đơn “(”", "Dấu nháy kép (\")", "Dấu bằng (=)"], "a": 3, "e": "Công thức luôn bắt đầu bằng dấu bằng (=)."}, {"n": 71, "q": "Kí hiệu nào được sử dụng để đánh dấu một địa chỉ là địa chỉ tuyệt đối trong phần mềm bảng tính?", "o": ["Dấu thăng (#).", "Dấu đô la ($).", "Dấu sao (*).", "Dấu và (&)."], "a": 1, "e": "Dấu đô la ($) đứng trước tên cột và tên hàng để tạo địa chỉ tuyệt đối."}, {"n": 72, "q": "Địa chỉ nào sau đây là địa chỉ tuyệt đối?", "o": ["$C$3", "C3", "$C3", "C$3"], "a": 0, "e": "Địa chỉ tuyệt đối có $ trước cả tên cột và tên hàng: $C$3. $C3 và C$3 chỉ cố định một phần."}, {"n": 73, "q": "Sau khi nhập địa chỉ tương đối, phím tắt nào trên bàn phím được sử dụng để chuyển đổi nhanh thành địa chỉ tuyệt đối?", "o": ["Phím F2.", "Phím F3.", "Phím F4.", "Phím F5."], "a": 2, "e": "Nhấn phím F4 để chuyển nhanh địa chỉ tương đối thành tuyệt đối."}, {"n": 74, "q": "Địa chỉ tuyệt đối trong công thức bảng tính có đặc điểm gì?", "o": ["Không thay đổi khi thực hiện thao tác sao chép công thức sang một ô tính khác.", "Tự động cập nhật tham chiếu hàng và cột dựa trên khoảng cách di chuyển của ô chứa công thức.", "Thay đổi giá trị hiển thị bên trong ô nhưng vẫn giữ nguyên hoàn toàn định dạng của chữ số.", "Bắt buộc phải kết hợp với hàm logic phức tạp để giữ nguyên giá trị dữ liệu nguồn trong toàn bộ quá trình xử lí thông tin."], "a": 0, "e": "Địa chỉ tuyệt đối không thay đổi khi sao chép công thức sang ô khác."}, {"n": 75, "q": "Đặc điểm của địa chỉ tương đối khi sao chép công thức là gì?", "o": ["Không thay đổi trong mọi trường hợp.", "Chỉ thay đổi tên cột, giữ nguyên tên hàng.", "Tự động thay đổi để tương ứng với vị trí mới của ô chứa công thức.", "Người dùng phải nhập lại thủ công sau mỗi lần sao chép."], "a": 2, "e": "Địa chỉ tương đối tự thay đổi theo vị trí mới của ô chứa công thức."}, {"n": 76, "q": "Khi thực hiện sao chép công thức =C4*$D$2 từ ô E4 xuống ô E5, thành phần nào trong công thức sẽ bị thay đổi?", "o": ["C4", "$D$2", "Dấu *", "Không có thành phần nào thay đổi"], "a": 0, "e": "Sao chép xuống 1 hàng: địa chỉ tương đối C4 đổi thành C5; $D$2 giữ nguyên. Vậy thành phần bị thay đổi là C4."}, {"n": 77, "q": "Sao chép công thức =B3*$F$1 từ ô D3 xuống ô D4, thành phần nào của công thức được giữ nguyên?", "o": ["B3", "$F$1", "Cả B3 và $F$1", "Không có thành phần nào"], "a": 1, "e": "B3 là địa chỉ tương đối nên đổi thành B4; $F$1 là địa chỉ tuyệt đối nên được giữ nguyên."}, {"n": 78, "q": "Để dán dữ liệu đã được sao chép vào phần mềm bảng tính bằng thanh công cụ, em sử dụng lệnh gì?", "o": ["Lệnh Copy", "Lệnh Paste", "Lệnh Cut", "Lệnh Format Painter"], "a": 1, "e": "Lệnh Paste (dán) đưa dữ liệu đã sao chép vào ô đích; phím tắt Ctrl + V."}, {"n": 79, "q": "Tại ô D4 có công thức =B4*C4. Nếu sao chép công thức này từ ô D4 xuống ô D5 thì công thức tại ô D5 là gì?", "o": ["=B5*C5", "=B4*C4", "=C4*D4", "=B5*C4"], "a": 0, "e": "Xuống 1 hàng: B4→B5, C4→C5 nên được =B5*C5."}, {"n": 80, "q": "Tại ô F4 có công thức =E4*$F$2. Khi sao chép công thức này từ ô F4 xuống ô F5, kết quả công thức nhận được tại ô F5 là gì?", "o": ["=E4*$F$2", "=E5*$F$3", "=E5*$F$2", "=E4*$F$3"], "a": 2, "e": "Xuống 1 hàng: E4→E5 (tương đối), $F$2 giữ nguyên → =E5*$F$2."}, {"n": 81, "q": "Tại ô C2 có công thức =A2+B2. Nếu sao chép công thức này từ ô C2 sang ô D2 thì công thức tại ô D2 là gì?", "o": ["=A2+B2", "=B2+C2", "=B3+C3", "=A3+B3"], "a": 1, "e": "Sang phải 1 cột: A→B, B→C nên được =B2+C2."}, {"n": 82, "q": "Bảng tính có cột C chứa Đơn giá, cột D chứa Số lượt mua. Để tính Doanh thu tại ô E4 theo công thức Doanh thu = Đơn giá * Số lượt mua và có thể sao chép cho các ô bên dưới, em sẽ nhập công thức nào?", "o": ["=C4*$D$4", "=C4*D4", "=$C$4*$D$4", "=$C$4*D4"], "a": 1, "e": "Đơn giá và số lượng đổi theo từng hàng nên cả hai dùng địa chỉ tương đối: =C4*D4."}, {"n": 83, "q": "Tại ô D5 có công thức =B5*C5. Nếu em thực hiện lệnh Copy ô D5 và Paste vào ô F7, công thức nhận được tại ô F7 là gì?", "o": ["=D7*E7", "=B5*C5", "=B7*C7", "=D5*E5"], "a": 0, "e": "Từ D5 đến F7: sang phải 2 cột, xuống 2 hàng. B5→D7, C5→E7 nên được =D7*E7."}, {"n": 84, "q": "Ô F2 chứa tỉ lệ doanh thu của công ti là 70%; các ô E4:E9 chứa doanh thu của từng phần mềm. Công thức nào nhập tại ô F4 để tính doanh thu của công ti và có thể sao chép xuống các ô F5:F9 cho kết quả đúng?", "o": ["=E4*F2", "=$E$4*F2", "=E4*$F$2", "=$E$4*$F$2"], "a": 2, "e": "E4 (doanh thu từng phần mềm) thay đổi theo hàng → tương đối; F2 (tỉ lệ chung) cố định → $F$2. Công thức: =E4*$F$2.", "h": "<img src=\"data:image/webp;base64,UklGRmo+AABXRUJQVlA4IF4+AACwBwGdASoqA0IBPm02l0ikIqKiIrIp2IANiWdI6tMne5NKe9af87mnyJigE2tiuxjpudfnV+zIO7svv6Pv7+jn+9eld0XOeZ9KP+G6YT1Zv6/6h/7R+tZ6xn+uyZ30N/h/xl8PP7L/dP2X9AfxD5N+p/3T+9f43+x/tR8kP+N08upB8W+yX3L+2/t7/d/nF/E/67xL+AP8b+Y3wC/jv8g/vX9n/d3++eSX34Wx/779fPYF9Qfmv+j/vX+e/7n949GH+U/tP7le5P5P/Q/7/+bH9W///4Afxz+Xf47+5fvH/e////5vrv/d/9TyQfsf+Q/63+b+AL+Y/1X/h/4v8q/pX/mP+1/k/9J+0Htx/Pf8h/0P878Av8v/rH/F/wX+m/a355vYZ+5f///93wn/uR//xyOdwsePqEkGM/hSb5/bMIxs+YTCwIGBaT42/+9vDtgwF+pHNSbZRhMKqrDQjU3ib680GWyIRGFdN2E5bRJjEs6l3oZPqeIwf85bOiCQNn , "a": 1, "e": "Địa chỉ ô viết tên cột (chữ) rồi tên hàng (số): B2 là giao của cột B và hàng 2."}, {"n": 89, "q": "Địa chỉ ô nào sau đây được định dạng đúng theo chuẩn của địa chỉ tuyệt đối?", "o": ["A1", "A$1", "$A$1", "$A1"], "a": 2, "e": "Địa chỉ tuyệt đối phải có $ trước cả cột và hàng: $A$1."}, {"n": 90, "q": "Trong công thức =E4*$F$2, địa chỉ ô E4 đóng vai trò gì?", "o": ["Là địa chỉ hỗn hợp", "Là địa chỉ tương đối", "Là địa chỉ tuyệt đối", "Là hằng số"], "a": 1, "e": "E4 không có dấu $ nên là địa chỉ tương đối; $F$2 mới là địa chỉ tuyệt đối."}, {"n": 91, "q": "Tại ô G3 có công thức =E3*$H$1. Sao chép công thức này từ ô G3 xuống ô G6 thì công thức tại ô G6 là gì?", "o": ["=E3*$H$1", "=E6*$H$4", "=E6*$H$1", "=E3*$H$4"], "a": 2, "e": "Từ G3 xuống G6 (3 hàng): E3→E6; $H$1 giữ nguyên → =E6*$H$1."}, {"n": 92, "q": "Tại ô C5 có công thức =A5+B5. Nếu sao chép công thức này từ ô C5 sang ô E7 thì công thức tại ô E7 là gì?", "o": ["=A7+B7", "=C5+D5", "=E7+F7", "=C7+D7"], "a": 3, "e": "Từ C5 đến E7: sang phải 2 cột, xuống 2 hàng. A5→C7, B5→D7 nên được =C7+D7."}, {"n": 93, "q": "Trong bài toán tính tiền, cột C chứa Đơn giá, ô D2 chứa Tỉ lệ giảm giá cố định. Công thức tính Số tiền được giảm tại ô D4, sao cho có thể sao chép chính xác xuống toàn bộ các hàng bên dưới là gì?", "o": ["=C4*D2", "=C4*$D$2", "=$C$4*D2", "=$C$4*$D$2"], "a": 1, "e": "Đơn giá C4 đổi theo hàng (tương đối); tỉ lệ giảm D2 cố định → $D$2. Công thức: =C4*$D$2."}, {"n": 94, "q": "Từ công thức tính tiền giảm giá =C4*$D$2, công thức tính Đơn giá sau giảm (bằng Đơn giá ban đầu trừ đi Số tiền được giảm) tại ô E4 được viết như thế nào?", "o": ["=C4-C4*$D$2", "=$C$4-$C$4*D2", "=C4-$C$4*D2", "=C4-C4*D2"], "a": 0, "e": "Đơn giá sau giảm = Đơn giá − Tiền giảm = C4 − C4*$D$2, viết: =C4-C4*$D$2."}], "f": [{"n": 95, "q": "Một cửa hàng lập bảng tính tiền bán hàng có giảm giá như hình dưới (các ô D4:E6 chưa nhập công thức). Ô D2 chứa tỉ lệ giảm giá cố định; cột D là số tiền giảm, tính bằng đơn giá nhân với tỉ lệ giảm giá; cột E là giá sau giảm.", "s": ["Trong công thức =C4*$D$2, C4 là địa chỉ tương đối còn $D$2 là địa chỉ tuyệt đối.", "Để tính số tiền giảm tại ô D4 và sao chép xuống các ô D5, D6 cho kết quả đúng, có thể nhập vào ô D4 công thức =C4*D2.", "Nếu nhập vào ô D4 công thức =$C$4*$D$2 rồi sao chép xuống ô D5 thì công thức tại ô D5 là =$C$5*$D$2.", "Giá sau giảm tại ô E4 được tính bằng công thức =C4-C4*$D$2; khi sao chép công thức này xuống ô E5 ta được =C5-C5*$D$2."], "a": [1, 0, 0, 1], "e": ["C4 không có $ là địa chỉ tương đối; $D$2 có $ trước cả cột và hàng là tuyệt đối.", "=C4*D2 sao chép xuống thành =C5*D3: D3 không phải ô tỉ lệ → sai. Phải dùng $D$2.", "$C$4 là tuyệt đối nên không đổi: D5 là =$C$4*$D$2, không phải =$C$5*$D$2.", "=C4-C4*$D$2 sao chép xuống E5 thành =C5-C5*$D$2: đúng."], "h": "<div style=\"overflow-x:auto\"><table class=\"sheet\"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr><tr><th>1</th><td colspan=\"5\" class=\"t\">BẢNG TÍNH TIỀN BÁN HÀNG CÓ GIẢM GIÁ</td></tr><tr><th>2</th><td>Tỉ lệ giảm giá:</td><td></td><td></td><td>10%</td><td></td></tr><tr><th>3</th><td class=\"b\">STT</td><td class=\"b\">Tên mặt hàng</td><td class=\"b\">Đơn giá (đồng)</td><td class=\"b\">Số tiền giảm (đồng)</td><td class=\"b\">Giá sau giảm (đồng)</td></tr><tr><th>4</th><td>1</td><td>Vở</td><td>20000</td><td></td><td></td></tr><tr><th>5</th><td>2</td><td>Bút bi</td><td>5000</td><td></td><td></td></tr><tr><th>6</th><td>3</td><td>Cặp sách</td><td>250000</td><td></td><td></td></tr></table></div>"}, {"n": 96, "q": "Một cửa hàng lập bảng tính tiền thuế giá trị gia tăng (VAT) cho các mặt hàng. Ô F1 chứa thuế suất cố định là 8%; cột B (từ B3 đến B7) chứa giá bán chưa thuế; cột C (từ C3 đến C7) là tiền thuế, bằng giá bán nhân với thuế suất; cột D là tổng tiền phải trả. Các bạn học sinh đưa ra các nhận định sau:", "s": ["Khi nháy chuột chọn ô B3 để đưa vào công thức, địa chỉ ô nhận được mặc định là địa chỉ tương đối.", "Nhập vào ô C3 công thức =B3*$F$1 rồi sao chép xuống ô C4 thì công thức tại ô C4 là =B4*$F$2.", "Sao chép công thức =B3*$F$1 từ ô C3 sang ô D3 thì công thức tại ô D3 là =C3*$F$1.", "Công thức tính tổng tiền tại ô D3 là =B3+C3; khi sao chép xuống ô D4, công thức tại ô D4 là =B4+C3."], "a": [1, 0, 1, 0], "e": ["Nháy chuột chọn ô thì địa chỉ mặc định là địa chỉ tương đối.", "$F$1 là tuyệt đối nên giữ nguyên: C4 là =B4*$F$1, không đổi thành $F$2.", "Sang phải 1 cột: B3→C3, $F$1 giữ nguyên → =C3*$F$1.", "Xuống 1 hàng, cả B3 và C3 đều đổi thành B4 và C4 → =B4+C4, không phải =B4+C3."]}, {"n": 97, "q": "Một lớp lập bảng tính tiền vé tham quan. Ô E1 chứa giá vé cố định cho mỗi học sinh; cột B (từ B4 đến B8) chứa số học sinh của từng lớp; cột C (từ C4 đến C8) chứa tiền vé, được nhập công thức =B4*$E$1 tại ô C4 rồi sao chép xuống các ô còn lại. Em có các nhận định sau:", "s": ["Khi sao chép công thức, địa chỉ tuyệt đối $E$1 được giữ nguyên còn địa chỉ tương đối B4 thay đổi theo vị trí mới.", "Nếu nhập tại ô C4 công thức =B4*E1 rồi sao chép xuống ô C5 thì công thức tại ô C5 là =B5*E2 và cho kết quả sai.", "Sao chép công thức từ ô C4 xuống ô C8 thì công thức tại ô C8 là =B8*$E$5.", "Sao chép công thức từ ô C4 sang ô D6 thì công thức tại ô D6 là =C6*$E$3."], "a": [1, 1, 0, 0], "e": ["Tương đối (B4) đổi theo vị trí mới; tuyệt đối ($E$1) giữ nguyên.", "=B4*E1 xuống C5 thành =B5*E2: E2 không chứa giá vé nên kết quả sai.", "Xuống tới C8: B4→B8, $E$1 giữ nguyên → =B8*$E$1, không phải $E$5.", "C4→D6: sang phải 1 cột, xuống 2 hàng → =C6*$E$1, $E$1 không đổi."]}, {"n": 98, "q": "Một lớp lập bảng tính tiền ăn bán trú. Ô G1 chứa giá tiền một suất ăn cố định; cột C (từ C3 đến C8) chứa số suất ăn của từng học sinh; cột D (từ D3 đến D8) chứa số tiền phải trả, được nhập công thức =C3*$G$1 tại ô D3 rồi sao chép xuống các ô còn lại. Em có các nhận định sau:", "s": ["Sau khi nhập địa chỉ G1, nhấn phím F4 sẽ chuyển địa chỉ này thành địa chỉ tuyệt đối $G$1.", "Công thức nhận được tại ô D5 là =C5*$G$3.", "Sao chép công thức từ ô D3 sang ô E3 thì công thức tại ô E3 là =D3*$G$1.", "Nếu nhập tại ô D3 công thức =C3*G1 rồi sao chép xuống ô D4 thì công thức tại ô D4 vẫn là =C4*G1."], "a": [1, 0, 1, 0], "e": ["Nhấn F4 sau khi nhập địa chỉ G1 sẽ chuyển thành $G$1.", "D5 là =C5*$G$1; $G$1 giữ nguyên, không thành $G$3.", "D3→E3 (sang phải 1 cột): C3→D3, $G$1 giữ nguyên → =D3*$G$1.", "=C3*G1 xuống D4 thành =C4*G2, không phải =C4*G1 vì G1 là địa chỉ tương đối."]}]}];
