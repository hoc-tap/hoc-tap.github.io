<style>
:root{--bg:#f4f7fc;--surface:#fff;--ink:#17233b;--muted:#5a6b88;--line:#dde5f2;--blue:#2457c5;--blue-soft:#e8effc;--ok:#0b8f55;--ok-soft:#e2f6ea;--bad:#d03a3a;--bad-soft:#fdeaea;--amber:#e59a00;--amber-soft:#fff7e0;--nav:64px}
*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.top{position:fixed;inset:0 0 auto 0;height:var(--nav);z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 max(16px,calc((100% - 1120px)/2))}
.brand{font-weight:700;font-size:1.05rem;color:var(--ink);text-decoration:none}.brand i{font-style:normal;color:var(--blue)}

h2{margin:0;font-size:1.4rem}h3.part{margin:18px 0 10px;font-size:1rem;color:var(--muted)}

.ex{margin:0 0 10px;max-width:100%;overflow-x:auto}main,.card{min-width:0}.sheet{border-collapse:collapse;font-size:.9rem;min-width:460px}.sheet th{background:#eef2f9;color:#5a6b88;font-weight:600}.sheet td,.sheet th{border:1px solid #c9d4e6;padding:5px 10px;text-align:center}.sheet td.b{background:#e8effc;font-weight:600}.sheet td.t{background:#fff7e0;font-weight:700}

 .toc h4,.score button,.toc a>span{display:none!important}.toc a{flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;padding:4px 10px}.toc a small{display:none}.toc a.on{border-bottom-color:var(--blue)}

<header class="hero"><h1>Tin học 9 – Trắc nghiệm ôn tập giữa học kì 1</h1><p>Chọn đáp án để xem kết quả và hướng dẫn trả lời ngay. Có thể làm lại bất cứ lúc nào.</p></header>

<script>
var DATA=[{"b": 1, "t": "Thiết bị có gắn bộ xử lí và khả năng của máy tính", "q": [{"q": "Phương án nào sau đây là ví dụ về thiết bị có gắn bộ xử lí trong thương mại?", "o": ["Máy chiếu trong lớp học.", "Máy chụp X-quang.", "Hệ thống thanh toán trong siêu thị.", "Hệ thống phun tưới vận hành tự động."], "a": 2, "e": "Đáp án đúng là C. Hệ thống thanh toán trong siêu thị. Ghi nhớ: Bộ xử lí có mặt khắp nơi; máy tính tính nhanh, chính xác, lưu trữ lớn, kết nối toàn cầu nhưng không cảm thụ văn học.", "n": 1}, {"q": "Robot lắp ráp là thiết bị có gắn bộ xử lí được sử dụng trong lĩnh vực nào?", "o": ["Công nghiệp.", "Giao thông.", "Xây dựng.", "Giải trí."], "a": 0, "e": "Đáp án đúng là A. Công nghiệp. Ghi nhớ: Bộ xử lí có mặt khắp nơi; máy tính tính nhanh, chính xác, lưu trữ lớn, kết nối toàn cầu nhưng không cảm thụ văn học.", "n": 2}, {"q": "Máy tính không có khả năng nào sau đây?", "o": ["Kết nối toàn cầu với tốc độ cao.", "Lưu trữ dữ liệu với dung lượng lớn.", "Cảm thụ văn học.", "Tính toán nhanh."], "a": 2, "e": "Đáp án đúng là C. Cảm thụ văn học. (Lưu ý: đề yêu cầu chọn phát biểu SAI / phương án KHÔNG đúng, nên đọc kĩ từ phủ định.) Ghi nhớ: Bộ xử lí có mặt khắp nơi; máy tính tính nhanh, chính xác, lưu trữ lớn, kết nối toàn cầu nhưng không cảm thụ văn học.", "n": 3}, {"q": "Phát biểu nào sau đây sai?", "o": ["Máy tính được ứng dụng hiệu quả trong nhiều lĩnh vực của khoa học kĩ thuật và đời sống.", "Nhiều dữ liệu hiện có trên Internet là miễn phí.", "Công nghệ thông tin có tác động tiêu cực đến con người và xã hội nhiều hơn so với tác động tích cực.", "Cần sử dụng công nghệ thông tin đúng cách để tránh những tác động tiêu cực đến cuộc sống."], "a": 2, "e": "Đáp án đúng là C. Công nghệ thông tin có tác động tiêu cực đến con người và xã hội nhiều hơn so với tác động tích cực. (Lưu ý: đề yêu cầu chọn phát biểu SAI / phương án KHÔNG đúng, nên đọc kĩ từ phủ định.) Ghi nhớ: Bộ xử lí có mặt khắp nơi; máy tính tính nhanh, chính xác, lưu trữ lớn, kết nối toàn cầu nhưng không cảm thụ văn học.", "n": 4}, {"q": "Phương án nào sau đây là ví dụ về thiết bị có gắn bộ xử lí trong giáo dục?", "o": ["Tủ lạnh.", "Máy bán hàng tự động.", "Robot hút bụi.", "Máy chiếu trong lớp học."], "a": 3, "e": "Đáp án đúng là D. Máy chiếu trong lớp học. Ghi nhớ: Bộ xử lí có mặt khắp nơi; máy tính tính nhanh, chính xác, lưu trữ lớn, kết nối toàn cầu nhưng không cảm thụ văn học.", "n": 5}, {"q": "Thiết bị bay không người lái để gieo hạt giống, phun thuốc trừ sâu,… là thiết bị có gắn bộ xử lí được sử dụng trong lĩnh vực nào?", "o": ["Giao thông.", "Sinh học.", "Nông nghiệp.", "Công nghiệp."], "a": 2, "e": "Đáp án đúng là C. Nông nghiệp. (Lưu ý: đề yêu cầu chọn phát biểu SAI / phương án KHÔNG đúng, nên đọc kĩ từ phủ định.) Ghi nhớ: Bộ xử lí có mặt khắp nơi; máy tính tính nhanh, chính xác, lưu trữ lớn, kết nối toàn cầu nhưng không cảm thụ văn học.", "n": 6}, {"q": "Thành phần quan trọng nhất được ví như 'bộ não' của máy tính, thực hiện các thao tác xử lý thông tin là:", "o": ["Bộ nhớ ngoài.", "Màn hình hiển thị.", "Bộ xử lý trung tâm (CPU).", "Bàn phím máy tính."], "a": 2, "e": "Đáp án đúng là C. Bộ xử lý trung tâm (CPU). Ghi nhớ: Bộ xử lí có mặt khắp nơi; máy tính tính nhanh, chính xác, lưu trữ lớn, kết nối toàn cầu nhưng không cảm thụ văn học.", "n": 7}, {"q": "Một gia đình muốn thiết kế hệ thống 'nhà thông minh' tự động bật đèn khi có người và tự động điều chỉnh điều hòa theo nhiệt độ phòng. Gia đình đó cần lựa chọn nhóm thiết bị nào?", "o": ["Các thiết bị cơ học truyền thống không dùng điện.", "Các thiết bị gia dụng tích hợp bộ xử lý thông tin và cảm biến có kết nối mạng.", "Các máy tính để bàn công suất lớn đặt ở mỗi phòng.", "Các công tắc điện thông thường."], "a": 1, "e": "Đáp án đúng là B. Các thiết bị gia dụng tích hợp bộ xử lý thông tin và cảm biến có kết nối mạng. Ghi nhớ: Bộ xử lí có mặt khắp nơi; máy tính tính nhanh, chính xác, lưu trữ lớn, kết nối toàn cầu nhưng không cảm thụ văn học.", "n": 8}], "f": []}, {"b": 2, "t": "Đặc điểm quan trọng của thông tin trong giải quyết vấn đề", "q": [{"q": "Chất lượng thông tin được đánh giá thông qua mấy tiêu chí?", "o": ["1.", "2.", "3.", "4."], "a": 3, "e": "Đáp án đúng là D. 4. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "n": 9}, {"q": "Tiêu chí nào sau đây không được dùng để đánh giá chất lượng thông tin?", "o": ["Tính sử dụng được.", "Tính hấp dẫn.", "Tính cập nhật.", "Tính đầy đủ."], "a": 1, "e": "Đáp án đúng là B. Tính hấp dẫn. (Lưu ý: đề yêu cầu chọn phát biểu SAI / phương án KHÔNG đúng, nên đọc kĩ từ phủ định.) Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "n": 10}, {"q": "Chất lượng thông tinh được đánh giá thông qua:", "o": ["Tính mới", "Tính chính xác", "Tính mới và tính chính xác", "Tính mới, tính chính xác, tính đầy đủ, tính sử dụng được"], "a": 3, "e": "Đáp án đúng là D. Tính mới, tính chính xác, tính đầy đủ, tính sử dụng được Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "n": 11}, {"q": "Phát biểu nào sau đây sai?", "o": ["Internet là một kho thông tin khổng lồ.", "Cần phải quan tâm đến chất lượng thông tin khi tìm kiếm, tiếp nhận, trao đổi và sử dụng thông tin để có thể đưa ra các quyết định đúng đắn.", "Số lượng bản tin làm cho thông tin trở thành hữu ích.", "Em có thể tìm thấy nhiều thông tin trên Internet nhưng không phải thông tin nào cũng có thể sử dụng để giải quyết vấn đề."], "a": 2, "e": "Đáp án đúng là C. Số lượng bản tin làm cho thông tin trở thành hữu ích. (Lưu ý: đề yêu cầu chọn phát biểu SAI / phương án KHÔNG đúng, nên đọc kĩ từ phủ định.) Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "n": 12}, {"q": "Tính chính xác của thông tin thể hiện điều gì?", "o": ["Thể hiện thông tin đã bị lỗi thời chưa.", "Thể hiện tính phù hợp của thông tin với vấn đề hay câu hỏi được đặt ra.", "Thể hiện sự bao quát nhiều khía cạnh, có được cái nhìn tổng thể về vấn đề được đặt ra.", "Thể hiện tính đúng đắn của thông tin."], "a": 3, "e": "Đáp án đúng là D. Thể hiện tính đúng đắn của thông tin. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "n": 13}, {"q": "Phát biểu nào sau đây sai?", "o": ["Thông tin là cơ sở để ra quyết định.", "Chất lượng thông tin trên Internet thể hiện ở số lượng người đọc.", "Không phải thông tin nào trên Internet cũng hữu ích đối với việc giải quyết vấn đề.", "Nếu thông tin không liên quan tới vấn đề được đặt ra thì em sẽ không sử dụng được và thông tin trở nên vô ích."], "a": 1, "e": "Đáp án đúng là B. Chất lượng thông tin trên Internet thể hiện ở số lượng người đọc. (Lưu ý: đề yêu cầu chọn phát biểu SAI / phương án KHÔNG đúng, nên đọc kĩ từ phủ định.) Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "n": 14}, {"q": "Khi tìm kiếm thông tin về Cuộc thi Viết thư Quốc tế UPU năm học 2024 – 2025, bạn Minh đã không để ý đến thời hạn nộp bài dự thi nên đã bỏ lỡ cơ hội tham gia. Theo em, sơ suất này vi phạm tiêu chí nào về chất lượng thông tin?", "o": ["Tính đầy đủ.", "Tính chính xác.", "Tính mới.", "Tính sử dụng được."], "a": 0, "e": "Đáp án đúng là A. Tính đầy đủ. (Lưu ý: đề yêu cầu chọn phát biểu SAI / phương án KHÔNG đúng, nên đọc kĩ từ phủ định.) Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "n": 15}, {"q": "Trong các thiết bị sau đây, thiết bị nào là thiết bị số có gắn bộ xử lý thông tin?", "o": ["Bảng đen trong lớp học.", "Điện thoại thông minh.", "Thước kẻ nhựa.", "Đồng hồ cơ đeo tay."], "a": 1, "e": "Đáp án đúng là B. Điện thoại thông minh. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "n": 16}, {"q": "Tiêu chí nào của chất lượng thông tin thể hiện sự bao quát, cung cấp đầy đủ các khía cạnh cần thiết để giải quyết vấn đề?", "o": ["Tính mới.", "Tính đầy đủ.", "Tính chính xác.", "Tính sử dụng được."], "a": 1, "e": "Đáp án đúng là B. Tính đầy đủ. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "n": 17}], "f": [{"q": "Một trong những khả năng nổi bật của máy tính là khả năng lưu trữ dữ liệu. Khả năng này cho phép máy tính lưu giữ một lượng thông tin khổng lồ và truy xuất chúng một cách nhanh chóng. Dưới đây là một số nhận định về khả năng này:", "s": ["Máy tính có thể lưu trữ mọi loại dữ liệu, kể cả những dữ liệu không có cấu trúc như hình ảnh, âm thanh và video.", "Khả năng lưu trữ của máy tính không giới hạn, chúng ta có thể lưu trữ bất kỳ lượng dữ liệu nào mà mình muốn.", "Các thiết bị lưu trữ như ổ cứng, thẻ nhớ có tuổi thọ không giới hạn và dữ liệu sẽ được bảo toàn vĩnh viễn.", "Vi rút máy tính có thể làm hỏng dữ liệu được lưu trữ trên máy tính."], "a": [1, 0, 0, 1], "e": ["ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («không giới hạn»). Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («không giới hạn»). Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được."], "n": 68}, {"q": "Trong cuộc sống hiện đại, công nghệ thông tin đã trở thành một phần không thể thiếu. Chúng ta sử dụng điện thoại thông minh để liên lạc, tìm kiếm thông tin, giải trí và làm việc hàng ngày. Các ứng dụng như mạng xã hội, email, trình duyệt web, và các ứng dụng đặt hàng trực tuyến đã trở nên quá quen thuộc. Nhờ công nghệ, chúng ta có thể kết nối với mọi người trên toàn cầu, tiếp cận thông tin một cách nhanh chóng và thuận tiện, cũng như thực hiện các giao dịch mua sắm một cách dễ dàng. Dưới đây là một số nhận định về vai trò của công nghệ thông tin:", "s": ["Công nghệ thông tin chủ yếu được sử dụng để giải trí.", "Công nghệ thông tin giúp chúng ta tiết kiệm thời gian và công sức.", "Công nghệ thông tin chỉ dành cho giới trẻ.", "Công nghệ thông tin làm giảm đi sự tương tác trực tiếp giữa con người."], "a": [0, 1, 0, 1], "e": ["SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («chỉ»). Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được."], "n": 69}, {"q": "Việc ra quyết định sáng suốt đòi hỏi chúng ta phải có những thông tin chính xác và đầy đủ. Thông tin đúng đắn giúp chúng ta hiểu rõ vấn đề, đánh giá được các lựa chọn và đưa ra quyết định phù hợp nhất. Dựa trên các nhận định sau, đâu là biểu hiện của một thông tin mang tính chính xác:", "s": ["Thông tin được cập nhật thường xuyên, phản ánh những diễn biến mới nhất của vấn đề.", "Thông tin dựa trên những câu chuyện cá nhân, kinh nghiệm chủ quan.", "Thông tin phù hợp với những gì đã biết về vấn đề đó.", "Thông tin sử dụng những từ ngữ mang tính tuyệt đối như \"luôn luôn\", \"không bao giờ\"."], "a": [0, 0, 1, 0], "e": ["SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («luôn»). Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được."], "n": 70}, {"q": "Mạng xã hội là một phần không thể thiếu trong cuộc sống hiện đại. Tuy nhiên, việc sử dụng mạng xã hội cũng tiềm ẩn nhiều rủi ro. Dưới đây là một số hành vi có thể gây ra những hậu quả tiêu cực khi sử dụng mạng xã hội:", "s": ["Tham gia vào các cuộc tranh luận sôi nổi trên mạng xã hội, bày tỏ quan điểm cá nhân một cách thẳng thắn và trung thực, dù có thể gây tranh cãi với những người có quan điểm khác.", "Kết bạn với những người có cùng sở thích trên mạng xã hội, chia sẻ những khoảnh khắc vui vẻ trong cuộc sống và tạo dựng một cộng đồng mạng thân thiết.", "Tạo ra các nội dung sáng tạo và chia sẻ chúng trên mạng xã hội, nhằm thể hiện bản thân và kết nối với cộng đồng.", "Chia sẻ thông tin cá nhân lên các nền tảng mạng xã hội, đặc biệt là những thông tin nhạy cảm như địa chỉ nhà, số điện thoại, lịch trình sinh hoạt, phơi bày quá nhiều về cuộc sống cá nhân lên mạng xã hội."], "a": [0, 0, 0, 1], "e": ["SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được."], "n": 71}, {"q": "Tìm hiểu về thiết bị số và vai trò của bộ xử lý thông tin trong đời sống hiện đại.", "s": ["Bộ xử lý thông tin (CPU hoặc vi xử lý) chỉ xuất hiện trong máy tính để bàn và máy tính xách tay, không có trong các thiết bị gia dụng.", "Máy tính có khả năng tính toán nhanh, chính xác, lưu trữ dung lượng lớn và làm việc bền bỉ.", "Đồng hồ thông minh (smartwatch) là một thiết bị số vì nó tích hợp vi xử lý để đo nhịp tim, đếm bước chân và kết nối điện thoại.", "Mọi thông tin tìm kiếm được trên mạng Internet đều có độ chính xác cao và có thể sử dụng ngay mà không cần kiểm chứng."], "a": [0, 1, 1, 0], "e": ["SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («chỉ»). Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («Mọi»). Ghi nhớ: Chất lượng thông tin gồm 4 tiêu chí: tính mới, tính chính xác, tính đầy đủ, tính sử dụng được."], "n": 72}]}, {"b": 3, "t": "Chất lượng thông tin và nguồn thông tin đáng tin cậy", "q": [{"q": "Nguồn thông tin đáng tin cậy để tìm hiểu thông tin về kì thi tuyển sinh lớp 10 là", "o": ["mạng xã hội.", "trang web của Bộ Thông tin và Truyền thông.", "trang web của Sở Giáo dục và Đào tạo.", "thông tin từ bạn bè."], "a": 2, "e": "Đáp án đúng là C. trang web của Sở Giáo dục và Đào tạo. Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "n": 18}, {"q": "Thông tin nào sau đây phù hợp với mục tiêu du học nước ngoài?", "o": ["Thông tin xét tuyển các trường THPT trong nước.", "Dự báo thời tiết.", "Điều kiện xin học học bổng du học.", "Luật an ninh mạng."], "a": 2, "e": "Đáp án đúng là C. Điều kiện xin học học bổng du học. Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "n": 19}, {"q": "Em cần tìm kiếm thông tin về bài thi IELTS ở đâu?", "o": ["Website của Bộ Giáo dục và Đào tạo.", "Website của các đơn vị tổ chức thi (Hội đồng Anh, IDP).", "Website của nhà trường.", "Website của Sở Giáo dục và Đào tạo."], "a": 1, "e": "Đáp án đúng là B. Website của các đơn vị tổ chức thi (Hội đồng Anh, IDP). Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "n": 20}, {"q": "Nguồn thông tin nào sau đây là đáng tin cậy nhất?", "o": ["Ý kiến của người thân.", "Các loại sách tham khảo phổ biến trên thị trường.", "Những chia sẻ cá nhân trên Internet.", "Sách giáo khoa do Nhà xuất bản Giáo dục Việt Nam phát hành."], "a": 3, "e": "Đáp án đúng là D. Sách giáo khoa do Nhà xuất bản Giáo dục Việt Nam phát hành. Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "n": 21}, {"q": "Tiêu chí 'Tính mới' của thông tin khi thu thập nhằm giải quyết vấn đề được hiểu là gì?", "o": ["Thông tin được cập nhật gần nhất, không bị lỗi thời.", "Thông tin chứa đựng đầy đủ mọi chi tiết của sự việc.", "Thông tin hoàn toàn chính xác từ nguồn tin cậy.", "Thông tin phù hợp trực tiếp với mục đích sử dụng."], "a": 0, "e": "Đáp án đúng là A. Thông tin được cập nhật gần nhất, không bị lỗi thời. Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "n": 22}, {"q": "Để tìm kiếm thông tin tuyển sinh chính thức vào lớp 10 của Sở Giáo dục và Đào tạo, trang web chính thống thường có tên miền kết thúc bằng:", "o": [".com.vn", ".org.vn", ".edu.vn", ".net.vn"], "a": 2, "e": "Đáp án đúng là C. .edu.vn Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "n": 23}, {"q": "Thao tác nào sau đây giúp kiểm tra 'Tính chính xác' của thông tin thu thập được trên mạng Internet?", "o": ["Kiểm tra xem bài viết có hình ảnh minh họa hay không.", "Đếm số lượng chia sẻ (share) của bài viết.", "Đối chiếu thông tin từ nhiều nguồn chính thống khác nhau.", "Xem bài viết được đăng vào khung giờ nào trong ngày."], "a": 2, "e": "Đáp án đúng là C. Đối chiếu thông tin từ nhiều nguồn chính thống khác nhau. Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "n": 24}, {"q": "Vì sao khi tìm kiếm thông tin để chọn trường THPT, học sinh không nên chỉ dựa vào một bài đăng quảng cáo cá nhân trên mạng xã hội?", "o": ["Vì mạng xã hội cấm chia sẻ thông tin giáo dục.", "Vì bài đăng quảng cáo có thể thiếu tính khách quan, chưa đầy đủ hoặc không cập nhật chính xác tiêu chí tuyển sinh.", "Vì thông tin trên mạng xã hội luôn luôn là thông tin bị mã hóa.", "Vì thông tin tuyển sinh chỉ được công bố qua sách in."], "a": 1, "e": "Đáp án đúng là B. Vì bài đăng quảng cáo có thể thiếu tính khách quan, chưa đầy đủ hoặc không cập nhật chính xác tiêu chí tuyển sinh. (Lưu ý: đề yêu cầu chọn phát biểu SAI / phương án KHÔNG đúng, nên đọc kĩ từ phủ định.) Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "n": 25}, {"q": "Để đánh giá tính 'sử dụng được' của một nguồn thông tin vừa thu thập, học sinh cần căn cứ vào điều gì?", "o": ["Mức độ liên quan và phù hợp của thông tin đó đối với mục tiêu/vấn đề cần giải quyết.", "Dung lượng lưu trữ của tệp văn bản.", "Tốc độ tải về của trang web chứa thông tin.", "Định dạng hình ảnh đính kèm trong bài viết."], "a": 0, "e": "Đáp án đúng là A. Mức độ liên quan và phù hợp của thông tin đó đối với mục tiêu/vấn đề cần giải quyết. Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "n": 26}, {"q": "Bạn Nam cần tìm thông tin về lịch thi học sinh giỏi cấp tỉnh. Bạn tìm thấy hai nguồn: (1) Bài đăng trên diễn đàn cá nhân từ 2 năm trước; (2) Thông báo chính thức trên trang điện tử của Sở GD&ĐT đăng tuần trước. Nam nên chọn nguồn nào và vì sao?", "o": ["Chọn nguồn (1) vì diễn đàn có nhiều bình luận tương tác.", "Chọn nguồn (2) vì đảm bảo tính mới, tính chính xác và độ tin cậy cao nhất.", "Chọn cả hai nguồn và lấy trung bình thời gian.", "Không chọn nguồn nào vì thông tin trên Internet đều sai."], "a": 1, "e": "Đáp án đúng là B. Chọn nguồn (2) vì đảm bảo tính mới, tính chính xác và độ tin cậy cao nhất. Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "n": 27}], "f": [{"q": "Nhờ có thông tin, con người có thể đưa ra những quyết định sáng suốt, giải quyết vấn đề một cách hiệu quả. Tuy nhiên, trước lượng thông tin khổng lồ, việc sàng lọc và đánh giá thông tin trở nên vô cùng quan trọng. Dưới đây là một số nhận định về vai trò của thông tin trong giải quyết vấn đề:", "s": ["Thông tin chính xác là nền tảng cho mọi quyết định trong cuộc sống.", "Tất cả thông tin trên mạng đều đáng tin cậy.", "Chỉ cần đọc nhiều thông tin là sẽ có nhiều kiến thức.", "Việc tìm kiếm và đánh giá thông tin là một kỹ năng sống cần thiết."], "a": [1, 0, 0, 1], "e": ["ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («Tất cả»). Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («Chỉ»). Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn."], "n": 73}, {"q": "Trong cuộc sống hàng ngày, chúng ta tiếp xúc với rất nhiều nguồn thông tin khác nhau, từ báo chí, truyền hình, mạng xã hội cho đến sách báo. Tính mới của thông tin giúp chúng ta cập nhật những tin tức nóng hổi, những sự kiện đang diễn ra, những xu hướng mới nổi. Sau đây là một số ý kiến về đặc trưng của tính mới (tính cập nhật) của thông tin:", "s": ["Tính mới thể hiện mức độ cập nhật, phản ánh đúng thực tế và những diễn biến mới nhất của một vấn đề hoặc sự kiện.", "Thông tin mới có giá trị cao hơn thông tin cũ, mang lại giá trị thực tiễn lớn hơn.", "Thông tin mới luôn thay thế hoàn toàn thông tin cũ.", "Tính mới là yếu tố duy nhất để đánh giá giá trị của thông tin."], "a": [1, 1, 0, 0], "e": ["ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («luôn»). Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («duy nhất»). Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn."], "n": 74}, {"q": "Trong thời đại thông tin phát triển như hiện nay, việc tiếp cận thông tin trở nên dễ dàng hơn bao giờ hết. Tuy nhiên, điều này cũng đồng nghĩa với việc chúng ta dễ dàng bị \"ngập lụt\" bởi lượng thông tin quá lớn. Dưới đây là một số nhận định về cách hạn chế tối đa việc sử dụng thông tin sai lệch:", "s": ["Tập trung vào các nguồn tin có lượng tương tác cao trên mạng xã hội, bởi vì sự đồng thuận của cộng đồng thường là một chỉ số đáng tin cậy.", "Kiểm chứng thông tin từ nhiều nguồn khác nhau, ưu tiên các nguồn tin được xác thực bởi các tổ chức độc lập, có uy tín và cung cấp bằng chứng cụ thể.", "Tìm kiếm thông tin từ nhiều nguồn khác nhau, bao gồm cả các nguồn tin không chính thống, để có cái nhìn đa chiều về vấn đề.", "Kiểm tra xem thông tin có được cập nhật thường xuyên hay không, đặc biệt là đối với các vấn đề có tính thời sự cao."], "a": [0, 1, 0, 1], "e": ["SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («chỉ»). Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Chọn nguồn tin cậy đúng lĩnh vực: cơ quan quản lí, đơn vị tổ chức, sách giáo khoa chính thống; đối chiếu nhiều nguồn."], "n": 75}]}, {"b": 4, "t": "Đạo đức, pháp luật và văn hoá trong môi trường số", "q": [{"q": "Công nghệ thông tin có tác động tiêu cực như thế nào đến sức khoẻ thể chất của con người?", "o": ["Khiến con người trở nên thụ động.", "Gây giảm thị lực.", "Giảm tương tác giữa người với người.", "Thông tin giả tràn lan."], "a": 1, "e": "Đáp án đúng là B. Gây giảm thị lực. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 28}, {"q": "“Não của chúng ta hoạt động ít dần vì sự xuất hiện của công nghệ cao”, nhà thần kinh học Michael Merzenich cho biết trong cuốn sách “The Shallows: What The Internet Is Doing To Our Brains”, cảnh báo tác động của công nghệ đối với trí thông minh của con người, nguy hiểm tới mức không tưởng. Vậy theo em, công nghệ thông tin tác động lên não của chúng ta như thế nào?", "o": ["Đạo đức suy giảm.", "Tỉ lệ thất nghiệp tăng.", "Chênh lệnh giàu nghèo ngày càng lớn.", "Giảm độ tập trung."], "a": 3, "e": "Đáp án đúng là D. Giảm độ tập trung. (Lưu ý: đề yêu cầu chọn phát biểu SAI / phương án KHÔNG đúng, nên đọc kĩ từ phủ định.) Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 29}, {"q": "Hành vi nào sau đây là thiếu văn hoá khi hoạt động trong môi trường số?", "o": ["Dùng từ ngữ phản cảm khi bình luận trên các diễn đàn, mạng xã hội.", "Sử dụng phần mềm không có bản quyền.", "Làm lộ thông tin cá nhân, tổ chức gây ảnh hưởng xấu.", "Sử dụng dữ liệu của người khác mà không xin phép."], "a": 0, "e": "Đáp án đúng là A. Dùng từ ngữ phản cảm khi bình luận trên các diễn đàn, mạng xã hội. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 30}, {"q": "Tự ý đăng địa chỉ nhà của người khác là", "o": ["hành vi vi phạm pháp luật liên quan đến sở hữu trí tuệ, sở hữu tài sản, đánh bạc,...", "hành vi vi phạm quyền nhân thân, uy tín của cá nhân và tổ chức.", "hành vi vi phạm an ninh quốc gia, trật tự, an toàn xã hội.", "hành vi vi phạm đến việc bảo đảm an toàn thông tin trên không gian mạng."], "a": 1, "e": "Đáp án đúng là B. hành vi vi phạm quyền nhân thân, uy tín của cá nhân và tổ chức. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 31}, {"q": "Phương án nào sau đây không phải là tác động tiêu cực của công nghệ kĩ thuật số đến đời sống con người?", "o": ["Nhờ trí tuệ nhân tạo làm bài tập về nhà", "Truy cập mạng xã hội trong nhiều giờ", "Thường xuyên sử dụng phần mềm soạn thảo văn bản để làm báo cáo", "Vừa ăn vừa xem video trên trang YouTube"], "a": 2, "e": "Đáp án đúng là C. Thường xuyên sử dụng phần mềm soạn thảo văn bản để làm báo cáo (Lưu ý: đề yêu cầu chọn phát biểu SAI / phương án KHÔNG đúng, nên đọc kĩ từ phủ định.) Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 32}, {"q": "Công nghệ kĩ thuật số có tác động tiêu cực đến quyền riêng tư như thế nào?", "o": ["Gây mất ngủ.", "Ít giao tiếp.", "Thông tin cá nhân có thể bị rò rỉ và sử dụng bất hợp pháp.", "Gây nghiện Internet."], "a": 2, "e": "Đáp án đúng là C. Thông tin cá nhân có thể bị rò rỉ và sử dụng bất hợp pháp. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 33}, {"q": "Công nghệ kĩ thuật số có tác động tiêu cực đến môi trường như thế nào?", "o": ["Nguy cơ thất nghiệp tăng.", "Tổn hại thị lực.", "Giúp tiết kiệm thời gian di chuyển.", "Tạo ra rác thải điện tử."], "a": 3, "e": "Đáp án đúng là D. Tạo ra rác thải điện tử. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 34}, {"q": "Công nghệ kĩ thuật số có tác động tiêu cực đến xã hội như thế nào?", "o": ["Thúc đẩy các nền kinh tế truyền thống chuyển đổi sang kinh tế tri thức.", "Hạn chế những ý tưởng sáng tạo do thói quen tìm kiếm trên Google.", "Khiến cho một bộ phận người dân yếu thế như người già, người khuyết tật ngày càng tụt hậu.", "Tăng nguy cơ mắc các bệnh liên quan đến tim mạch, tiểu đường, ung thư và béo phì do ít vận động."], "a": 2, "e": "Đáp án đúng là C. Khiến cho một bộ phận người dân yếu thế như người già, người khuyết tật ngày càng tụt hậu. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 35}, {"q": "Phương án nào sau đây không phải là tác động tiêu cực của công nghệ số đến đời sống con người?", "o": ["Thông tin cá nhân bị rò rỉ và sử dụng bất hợp pháp.", "Cung cấp các công cụ giáo dục tiên tiến.", "Thiết bị số nhanh chóng trở nên lỗi thời.", "Người dân ở các vùng khó khăn ngày càng tụt hậu."], "a": 1, "e": "Đáp án đúng là B. Cung cấp các công cụ giáo dục tiên tiến. (Lưu ý: đề yêu cầu chọn phát biểu SAI / phương án KHÔNG đúng, nên đọc kĩ từ phủ định.) Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 36}, {"q": "Công nghệ kĩ thuật số giúp tạo ra một nền giáo dục hiện đại và tiên tiến như thế nào?", "o": ["Cải thiện quy trình tuyển dụng, thu thập và phân tích dữ liệu kinh doanh chính xác hơn.", "Các nguồn tài nguyên trực tuyến không giới hạn phục vụ cho việc nghiên cứu.", "Tạo điều kiện cho việc mua sắm trực tuyến ngày càng phổ biến.", "Tạo ra lợi nhuận cho các doanh nghiệp."], "a": 1, "e": "Đáp án đúng là B. Các nguồn tài nguyên trực tuyến không giới hạn phục vụ cho việc nghiên cứu. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 37}, {"q": "Ví dụ về việc con người quá lệ thuộc vào công nghệ kĩ thuật số để giải quyết những vấn đề nhỏ trong cuộc sống là", "o": ["Việc lộ thông tin tài khoản ngân hàng có thể bị mất tiền trong tài khoản.", "Lừa đảo qua mạng.", "Học sinh lười suy nghĩ, nhờ trí tuệ nhân tạo làm bài tập về nhà.", "Gia tăng ô nhiễm môi trường."], "a": 2, "e": "Đáp án đúng là C. Học sinh lười suy nghĩ, nhờ trí tuệ nhân tạo làm bài tập về nhà. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 38}, {"q": "Công nghệ kĩ thuật số có tác động tiêu cực đến sức khoẻ tinh thần của con người như thế nào?", "o": ["Gây ra các vấn đề về cột sống.", "Suy giảm sự sáng tạo.", "Thách thức về an ninh dữ liệu.", "Nguy cơ trầm cảm và lo lắng."], "a": 3, "e": "Đáp án đúng là D. Nguy cơ trầm cảm và lo lắng. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 39}, {"q": "Việc lộ thông tin cá nhân trên Internet dẫn đến hậu quả gì?", "o": ["Giảm kết nối, tương tác trực tiếp giữa người với người.", "Tài khoản bị mạo danh.", "Thay đổi thói quen sinh hoạt.", "Hình thành thói quen thích được chú ý."], "a": 1, "e": "Đáp án đúng là B. Tài khoản bị mạo danh. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 40}, {"q": "Môi trường kinh doanh toàn cầu được tạo ra bởi cuộc cách mạng công nghiệp lần thứ tư và công nghiệp 4.0. Dưới sự phát triển bùng nổ của thời đại Internet, công nghiệp 4.0 trong thời đại này đã tạo ra những phát minh thay đổi hoàn toàn cách các doanh nghiệp vận hành. Em hãy tìm hiểu thông tin trên Internet và cho biết công nghệ nào cho phép người dùng có thể sử dụng các dịch vụ lưu trữ thông tin nhờ vào các nhà cung cấp như Facebook, Office 365, YouTube, …?", "o": ["Trí tuệ nhân tạo (AI).", "Điện toán đám mây (Cloud Computing).", "Khai phá dữ liệu (Data Mining).", "Internet vạn vật (Internet of Things)."], "a": 1, "e": "Đáp án đúng là B. Điện toán đám mây (Cloud Computing). Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 41}, {"q": "Công nghệ thông tin tác động tiêu cực đến môi trường như thế nào?", "o": ["Tạo ra thông tin sai lệch và tin tức giả mạo.", "Rác thải từ những sản phẩm công nghệ lỗi thời.", "Tăng nguy cơ thất nghiệp.", "Bạo lực mạng."], "a": 1, "e": "Đáp án đúng là B. Rác thải từ những sản phẩm công nghệ lỗi thời. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 42}, {"q": "Biện pháp để hạn chế tác động tiêu cực của công nghệ thông tin đến sức khoẻ thể chất của con người là", "o": ["cẩn trọng khi chia sẻ thông tin trên Internet và mạng xã hội.", "rèn luyện các kỹ năng tìm kiếm và đánh giá độ tin cậy của các thông tin nhận được.", "cập nhật các thông tin về tiến bộ công nghệ.", "dành thời gian giao lưu với người thân, bạn bè, chơi thể thao, tham gia các hoạt động ngoại khoá, …"], "a": 3, "e": "Đáp án đúng là D. dành thời gian giao lưu với người thân, bạn bè, chơi thể thao, tham gia các hoạt động ngoại khoá, … Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 43}, {"q": "Đâu là một tác động tiêu cực của công nghệ kỹ thuật số đối với sức khỏe thể chất và tinh thần của con người?", "o": ["Nghiện Internet, trò chơi điện tử dẫn đến suy giảm thị lực và mệt mỏi.", "Mở rộng khả năng giao tiếp toàn cầu.", "Tăng tốc độ tìm kiếm tri thức khoa học.", "Tự động hóa các dây chuyền sản xuất."], "a": 0, "e": "Đáp án đúng là A. Nghiện Internet, trò chơi điện tử dẫn đến suy giảm thị lực và mệt mỏi. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 44}, {"q": "Văn bản pháp lý nào của Việt Nam quy định về việc bảo đảm an toàn thông tin mạng và phòng chống hành vi vi phạm trên không gian mạng?", "o": ["Luật An ninh mạng.", "Luật Doanh nghiệp.", "Luật Lao động.", "Luật Thương mại."], "a": 0, "e": "Đáp án đúng là A. Luật An ninh mạng. (Lưu ý: đề yêu cầu chọn phát biểu SAI / phương án KHÔNG đúng, nên đọc kĩ từ phủ định.) Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 45}, {"q": "Phát biểu nào sau đây giải thích rõ nhất tác động tích cực của công nghệ thông tin trong lĩnh vực giáo dục?", "o": ["Cung cấp các nền tảng học trực tuyến, kho học liệu mở giúp học sinh học tập mọi lúc, mọi nơi.", "Tự động hóa hoàn toàn việc chấm bài mà không cần giáo viên.", "Giúp học sinh chơi game giải trí sau giờ học.", "Thay thế hoàn toàn các trường học truyền thống bằng máy tính."], "a": 0, "e": "Đáp án đúng là A. Cung cấp các nền tảng học trực tuyến, kho học liệu mở giúp học sinh học tập mọi lúc, mọi nơi. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 46}, {"q": "Hành vi nào sau đây vi phạm khía cạnh đạo đức và pháp lý khi trao đổi thông tin trong môi trường số?", "o": ["Trích dẫn rõ nguồn tác giả khi sử dụng tài liệu tham khảo.", "Sao chép bài viết của người khác rồi đăng lên trang cá nhân và nhận là của mình.", "Gửi email hỏi bài giáo viên chủ nhiệm.", "Tham gia thảo luận nhóm học tập trực tuyến lịch sự."], "a": 1, "e": "Đáp án đúng là B. Sao chép bài viết của người khác rồi đăng lên trang cá nhân và nhận là của mình. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 47}, {"q": "Nếu em nhận được tin nhắn từ một tài khoản lạ yêu cầu cung cấp mã OTP và thông tin tài khoản ngân hàng của bố mẹ để nhận quà trúng thưởng, em nên xử lý như thế nào?", "o": ["Cung cấp ngay thông tin để nhận quà thưởng.", "Chuyển tiếp tin nhắn cho tất cả bạn bè trong lớp cùng nhận thưởng.", "Tuyệt đối không cung cấp thông tin, báo cho bố mẹ/người lớn và chặn tài khoản gửi tin.", "Nhắn tin trêu đẹo người gửi tin nhắn."], "a": 2, "e": "Đáp án đúng là C. Tuyệt đối không cung cấp thông tin, báo cho bố mẹ/người lớn và chặn tài khoản gửi tin. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 48}, {"q": "Khi phát hiện hình ảnh cá nhân của mình bị kẻ xấu ghép chỉnh sửa rồi đăng tải bài viết xúc phạm trên mạng xã hội, quy trình xử lý đúng pháp luật và an toàn cho học sinh là gì?", "o": ["Đăng bài chửi bới lại kẻ xấu để đòi lại công bằng.", "Chụp lại bằng chứng, báo cáo bài viết, báo cho cha mẹ/thầy cô và cơ quan chức năng hỗ trợ giải quyết theo Luật An ninh mạng.", "Rủ bạn bè đến nhà kẻ xấu để gây gổ.", "Giấu kín không nói với ai và nghỉ học."], "a": 1, "e": "Đáp án đúng là B. Chụp lại bằng chứng, báo cáo bài viết, báo cho cha mẹ/thầy cô và cơ quan chức năng hỗ trợ giải quyết theo Luật An ninh mạng. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "n": 49}], "f": [{"q": "Sự phát triển của công nghệ thông tin đang đặt ra nhiều câu hỏi về tương lai của nhân loại. Máy tính có thể thực hiện nhiều công việc mà trước đây chỉ con người mới làm được, từ lái xe đến chẩn đoán bệnh. Tuy nhiên, việc phát triển công nghệ thông tin quá nhanh cũng gây ra lo ngại về việc mất việc làm và sự lệ thuộc vào máy móc. Sau đây là những nhận định về mối quan hệ giữa con người và máy tính trong tương lai:", "s": ["Máy tính sẽ trở thành những trợ lý đắc lực, hỗ trợ con người trong mọi khía cạnh của cuộc sống.", "Máy tính sẽ thống trị thế giới và thay thế con người.", "Sự phát triển của trí tuệ nhân tạo đang thay đổi cách con người sống và làm việc.", "Con người sẽ không còn cần làm việc nữa vì máy tính sẽ làm tất cả."], "a": [1, 0, 1, 0], "e": ["ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («thống trị»). Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («tất cả»). Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật."], "n": 76}, {"q": "Công nghệ giáo dục đã tạo ra nhiều thay đổi trong cách chúng ta học tập. Từ việc học trực tuyến đến các ứng dụng học tập trên thiết bị di động, công nghệ đã mở ra những cánh cửa mới cho giáo dục. Dưới đây là một số nhận định về tác động của công nghệ thông tin lên giáo dục:", "s": ["Công nghệ giáo dục giúp học sinh tiếp cận kiến thức một cách chủ động và linh hoạt hơn.", "Công nghệ giáo dục có thể thay thế hoàn toàn giáo viên trong tương lai.", "Công nghệ giáo dục chỉ phù hợp với học sinh ở các thành phố lớn, còn học sinh ở vùng nông thôn khó tiếp cận.", "Công nghệ giáo dục có thể làm giảm sự tương tác trực tiếp giữa học sinh và giáo viên."], "a": [1, 0, 0, 1], "e": ["ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («thay thế»). Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («chỉ»). Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật."], "n": 77}, {"q": "Trong thời đại số, công nghệ thông tin đã trở thành một phần không thể thiếu trong cuộc sống của chúng ta, đặc biệt là trong học tập. Internet, máy tính đã mở ra một kho tàng kiến thức vô tận, giúp chúng ta tiếp cận thông tin một cách nhanh chóng và dễ dàng. Tuy nhiên, bên cạnh những lợi ích to lớn, việc sử dụng công nghệ không đúng cách cũng tiềm ẩn nhiều nguy hiểm như nghiện mạng xã hội, tiếp xúc với nội dung độc hại, hoặc mất tập trung trong học tập. Dưới đây là một số ý kiến về cách sử dụng công nghệ thông tin hiệu quả:", "s": ["Tìm kiếm thông tin từ nhiều nguồn khác nhau và so sánh để đưa ra kết luận.", "Tìm kiếm sự giúp đỡ từ cộng đồng trực tuyến khi gặp khó khăn.", "Chỉ sử dụng một loại thiết bị duy nhất để học tập.", "Chia sẻ thông tin cá nhân một cách rộng rãi trên mạng xã hội."], "a": [1, 1, 0, 0], "e": ["ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («Chỉ»). Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật."], "n": 78}, {"q": "Khi thu thập thông tin về tác động của biến đổi khí hậu, các học sinh được yêu cầu tìm kiếm một bài báo nghiên cứu có liên quan. Sau đây là một số nhận định về dấu hiệu cho thấy một nguồn tin có thể được coi là đáng tin cậy:", "s": ["Bài báo được đăng trên một tạp chí khoa học có hệ số tác động cao và đã trải qua quá trình đánh giá ngang hàng.", "Tác giả của bài báo là một nhà khoa học có nhiều người theo dõi trên mạng xã hội.", "Bài báo trích dẫn nhiều nguồn tài liệu khác nhau, bao gồm cả các nguồn tài liệu không được đánh giá ngang hàng.", "Bài báo trích dẫn từ các nguồn tài liệu được đánh giá ngang hàng và các nghiên cứu thực nghiệm độc lập."], "a": [1, 0, 0, 1], "e": ["ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Tác động tiêu cực: sức khoẻ, quyền riêng tư, môi trường, xã hội; ứng xử có văn hoá, tuân thủ pháp luật."], "n": 79}, {"q": "Công nghệ kỹ thuật số đã và đang thay đổi sâu sắc cuộc sống của chúng ta. Từ cách chúng ta giao tiếp, làm việc, học tập đến giải trí, mọi thứ đều được số hóa. Dưới đây là một số ý kiến về tác động tích cực của công nghệ kĩ thuật số mang lại cho con người:", "s": ["Công nghệ số đã giúp con người tiếp cận thông tin một cách dễ dàng và nhanh chóng hơn.", "Công nghệ số đã làm tăng sự kết nối toàn cầu, đồng thời làm giảm chất lượng cuộc sống của người dân ở các nước đang phát triển.", "Công nghệ số đã thúc đẩy sự phát triển của nền kinh tế tri thức, đặc biệt là trong lĩnh vực big data và AI.", "Công nghệ số đã giúp học s ).", "Màu xanh lơ (Cyan) + Màu hồng sẫm (Magenta).", "Màu lam (Blue) + Màu lục (Green)."], "a": 0, "e": "Đáp án đúng là A. Màu hồng sẫm (Magenta) + Màu vàng (Yellow). Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "n": 58}, {"q": "Phần mềm mô phỏng là gì?", "o": ["Phần mềm dùng để soạn thảo văn bản và in ấn.", "Phần mềm mô phỏng hoạt động hoặc cơ chế của các đối tượng trong thực tế trên máy tính.", "Phần mềm diệt vi-rút bảo vệ máy tính.", "Phần mềm quản lý cơ sở dữ liệu học sinh."], "a": 1, "e": "Đáp án đúng là B. Phần mềm mô phỏng hoạt động hoặc cơ chế của các đối tượng trong thực tế trên máy tính. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "n": 59}, {"q": "Lợi ích lớn nhất của việc sử dụng phần mềm mô phỏng thí nghiệm khoa học trong nhà trường là gì?", "o": ["Thay thế hoàn toàn các môn học lý thuyết.", "Giúp học sinh quan sát trực quan hiện tượng, thực hiện các thí nghiệm nguy hiểm/đắt tiền an toàn và tiết kiệm chi phí.", "Giảm thời gian học tập của học sinh xuống một nửa.", "Giúp máy tính hoạt động nhanh hơn."], "a": 1, "e": "Đáp án đúng là B. Giúp học sinh quan sát trực quan hiện tượng, thực hiện các thí nghiệm nguy hiểm/đắt tiền an toàn và tiết kiệm chi phí. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "n": 60}], "f": [{"q": "Máy tính đã trở thành công cụ không thể thiếu trong cuộc sống hiện đại, đóng vai trò quan trọng trong việc thúc đẩy sự phát triển của khoa học kỹ thuật và nâng cao chất lượng cuộc sống. Nhờ có máy tính, các nhà khoa học có thể thực hiện những tính toán phức tạp, mô phỏng các hiện tượng tự nhiên và khám phá ra những điều mới mẻ. Còn trong đời sống, máy tính giúp chúng ta kết nối với mọi người trên toàn cầu, truy cập thông tin một cách nhanh chóng và thuận tiện, hỗ trợ việc học tập, làm việc và giải trí. Dưới đây là các nhận định về ứng dụng của máy tính trong đời sống:", "s": ["Máy tính chỉ được sử dụng trong lĩnh vực khoa học.", "Máy tính giúp tăng năng suất và hiệu quả làm việc.", "Máy tính giúp chúng ta kết nối với thế giới bên ngoài.", "Máy tính khiến con người trở nên lười biếng và phụ thuộc."], "a": [0, 1, 1, 0], "e": ["SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («chỉ»). Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng."], "n": 84}, {"q": "Phần mềm mô phỏng đã trở thành một công cụ linh hoạt, có thể ứng dụng trong nhiều tình huống khác nhau. Tuy nhiên, mục đích chính mà nó hướng tới vẫn luôn rõ ràng. Dưới đây là một số nhận định về mục đích chính của việc sử dụng phần mềm mô phỏng:", "s": ["Mục đích chính của phần mềm mô phỏng là phân tích các yếu tố ảnh hưởng đến hệ thống và đánh giá hiệu quả của các giải pháp.", "Mục đích chính của phần mềm mô phỏng là thay thế hoàn toàn các bản vẽ kỹ thuật 2D, giúp các kỹ sư tiết kiệm thời gian và công sức trong quá trình thiết kế.", "Mục đích chính của phần mềm mô phỏng là bảo vệ môi trường bằng cách giảm thiểu việc sử dụng nguyên liệu thô trong quá trình sản xuất.", "Mục đích chính của phần mềm mô phỏng là dự đoán kết quả của một quá trình hoặc hệ thống trước khi thực hiện nó trong thực tế."], "a": [1, 0, 0, 1], "e": ["ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («thay thế»). Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng."], "n": 85}, {"q": "Phần mềm mô phỏng đã trở thành một công cụ không thể thiếu trong nhiều lĩnh vực, từ thiết kế sản phẩm đến đào tạo. Với khả năng tái tạo các tình huống thực tế một cách chân thực, phần mềm mô phỏng mang lại nhiều lợi ích đáng kể. Sau đây là những nhận định về lợi ích khi sử dụng phần mềm mô phỏng:", "s": ["Phần mềm mô phỏng giúp phát hiện và khắc phục các lỗi thiết kế tiềm ẩn trước khi sản xuất, giảm thiểu rủi ro thất bại và tăng độ tin cậy của sản phẩm cuối cùng.", "Phần mềm mô phỏng cho phép người dùng tương tác trực tiếp với mô hình 3D, giúp họ hiểu sâu hơn về cấu trúc, chức năng và hoạt động của hệ thống.", "Phần mềm mô phỏng giúp tiết kiệm thời gian và chi phí vì có thể thay thế hoàn toàn các thử nghiệm thực tế.", "Phần mềm mô phỏng có thể tạo ra các sản phẩm thực tế mà không cần đến quá trình sản xuất truyền thống."], "a": [1, 1, 0, 0], "e": ["ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («thay thế»). Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "SAI. Nhận định dùng từ mang tính tuyệt đối/cực đoan («không cần»). Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng."], "n": 86}, {"q": "Phần mềm mô phỏng không chỉ là một công cụ, mà còn là một cầu nối giữa thế giới thực và thế giới ảo. Với khả năng tái tạo các quá trình và hiện tượng một cách chân thực, phần mềm mô phỏng giúp chúng ta hiểu rõ hơn về thế giới xung quanh. Vậy, phần mềm mô phỏng thường được sử dụng để mô phỏng hoạt động của đối tượng nào sau đây?", "s": ["Các quá trình sinh học.", "Các sự kiện lịch sử, các tác phẩm nghệ thuật.", "Các hiện tượng tự nhiên.", "Các hệ thống cơ khí đơn giản."], "a": [1, 0, 1, 1], "e": ["ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng."], "n": 87}, {"q": "Em hãy tìm kiếm trên Internet một phần mềm mô phỏng pha màu để tìm hiểu hệ màu CMYK và cho biết các màu đỏ (Red), lục (Green), lam (Blue) lần lượt được tạo ra từ những màu nào trong ba màu cơ bản xanh lơ (Cyan), hồng sẫm (Magenta) và vàng (Yellow) của hệ màu CMYK. Dưới đây là một số kết quả:", "s": ["Cyan + Yellow = Green (Lục)", "Cyan + Magenta = Red (Đỏ)", "Magenta + Yellow = Blue (Lam)", "Magenta + Yellow = Red (Đỏ)"], "a": [1, 0, 0, 1], "e": ["ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "SAI. Nhận định trái với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng.", "ĐÚNG. Nhận định phù hợp với kiến thức đã học. Ghi nhớ: Phần mềm mô phỏng: trực quan, an toàn, tiết kiệm; nhớ cặp phần mềm – chức năng."], "n": 88}, {"q": "Tác động của công nghệ số và ứng dụng phần mềm mô phỏng trong học tập.", "s": ["Sử dụng thiết bị số liên tục nhiều giờ trong ngày để chơi game không gây ảnh hưởng đến sức khỏe thể chất và tinh thần của học sinh.", "Phần mềm
