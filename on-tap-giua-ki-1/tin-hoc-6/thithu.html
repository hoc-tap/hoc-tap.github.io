<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kiểm tra thử - Tin học 6</title>
<style>
:root{--p:#4f7cff;--p2:#7c5cff;--ok:#16a34a;--bad:#ef4444;--bg:#f3f7ff;--tx:#1e293b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);background:linear-gradient(135deg,#eef4ff,#fdf2ff 60%,#effff6);min-height:100vh;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
[hidden]{display:none!important}
.bub{position:fixed;border-radius:50%;opacity:.35;animation:fl 14s ease-in-out infinite;z-index:0}
@keyframes fl{50%{transform:translateY(-40px) scale(1.15)}}
#nav{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;white-space:nowrap;background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;padding:9px 14px;font-size:14px;box-shadow:0 3px 12px #4f7cff55}
#nav span{overflow:hidden;text-overflow:ellipsis}
#nav .s{font-weight:800;flex:0 1 auto}#nav .t{flex:1 1 0;min-width:0}#nav .u{flex:0 1 auto}
#clk{margin-left:auto;flex:none;background:#fff;color:var(--p);font-weight:800;padding:3px 12px;border-radius:99px;font-variant-numeric:tabular-nums}
#clk.low{background:var(--bad);color:#fff;animation:pu 1s infinite}
@keyframes pu{50%{transform:scale(1.1)}}
#start{position:relative;z-index:1;max-width:420px;margin:7vh auto;padding:0 16px}
.card{background:#fff;border-radius:22px;padding:28px 24px;box-shadow:0 12px 40px #4f7cff30;animation:up .6s}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.card h1{margin:0 0 4px;font-size:22px;text-align:center;color:var(--p)}.card small{display:block;text-align:center;color:#64748b;margin-bottom:18px}
.em{font-size:54px;text-align:center;animation:bo 2s infinite}@keyframes bo{50%{transform:translateY(-8px)}}
.card input{width:100%;padding:13px 14px;margin:6px 0 12px;border:2px solid #dbe5ff;border-radius:12px;font-size:16px;outline:0;transition:.2s}
.card input:focus{border-color:var(--p);box-shadow:0 0 0 4px #4f7cff22}
.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--p),var(--p2));cursor:pointer;transition:.2s;width:100%}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #4f7cff55}.btn.g{background:#e2e8f0;color:#334155}
#err{color:var(--bad);min-height:20px;font-size:14px;margin-bottom:6px}
#strip{position:sticky;top:41px;z-index:15;display:flex;gap:6px;align-items:center;overflow-x:auto;padding:8px 10px;background:#fffffff2;box-shadow:0 2px 8px #0001}
#strip .btn{width:auto;padding:7px 14px;font-size:14px;flex:none}
.wrap{position:relative;z-index:1;display:flex;gap:18px;max-width:1100px;margin:0 auto;padding:14px 12px 80px;align-items:flex-start}
#qs{flex:1;min-width:0}
#side{display:none;width:270px;position:sticky;top:64px;background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 24px #4f7cff22}
@media(min-width:900px){#side{display:block}#strip{display:none}}
.gr{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
.gb{border:2px solid #dbe5ff;background:#fff;border-radius:9px;padding:7px 0;font-weight:700;cursor:pointer;color:#475569;flex:none;min-width:34px;transition:.15s}
.gb.done{background:var(--ok);border-color:var(--ok);color:#fff}.gb.skip{background:var(--bad);border-color:var(--bad);color:#fff}
.gb:hover{transform:scale(1.1)}
.pb{height:8px;background:#e2e8f0;border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#4f7cff);transition:.4s}
.sec{margin:18px 0 10px;padding:9px 16px;border-radius:12px;background:linear-gradient(90deg,#dbeafe,#ede9fe);color:#3730a3;font-size:17px}
.q{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px #4f7cff18;border:2px solid transparent;scroll-margin-top:110px;transition:.3s;animation:up .5s}
.q.skip{background:#fee2e2;border-color:#fca5a5}
.q p{margin:8px 0 12px;font-size:17px;line-height:1.5;font-weight:600}
.num{background:var(--p);color:#fff;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid #e2e8f0;background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:8px;font-size:16px;line-height:1.4;cursor:pointer;transition:.18s;font-family:inherit;color:inherit}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:#eef2ff;color:var(--p);display:grid;place-items:center}
.opt:hover{border-color:var(--p);transform:translateX(4px)}
.opt.sel{border-color:var(--p);background:#eef3ff;animation:pop .3s}.opt.sel b{background:var(--p);color:#fff}
@keyframes pop{50%{transform:scale(1.02)}}
.fig{width:100%;max-width:340px;display:block;margin:0 auto 12px;background:#f8fbff;border-radius:12px}
#mod{position:fixed;inset:0;background:#0f172a99;z-index:50;display:grid;place-items:center;padding:16px}
#mod>div{background:#fff;border-radius:18px;padding:22px;max-width:440px;width:100%;animation:up .3s;line-height:1.5}
#mod.w>div{border:4px solid var(--bad);animation:sh .5s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#mod .r{display:flex;gap:10px;margin-top:14px}
#res{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 12px 60px}
.sc{text-align:center;background:#fff;border-radius:22px;padding:26px;box-shadow:0 10px 30px #4f7cff30;margin-bottom:16px}
.sc .n{font-size:64px;font-weight:900;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.rv{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border-left:6px solid var(--ok);line-height:1.5}.rv.x{border-color:var(--bad)}
.rv .c{color:var(--ok);font-weight:700}.rv .w{color:var(--bad);font-weight:700}.rv .e{background:#f1f5f9;border-radius:8px;padding:8px;margin-top:6px;font-size:15px}
.cf{position:fixed;top:-30px;z-index:60;font-size:26px;animation:fall 3.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.lk #exam{filter:blur(30px)}
@media(max-width:600px){#nav{font-size:11px;gap:6px;padding:8px}.q p{font-size:16px}}
@media print{body{display:none}}
