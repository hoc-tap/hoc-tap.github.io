<style>
:root{--bg:#f4f7fc;--surface:#fff;--ink:#17233b;--muted:#5a6b88;--line:#dde5f2;--blue:#2457c5;--blue-soft:#e8effc;--ok:#0b8f55;--ok-soft:#e2f6ea;--bad:#d03a3a;--bad-soft:#fdeaea;--amber:#e59a00;--amber-soft:#fff7e0;--nav:64px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav) + 16px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.top{position:fixed;inset:0 0 auto 0;height:var(--nav);z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 max(16px,calc((100% - 1120px)/2))}
.brand{font-weight:700;font-size:1.05rem;color:var(--ink);text-decoration:none}.brand i{font-style:normal;color:var(--blue)}
.links{display:flex;gap:6px}

.toc{grid-column:2;grid-row:1;position:sticky;top:calc(var(--nav) + 16px);align-self:start;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}

.fb.good{border-left-color:var(--ok)}.fb.wrong{border-left-color:var(--bad)}

.yn button:disabled{cursor:default}.yn .ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}.yn .bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

 .toc h4,.score button{display:none}.toc a{flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;padding:4px 10px}.toc a small{display:none}.toc a.on{border-bottom-color:var(--blue)}
 .score{margin:0 0 0 auto;padding:4px 10px;white-space:nowrap;flex:0 0 auto}
 html{scroll-padding-top:calc(var(--nav) + 64px)}}
@media(max-width:520px){.brand{font-size:.9rem;line-height:1.2}.links a{padding:7px 10px;font-size:.82rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

<header class="hero"><h1>Tin học 6 – Trắc nghiệm ôn tập giữa học kì 1</h1><p>Chọn đáp án để xem kết quả và hướng dẫn trả lời ngay. Có thể làm lại bất cứ lúc nào.</p></header>

<script>
var DATA=[{"b": 1, "t": "Thông tin và dữ liệu", "q": [{"n": 1, "q": "Nội dung nào sau đây mô tả đúng nhất về vật mang tin?", "o": ["Là thông tin đã được xử lý trong máy tính", "Là vật chứa hoặc lưu giữ thông tin dưới dạng dữ liệu", "Là hoạt động suy nghĩ của não người", "Là các con số được nhập vào phần mềm"], "a": 1, "e": "Vật mang tin là vật chứa hoặc lưu giữ thông tin dưới dạng dữ liệu (giấy, đĩa, thẻ nhớ…)."}, {"n": 2, "q": "Điểm khác nhau cơ bản giữa thông tin và dữ liệu là gì?", "o": ["Thông tin là sự hiểu biết của con người, dữ liệu là các con số, chữ viết, hình ảnh, âm thanh", "Thông tin luôn ở dạng chữ, dữ liệu luôn ở dạng số", "Thông tin được lưu trên đĩa cứng, dữ liệu được lưu trong não người", "Thông tin không có giá trị, dữ liệu có giá trị cao"], "a": 0, "e": "Thông tin là sự hiểu biết; dữ liệu là con số, chữ, hình ảnh, âm thanh được ghi lại."}, {"n": 3, "q": "Thông tin là gì?", "o": ["Những tín hiệu điện tử được truyền đi qua các thiết bị máy tính thông minh", "Vật được dùng để lưu trữ và truyền tải hiểu biết của con người", "Các con số và văn bản được ghi lại trên các thiết bị", "Những gì đem lại hiểu biết cho con người về thế giới xung quanh và chính bản thân mình"], "a": 3, "e": "Định nghĩa SGK: Thông tin là những gì đem lại hiểu biết."}, {"n": 4, "q": "Dữ liệu được thể hiện dưới các dạng chủ yếu nào?", "o": ["Lời nói, hành động, biểu cảm, âm thanh", "Thông tin, vật mang tin, ý nghĩ, con số", "Giấy viết, đĩa CD, thẻ nhớ, hình ảnh", "Con số, văn bản, hình ảnh, âm thanh"], "a": 3, "e": "SGK liệt kê 4 dạng dữ liệu cơ bản: con số, văn bản, hình ảnh, âm thanh."}, {"n": 5, "q": "Máy tính thực chất xử lí đối tượng nào?", "o": ["Suy nghĩ con người", "Sự kiện lịch sử", "Vật mang tin", "Dữ liệu"], "a": 3, "e": "Máy tính trực tiếp xử lí dữ liệu (dãy bit) để cung cấp thông tin cho con người."}, {"n": 6, "q": "Mối quan hệ cơ bản giữa thông tin và dữ liệu là gì?", "o": ["Dữ liệu và thông tin hoàn toàn độc lập với nhau", "Thông tin luôn sinh ra dữ liệu trước khi được xử lý", "Thông tin tự động tạo ra vật mang tin", "Dữ liệu đem lại thông tin cho con người"], "a": 3, "e": "Vì dữ liệu đem lại thông tin nên đôi khi vật chứa dữ liệu được gọi là vật mang tin."}, {"n": 7, "q": "Trong đời sống, 'Tiếng còi xe cứu thương' được xem là dữ liệu dưới dạng nào?", "o": ["Dạng văn bản", "Dạng con số", "Dạng âm thanh", "Dạng hình ảnh"], "a": 2, "e": "'Tiếng còi xe cứu thương' được thu nhận thông qua thị giác hoặc thính giác và phân loại thuộc dạng âm thanh."}, {"n": 8, "q": "Trong tình huống \"Trước khi ra đường, Nam xem dự báo thời tiết thấy trời sắp mưa nên mang theo ô\", việc xem dự báo thời tiết thể hiện điều gì?", "o": ["Nhu cầu thu nhận thông tin để giúp đưa ra quyết định hợp lý", "Hoạt động truyền dữ liệu tự động giữa máy tính và não", "Việc mã hóa thông tin thành dãy nhị phân", "Lợi ích của việc kết nối mạng máy tính LAN"], "a": 0, "e": "Xem dự báo thời tiết là thu nhận thông tin để đưa ra quyết định (mang theo ô)."}, {"n": 9, "q": "Hai người cùng nghe một bản tin tiếng Pháp, một người hiểu, một người không. Điều này minh chứng cho tính chất nào?", "o": ["Thông tin luôn độc lập với dữ liệu và không bị ảnh hưởng bởi người nghe", "Bản tin tiếng Pháp không phải là vật mang tin đối với người không hiểu", "Dữ liệu dạng âm thanh không thể chuyển hóa thành thông tin hữu ích", "Sự hiểu biết mà thông tin đem lại luôn phụ thuộc vào người tiếp nhận"], "a": 3, "e": "Người hiểu tiếng Pháp nhận được thông tin, người kia thì không. Tính chất phụ thuộc người nhận."}, {"n": 10, "q": "Khi giáo viên nhìn vào bảng điểm dạng số, cô biết được em nào học xuất sắc nhất. Điều cô giáo biết được gọi là gì?", "o": ["Tín hiệu vật lý", "Vật mang tin", "Thông tin", "Dữ liệu"], "a": 2, "e": "Điểm số là dữ liệu, nhưng việc 'biết em nào giỏi nhất' là hiểu biết, tức là thông tin."}, {"n": 11, "q": "Trong bảng thống kê dân số các tỉnh thành, dòng chữ 'Thành phố Hà Nội' thuộc dạng dữ liệu nào?", "o": ["Dạng văn bản", "Dạng hình ảnh", "Dạng con số", "Dạng âm thanh"], "a": 0, "e": "Tên địa danh được viết bằng chữ cái nên nó là dữ liệu dạng văn bản."}], "f": []}, {"b": 2, "t": "Xử lí thông tin", "q": [{"n": 12, "q": "Quá trình xử lý thông tin của máy tính bao gồm các bước cơ bản nào theo đúng thứ tự?", "o": ["Xử lý -> Thu nhận -> Lưu trữ -> Truyền tải", "Thu nhận -> Lưu trữ -> Xử lý -> Truyền tải", "Truyền tải -> Thu nhận -> Lưu trữ -> Xử lý", "Lưu trữ -> Xử lý -> Thu nhận -> Truyền tải"], "a": 1, "e": "Thứ tự đúng: thu nhận → lưu trữ → xử lí → truyền tải."}, {"n": 13, "q": "Bộ phận nào của máy tính đóng vai trò chủ yếu trong việc \"Xử lý\" thông tin?", "o": ["Bàn phím và chuột", "Màn hình và loa", "Bộ xử lý trung tâm (CPU)", "Ổ đĩa cứng và USB"], "a": 2, "e": "CPU là bộ xử lí trung tâm, thực hiện việc xử lí thông tin của máy tính."}, {"n": 14, "q": "Hoạt động nào sau đây thuộc bước \"Thu nhận thông tin\" trong các hoạt động thông tin của con người?", "o": ["Lắng nghe cô giáo giảng bài trên lớp", "Viết bài văn hoàn chỉnh vào vở", "Suy nghĩ cách giải một bài toán khó", "Gửi tin nhắn mừng sinh nhật bạn"], "a": 0, "e": "Lắng nghe giảng bài là dùng giác quan để thu nhận thông tin; các việc còn lại là lưu trữ, xử lí, truyền thông tin."}, {"n": 15, "q": "Quá trình xử lí thông tin của con người bao gồm bao nhiêu hoạt động cơ bản?", "o": ["Năm hoạt động", "Ba hoạt động", "Hai hoạt động", "Bốn hoạt động"], "a": 3, "e": "Quá trình xử lí thông tin gồm 4 hoạt động cơ bản: thu nhận, lưu trữ, xử lí và truyền thông tin."}, {"n": 16, "q": "Sau khi thu nhận thông tin, bộ não thực hiện việc ghi nhớ lại, đó là hoạt động nào?", "o": ["Xử lí thông tin", "Thu nhận thông tin", "Lưu trữ thông tin", "Truyền thông tin"], "a": 2, "e": "Việc ghi nhớ lại thông tin sau khi nhận được chính là hoạt động lưu trữ."}, {"n": 17, "q": "Quá trình biến đổi thông tin ban đầu thành thông tin mới được gọi là gì?", "o": ["Thu nhận thông tin", "Truyền thông tin", "Xử lí thông tin", "Lưu trữ thông tin"], "a": 2, "e": "Xử lí thông tin là quá trình biến đổi thông tin ban đầu thành thông tin mới."}, {"n": 18, "q": "Bàn phím và chuột thuộc loại thiết bị nào của máy tính?", "o": ["Thiết bị vào", "Bộ xử lí", "Thiết bị ra", "Bộ nhớ"], "a": 0, "e": "Bàn phím và chuột là các thiết bị vào để đưa thông tin vào máy tính."}, {"n": 19, "q": "Bộ phận nào của máy tính được sử dụng với mục đích lưu trữ thông tin?", "o": ["Thiết bị ra", "Thiết bị vào", "Bộ xử lí", "Bộ nhớ"], "a": 3, "e": "Bộ nhớ là thành phần dùng để lưu trữ thông tin của máy tính."}, {"n": 20, "q": "Bộ phận nào trên cơ thể người thực hiện nhiệm vụ thu nhận thông tin?", "o": ["Tay và chân", "Các giác quan", "Hệ tiêu hoá", "Não bộ"], "a": 1, "e": "Nhờ các giác quan, con người nhận được thông tin từ thế giới bên ngoài."}, {"n": 21, "q": "Hoạt động chép bài giảng của giáo viên vào vở trên lớp thuộc quá trình nào?", "o": ["Thu nhận thông tin", "Lưu trữ thông tin", "Xử lí thông tin", "Truyền thông tin"], "a": 1, "e": "Chép bài vào vở là một cách lưu trữ thông tin bên cạnh việc ghi nhớ."}, {"n": 22, "q": "Đặc điểm nổi bật của máy tính khi thực hiện việc xử lí thông tin là gì?", "o": ["Không thể tính toán liên tục", "Thường xuyên xảy ra sai sót", "Tốc độ cao, chính xác và bền bỉ", "Tốc độ rất chậm nhưng chính xác"], "a": 2, "e": "Máy tính xử lí thông tin với tốc độ cao, chính xác và vô cùng bền bỉ."}, {"n": 23, "q": "Vì sao máy tính được coi là công cụ hiệu quả để xử lý thông tin?", "o": ["Vì máy tính có khả năng suy nghĩ độc lập như con người", "Vì máy tính xử lý dữ liệu nhanh chóng, chính xác và lưu trữ khối lượng lớn", "Vì máy tính không bao giờ cần cung cấp dữ liệu đầu vào", "Vì máy tính tự sáng tạo ra thông tin mới mà không cần con người"], "a": 1, "e": "Máy tính xử lí nhanh, chính xác, lưu trữ lớn; nhưng không tự suy nghĩ hay tự sáng tạo như con người."}, {"n": 24, "q": "Việc học sinh gửi tệp bài làm qua thư điện tử cho giáo viên là ví dụ minh họa cho bước nào trong xử lý thông tin?", "o": ["Thu nhận thông tin", "Lưu trữ thông tin", "Xử lý thông tin", "Truyền tải thông tin"], "a": 3, "e": "Gửi tệp qua thư điện tử là chia sẻ thông tin cho người khác, tức là truyền thông tin."}, {"n": 25, "q": "Bộ nhớ của máy tính đóng vai trò gì trong quá trình xử lý thông tin?", "o": ["Hiển thị kết quả xử lý ra màn hình", "Biến đổi dữ liệu đầu vào", "Lưu trữ thông tin", "Thu nhận thông tin từ người dùng"], "a": 2, "e": "Bộ nhớ (đĩa cứng, thẻ nhớ, đĩa quang...) đóng vai trò lưu trữ thông tin trong máy tính."}, {"n": 26, "q": "Thiết bị nào sau đây thuộc nhóm thiết bị ra của máy tính?", "o": ["Màn hình và máy in", "Bàn phím và chuột", "Thẻ nhớ và ổ đĩa cứng", "Máy quét hình ảnh"], "a": 0, "e": "Màn hình và máy in là thiết bị ra, dùng để truyền hoặc hiển thị/xuất thông tin ra bên ngoài cho con người tiếp nhận."}, {"n": 27, "q": "Điểm tương đồng cơ bản về mô hình hoạt động xử lý thông tin giữa con người và máy tính là gì?", "o": ["Đều sử dụng bộ nào sinh học để phân tích và suy luận các vấn đề trong thực tế đời sống", "Đều chỉ lưu trữ được thông tin dưới dạng sóng âm thanh", "Đều xử lý thông tin dựa trên cảm xúc và trải nghiệm cá nhân tích lũy qua thời gian", "Đều thực hiện đủ 4 hoạt động: thu nhận, lưu trữ, xử lý và truyền thông tin"], "a": 3, "e": "Cả con người và máy tính đều thực hiện đủ 4 hoạt động cơ bản của quá trình xử lý thông tin: thu nhận, lưu trữ, xử lý và truyền thông tin."}, {"n": 28, "q": "Việc chuyển một bài văn xuôi thành một bài thơ thuộc hoạt động nào trong quá trình xử lý thông tin?", "o": ["Thu nhận thông tin", "Lưu trữ thông tin trên các vật mang tin dạng giấy viết hoặc tệp văn bản điện tử", "Truyền thông tin", "Xử lý thông tin"], "a": 3, "e": "Chuyển thể văn bản đòi hỏi bộ não phải phân tích, biến đổi cấu trúc và từ ngữ, đây là hoạt động xử lý thông tin (biến đổi thông tin ban đầu thành thông tin mới)."}, {"n": 29, "q": "Bản chất của hoạt động xử lý thông tin ở bộ não con người là gì?", "o": ["Biến đổi thông tin ban đầu thành thông tin mới thông qua so sánh, phân tích và suy luận", "Chuyển đổi toàn bộ hình ảnh và âm thanh thành các dạng tín hiệu điện từ lưu trữ vĩnh viễn trong não", "Truyền trực tiếp thông tin nhận được đến người khác mà không cần ghi nhớ", "Sao chép nguyên vẹn dữ liệu từ môi trường xung quanh vào bộ nhớ"], "a": 0, "e": "Xử lý thông tin là quá trình bộ não liên kết, phân tích, so sánh dữ liệu đã có để rút ra kết luận, quyết định, tạo ra thông tin mới."}, {"n": 30, "q": "Nhóm thiết bị nào sau đây trong máy tính đóng vai trò thu nhận thông tin tương tự như các giác quan của con người?", "o": ["Bộ nhớ trong và ổ đĩa cứng", "Màn hình và máy in", "Bàn phím, máy quét, màn hình và ổ cứng cùng phối hợp để tiếp nhận các luồng tín hiệu từ bên ngoài", "Bàn phím, chuột và máy quét"], "a": 3, "e": "Bàn phím, chuột, máy quét là các thiết bị vào, đảm nhận chức năng thu nhận thông tin nhập từ bên ngoài vào máy tính."}], "f": [{"n": 31, "q": "Trên đường đi học, bạn Minh quan sát thấy đèn tín hiệu giao thông chuyển sang màu đỏ nên dừng xe lại trước vạch quy định. Tìm hiểu về quá trình xử lý thông tin trong tình huống này, các nhận định sau đây đúng hay sai?", "s": ["Đèn tín hiệu giao thông phát sáng màu đỏ đóng vai trò là vật mang tin.", "Sự hiểu biết \"màu đỏ là tín hiệu phải dừng xe\" đối với Minh là thông tin.", "Việc mắt Minh quan sát thấy ánh sáng màu đỏ là bước \"Thu nhận thông tin\" trong quá trình xử lý thông tin.", "Quyết định dừng xe của Minh thể hiện bước \"Truyền tải thông tin\" ra ngoài môi trường."], "a": [1, 1, 1, 0], "e": ["Đèn đỏ chứa thông tin chỉ dẫn nên là vật mang tin.", "Sự hiểu biết “đỏ là dừng” giúp Minh quyết định hành động nên là thông tin.", "Mắt quan sát ánh sáng đỏ là dùng giác quan để thu nhận thông tin.", "Quyết định dừng xe là kết quả của bước xử lí thông tin ở não."]}, {"n": 32, "q": "Trong giờ học, bạn Lan nghe cô giáo giảng bài, ghi chép vào vở, suy nghĩ để giải một bài toán rồi giơ tay phát biểu ý kiến. Các nhận định sau về hoạt động thông tin của Lan đúng hay sai?", "s": ["Việc Lan nghe cô giáo giảng bài là hoạt động thu nhận thông tin.", "Việc Lan ghi chép bài giảng vào vở là hoạt động lưu trữ thông tin.", "Việc Lan suy nghĩ, so sánh để tìm ra đáp án bài toán là hoạt động truyền thông tin.", "Việc Lan phát biểu ý kiến trước lớp là hoạt động truyền thông tin cho các bạn."], "a": [1, 1, 0, 1], "e": ["Nghe giảng là dùng giác quan thu nhận thông tin.", "Ghi chép vào vở là lưu trữ thông tin.", "Suy nghĩ, so sánh để tìm đáp án là xử lí thông tin, không phải truyền thông tin.", "Phát biểu ý kiến là chia sẻ thông tin cho người khác: truyền thông tin."]}, {"n": 33, "q": "Bạn Minh dùng máy tính để soạn bài thuyết trình: gõ nội dung bằng bàn phím, máy tính định dạng và tính toán, lưu tệp vào ổ đĩa rồi chiếu kết quả lên màn hình. Các nhận định sau đúng hay sai?", "s": ["Bàn phím là thiết bị vào, dùng để đưa thông tin vào máy tính.", "Bộ xử lí có chức năng lưu trữ thông tin lâu dài trong máy tính.", "Việc lưu tệp bài thuyết trình vào ổ đĩa là hoạt động lưu trữ thông tin.", "Việc máy tính định dạng, tính toán nội dung là hoạt động truyền thông tin ra bên ngoài."], "a": [1, 0, 1, 0], "e": ["Bàn phím đưa thông tin vào máy tính nên là thiết bị vào.", "Bộ xử lí xử lí thông tin; lưu trữ lâu dài là việc của bộ nhớ (ổ đĩa).", "Lưu tệp vào ổ đĩa là lưu trữ thông tin.", "Định dạng, tính toán là xử lí thông tin; đưa kết quả ra ngoài là việc của thiết bị ra."]}]}, {"b": 3, "t": "Thông tin trong máy tính", "q": [{"n": 34, "q": "Đơn vị nhỏ nhất dùng để đo dung lượng thông tin trong lưu trữ máy tính là gì?", "o": ["Byte", "Bit", "Kilobyte (KB)", "Gigabyte (GB)"], "a": 1, "e": "Bit là đơn vị nhỏ nhất (1 Byte = 8 bit)."}, {"n": 35, "q": "Thông tin trong máy tính được biểu diễn hoàn toàn dưới dạng nào?", "o": ["Các chữ cái tiếng Anh", "Dãy bit chỉ gồm hai ký hiệu 0 và 1", "Ký hiệu thập phân từ 0 đến 9", "Các hình ảnh và âm thanh nguyên bản"], "a": 1, "e": "Máy tính biểu diễn mọi thông tin bằng dãy bit gồm hai kí hiệu 0 và 1."}, {"n": 36, "q": "Vì sao máy tính lại dùng dãy bit (0 và 1) để biểu diễn thông tin?", "o": ["Vì máy tính gồm các linh kiện điện tử chỉ có 2 trạng thái (đóng/mở mạch điện)", "Vì số 0 và 1 là các con số dễ nhớ nhất với con người", "Vì sử dụng dãy bit giúp giảm bớt dung lượng đĩa cứng", "Vì các ngôn ngữ lập trình chỉ hiểu được ký hiệu 0 và 1"], "a": 0, "e": "Linh kiện điện tử chỉ có hai trạng thái (đóng/mở mạch điện), ứng với 0 và 1."}, {"n": 37, "q": "Quá trình biến đổi một thông tin thành dãy các kí hiệu 0 và 1 được gọi là gì?", "o": ["Phân loại thông tin", "Lưu trữ thông tin", "Mã hoá thông tin", "Giải nén thông tin"], "a": 2, "e": "Chuyển đổi thông tin thành dãy bit được gọi là mã hoá."}, {"n": 38, "q": "Một đơn vị byte có độ lớn tương đương với bao nhiêu bit liên tục?", "o": ["4 bit", "8 bit", "16 bit", "32 bit"], "a": 1, "e": "Một byte bằng 8 bit liền tục."}, {"n": 39, "q": "Trong máy tính cá nhân hiện nay, thiết bị lưu trữ nào thường có mức dung lượng lớn nhất?", "o": ["Ổ đĩa cứng", "Thẻ nhớ ngoài", "Đĩa quang học", "Đĩa mềm truyền thống"], "a": 0, "e": "Các ổ đĩa cứng hiện nay thường có dung lượng lớn nhất, từ vài trăm GB đến vài TB."}, {"n": 40, "q": "Kí hiệu 0 và 1 dùng để biểu diễn thông tin trong máy tính được gọi chung là gì?", "o": ["Kí tự", "Bit", "Byte", "Chữ số"], "a": 1, "e": "Mỗi kí hiệu 0 hoặc 1 trong máy tính được gọi là một bit."}, {"n": 41, "q": "Để dễ dàng quản lí và lưu trữ, thông tin trong máy tính được tổ chức dưới dạng nào?", "o": ["Các phần mềm hệ thống", "Các đoạn mã nguồn", "Các tệp tin", "Các dãy số nhị phân"], "a": 2, "e": "Thông tin trong máy tính được tổ chức dưới dạng các tệp (tệp văn bản, tệp hình ảnh, v.v.)."}, {"n": 42, "q": "Đơn vị 1 Kilobyte (KB) có độ lớn xấp xỉ bằng bao nhiêu Byte?", "o": ["10 Byte", "100 Byte", "1.000 Byte", "1.000.000 Byte"], "a": 2, "e": "1 KB xấp xỉ 1.000 Byte."}, {"n": 43, "q": "Một tệp sách điện tử có dung lượng xấp xỉ 1 Megabyte (MB). Dung lượng này tương đương với khoảng bao nhiêu Byte?", "o": ["1 nghìn Byte", "1 triệu Byte", "1 tỉ Byte", "10 tỉ Byte"], "a": 1, "e": "1 MB xấp xỉ 1 triệu Byte."}, {"n": 44, "q": "Hình ảnh kĩ thuật số được tạo thành từ đâu?", "o": ["Các dải màu quang phổ được thu thập từ lăng kính đa sắc của màn hình điện tử hiện đại", "Các con số thập phân", "Các nét vẽ liên tục bằng mực in", "Các điểm ảnh"], "a": 3, "e": "Hình ảnh được chia thành một lưới các ô vuông, mỗi ô vuông nhỏ là một điểm ảnh."}, {"n": 45, "q": "Văn bản được biểu diễn trong máy tính bằng cách nào?", "o": ["Chuyển từng kí tự một thành dãy bit tương ứng", "Chuyển toàn bộ đoạn văn thành một số nguyên duy nhất", "Chụp ảnh lại toàn bộ văn bản rồi nén lại thành một tập tin ảnh duy nhất để tiết kiệm bộ nhớ lưu trữ hệ thống", "Phân tích ngữ pháp rồi mã hóa thành âm thanh"], "a": 0, "e": "Mỗi kí tự trong văn bản được máy tính chuyển đổi thành một dãy bit riêng biệt theo bảng mã."}, {"n": 46, "q": "Dãy đơn vị đo dung lượng thông tin nào sau đây được sắp xếp theo thứ tự từ nhỏ đến lớn?", "o": ["TB, GB, MB, KB, Byte, Bit", "Byte, Bit, MB, KB, GB, TB", "Bit, Byte, KB, MB, GB, TB", "Bit, Byte, MB, KB, TB, GB"], "a": 2, "e": "Thứ tự chính xác từ nhỏ đến lớn là Bit -> Byte -> Kilobyte -> Megabyte -> Gigabyte -> Terabyte."}, {"n": 47, "q": "Thông tin trong máy tính (văn bản, hình ảnh, âm thanh) đều được chuyển thành gì để máy tính xử lí?", "o": ["Dãy bit", "Tín hiệu sóng âm", "Các chữ cái tiếng Anh", "Dãy số thập phân"], "a": 0, "e": "Mọi thông tin trong máy tính đều phải được chuyển hóa thành dãy bit để máy tính có thể nhận biết và xử lý."}, {"n": 48, "q": "Khái niệm 'chữ số nhị phân' dùng để chỉ điều gì?", "o": ["Một chương trình mã hóa dữ liệu kép", "Hệ thống số đếm bao gồm hai chữ số 1 và 2", "Các con số chia hết cho 2 trong toán học", "Kí hiệu 0 hoặc 1"], "a": 3, "e": "Bit là viết tắt của Binary digit, nghĩa là chữ số nhị phân, gồm hai kí hiệu 0 và 1."}, {"n": 49, "q": "Một thẻ nhớ USB có dung lượng 8 GB. Nếu mỗi bài hát dạng MP3 có dung lượng xấp xỉ 4 MB, thẻ nhớ đó có thể chứa khoảng bao nhiêu bài hát?", "o": ["200 bài hát", "2.000 bài hát", "20.000 bài hát", "200.000 bài hát"], "a": 1, "e": "8 GB ≈ 8000 MB; 8000 : 4 = 2000 bài hát."}, {"n": 50, "q": "Trong bảng mã, kí tự 'C' được mã hóa thành 01000011, kí tự 'A' được mã hóa thành 01000001. Từ 'CA' sẽ được máy tính lưu trữ thành dãy bit nào?", "o": ["0100001101000001", "0100000101000011", "02000012", "10000100"], "a": 0, "e": "Ghép dãy bit của chữ 'C' và chữ 'A' theo đúng thứ tự ta được 0100001101000001."}, {"n": 51, "q": "Một đĩa quang CD có dung lượng 700 MB. Bạn Bình có một thư mục chứa ảnh nặng 1 GB. Phương án nào sau đây đúng?", "o": ["Đĩa CD lưu được chính xác toàn bộ thư mục mà không bị đầy", "Thư mục ảnh sẽ tự động được phần mềm ghi đĩa nén lại mức tối đa", "Đĩa CD lưu được thư mục ảnh và còn thừa 300 MB", "Đĩa CD không đủ dung lượng để chứa thư mục ảnh này"], "a": 3, "e": "1 GB = 1024 MB. 1024 MB > 700 MB nên đĩa CD không đủ dung lượng."}, {"n": 52, "q": "Cứ 1 phút thu âm giọng nói tạo ra tệp dung lượng 2 MB. Một đoạn ghi âm dài 1 giờ sẽ tiêu tốn bao nhiêu dung lượng bộ nhớ?", "o": ["24 MB", "2 MB", "120 MB", "60 MB"], "a": 2, "e": "1 giờ = 60 phút. Dung lượng cần là 60 x 2 MB = 120 MB."}], "f": [{"n": 53, "q": "Bạn An tìm hiểu về việc biểu diễn và lưu trữ dữ liệu trong máy tính. An đưa ra các nhận định sau về dung lượng và mã hóa thông tin:", "s": ["Tất cả các dạng dữ liệu chữ, hình ảnh, âm thanh lưu trong máy tính đều được mã hóa thành dãy bit.", "1 Byte là đơn vị đo dung lượng nhỏ hơn 1 Bit trong lưu trữ máy tính.", "Một tệp tài liệu văn bản dung lượng 2 MB xấp xỉ tương đương với 2.000.000 Byte.", "Một thẻ nhớ USB 8 GB có thể lưu trữ được tối đa khoảng 4.000 bài hát nếu mỗi bài hát có dung lượng 2 MB."], "a": [1, 0, 1, 1], "e": ["Chữ, ảnh, âm thanh đều được mã hoá thành dãy bit.", "1 Byte = 8 bit nên Byte lớn hơn Bit.", "2 MB ≈ 2 × 1.000.000 = 2.000.000 Byte.", "8 GB ≈ 8000 MB; 8000 : 2 = 4000 bài hát."]}, {"n": 54, "q": "Nam tìm hiểu về cách máy tính biểu diễn và lưu trữ thông tin. Các nhận định Nam đưa ra sau đây đúng hay sai?", "s": ["Bit là đơn vị nhỏ nhất dùng để đo lượng thông tin trong máy tính.", "Hình ảnh kĩ thuật số được tạo thành từ các điểm ảnh, mỗi điểm ảnh được biểu diễn bằng dãy bit.", "Khi lưu trữ văn bản, máy tính giữ nguyên hình dạng chữ viết như một bức ảnh, không cần mã hoá thành dãy bit.", "Từ “TIN” gồm 3 kí tự, nếu mỗi kí tự được mã hoá bằng 1 byte thì cần 24 bit để lưu trữ từ này."], "a": [1, 1, 0, 1], "e": ["Bit là đơn vị nhỏ nhất đo lượng thông tin.", "Ảnh số gồm các điểm ảnh, mỗi điểm ảnh được biểu diễn bằng dãy bit.", "Văn bản phải được mã hoá từng kí tự thành dãy bit, không lưu như ảnh chụp.", "3 kí tự × 1 byte = 3 byte = 3 × 8 = 24 bit."]}, {"n": 55, "q": "Bạn Hà có một thẻ nhớ dung lượng 2 GB để lưu ảnh chụp từ điện thoại, mỗi ảnh có dung lượng khoảng 4 MB. Các nhận định sau đúng hay sai?", "s": ["1 byte bằng 8 bit.", "Đơn vị GB nhỏ hơn đơn vị MB.", "Thẻ nhớ 2 GB có dung lượng xấp xỉ 2000 MB.", "Thẻ nhớ đó chỉ lưu được khoảng 50 bức ảnh nói trên."], "a": [1, 0, 1, 0], "e": ["1 byte = 8 bit.", "Thứ tự KB < MB < GB nên GB lớn hơn MB.", "1 GB xấp xỉ 1000 MB nên 2 GB ≈ 2000 MB.", "2000 : 4 ≈ 500 ảnh, không phải 50 ảnh."]}, {"n": 56, "q": "Nhà trường tạo một tệp văn bản có dung lượng khoảng 3 MB và một tệp ảnh khoảng 5 MB để lưu vào một đĩa CD có dung lượng 700 MB. Các nhận định sau đúng hay sai?", "s": ["Kí hiệu MB là viết tắt của đơn vị Megabyte.", "Đơn vị KB lớn hơn đơn vị MB.", "Máy tính biểu diễn văn bản bằng cách chuyển từng kí tự thành một dãy bit tương ứng.", "Đĩa CD 700 MB đủ chỗ để chứa cả hai tệp nói trên."], "a": [1, 0, 1, 1], "e": ["MB là viết tắt của Megabyte.", "KB nhỏ hơn MB (1 MB ≈ 1000 KB).", "Mỗi kí tự được chuyển thành một dãy bit theo bảng mã.", "3 MB + 5 MB = 8 MB < 700 MB nên đĩa CD đủ chỗ."]}]}, {"b": 4, "t": "Mạng máy tính", "q": [{"n": 57, "q": "Mạng máy tính là gì?", "o": ["Là tập hợp các máy tính đứng độc lập không nối với nhau", "Là tập hợp các máy tính và thiết bị được kết nối với nhau để truyền tải thông tin", "Là phần mềm dùng để soạn thảo văn bản trực tuyến", "Là hệ thống chỉ gồm các dây cáp mạng trong phòng học"], "a": 1, "e": "Mạng máy tính là tập hợp máy tính và thiết bị được kết nối để trao đổi, truyền tải thông tin."}, {"n": 58, "q": "Các thành phần chủ yếu của một mạng máy tính bao gồm những gì?", "o": ["Máy tính, bàn phím và chuột", "Thiết bị đầu cuối, các thiết bị kết nối mạng và phần mềm mạng", "Màn hình, máy in và dây điện", "Ổ đĩa USB, đĩa CD và thẻ nhớ"], "a": 1, "e": "Mạng có 3 thành phần: thiết bị đầu cuối, thiết bị kết nối mạng và phần mềm mạng."}, {"n": 59, "q": "Thiết bị nào sau đây đóng vai trò là \"Thiết bị kết nối mạng\" (thiết bị mạng)?", "o": ["Máy tính xách tay (Laptop)", "Điện thoại thông minh (Smartphone)", "Bộ chia cổng mạng (Switch)", "Máy in văn phòng"], "a": 2, "e": "Switch dùng để nối các máy trong mạng nên là thiết bị kết nối; laptop, điện thoại, máy in là thiết bị đầu cuối."}, {"n": 60, "q": "Điều kiện tối thiểu để tạo thành một mạng máy tính là gì?", "o": ["Cần ba máy tính trở lên kết nối qua dây dẫn", "Cần một máy chủ cỡ lớn và một máy trạm", "Cần ít nhất hai máy tính kết nối với nhau", "Cần ít nhất một máy tính và một máy in"], "a": 2, "e": "Chỉ cần hai máy tính kết nối với nhau là đã có một mạng máy tính."}, {"n": 61, "q": "Thiết bị nào sau đây thuộc nhóm các thiết bị đầu cuối trong mạng máy tính?", "o": ["Bộ định tuyến", "Bộ chia mạng", "Dây cáp mạng", "Điện thoại thông minh"], "a": 3, "e": "Điện thoại thông minh là thiết bị giao tiếp trực tiếp với người dùng nên là thiết bị đầu cuối."}, {"n": 62, "q": "Thiết bị Router trong mạng máy tính còn được gọi bằng tên tiếng Việt là gì?", "o": ["Bộ định tuyến", "Máy chủ trung tâm", "Điểm truy cập không dây", "Phần mềm hệ thống"], "a": 0, "e": "Router là thiết bị kết nối có tên tiếng Việt là bộ định tuyến."}, {"n": 63, "q": "Các công nghệ sóng vô tuyến phổ biến được sử dụng trong mạng không dây là gì?", "o": ["Cáp đồng và cáp quang", "Tia hồng ngoại và tia cực tím", "Wifi và Bluetooth", "Sóng âm thanh và sóng siêu âm"], "a": 2, "e": "Wifi và Bluetooth là hai loại sóng vô tuyến phổ biến để truyền dữ liệu mạng không dây."}, {"n": 64, "q": "Phần mềm mạng trong mạng máy tính có vai trò giống như yếu tố nào trong mạng giao thông?", "o": ["Nhà ga, bến xe, bến cảng", "Các phương tiện di chuyển", "Hàng hoá được vận chuyển", "Hệ thống duy trì luật lệ giao thông"], "a": 3, "e": "Phần mềm mạng đóng vai trò như hệ thống duy trì luật lệ để dữ liệu đi đến đúng đích."}, {"n": 65, "q": "Điểm chung của các mạng lưới (mạng giao thông, mạng lưới điện, mạng ống nước) là gì?", "o": ["Kết nối các thành viên và chia sẻ tài nguyên", "Chỉ dành cho những người quản trị mạng", "Có nhiều đường cắt nhau chằng chịt", "Hoạt động độc lập không liên quan đến nhau"], "a": 0, "e": "Điểm chung của các mạng lưới là kết nối các thành viên để chia sẻ tài nguyên cho nhiều người."}, {"n": 66, "q": "Thiết bị Switch trong mạng máy tính còn được gọi bằng tên tiếng Việt là gì?", "o": ["Cáp mạng", "Bộ chuyển mạch", "Trạm thu phát sóng", "Bộ chia"], "a": 1, "e": "Switch là thiết bị kết nối mạng có tên tiếng Việt là bộ chuyển mạch."}, {"n": 67, "q": "Điểm truy cập không dây có tên gọi bằng tiếng Anh là gì?", "o": ["Access Point", "Communication Hub", "Network Switch", "Wireless Router"], "a": 0, "e": "Điểm truy cập không dây trong tiếng Anh được gọi là Access Point."}, {"n": 68, "q": "Thiết bị nào sau đây thường xuyên sử dụng kết nối không dây nhất?", "o": ["Bộ chuyển mạch trung tâm", "Máy tính để bàn chuyên dụng", "Máy chủ dữ liệu lớn", "Điện thoại thông minh"], "a": 3, "e": "Điện thoại thông minh là thiết bị di động nên thường xuyên sử dụng kết nối không dây."}, {"n": 69, "q": "Lợi ích quan trọng nhất của việc kết nối các máy tính thành mạng là gì?", "o": ["Cho phép chia sẻ tài nguyên phần cứng (máy in) và dữ liệu giữa nhiều người dùng", "Tăng tốc độ khởi động của hệ điều hành trên máy tính", "Giúp máy tính không bao giờ bị nhiễm virus", "Giảm lượng điện tiêu thụ của các thiết bị máy tính"], "a": 0, "e": "Mạng cho phép chia sẻ dữ liệu và thiết bị (như máy in) giữa nhiều người dùng."}, {"n": 70, "q": "Trường hợp nào sau đây thể hiện rõ mạng không dây (Wi-Fi) tiện dụng hơn mạng có dây?", "o": ["Kết nối máy tính để bàn cố định trong văn phòng làm việc", "Người dùng di chuyển laptop hoặc điện thoại trong quán cà phê mà vẫn duy trì kết nối", "Kết nối máy chủ lưu trữ dữ liệu dung lượng cực lớn cố định", "Kết nối máy in cố định ở góc phòng học"], "a": 1, "e": "Wi-Fi tiện nhất khi vừa di chuyển vừa giữ kết nối; máy cố định dùng dây vẫn ổn định."}, {"n": 71, "q": "Tại sao việc lắp đặt mạng không dây lại thường thuận lợi hơn mạng có dây?", "o": ["Mạng không dây hoàn toàn miễn nhiễm với mọi loại nhiễu tín hiệu", "Tốc độ truyền tải của mạng không dây luôn luôn nhanh hơn mạng có dây gấp nhiều lần trong mọi điều kiện môi trường", "Không cần phải đi dây và khoan đục tường", "Các thiết bị mạng không dây luôn rẻ hơn so với các thiết bị mạng có dây tương ứng"], "a": 2, "e": "Việc lắp đặt và mở rộng mạng không dây thuận lợi hơn vì không cần phải đi dây và khoan đục tường."}, {"n": 72, "q": "Nếu một đoạn đường dây cáp mạng bị đứt, hiện tượng gì sẽ xảy ra?", "o": ["Mạng sẽ tự động sinh ra một đường truyền không dây phụ trợ để thay thế hoàn toàn đường dây cáp vừa bị đứt gãy", "Mạng vẫn hoạt động bình thường nhờ cơ chế tự động phục hồi của phần cứng", "Tất cả các máy tính trên thế giới sẽ mất kết nối Internet", "Giao thông dữ liệu qua đoạn mạng đó sẽ bị ngưng trệ"], "a": 3, "e": "Nếu một đoạn đường bị sạt lở thì giao thông sẽ bị ngưng trệ, điều đó có nghĩa là mạng sẽ chỉ hoạt động nếu được kết nối."}, {"n": 73, "q": "Đường truyền dữ liệu không nhìn thấy trong mạng máy tính sử dụng hình thức nào?", "o": ["Dây dẫn mạng bằng cáp quang", "Cáp đồng xoắn đôi", "Sóng vô tuyến", "Hệ thống dây điện dân dụng"], "a": 2, "e": "Đường truyền dữ liệu không nhìn thấy sử dụng sóng vô tuyến như wifi, bluetooth,...."}, {"n": 74, "q": "Mục đích chính của việc kết nối các máy tính với nhau tạo thành mạng là gì?", "o": ["Để giúp máy tính hoạt động nhanh hơn và tiết kiệm được một lượng lớn điện năng", "Để trao đổi dữ liệu và dùng chung các thiết bị phần cứng", "Để tự động gia tăng dung lượng lưu trữ của ổ cứng máy tính", "Để bảo vệ máy tính khỏi tất cả các loại virus nguy hiểm"], "a": 1, "e": "Mạng máy tính cho phép trao đổi dữ liệu và chia sẻ các thiết bị phần cứng dùng chung."}, {"n": 75, "q": "Trong phòng máy tính của trường học, thiết bị Access Point (trạm truy cập không dây) có chức năng chính là gì?", "o": ["Phát tín hiệu Wi-Fi cho các thiết bị di động kết nối vào mạng", "Lưu trữ dữ liệu bài tập của học sinh", "In ấn các tài liệu học tập", "Cung cấp nguồn điện cho các máy tính hoạt động"], "a": 0, "e": "Access Point phát tín hiệu Wi-Fi cho thiết bị di động kết nối vào mạng."}], "f": [{"n": 76, "q": "Trường TH&THCS Nguyễn Du trang bị phòng máy tính gồm 24 máy tính học sinh, 1 máy tính giáo viên, 1 máy in và 1 bộ Switch. Các phát biểu sau về mạng máy tính phòng học đúng hay sai?", "s": ["Các máy tính của học sinh và giáo viên trong phòng máy đóng vai trò là thiết bị đầu cuối.", "Bộ chia cổng Switch đóng vai trò là thiết bị mạng kết nối các máy tính lại với nhau.", "Việc kết nối mạng cho phép tất cả 24 máy tính học sinh có thể dùng chung 1 máy in của phòng máy.", "Mạng máy tính trong phòng học chỉ truyền được dữ liệu văn bản chứ không thể chia sẻ tệp hình ảnh hay video."], "a": [1, 1, 1, 0], "e": ["Máy tính của học sinh và giáo viên là thiết bị đầu cuối.", "Switch nối các máy tính với nhau nên là thiết bị kết nối mạng.", "Qua mạng, cả 24 máy dùng chung một máy in.", "Mạng chia sẻ được nhiều loại dữ liệu: văn bản, ảnh, video…"]}, {"n": 77, "q": "Gia đình bạn Lan có một mạng gia đình gồm 1 bộ định tuyến (Router) phát Wi-Fi, 2 máy tính xách tay, 2 điện thoại thông minh và 1 ti vi thông minh. Các nhận định sau đúng hay sai?", "s": ["Máy tính xách tay và điện thoại thông minh trong mạng là các thiết bị đầu cuối.", "Bộ định tuyến là thiết bị đầu cuối vì giao tiếp trực tiếp với người dùng.", "Nhờ kết nối Wi-Fi, điện thoại có thể di chuyển trong nhà mà vẫn duy trì kết nối mạng.", "Nếu bộ định tuyến bị hỏng thì các thiết bị vẫn truy cập mạng Wi-Fi như bình thường."], "a": [1, 0, 1, 0], "e": ["Laptop và điện thoại là thiết bị đầu cuối.", "Bộ định tuyến là thiết bị kết nối mạng, không phải thiết bị đầu cuối.", "Wi-Fi cho phép di chuyển mà vẫn duy trì kết nối.", "Bộ định tuyến hỏng thì các thiết bị mất đường kết nối mạng."]}, {"n": 78, "q": "Thư viện nhà trường có 5 máy tính để bàn nối với nhau bằng cáp mạng qua một bộ chia mạng (Switch) và muốn lắp thêm một Access Point cho học sinh dùng máy tính bảng. Các nhận định sau đúng hay sai?", "s": ["Một mạng máy tính cần tối thiểu hai máy tính được kết nối với nhau.", "Phần mềm mạng là thiết bị phần cứng dùng để nối các máy tính với nhau.", "Access Point giúp máy tính bảng kết nối vào mạng mà không cần dây cáp.", "Nếu cáp nối một máy tính với Switch bị đứt thì cả 5 máy tính đều mất kết nối."], "a": [1, 0, 1, 0], "e": ["Mạng cần tối thiểu hai máy tính kết nối với nhau.", "Phần mềm mạng không phải thiết bị phần cứng; thiết bị nối là thiết bị kết nối mạng.", "Access Point phát Wi-Fi nên máy tính bảng vào mạng không cần cáp.", "Cáp đứt chỉ làm mất kết nối của máy nối qua cáp đó, các máy khác vẫn hoạt động."]}, {"n": 79, "q": "Phòng học lớp 6A có 3 máy tính bảng của học sinh, 1 máy tính của giáo viên, 1 máy in dùng chung và 1 Access Point nối vào mạng nhà trường. Các nhận định sau đúng hay sai?", "s": ["Máy tính bảng và máy tính của giáo viên là các thiết bị đầu cuối.", "Mạng không dây buộc phải dùng cáp quang để truyền dữ liệu giữa các thiết bị.", "Nhiều máy tính cùng dùng chung một máy in qua mạng là ví dụ về chia sẻ thiết bị.", "Nếu Access Point bị hỏng thì các máy tính bảng kết nối qua Wi-Fi không truy cập được mạng."], "a": [1, 0, 1, 1], "e": ["Máy tính bảng và máy tính giáo viên là thiết bị đầu cuối.", "Mạng không dây dùng sóng vô tuyến (Wi-Fi, Bluetooth), không cần cáp quang.", "Nhiều máy dùng chung một máy in là chia sẻ thiết bị.", "Access Point phát Wi-Fi nên hỏng thì máy tính bảng mất kết nối mạng."]}]}, {"b": 5, "t": "Internet", "q": [{"n": 80, "q": "Internet là gì?", "o": ["Mạng kết nối các máy tính trong cùng một phòng học", "Mạng liên kết các hệ thống máy tính trên toàn cầu", "Một phần mềm diệt virus trên máy tính", "Dịch vụ lưu trữ dữ liệu cá nhân ngoại tuyến"], "a": 1, "e": "Internet là mạng liên kết các hệ thống máy tính trên toàn cầu."}, {"n": 81, "q": "Đặc điểm nổi bật nhất của Internet là gì?", "o": ["Do một quốc gia duy nhất quản lý và sở hữu", "Quy mô toàn cầu, chia sẻ thông tin đa dạng và không thuộc sở hữu của riêng ai", "Chỉ cho phép xem thông tin chữ viết, không có hình ảnh", "Hoàn toàn miễn phí tất cả các dịch vụ kết nối"], "a": 1, "e": "Internet có quy mô toàn cầu, thông tin đa dạng và không thuộc sở hữu của riêng ai."}, {"n": 82, "q": "Để máy tính có thể truy cập Internet, người sử dụng cần đăng ký dịch vụ với đơn vị nào?", "o": ["Nhà cung cấp dịch vụ Internet", "Cửa hàng bán lẻ thiết bị điện tử", "Nhà sản xuất máy tính", "Tổ chức quản lý thông tin toàn cầu"], "a": 0, "e": "Cần đăng ký với nhà cung cấp dịch vụ Internet (ISP) để được hỗ trợ cài đặt và cấp quyền truy cập."}, {"n": 83, "q": "Đặc điểm nào mô tả việc thông tin trên mạng luôn hiện diện thường trực?", "o": ["Tính lưu trữ", "Tính dễ tiếp cận", "Tính cập nhật", "Tính ẩn danh"], "a": 0, "e": "Tính lưu trữ cho phép thông tin được lưu trữ thường trực."}, {"n": 84, "q": "Internet có thuộc sở hữu của chính phủ một quốc gia phát triển nào không?", "o": ["Có, thuộc về liên minh các quốc gia lớn", "Có, thuộc về nhà cung cấp dịch vụ Internet quốc tế", "Không, nó là mạng máy tính công cộng toàn cầu", "Có, thuộc về quốc gia nơi phát minh ra Internet"], "a": 2, "e": "Internet không thuộc sở hữu hay do bất kì một tổ chức hoặc cá nhân nào điều hành."}, {"n": 85, "q": "Sự tương tác hai chiều trên các nền tảng Internet được thể hiện qua hoạt động nào sau đây?", "o": ["Người dùng đọc tin tức báo điện tử mà không gửi lại phản hồi", "Người dùng vừa nhận tin tức, vừa có thể bình luận, gửi tin nhắn trao đổi trên mạng xã hội", "Xem chương trình truyền hình qua đài phát thanh truyền thống", "Đọc thông tin trên biển quảng cáo tấm lớn ngoài đường"], "a": 1, "e": "Tương tác hai chiều: vừa nhận tin vừa bình luận, nhắn tin phản hồi."}, {"n": 86, "q": "Tại sao báo điện tử trên Internet lại có ưu thế hơn so với báo giấy truyền thống về mặt thời gian?", "o": ["Vì thông tin trên Internet luôn được tự động tạo ra bởi trí tuệ nhân tạo độc lập với con người, đảm bảo hệ thống xuất bản diễn ra mỗi giây", "Vì báo điện tử sử dụng màu sắc đẹp hơn so với báo giấy", "Vì báo điện tử luôn được miễn phí cho mọi đối tượng", "Vì Internet có tính cập nhật, thông tin được đưa lên và làm mới thường xuyên, liên tục"], "a": 3, "e": "Tính cập nhật của Internet giúp thông tin được làm mới thường xuyên, nhanh hơn chu trình in ấn của báo giấy."}, {"n": 87, "q": "Lợi ích của tính lưu trữ trên Internet đối với học sinh là gì?", "o": ["Toàn bộ thiết bị phần cứng của nhà trường sẽ tự động được gia tăng dung lượng bộ nhớ định kì mà không cần mua thiết bị vật lý mới, giúp tiết kiệm ngân sách giáo dục", "Hệ thống tự động giải mọi bài tập về nhà", "Cho phép học sinh tìm lại và sao chép các tài liệu học tập, sách điện tử một cách nhanh chóng ngay cả sau một thời gian dài", "Học sinh có thể tự ý thay đổi điểm số của mình trên hệ thống của nhà trường"], "a": 2, "e": "Tính lưu trữ giúp thông tin tồn tại thường trực, dễ sao chép, phục vụ tốt cho việc giữ lại tài liệu học tập."}, {"n": 88, "q": "Sự khác biệt chính giữa \"truyền thông một chiều\" (như tivi) và Internet là gì?", "o": ["Tivi có hình ảnh sắc nét hơn rất nhiều so với mọi nội dung trên Internet", "Internet yêu cầu người sử dụng phải trải qua các khóa học kỹ năng mạng phức tạp và đạt chứng chỉ để vận hành hệ thống máy tính cá nhân ở nhà", "Internet cho phép tương tác hai chiều, người dùng vừa tiếp nhận vừa có thể gửi lại thông tin tức thời", "Truyền thông một chiều không thể lưu trữ thông tin lâu dài"], "a": 2, "e": "Internet có tính tương tác, cho phép tức thời nhận và gửi thông tin, khác với tính một chiều của tivi."}, {"n": 89, "q": "Nếu không có Internet, hoạt động nào sau đây vẫn có thể thực hiện được bằng các thiết bị công nghệ truyền thống?", "o": ["Xem truyền hình qua ăng-ten vô tuyến", "Tìm kiếm thông tin trên WWW", "Gọi điện thoại qua mạng xã hội", "Gửi thư điện tử (email)"], "a": 0, "e": "Xem truyền hình qua ăng-ten không cần Internet; các hoạt động còn lại đều cần Internet."}, {"n": 90, "q": "Internet ảnh hưởng đến môi trường làm việc như thế nào?", "o": ["Bắt buộc mọi người phải đến văn phòng để sử dụng mạng lưới tập trung", "Làm giảm sự đa dạng của các ngành nghề hiện có", "Hệ thống tự động hóa hoàn toàn quy trình kinh doanh toàn cầu, do đó loại bỏ hoàn toàn các ngành nghề liên quan đến quản trị nhân sự truyền thống ở mọi cấp độ", "Cung cấp môi trường làm việc từ xa, giúp con người có thể học tập, hội họp mà không cần gặp mặt trực tiếp"], "a": 3, "e": "Internet cung cấp môi trường làm việc từ xa như dạy học, hội họp trực tuyến."}, {"n": 91, "q": "Ứng dụng nào trên Internet hỗ trợ hiệu quả nhất cho học sinh trong việc trao đổi bài tập nhóm trực tuyến?", "o": ["Trình phát nhạc ngoại tuyến", "Phần mềm quét mã vạch", "Các dịch vụ thư điện tử (Email) và ứng dụng nhắn tin nhóm", "Phần mềm tính tiền siêu thị"], "a": 2, "e": "Email và ứng dụng nhắn tin nhóm giúp trao đổi bài tập nhóm trực tuyến."}, {"n": 92, "q": "Một nhóm học sinh đang làm dự án nghiên cứu về biến đổi khí hậu. Các bạn quyết định tìm kiếm số liệu nhiệt độ toàn cầu từ các trang web khoa học. Việc này ứng dụng dịch vụ nào và thuộc lĩnh vực nào?", "o": ["Dịch vụ điện thoại - Lĩnh vực Giải trí", "Dịch vụ thư điện tử - Lĩnh vực Y tế", "Dịch vụ mạng xã hội - Lĩnh vực Kinh doanh", "Dịch vụ tìm kiếm - Lĩnh vực Khoa học kỹ thuật và Giáo dục"], "a": 3, "e": "Tìm số liệu trên các trang web là dịch vụ tìm kiếm, phục vụ khoa học và giáo dục."}, {"n": 93, "q": "Ông nội của bạn Bình hay đọc tin tức từ các tờ báo giấy được bưu tá giao vào mỗi sáng. Bình giới thiệu cho ông đọc báo mạng trên máy tính bảng để đọc nhanh hơn. Việc đổi từ báo giấy sang báo mạng tận dụng ưu điểm nào của Internet?", "o": ["Tính tin tức chính trị, nhanh chóng và đầy đủ cho mọi người", "Tính cập nhật thường xuyên và tính dễ tiếp cận mọi lúc", "Tính ẩn danh", "Tính lưu trữ"], "a": 1, "e": "Báo mạng (Internet) có thông tin được cập nhật thường xuyên và dễ dàng đọc mọi lúc trên máy tính bảng."}, {"n": 94, "q": "Trong bối cảnh giãn cách xã hội, trường học tổ chức các lớp học qua phần mềm video call. Đây là ví dụ về việc Internet hỗ trợ lĩnh vực nào?", "o": ["Giáo dục", "Nông nghiệp", "Y tế", "Giao thông vận tải"], "a": 0, "e": "Dạy và học qua video call là Internet hỗ trợ lĩnh vực giáo dục."}, {"n": 95, "q": "Bạn Tuấn có một bức ảnh chụp cảnh đẹp quê hương và muốn chia sẻ cho một người bạn ở Mỹ cùng xem ngay lập tức. Tuấn đã sử dụng ứng dụng nhắn tin trên Internet. Việc bức ảnh truyền đến tay người bạn ở Mỹ chỉ sau vài giây thể hiện đặc điểm nào?", "o": ["Tính ẩn danh và Tính lưu trữ", "Tính đa dạng, Tính toàn cầu và Tính tương tác", "Tính mạnh mẽ, hạ tầng viễn thông cáp đồng trục truyền thống vẫn vượt trội hơn hẳn so vô tuyến tầm xa", "Tính cập nhật"], "a": 1, "e": "Bức ảnh là \"tính đa dạng\", Mỹ - Việt Nam là \"tính toàn cầu\", nhắn tin ngay lập tức là \"tính tương tác\"."}], "f": [{"n": 96, "q": "Khi tìm hiểu về Internet và các dịch vụ trên Internet, nhóm bạn Lan nêu các ý kiến sau. Tìm hiểu tính đúng/sai của từng ý kiến:", "s": ["Internet là mạng máy tính khổng lồ kết nối hàng triệu máy tính trên khắp thế giới.", "Internet là môi trường cho phép tương tác hai chiều thông qua việc gửi tin nhắn, bình luận trên các nền tảng số.", "Mọi thông tin được tìm thấy trên mạng Internet đều hoàn toàn chính xác và có độ tin cậy 100%.", "Học sinh có thể sử dụng dịch vụ thư điện tử (Email) để gửi bài tập về nhà cho giáo viên."], "a": [1, 1, 0, 1], "e": ["Internet là mạng liên kết hàng triệu máy tính toàn cầu.", "Internet cho phép gửi tin, bình luận (tương tác hai  var sec=el('section');sec.id='bai'+s.b;var h=el('header','sh');h.appendChild(el('span','badge','Bài '+s.b));h.appendChild(el('h2',null,s.t));sec.appendChild(h);
 if(s.q.length){sec.appendChild(el('h3','part','I. Chọn một đáp án đúng nhất'));
