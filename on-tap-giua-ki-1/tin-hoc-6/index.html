<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ôn tập và kiểm tra thử môn Tin học 6</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#1e293b;background:linear-gradient(135deg,#eef4ff,#fdf2ff 60%,#effff6);overflow-x:hidden}
.bub{position:fixed;border-radius:50%;opacity:.35;animation:fl 14s ease-in-out infinite;z-index:0}
@keyframes fl{50%{transform:translateY(-40px) scale(1.15)}}
.card{position:relative;z-index:1;width:100%;max-width:460px;background:#fff;border-radius:24px;padding:32px 24px;text-align:center;box-shadow:0 12px 40px #4f7cff30;animation:up .6s}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.sc{font-size:13px;font-weight:700;letter-spacing:.5px;color:#64748b}
.em{font-size:60px;margin:8px 0;animation:bo 2s infinite}@keyframes bo{50%{transform:translateY(-8px)}}
h1{margin:0 0 6px;font-size:24px;line-height:1.3;color:#4f7cff}
p{margin:0 0 22px;color:#64748b}
a{display:block;text-decoration:none;color:#fff;font-weight:700;font-size:18px;padding:16px;border-radius:14px;margin-bottom:14px;transition:.2s}
a small{display:block;font-weight:400;font-size:13px;opacity:.9;margin-top:2px}
a:hover{transform:translateY(-3px);box-shadow:0 10px 24px #4f7cff55}
.a1{background:linear-gradient(90deg,#22c55e,#16a34a)}.a2{background:linear-gradient(90deg,#4f7cff,#7c5cff)}
</style></head><body>
<i class="bub" style="width:140px;height:140px;left:-30px;top:20vh;background:#bfdbfe"></i><i class="bub" style="width:100px;height:100px;right:-20px;top:55vh;background:#e9d5ff;animation-delay:-4s"></i><i class="bub" style="width:80px;height:80px;left:40vw;bottom:-20px;background:#bbf7d0;animation-delay:-8s"></i>
<main class="card"><div class="sc">HỌC TẬP</div><div class="em">💻</div>
