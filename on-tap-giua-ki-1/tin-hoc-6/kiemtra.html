<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow"><title>Kiểm tra thử – Tin học 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fc;--ink:#17233b;--muted:#5a6b88;--line:#dbe4f3;--blue:#2457c5;--blue2:#6b5bd6;--soft:#e8effc;--ok:#0b8f55;--oks:#e2f6ea;--bad:#d03a3a;--bads:#fdeaea;--skip:#ffe3e3;--amber:#e59a00;--nav:52px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(160deg,#eaf1ff 0%,#f6f0ff 55%,#eefaf6 100%) fixed;min-height:100vh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
#nav{position:fixed;inset:0 0 auto 0;height:var(--nav);z-index:60;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 max(10px,calc((100% - 1180px)/2));font-size:.88rem;white-space:nowrap}
#nav b.br{color:var(--blue);font-weight:800;letter-spacing:.2px}
#nav .t{font-weight:600;color:var(--muted)}#nav .u{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:right;font-weight:600}
#nav .sep{width:1px;height:18px;background:var(--line)}
#clk{font-weight:800;font-variant-numeric:tabular-nums;background:var(--soft);color:var(--blue);padding:4px 10px;border-radius:999px}
#clk.warn{background:var(--bads);color:var(--bad);animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.08)}}
#pb{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:linear-gradient(90deg,var(--blue),var(--blue2));transition:width .4s}
#start{min-height:100vh;display:grid;place-items:center;padding:20px}
.sc{width:min(440px,100%);background:#fff;border-radius:22px;padding:30px 26px;box-shadow:0 20px 50px rgba(36,87,197,.16);animation:up .6s both}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.sc .lg{font-weight:800;color:var(--blue);font-size:.95rem}
.sc h1{margin:6px 0 4px;font-size:1.6rem;line-height:1.25}
.sc p{margin:0 0 18px;color:var(--muted);font-size:.93rem}
.sc label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 5px}
.sc input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;outline:0;transition:.2s}
.sc input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--soft)}
.sc input.err{border-color:var(--bad)}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 16px rgba(36,87,197,.28)}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.sc .btn{width:100%;margin-top:20px;font-size:1.05rem}
.btn.g{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.btn.r{background:linear-gradient(135deg,#e35656,#c42d2d);box-shadow:0 6px 16px rgba(208,58,58,.3)}
#exam,#result{padding-top:calc(var(--nav) + 10px)}
.strip{position:sticky;top:var(--nav);z-index:40;display:none;align-items:center;gap:8px;background:rgba(255,255,255,.97);padding:7px 10px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
.chip.part{border-color:#9bb6ee;background:linear-gradient(90deg,var(--soft) 50%,#fff 50%)}
.chip.done{background:var(--blue);border-color:var(--blue);color:#fff;animation:pop .3s}
.chip.skip{background:var(--skip);border-color:var(--bad);color:var(--bad)}
@keyframes pop{50%{transform:scale(1.18)}}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;max-width:1180px;margin:0 auto;padding:12px 16px 60px}
.side{position:sticky;top:calc(var(--nav) + 14px);align-self:start;background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(36,87,197,.1)}
.side h4{margin:0 0 10px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.grid .chip{width:100%}
.lg2{margin:12px 0;font-size:.78rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.lg2 i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.side .btn{width:100%}
.pt{margin:16px 0 8px;font-weight:800;color:var(--blue);font-size:1.02rem}
.card{background:#fff;border:2px solid transparent;border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:0 4px 14px rgba(36,87,197,.08);scroll-margin-top:calc(var(--nav) + 64px);transition:background .3s,border-color .3s}
.card.skip{background:var(--skip);border-color:#f1a3a3}
.q{margin:0 0 10px;font-weight:600}.q span{color:var(--blue)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:inherit;cursor:pointer;transition:.15s}
.opt b{flex:0 0 1.6em;height:1.6em;border-radius:50%;background:var(--soft);color:var(--blue);display:grid;place-items:center;font-size:.85rem}
.opt:hover{border-color:#9bb6ee}
.opt.on{border-color:var(--blue);background:var(--soft);transform:scale(1.01)}.opt.on b{background:var(--blue);color:#fff}
.tf{border-top:1px dashed var(--line);padding:9px 0 3px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tf p{margin:0;flex:1 1 60%}.yn{display:flex;gap:6px}
.yn button{padding:6px 16px;border:2px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-weight:700;cursor:pointer;transition:.15s}
.yn button.on{background:var(--blue);border-color:var(--blue);color:#fff}
#modal{position:fixed;inset:0;z-index:100;background:rgba(23,35,59,.55);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.mb{background:#fff;border-radius:20px;padding:24px;width:min(460px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);animation:up .3s both}
.mb h3{margin:0 0 8px;font-size:1.25rem}.mb p{margin:6px 0}
.mb.danger{border:4px solid var(--bad)}.mb.danger h3{color:var(--bad)}
.mb .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.mb .row .btn{flex:1}
.ul{max-height:130px;overflow:auto;background:var(--skip);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.92rem}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;background:#17233b;color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:.3s;max-width:92%}
#toast.s{opacity:1}
#dt{position:fixed;inset:0;z-index:200;background:#fff;display:grid;place-items:center;text-align:center;padding:30px;font-weight:700;color:var(--bad)}
.res{max-width:820px;margin:0 auto;padding:12px 16px 60px}
.score{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 16px 40px rgba(36,87,197,.3);animation:up .6s both}
.score .big{font-size:4rem;font-weight:800;line-height:1.1}.score .big small{font-size:1.4rem;opacity:.8}
.score p{margin:4px 0;opacity:.95}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stats div{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 4px 14px rgba(36,87,197,.08)}.stats b{display:block;font-size:1.3rem;color:var(--blue)}
.stats span{font-size:.8rem;color:var(--muted)}
#sv{text-align:center;font-size:.88rem;color:var(--muted);margin-bottom:10px}
.rv{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;border-left:6px solid var(--ok)}.rv.x{border-left-color:var(--bad)}
.rv .o{padding:2px 0;font-size:.95rem}.rv .o.c{color:var(--ok);font-weight:700}.rv .o.w{color:var(--bad);font-weight:700}
.rv .e{margin-top:8px;padding:8px 12px;border-radius:10px;background:#fff7e0;border-left:5px solid var(--amber);font-size:.93rem}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:150;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(700deg)}}
@media(max-width:900px){
 .layout{grid-template-columns:1fr;padding:10px 10px 60px}.side{display:none}.strip{display:flex}
 .card{scroll-margin-top:calc(var(--nav) + 60px)}
 #nav{font-size:.74rem;gap:6px;padding:0 8px}#nav .sep{display:none}#nav .t{overflow:hidden;text-overflow:ellipsis;max-width:22%}
 .stats b{font-size:1.1rem}.score .big{font-size:3.2rem}}
@media print{body{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
