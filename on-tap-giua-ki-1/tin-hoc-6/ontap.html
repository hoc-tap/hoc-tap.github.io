<style>
:root{--p:#4f7cff;--ok:#16a34a;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#1e293b;background:linear-gradient(135deg,#eef4ff,#fdf2ff 60%,#effff6)}
header{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#4f7cff,#7c5cff);color:#fff;padding:9px 14px;font-size:14px;box-shadow:0 3px 12px #4f7cff55;white-space:nowrap}
header b{overflow:hidden;text-overflow:ellipsis}header .st{margin-left:auto;flex:none;background:#fff;color:var(--p);font-weight:800;padding:3px 12px;border-radius:99px}
#pb{height:5px;background:#dbe5ff}#pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#4f7cff);transition:.4s}
main{max-width:820px;margin:0 auto;padding:12px 12px 80px}
h2{margin:20px 0 6px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#dbeafe,#ede9fe);color:#3730a3;font-size:18px}
h3{margin:12px 0 6px;font-size:14px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
.q{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px #4f7cff18;animation:up .4s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.q p{margin:8px 0 12px;font-size:17px;line-height:1.5;font-weight:600}
.num{background:var(--p);color:#fff;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid #e2e8f0;background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:8px;font:inherit;font-size:16px;line-height:1.4;cursor:pointer;transition:.18s;color:inherit}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:#eef2ff;color:var(--p);display:grid;place-items:center}
.q:not(.d) .opt:hover{border-color:var(--p);transform:translateX(4px)}
.d .opt{cursor:default}.opt.ok{border-color:var(--ok);background:#dcfce7;animation:pop .35s}.opt.ok b{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:#fee2e2;animation:sh .4s}.opt.no b{background:var(--bad);color:#fff}
@keyframes pop{50%{transform:scale(1.03)}}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ex{margin-top:6px;padding:10px 12px;border-radius:10px;background:#f1f5f9;line-height:1.5;font-size:15px;animation:up .3s}
.ex.g{border-left:5px solid var(--ok)}.ex.r{border-left:5px solid var(--bad)}
.fig{width:100%;max-width:340px;display:block;margin:0 auto 12px;background:#f8fbff;border-radius:12px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,#4f7cff,#7c5cff);cursor:pointer}
#top{position:fixed;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;padding:0;box-shadow:0 6px 16px #4f7cff66}
</style></head><body>
