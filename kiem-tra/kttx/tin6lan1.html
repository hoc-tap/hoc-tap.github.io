<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kiểm tra thường xuyên – TH&THCS NGUYỄN DU</title>
<style>
:root{
  --nav:54px;
  --ink:#24304a; --muted:#6b7a99; --line:#e3e9f6;
  --blue:#4f7cff; --blue2:#6aa5ff; --violet:#8a63ff; --teal:#19c3a6; --pink:#ff7aa8; --amber:#ffb84d;
  --green:#22b573; --red:#ef4f5f;
  --bg:#f3f7ff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,#eaf2ff 0%,#f7f0ff 50%,#e9fbf5 100%);
  display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
.hidden{display:none!important}
button{font-family:inherit}

/* ---------- NAV ---------- */
#nav{height:var(--nav);flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;white-space:nowrap;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:3px solid transparent;
  border-image:linear-gradient(90deg,var(--blue),var(--violet),var(--teal),var(--amber)) 1;
  box-shadow:0 4px 18px rgba(79,124,255,.12);z-index:20;overflow:hidden;font-size:14px}
#nav .sep{width:1px;height:22px;background:var(--line);flex:none}
#nav .school{font-weight:800;color:var(--blue);letter-spacing:.3px;flex:none}
#nav .exam{font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:60px;flex:0 1 auto}
#nav .who{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:40px}
#nav .pc{color:var(--muted);flex:none}
#nav .clock{margin-left:auto;flex:none;font-variant-numeric:tabular-nums;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--violet));padding:6px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(79,124,255,.35)}
@media(max-width:900px){#nav{gap:8px;padding:0 10px;font-size:12px}#nav .pc{display:none}}

/* ---------- LOGIN ---------- */
#login{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:auto}
.bubble{position:absolute;border-radius:50%;opacity:.35;filter:blur(2px);animation:float 14s ease-in-out infinite;pointer-events:none}
.b1{width:220px;height:220px;background:#a9c4ff;left:6%;top:10%}
.b2{width:150px;height:150px;background:#ffc6dc;right:10%;top:14%;animation-delay:-4s}
.b3{width:260px;height:260px;background:#b5f0de;right:6%;bottom:6%;animation-delay:-8s}
.b4{width:110px;height:110px;background:#ffe3a8;left:12%;bottom:12%;animation-delay:-2s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-28px) scale(1.07)}}
.card{background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(79,124,255,.18);position:relative;z-index:1}
#loginCard{width:min(460px,100%);padding:30px 32px 28px;animation:pop .6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.logo{width:68px;height:68px;border-radius:20px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:34px;
  background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:0 10px 24px rgba(106,99,255,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
#loginCard h1{margin:0;text-align:center;font-size:20px;color:var(--blue);letter-spacing:.4px}
#loginCard h2{margin:4px 0 2px;text-align:center;font-size:16px;font-weight:700}
#loginCard .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:#44527a}
.field label i{color:var(--red);font-style:normal}
.field label small{font-weight:400;color:var(--muted)}
.field input{width:100%;padding:12px 14px;font-size:16px;border:2px solid var(--line);border-radius:14px;outline:none;transition:.2s;background:#f9fbff;color:var(--ink)}
.field input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(79,124,255,.15)}
.field input.err{border-color:var(--red);background:#fff5f6;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{color:var(--red);font-size:13px;min-height:18px;margin:2px 0 8px;font-weight:600}
.btn{border:0;cursor:pointer;font-weight:800;font-size:16px;padding:13px 22px;border-radius:14px;color:#fff;transition:transform .15s,box-shadow .2s,filter .2s;
  background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:0 8px 20px rgba(79,124,255,.35)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;filter:grayscale(.3)}
.btn.green{background:linear-gradient(135deg,#19c3a6,#22b573);box-shadow:0 8px 20px rgba(34,181,115,.35)}
.btn.red{background:linear-gradient(135deg,#ff7a7a,#ef4f5f);box-shadow:0 8px 20px rgba(239,79,95,.35)}
.btn.gray{background:#eef2fb;color:#44527a;box-shadow:none}
#btnStart{width:100%;margin-top:4px}

/* ---------- EXAM ---------- */
#exam{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding:16px 18px}
#qpane{overflow-y:auto;position:relative;padding:2px 10px 80px 2px;scroll-behavior:smooth}
#qpane::-webkit-scrollbar,#side::-webkit-scrollbar{width:9px}
#qpane::-webkit-scrollbar-thumb,#side::-webkit-scrollbar-thumb{background:#c9d6f5;border-radius:9px}
#side{overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:10px}
.panel{background:#fff;border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(79,124,255,.12)}
.sec{margin:18px 0 10px;font-size:15px;font-weight:800;color:#fff;display:inline-block;padding:7px 16px;border-radius:999px;
  background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:0 6px 14px rgba(106,99,255,.3)}
.sec.s2{background:linear-gradient(135deg,var(--teal),#3ab0ff)}
.sec.s3{background:linear-gradient(135deg,var(--amber),var(--pink))}
.sec:first-child{margin-top:0}
.q{background:#fff;border:2px solid transparent;border-radius:20px;padding:18px 20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(79,124,255,.10);
  animation:slideIn .5s both;transition:background .3s,border-color .3s,box-shadow .3s}
@keyframes slideIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.q.skipped{background:#ffe6e8;border-color:#ff8f9a;box-shadow:0 8px 24px rgba(239,79,95,.18)}
.qh{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.num{flex:none;min-width:38px;height:38px;padding:0 8px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;
  background:linear-gradient(135deg,var(--blue),var(--violet))}
.q.skipped .num{background:linear-gradient(135deg,#ff7a7a,var(--red))}
.qt{font-size:17px;line-height:1.5;font-weight:600;padding-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:1180px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:11px 14px;border-radius:14px;cursor:pointer;font-size:16px;line-height:1.4;color:var(--ink);
  background:#f6f9ff;border:2px solid var(--line);transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.q.skipped .opt{background:#fff6f6}
.opt:hover{transform:translateY(-2px);border-color:var(--blue2);background:#eef4ff;box-shadow:0 6px 16px rgba(79,124,255,.15)}
.opt .lt{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:#fff;border:2px solid #c9d6f5;color:var(--blue);transition:.2s}
.opt.sel{background:linear-gradient(135deg,#e6efff,#efe9ff);border-color:var(--blue);box-shadow:0 6px 18px rgba(79,124,255,.25)}
.opt.sel .lt{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;border-color:transparent;animation:tick .35s}
@keyframes tick{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

/* timer */
.timer{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg);width:104px;height:104px}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:#e8eefc}
.ring .fg{stroke:url(#grad);transition:stroke-dashoffset .5s linear}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.timer .lab{font-size:13px;color:var(--muted);line-height:1.5}
.timer .lab b{display:block;color:var(--ink);font-size:15px}
.timer.low .ring .t{color:var(--red);animation:pulse 1s infinite}
.timer.low .ring .fg{stroke:var(--red)}
@keyframes pulse{50%{transform:scale(1.12)}}
.prog{height:12px;background:#e8eefc;border-radius:99px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:99px;transition:width .4s}
.proglab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;font-weight:600}
.panel h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pb{height:42px;border-radius:12px;border:2px solid var(--line);background:#f6f9ff;font-weight:800;font-size:15px;color:#51628c;cursor:pointer;transition:.2s}
.pb:hover{transform:translateY(-2px);border-color:var(--blue2)}
.pb.done{background:linear-gradient(135deg,#22b573,#19c3a6);color:#fff;border-color:transparent}
.pb.skip{background:linear-gradient(135deg,#ff7a7a,var(--red));color:#fff;border-color:transparent;animation:pulse2 1.6s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 5px rgba(239,79,95,.2)}}
.pb.cur{outline:3px solid rgba(79,124,255,.55);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px;background:#dfe7fa}
.legend .l1::before{background:var(--green)}.legend .l2::before{background:var(--red)}
#btnSubmit{width:100%;font-size:17px;padding:14px}
@media(max-width:900px){
  #exam{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:10px;padding:10px}
  #side{order:-1;max-height:38vh;gap:8px}
  .panel{padding:10px 12px;border-radius:16px}
  .ring{width:64px;height:64px}.ring svg{width:64px;height:64px}.ring circle{stroke-width:8}.ring .t{font-size:14px}
  .grid{grid-template-columns:repeat(10,1fr);gap:5px}.pb{height:32px;font-size:12px;border-radius:8px}
  .legend{display:none}.q{padding:14px}.qt{font-size:16px}
}

/* ---------- RESULT ---------- */
#result{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px}
#resCard{width:min(560px,100%);padding:28px 30px;text-align:center;animation:pop .6s both}
#resCard h2{margin:0 0 4px;color:var(--blue)}
.score{margin:12px auto;width:170px;height:170px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  background:conic-gradient(from 200deg,var(--blue),var(--violet),var(--pink),var(--blue));box-shadow:0 14px 34px rgba(106,99,255,.4);animation:bob 3.5s ease-in-out infinite}
.score b{font-size:48px;line-height:1;font-variant-numeric:tabular-nums}.score span{font-size:13px;opacity:.9;margin-top:4px}
.stat{color:var(--muted);font-size:15px;margin:6px 0}
.gift{margin:16px auto 6px;padding:16px;border-radius:18px;background:linear-gradient(135deg,#fff7e0,#ffeef5);border:2px dashed #ffc46b}
.gift h3{margin:0 0 6px;font-size:16px;color:#c26a00}
.box{font-size:56px;cursor:pointer;display:inline-block;animation:shakeBox 1.1s infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
@keyframes shakeBox{0%,100%{transform:rotate(0)}15%{transform:rotate(-12deg)}30%{transform:rotate(10deg)}45%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}75%{transform:rotate(0)}}
.box.open{animation:burst .7s both}
@keyframes burst{0%{transform:scale(1)}40%{transform:scale(1.5) rotate(10deg)}100%{transform:scale(1)}}
.giftres{font-weight:800;font-size:16px;min-height:24px}
.giftres.win{color:var(--green)}.giftres.lose{color:var(--muted)}
.status{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:700;font-size:15px;line-height:1.5}
.status.wait{background:#eef4ff;color:var(--blue)}.status.ok{background:#e5f9ef;color:#0f8a52}.status.bad{background:#fff0f1;color:#c43142}
.spin{display:inline-block;width:16px;height:16px;border:3px solid #c9d6f5;border-top-color:var(--blue);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}
.status .btn{margin-top:8px;padding:8px 16px;font-size:14px}

/* ---------- MODAL / OVERLAY ---------- */
#modalWrap,#fsOverlay{position:fixed;inset:0;background:rgba(36,48,74,.55);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
#fsOverlay{z-index:120;background:rgba(36,48,74,.88)}
.modal{background:#fff;border-radius:22px;width:min(520px,100%);padding:26px 28px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:pop .35s both;max-height:92vh;overflow:auto}
.modal .ic{font-size:46px;line-height:1;margin-bottom:6px}
.modal h3{margin:0 0 10px;font-size:20px}
.modal p{margin:6px 0;line-height:1.55;font-size:16px}
.modal .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.modal .btns .btn{font-size:15px;padding:11px 20px}
.modal.danger{border:4px solid var(--red)}
.modal.danger h3{color:var(--red);font-size:22px;text-transform:uppercase}
.modal.danger .ic{animation:shake .6s infinite}
.modal.warn h3{color:#c26a00}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.chips span{background:#ffe6e8;color:var(--red);font-weight:800;border-radius:10px;padding:3px 10px;font-size:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#24304a;color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;
  opacity:0;transition:.35s;z-index:150;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:130}
.noscript{padding:30px;text-align:center;font-size:18px}
@media print{body{display:none!important}}
</style>
</head>
<body>

<header id="nav" class="hidden">
  <span class="school" id="nSchool"></span><span class="sep"></span>

  <span class="pc" id="nPc"></span>
  <span class="clock" id="nClock">--:--:--</span>
</header>

<section id="login">
  <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div><div class="bubble b4"></div>

            <circle class="bg" cx="52" cy="52" r="46"/><circle class="fg" id="ringFg" cx="52" cy="52" r="46" stroke-dasharray="289.03" stroke-dashoffset="0"/></svg>

</section>

<section id="result" class="hidden">
  <div class="card" id="resCard">
    <h2>🎉 Em đã hoàn thành bài kiểm tra!</h2>
    <div class="stat" id="rName"></div>

    <div class="stat" id="rStat"></div>

      <h3>🎁 Túi quà phần thưởng may mắn</h3>
      <div class="box" id="giftBox" title="Bấm để mở túi quà">🎁</div>

<div id="modalWrap" class="hidden"><div class="modal" id="modalBox"></div></div>
<div id="fsOverlay" class="hidden"><div class="modal warn" id="fsBox"></div></div>
<div id="toast"></div>

<script>
(function(){
'use strict';
/* ================= CẤU HÌNH ================= */
var CFG={

  pass:5, gift:0.5, pGiftLow:0.2, pGiftHigh:0.1,
  pwHash:6992331688856299,
  url:'https://script.google.com/macros/s/AKfycbxBt8Ft9YOj8X-FfYgtrPsUW3t1zdsM6u_bGt0aBXEdw6mvevIyy0NufI8xlKOf7K9Zsw/exec'
};
var MASK=90;

function rand01(){try{var u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]/4294967296;}catch(e){return Math.random();}}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function round2(x){return Math.round(x*100)/100;}
function fmtDT(ms){var d=new Date(ms+7*3600000);return pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds());}
function fmtClock(ms){var d=new Date(ms+7*3600000);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds());}
function fmtMS(s){s=Math.max(0,Math.ceil(s));return pad(Math.floor(s/60))+':'+pad(s%60);}

var offset=0, timeSrc='local';
function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'));},ms);p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
function syncTime(){
  var tries=[];
  if(/^https?:$/.test(location.protocol)){
    tries.push(function(){var t0=Date.now();return fetch(location.href.split('#')[0],{method:'HEAD',cache:'no-store'}).then(function(r){var d=r.headers.get('Date');if(!d)throw 0;var t1=Date.now();return {ms:new Date(d).getTime()+ (t1-t0)/2,src:'host'};});});
  }
  tries.push(function(){var t0=Date.now();return fetch('https://worldtimeapi.org/api/timezone/Asia/Ho_Chi_Minh',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){var t1=Date.now();return {ms:j.unixtime*1000+(t1-t0)/2,src:'net'};});});
  var i=0;
  function next(){
    if(i>=tries.length){offset=0;timeSrc='local';return Promise.resolve();}
    var f=tries[i++];
    return withTimeout(f(),2500).then(function(r){if(!isFinite(r.ms))throw 0;offset=r.ms-Date.now();timeSrc=r.src;},function(){return next();});
  }
  return next();
}
function nowMs(){return Date.now()+offset;}

/* ================= DỮ LIỆU ĐỀ (đã mã hóa) ================= */
var POOL=null;
function pool(){if(!POOL)POOL=dec(DQ,KQ);return POOL;}
function shuffle(a,rnd){for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildExam(seed){
  var P=pool(),f=stream('S'+seed),rnd=function(){return f()/4294967296;};
  var by={NB:[],TH:[],VD:[]};
  for(var i=0;i<P.length;i++)by[P[i].l].push(i);
  var used={},out=[];
  function take(lv,n){
    var idx=shuffle(by[lv].slice(),rnd),c=0;
    for(var k=0;k<idx.length&&c<n;k++){
      var p=P[idx[k]],key=p.q.replace(/\s+/g,' ').trim().toLowerCase();
      if(used[key])continue;used[key]=1;
      out.push({pi:idx[k],l:lv,q:p.q,perm:shuffle([0,1,2,3],rnd)});c++;
    }
  }
  take('NB',CFG.nNB);take('TH',CFG.nTH);take('VD',CFG.nVD);
  return out;
}

function onStart(){
  var ten=$('fTen').value.trim().replace(/\s+/g,' '),lop=$('fLop').value.trim(),sbd=$('fSbd').value.trim(),bad=null,m='';
  if(!ten){bad='fTen';m='Em chưa nhập Họ và tên.';}
  else if(!lop){bad='fLop';m='Em chưa nhập Lớp.';}
  else if(!isOffline()){
    var p=$('fPw').value.trim();
    if(cyrb53('nd#'+p)!==CFG.pwHash){bad='fPw';m='Mật khẩu chưa đúng. Em hãy hỏi giáo viên.';}
  }
  if(bad){$(bad).classList.add('err');$(bad).focus();$('loginMsg').textContent=m;return;}
  if(FS.can)FS.enter();
  $('btnStart').disabled=true;
  var seedArr=new Uint32Array(1);try{crypto.getRandomValues(seedArr);}catch(e){seedArr[0]=Math.floor(Math.random()*4294967295);}
  syncTime().then(function(){
    S={sbd:sbd,ten:ten,lop:lop,seed:seedArr[0]>>>0,start:nowMs(),ans:{},exits:0,maxPassed:0,recheck:0};
    save();begin();
  });
}

/* ================= DỰNG MÀN HÌNH LÀM BÀI ================= */
function begin(){
  EX=buildExam(S.seed);
  $('login').classList.add('hidden');$('result').classList.add('hidden');
  $('nWho').textContent='👤 '+S.ten+' · Lớp '+S.lop;
  $('nav').classList.remove('hidden');$('exam').classList.remove('hidden');
  var qp=$('qpane'),pal=$('palette');clear(qp);clear(pal);
  var secs={NB:['Phần 1 · Nhận biết',''],TH:['Phần 2 · Thông hiểu','s2'],VD:['Phần 3 · Vận dụng','s3']},lastL=null;
  EX.forEach(function(q,i){
    if(q.l!==lastL){lastL=q.l;var h=el('div','sec '+secs[q.l][1],secs[q.l][0]);qp.appendChild(h);}
    var card=el('article','q');card.id='q'+i;card.style.animationDelay=Math.min(i,6)*0.05+'s';
    var qh=el('div','qh');qh.appendChild(el('div','num',String(i+1)));qh.appendChild(el('div','qt',q.q));card.appendChild(qh);
    var ow=el('div','opts');
    q.perm.forEach(function(orig,j){
      var b=el('button','opt');b.type='button';b.appendChild(el('span','lt','ABCD'.charAt(j)));b.appendChild(el('span','tx',pool()[q.pi].o[orig]));
      b.addEventListener('click',function(){choose(i,j);});ow.appendChild(b);
    });
    card.appendChild(ow);qp.appendChild(card);
    var pb=el('button','pb',String(i+1));pb.type='button';pb.id='p'+i;pb.addEventListener('click',function(){goTo(i);});pal.appendChild(pb);
  });
  for(var k in S.ans){paintAns(+k);}
  refresh();
  startPerf=performance.now()-(nowMs()-S.start);
  active=true;finished=false;
  qp.scrollTop=0;
  if(!bound){bound=true;bind();}
  clearInterval(tickT);tickT=setInterval(tick,250);tick();
  qp.addEventListener('scroll',onScroll,{passive:true});
}
function paintAns(i){
  var card=$('q'+i);if(!card)return;
  var bs=card.querySelectorAll('.opt');
  for(var j=0;j<bs.length;j++)bs[j].classList.toggle('sel',S.ans[i]===j);
}
function choose(i,j){
  if(!active)return;
  S.ans[i]=j;if(i>S.maxPassed)S.maxPassed=i;
  paintAns(i);refresh();save();
}
function goTo(i){
  if(i>S.maxPassed)S.maxPassed=i;
  var c=$('q'+i);if(c)$('qpane').scrollTo({top:c.offsetTop-8,behavior:'smooth'});
  refresh();save();
}
function firstVisible(){
  var qp=$('qpane'),top=qp.scrollTop+30;
  for(var i=0;i<EX.length;i++){var c=$('q'+i);if(c.offsetTop+c.offsetHeight>top)return i;}
  return EX.length-1;
}
var scrollRaf=0;
function onScroll(){
  if(scrollRaf)return;
  scrollRaf=requestAnimationFrame(function(){scrollRaf=0;if(!active)return;var f=firstVisible();if(f>S.maxPassed){S.maxPassed=f;save();}refresh();});
}
function refresh(){
  if(!EX)return;
  var done=0,cur=firstVisible();
  for(var i=0;i<EX.length;i++){
    var has=S.ans[i]!==undefined,skip=!has&&i<S.maxPassed;
    if(has)done++;
    $('q'+i).classList.toggle('skipped',skip);
    var pb=$('p'+i);pb.className='pb'+(has?' done':'')+(skip?' skip':'')+(i===cur?' cur':'');
  }
  var pct=Math.round(done*100/EX.length);
  $('progBar').style.width=pct+'%';$('progTxt').textContent='Đã làm '+done+'/'+EX.length;$('progPct').textContent=pct+'%';
}

/* ================= ĐỒNG HỒ ================= */
var CIRC=2*Math.PI*46;
function tick(){
  $('nClock').textContent='🕒 '+fmtClock(nowMs());
  if(!active)return;
  var left=CFG.dur-(performance.now()-startPerf)/1000;
  $('tLeft').textContent=fmtMS(left);

}
function elapsed(){return Math.max(0,(performance.now()-startPerf)/1000);}
function timeUp(){
  if(!active||submitting)return;submitting=true;
  modal({tone:'danger',icon:'⏰',title:'Hết giờ làm bài!',body:['Hệ thống đang tự động nộp bài của em…']});
  setTimeout(function(){closeModal();finalize(true);},1800);
}

/* ================= CHẤM ĐIỂM ================= */
function grade(){
  var A=dec(DA,KA),det=[],ok=0,keyS='',ansS='';
  for(var i=0;i<EX.length;i++){
    var q=EX[i],right=q.perm.indexOf(+A.charAt(q.pi)),ch=S.ans[i];
    var good=(ch===right);if(good)ok++;
    det.push((i+1)+(good?'v':'x'));keyS+=(i+1)+'ABCD'.charAt(right);ansS+=(i+1)+(ch===undefined?'-':'ABCD'.charAt(ch));
  }
  return {ok:ok,det:det,key:keyS,ans:ansS};
}
function unanswered(){var r=[];for(var i=0;i<EX.length;i++)if(S.ans[i]===undefined)r.push(i);return r;}

/* ================= NỘP BÀI ================= */
function trySubmit(){
  if(!active||submitting)return;
  var el_=elapsed();
  if(el_<CFG.minBlock){
    var need=Math.ceil((CFG.minBlock-el_)/60);
    modal({tone:'danger',icon:'🚨',title:'Cảnh báo nghiêm trọng!',
      body:['Em mới làm bài được '+Math.floor(el_/60)+' phút '+pad(Math.floor(el_%60))+' giây. Làm bài quá nhanh như vậy là KHÔNG HỢP LỆ.',
            'Bài kiểm tra này yêu cầu em phải đọc kĩ từng câu hỏi. Em bắt buộc phải quay lại làm bài, chưa được nộp bài (còn khoảng '+need+' phút nữa mới được phép nộp).',
            'Giáo viên có thể kiểm tra thời gian làm bài của em trên hệ thống.'],
      buttons:[{t:'Tôi hiểu – quay lại làm bài',cls:'red',delay:4}]});
    return;
  }
  var un_=unanswered();
  if(un_.length){
    var chips=el('div','chips');un_.forEach(function(i){chips.appendChild(el('span',null,'Câu '+(i+1)));});
    modal({tone:'warn',icon:'⚠️',title:'Em còn '+un_.length+' câu chưa làm',
      body:['Em phải trả lời tất cả các câu hỏi mới được nộp bài:',chips],
      buttons:[{t:'Đến câu '+(un_[0]+1),cls:'',fn:function(){goTo(un_[0]);}}]});
    return;
  }
  var g=grade(),score=round2(g.ok*10/EX.length);
  if(el_<CFG.soft&&score<CFG.pass&&S.recheck<CFG.softTries){
    S.recheck++;save();
    modal({tone:'warn',icon:'🤔',title:'Bài làm chưa đủ 5 điểm',
      body:['Em nộp bài còn sớm mà kết quả chưa đạt 5 điểm. Em hãy đọc lại đề và kiểm tra kĩ các câu trả lời của mình.',
            'Lần kiểm tra lại: '+S.recheck+'/'+CFG.softTries+'. Hệ thống không hiển thị đáp án.'],
      buttons:[{t:'Kiểm tra lại bài',cls:''}]});
    return;
  }
  modal({tone:'',icon:'📨',title:'Nộp bài?',body:['Em đã trả lời đủ '+EX.length+' câu. Sau khi nộp em không thể sửa bài.'],
    buttons:[{t:'Chưa, để em xem lại',cls:'gray'},{t:'Nộp bài',cls:'green',fn:function(){finalize(false);}}]});
}

function finalize(auto){
  if(finished)return;finished=true;active=false;submitting=true;
  clearInterval(tickT);tickT=setInterval(tick,1000);
  closeModal();$('fsOverlay').classList.add('hidden');
  FS.exit();
  var secs=auto?CFG.dur:Math.min(CFG.dur,Math.round(elapsed()));
  var g=grade(),n=EX.length,base=round2(g.ok*10/n);
  var win=rand01()<(base<CFG.pass?CFG.pGiftLow:CFG.pGiftHigh),bonus=win?CFG.gift:0;
  var total=Math.min(10,round2(base+bonus));
  var att=(parseInt(ls(ATT)||'0',10)||0)+1;ls(ATT,String(att));
  var payload={
    soBaoDanh:S.sbd,hoTen:S.ten,lop:S.lop,maDe:'T6-'+S.seed.toString(36).toUpperCase(),kyKiemTra:CFG.ky,
    soCauNLC:g.ok,diemNLC:base,soYDS:0,diemDS:0,tongDiem:total,
    thoiGianBatDau:fmtDT(S.start),thoiGianLamBai:Math.floor(secs/60)+' phút '+pad(secs%60)+' giây',
    soLanThoat:S.exits,computerName:computerName,ip:ip,soLanLamBai:att,
    chiTietBaiLam:'NLC:'+g.det.join(',')+' | Đ/S:- | Túi quà phần thưởng may mắn:'+(win?'+'+CFG.gift:'0'),
    dapanNLC:g.key,cautraloiNLC:g.ans,dapanDS:'',cautraloiDS:''

function countUp(e,to,from){
  var a=from||0,t0=performance.now(),d=900;
  (function f(t){var p=Math.min(1,(t-t0)/d),v=a+(to-a)*(1-Math.pow(1-p,3));e.textContent=(Math.round(v*100)/100).toString();if(p<1)requestAnimationFrame(f);})(t0);
}

function post(payload){
  var ctl=('AbortController' in window)?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort();},20000);
  return fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined})
    .then(function(r){clearTimeout(t);return r.json();}).then(function(j){if(!j||j.result!=='success')throw new Error('srv');return true;},function(e){clearTimeout(t);throw e;});
}
function send(payload,total,base){
  var n=0;
  function go(){
    setStatus('wait','wait');
    n++;
    post(payload).then(function(){
      ls('kt_pending',null);
      setStatus('ok','✅ Em đã hoàn thành bài kiểm tra. Kết quả đã được ghi nhận. Em có thể rời khỏi chỗ ngồi theo hướng dẫn của giáo viên.');
    },function(){
      if(n<3){setTimeout(go,1500);return;}
      ls('kt_pending',JSON.stringify(payload));
      setStatus('bad','⚠️ Chưa lưu được kết quả lên hệ thống (có thể do mạng). Em hãy báo giáo viên để lấy điểm trực tiếp tại máy này. Điểm của em: '+total+' (máy: '+computerName+').',function(){n=0;go();});
    });

/* ================= PHÁO GIẤY ================= */
function confetti(count){
  var c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  var cols=['#4f7cff','#8a63ff','#19c3a6','#ffb84d','#ff7aa8','#22b573'],ps=[];
  for(var i=0;i<count;i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length]});
  var t0=performance.now();
  (function f(t){x.clearRect(0,0,c.width,c.height);var alive=false;
    ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y<c.height+20)alive=true;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore();});
    if(alive&&t-t0<6000)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})(t0);
}

  b.appendChild(el('div','ic',resume?'📝':'⚠️'));
  b.appendChild(el('h3',null,resume?'Em đang làm dở bài kiểm tra':'Em đã thoát chế độ toàn màn hình'));
  b.appendChild(el('p',null,resume?'Bấm nút bên dưới để tiếp tục làm bài. Thời gian vẫn được tính liên tục.':'Việc thoát màn hình bài làm được hệ thống ghi nhận và báo cho giáo viên. Bấm nút để tiếp tục làm bài.'));
  var bw=el('div','btns'),bt=el('button','btn','Tiếp tục làm bài');
  bt.onclick=function(){FS.enter();$('fsOverlay').classList.add('hidden');if(resume&&!active)begin();};
  bw.appendChild(bt);b.appendChild(bw);$('fsOverlay').classList.remove('hidden');
}
function bind(){
  $('btnSubmit').addEventListener('click',trySubmit);
  var fsch=function(){if(active&&FS.can&&!FS.is()&&!finished){recordExit();showFsOverlay(false);}};
  document.addEventListener('fullscreenchange',fsch);document.addEventListener('webkitfullscreenchange',fsch);
  document.addEventListener('visibilitychange',function(){if(document.hidden)recordExit();});
  window.addEventListener('blur',function(){if(active)recordExit();});
  window.addEventListener('beforeunload',function(e){if(active&&!finished){e.preventDefault();e.returnValue='';return '';}});
  setInterval(function(){
    if(!active||!FS.is())return;
    if(window.outerWidth-window.innerWidth>200||window.outerHeight-window.innerHeight>260){recordExit();}
  },2000);
}
/* chống sao chép / xem mã (hạn chế, không tuyệt đối) */
document.addEventListener('contextmenu',function(e){e.preventDefault();});
['copy','cut','dragstart','selectstart'].forEach(function(ev){document.addEventListener(ev,function(e){var t=e.target;if(t&&t.tagName==='INPUT')return;e.preventDefault();});});
document.addEventListener('keydown',function(e){
  var k=(e.key||'').toLowerCase(),one=k.length===1,c=e.ctrlKey||e.metaKey,t=e.target&&e.target.tagName==='INPUT';
  if(e.key==='F12'||(c&&e.shiftKey&&one&&'ijcek'.indexOf(k)>=0)||(c&&one&&'usp'.indexOf(k)>=0)||(e.altKey&&e.metaKey&&k==='i')||(active&&c&&one&&'cxa'.indexOf(k)>=0&&!t)||e.key==='PrintScreen'){
    e.preventDefault();e.stopPropagation();if(active)recordExit();return false;
  }
},true);

/* ================= KHỞI ĐỘNG ================= */
initLogin();
setInterval(function(){if(!active)$('nClock').textContent='🕒 '+fmtClock(nowMs());},1000);
(function resume(){
  var raw=ls(KEY);if(!raw)return;
  try{S=JSON.parse(raw);}catch(e){ls(KEY,null);S=null;return;}
  if(!S||!S.seed||!S.start){S=null;ls(KEY,null);return;}
  $('btnStart').disabled=true;
  syncTime().then(function(){
    $('login').classList.add('hidden');
    EX=buildExam(S.seed);
    if(nowMs()-S.start>=CFG.dur*1000){
      $('nWho').textContent='👤 '+S.ten+' · Lớp '+S.lop;$('nav').classList.remove('hidden');
      startPerf=performance.now()-CFG.dur*1000;active=true;submitting=true;finalize(true);return;
    }
    showFsOverlay(true);
  });
})();
})();
</script>
